name: phase8a-exp014-selection

on:
  workflow_dispatch:
    inputs:
      stage_c_run_id:
        description: Successful phase8a-exp015-stage-c workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Require main workflow dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Phase 8A historical workflows must be dispatched from refs/heads/main" >&2
            exit 1
          fi

      - name: Checkout exact selection runner commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Verify EXP-015 Stage C workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_C_RUN_ID: ${{ inputs.stage_c_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGE_C_RUN_ID}" > stage-c-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path('stage-c-run.json').read_text(encoding='utf-8'))
          assert run['name'] == 'phase8a-exp015-stage-c', run
          assert run['event'] == 'workflow_dispatch', run
          assert run['status'] == 'completed', run
          assert run['conclusion'] == 'success', run
          head_sha = run['head_sha']
          assert isinstance(head_sha, str) and len(head_sha) == 40, run
          Path('stage-c-head-sha.txt').write_text(head_sha, encoding='utf-8')
          PY

      - name: Download exact EXP-015 final shortlist
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.stage_c_run_id }}
          github-token: ${{ github.token }}
          pattern: phase8a-exp015-final-*
          path: .exp015-final-input
          merge-multiple: false

      - name: Resolve exact final shortlist artifact
        run: |
          set -euo pipefail
          mapfile -t files < <(find .exp015-final-input -type f -name final-shortlist.json | sort)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one EXP-015 final-shortlist.json" >&2
            exit 1
          fi
          cp "${files[0]}" exp015-final-shortlist.json

      - name: Freeze exact DEC-042 pool and set universe
        run: |
          set -euo pipefail
          python scripts/phase8a_selection.py preflight \
            --exp015-final exp015-final-shortlist.json \
            --code-commit "${GITHUB_SHA}" \
            --out .dec042-preflight

      - name: Verify frozen DEC-042 preflight
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          final_bytes = Path('exp015-final-shortlist.json').read_bytes()
          preflight = json.loads(Path('.dec042-preflight/preflight.json').read_text(encoding='utf-8'))
          assert preflight['protocol'] == 'fmp-phase8a-dec042-selection-preflight-v1', preflight
          assert preflight['experiment_id'] == 'EXP-20260922-014', preflight
          assert preflight['evidence_label'] == 'RETROSPECTIVE_ALREADY_SEEN', preflight
          assert preflight['untouched_oos'] is False, preflight
          assert preflight['promotion_authorized'] is False, preflight
          assert preflight['historical_status_mutation_authorized'] is False, preflight
          assert preflight['shadow_candidate_authorized'] is False, preflight
          assert preflight['runner_code_commit'] == os.environ['GITHUB_SHA'], preflight
          assert preflight['exp015_final_sha256'] == hashlib.sha256(final_bytes).hexdigest(), preflight
          assert preflight['range_start'] == '2019-01-01', preflight
          assert preflight['range_end_exclusive'] == '2026-08-21', preflight
          assert preflight['slippage_scenarios'] == [0.2, 0.5, 1.0], preflight
          assert 2 <= preflight['strategy_count'] <= 12, preflight
          assert preflight['set_count'] == len(preflight['portfolio_sets']), preflight
          assert len(preflight['set_universe_sha256']) == 64, preflight
          assert any(item['evidence_id'] == 'EXP-20260915-008:PHASE7_PROMOTE_TO_SHADOW_DESIGN' for item in preflight['pool_strategies']), preflight
          assert any(item['evidence_id'] == 'EXP-20260922-015:FINAL_SHORTLIST' for item in preflight['pool_strategies']), preflight

          symbols = sorted({item['symbol'] for item in preflight['pool_strategies']})
          Path('required-symbols.txt').write_text('\n'.join(symbols) + '\n', encoding='utf-8')
          PY

      - name: Upload DEC-042 preflight before selection data
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp014-selection-preflight-${{ github.sha }}
          path: .dec042-preflight
          include-hidden-files: true
          if-no-files-found: error

      - name: Download required accepted Phase 2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .phase2-accepted
          while IFS= read -r symbol; do
            case "${symbol}" in
              EURUSD)
                artifact_id='10325737935'
                expected_sha='db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3'
                ;;
              GBPUSD)
                artifact_id='10326096831'
                expected_sha='fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2'
                ;;
              USDJPY)
                artifact_id='10327600628'
                expected_sha='6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72'
                ;;
              *)
                echo "unsupported selection symbol: ${symbol}" >&2
                exit 1
                ;;
            esac
            root=".phase2-accepted/${symbol}"
            zip_path=".phase2-accepted/${symbol}.zip"
            mkdir -p "${root}"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "${zip_path}"
            actual_sha="$(sha256sum "${zip_path}" | awk '{print $1}')"
            if [ "${actual_sha}" != "${expected_sha}" ]; then
              echo "accepted Phase 2 artifact digest mismatch for ${symbol}" >&2
              exit 1
            fi
            unzip -q "${zip_path}" -d "${root}"
          done < required-symbols.txt

      - name: Run frozen DEC-042 selection
        run: |
          set -euo pipefail
          args=(
            python scripts/phase8a_selection.py run
            --preflight .dec042-preflight/preflight.json
            --code-commit "${GITHUB_SHA}"
            --out .dec042-selection
          )
          while IFS= read -r symbol; do
            root=".phase2-accepted/${symbol}"
            manifest="${root}/manifests/processed/fmp-canonical-1m-v1/${symbol}.json"
            test -f "${manifest}"
            args+=(--dataset-source "${symbol}=${root}::${manifest}")
          done < required-symbols.txt
          "${args[@]}"

      - name: Verify DEC-042 selection evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          preflight_bytes = Path('.dec042-preflight/preflight.json').read_bytes()
          preflight = json.loads(preflight_bytes)
          result = json.loads(Path('.dec042-selection/selection.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('.dec042-selection/manifest.json').read_text(encoding='utf-8'))

          assert result['protocol'] == 'fmp-phase8a-dec042-selection-v1', result
          assert result['experiment_id'] == 'EXP-20260922-014', result
          assert result['evidence_label'] == 'RETROSPECTIVE_ALREADY_SEEN', result
          assert result['untouched_oos'] is False, result
          assert result['promotion_authorized'] is False, result
          assert result['historical_status_mutation_authorized'] is False, result
          assert result['shadow_candidate_authorized'] is False, result
          assert result['preflight_sha256'] == hashlib.sha256(preflight_bytes).hexdigest(), result
          assert result['runner_code_commit'] == os.environ['GITHUB_SHA'], result
          assert result['range_start'] == '2019-01-01', result
          assert result['range_end_exclusive'] == '2026-08-21', result
          assert result['slippage_scenarios'] == [0.2, 0.5, 1.0], result
          assert result['set_universe_sha256'] == preflight['set_universe_sha256'], result
          assert result['evaluated_set_count'] == preflight['set_count'], result
          assert result['outcome'] in ('PORTFOLIO_SELECTION_PASS', 'NO_PORTFOLIO_SELECTED'), result
          if result['outcome'] == 'PORTFOLIO_SELECTION_PASS':
              assert isinstance(result['selected_strategy_fingerprints'], list), result
              assert len(result['selected_strategy_fingerprints']) >= 2, result
          else:
              assert result['selected_strategy_fingerprints'] is None, result
          assert manifest['protocol'] == 'fmp-phase8a-dec042-selection-artifacts-v1', manifest
          assert manifest['promotion_authorized'] is False, manifest
          PY

      - name: Upload DEC-042 selection evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp014-selection-${{ github.sha }}
          path: .dec042-selection
          include-hidden-files: true
          if-no-files-found: error
