name: phase8a-exp015-stage-a\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  actions: read\n\njobs:\n  stage-a-cell:\n    runs-on: ubuntu-latest\n    timeout-minutes: 360\n    strategy:\n      fail-fast: false\n      max-parallel: 3\n      matrix:\n        dataset:\n          - symbol: EURUSD\n            artifact_id: '10325737935'\n            zip_sha256: db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3\n          - symbol: GBPUSD\n            artifact_id: '10326096831'\n            zip_sha256: fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2\n          - symbol: USDJPY\n            artifact_id: '10327600628'\n            zip_sha256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72\n        timeframe: [5m, 15m, 1h]\n\n    steps:\n      - name: Checkout exact result-producing commit\n        uses: actions/checkout@v6\n        with:\n          ref: ${{ github.sha }}\n\n      - name: Set up Python\n        uses: actions/setup-python@v6\n        with:\n          python-version: '3.12'\n\n      - name: Install package\n        run: python -m pip install -e .\n\n      - name: Download and verify accepted Phase 2 artifact\n        env:\n          GH_TOKEN: ${{ github.token }}\n          ARTIFACT_ID: ${{ matrix.dataset.artifact_id }}\n          EXPECTED_ZIP_SHA256: ${{ matrix.dataset.zip_sha256 }}\n          SYMBOL: ${{ matrix.dataset.symbol }}\n        run: |\n          set -euo pipefail\n          root=".phase2-accepted/${SYMBOL}"\n          zip_path=".phase2-accepted/${SYMBOL}.zip"\n          mkdir -p "${root}"\n          gh api \\n            -H 'Accept: application/vnd.github+json' \\n            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \\n            > "${zip_path}"\n          actual_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"\n          if [ "${actual_sha256}" != "${EXPECTED_ZIP_SHA256}" ]; then\n            echo "accepted Phase 2 artifact digest mismatch" >&2\n            exit 1\n          fi\n          unzip -q "${zip_path}" -d "${root}"\n\n      - name: Run frozen EXP-015 Stage A cell\n        env:\n          SYMBOL: ${{ matrix.dataset.symbol }}\n          TIMEFRAME: ${{ matrix.timeframe }}\n        run: |\n          set -euo pipefail\n          root=".phase2-accepted/${SYMBOL}"\n          manifest="${root}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json"\n          out=".exp015-stage-a/${SYMBOL}-${TIMEFRAME}"\n          test -f "${manifest}"\n          python scripts/phase8a_exp015.py stage-a-cell \\n            --dataset-root "${root}" \\n            --manifest "${manifest}" \\n            --symbol "${SYMBOL}" \\n            --timeframe "${TIMEFRAME}" \\n            --code-commit "${GITHUB_SHA}" \\n            --out "${out}"\n\n      - name: Verify frozen EXP-015 Stage A evidence\n        env:\n          SYMBOL: ${{ matrix.dataset.symbol }}\n          TIMEFRAME: ${{ matrix.timeframe }}\n        run: |\n          python - <<'PY'\n          import json\n          import os\n          from pathlib import Path\n          from fmp.portfolio.challenger_discovery_stage_a import exp015_strategy_source_sha256\n\n          root = Path(".exp015-stage-a") / f"{os.environ['SYMBOL']}-{os.environ['TIMEFRAME']}"\n          cell = json.loads((root / "cell.json").read_text(encoding="utf-8"))\n          gate = json.loads((root / "gate.json").read_text(encoding="utf-8"))\n          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))\n          source_sha = exp015_strategy_source_sha256()\n\n          for payload in (cell, gate):\n              assert payload["experiment_id"] == "EXP-20260922-015", payload\n              assert payload["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", payload\n              assert payload["untouched_oos"] is False, payload\n              assert payload["promotion_authorized"] is False, payload\n              assert payload["historical_status_mutation_authorized"] is False, payload\n              assert payload["runner_code_commit"] == os.environ["GITHUB_SHA"], payload\n              assert payload["strategy_source_sha256"] == source_sha, payload\n              assert payload["symbol"] == os.environ["SYMBOL"], payload\n              assert payload["timeframe"] == os.environ["TIMEFRAME"], payload\n\n          assert cell["protocol"] == "fmp-phase8a-exp015-stage-a-cell-v1", cell\n          assert cell["range_start"] == "2015-01-01", cell\n          assert cell["range_end_exclusive"] == "2019-01-01", cell\n          assert cell["strategy_identity_count"] == 63, cell\n          assert cell["scenario_run_count"] == 189, cell\n          assert cell["slippage_scenarios"] == [0.2, 0.5, 1.0], cell\n          assert len(cell["strategy_fingerprints"]) == 63, cell\n\n          assert gate["protocol"] == "fmp-phase8a-exp015-stage-a-gate-v1", gate\n          assert len(gate["family_rankings"]) == 6, gate\n          assert len(gate["strategy_gates"]) == 63, gate\n          assert len(gate["survivor_fingerprints"]) <= 12, gate\n          assert set(gate["survivor_fingerprints"]).issubset(gate["strategy_fingerprints"]), gate\n\n          assert manifest["protocol"] == "fmp-phase8a-exp015-stage-a-cell-artifacts-v1", manifest\n          assert manifest["promotion_authorized"] is False, manifest\n          assert len(manifest["artifacts"]) == 2, manifest\n          PY\n\n      - name: Upload EXP-015 Stage A cell evidence\n        uses: actions/upload-artifact@v6\n        with:\n          name: phase8a-exp015-stage-a-${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}-${{ github.sha }}\n          path: .exp015-stage-a/${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}\n          include-hidden-files: true\n          if-no-files-found: error\n\n  stage-a-authorize:\n    needs: stage-a-cell\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n\n    steps:\n      - name: Checkout exact result-producing commit\n        uses: actions/checkout@v6\n        with:\n          ref: ${{ github.sha }}\n\n      - name: Set up Python\n        uses: actions/setup-python@v6\n        with:\n          python-version: '3.12'\n\n      - name: Install package\n        run: python -m pip install -e .\n\n      - name: Download all Stage A gate evidence\n        uses: actions/download-artifact@v6\n        with:\n          pattern: phase8a-exp015-stage-a-*-${{ github.sha }}\n          path: .exp015-stage-a-inputs\n          merge-multiple: false\n\n      - name: Derive exact Stage A survivor authorization\n        run: |\n          set -euo pipefail\n          python scripts/phase8a_exp015.py stage-a-authorize \\n            --inputs-root ".exp015-stage-a-inputs" \\n            --out ".exp015-stage-a-authorization"\n\n      - name: Verify authorization remains retrospective and non-promotional\n        run: |\n          python - <<'PY'\n          import json\n          import os\n          from pathlib import Path\n          from fmp.portfolio.challenger_discovery_stage_a import exp015_strategy_source_sha256\n\n          root = Path(".exp015-stage-a-authorization")\n          authorization = json.loads((root / "authorization.json").read_text(encoding="utf-8"))\n          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))\n\n          assert authorization["protocol"] == "fmp-phase8a-exp015-stage-a-authorization-v1", authorization\n          assert authorization["experiment_id"] == "EXP-20260922-015", authorization\n          assert authorization["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", authorization\n          assert authorization["untouched_oos"] is False, authorization\n          assert authorization["promotion_authorized"] is False, authorization\n          assert authorization["historical_status_mutation_authorized"] is False, authorization\n          assert authorization["runner_code_commit"] == os.environ["GITHUB_SHA"], authorization\n          assert authorization["strategy_source_sha256"] == exp015_strategy_source_sha256(), authorization\n          assert authorization["cell_count"] == 9, authorization\n          assert authorization["ranking_cell_count"] == 54, authorization\n          assert authorization["strategy_identity_count"] == 567, authorization\n          assert authorization["maximum_stage_a_survivors"] == 108, authorization\n          assert authorization["survivor_count"] == len(authorization["survivor_fingerprints"]), authorization\n          assert authorization["survivor_count"] <= 108, authorization\n          assert authorization["stage_b_source_open_authorized"] == bool(authorization["survivor_fingerprints"]), authorization\n\n          assert manifest["protocol"] == "fmp-phase8a-exp015-stage-a-authorization-artifacts-v1", manifest\n          assert manifest["promotion_authorized"] is False, manifest\n          PY\n\n      - name: Upload EXP-015 Stage A authorization\n        uses: actions/upload-artifact@v6\n        with:\n          name: phase8a-exp015-stage-a-authorization-${{ github.sha }}\n          path: .exp015-stage-a-authorization\n          include-hidden-files: true\n          if-no-files-found: error\n