name: phase8a-exp015-stage-a

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  catalog-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require main workflow dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Phase 8A historical workflows must be dispatched from refs/heads/main" >&2
            exit 1
          fi
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"

      - name: Reject any prior authoritative manual-main EXP-015 Stage A attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > current-stage-a-run.json
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > current-main.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase8a-exp015-stage-a.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            > stage-a-runs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          current = json.loads(
              Path("current-stage-a-run.json").read_text(encoding="utf-8")
          )
          main = json.loads(
              Path("current-main.json").read_text(encoding="utf-8")
          )
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_sha = os.environ["GITHUB_SHA"]

          assert current["id"] == run_id, current
          assert current["name"] == "phase8a-exp015-stage-a", current
          assert current["path"] == ".github/workflows/phase8a-exp015-stage-a.yml", current
          assert current["event"] == "workflow_dispatch", current
          assert current["head_branch"] == "main", current
          assert current["head_sha"] == run_sha, current
          assert current["run_attempt"] == 1, current
          assert main["name"] == "main", main
          assert main["commit"]["sha"] == run_sha, (main, current)

          listing = json.loads(
              Path("stage-a-runs.json").read_text(encoding="utf-8")
          )
          prior = [
              item
              for item in listing.get("workflow_runs", [])
              if item.get("event") == "workflow_dispatch"
              and item.get("head_branch") == "main"
              and item.get("id") != run_id
          ]
          if prior:
              ids = [item.get("id") for item in prior]
              raise SystemExit(
                  f"prior authoritative manual-main EXP-015 Stage A attempt exists: {ids}"
              )
          PY

      - name: Checkout exact result-producing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Freeze exact EXP-015 catalog before results
        run: |
          set -euo pipefail
          python scripts/phase8a_exp015.py catalog \
            --code-commit "${GITHUB_SHA}" \
            --out .exp015-catalog-freeze

      - name: Verify frozen catalog
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path('.exp015-catalog-freeze/catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('.exp015-catalog-freeze/manifest.json').read_text(encoding='utf-8'))
          assert catalog['protocol'] == 'fmp-phase8a-exp015-catalog-v1', catalog
          assert catalog['experiment_id'] == 'EXP-20260922-015', catalog
          assert catalog['runner_code_commit'] == os.environ['GITHUB_SHA'], catalog
          assert catalog['strategy_identity_count'] == 567, catalog
          assert len(catalog['strategies']) == 567, catalog
          assert len({item['fingerprint'] for item in catalog['strategies']}) == 567, catalog
          assert len(catalog['catalog_identity_sha256']) == 64, catalog
          assert catalog['promotion_authorized'] is False, catalog
          assert catalog['historical_status_mutation_authorized'] is False, catalog
          assert manifest['protocol'] == 'fmp-phase8a-exp015-catalog-artifacts-v1', manifest
          assert manifest['promotion_authorized'] is False, manifest
          PY

      - name: Upload frozen EXP-015 catalog
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp015-catalog-${{ github.sha }}
          path: .exp015-catalog-freeze
          include-hidden-files: true
          if-no-files-found: error

  stage-a-cell:
    needs: catalog-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset:
          - symbol: EURUSD
            artifact_id: '10325737935'
            zip_sha256: db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3
          - symbol: GBPUSD
            artifact_id: '10326096831'
            zip_sha256: fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2
          - symbol: USDJPY
            artifact_id: '10327600628'
            zip_sha256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72
        timeframe: [5m, 15m, 1h]

    steps:
      - name: Checkout exact result-producing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download frozen catalog before Stage A data
        uses: actions/download-artifact@v6
        with:
          name: phase8a-exp015-catalog-${{ github.sha }}
          path: .exp015-catalog-input

      - name: Verify frozen catalog is available
        run: |
          set -euo pipefail
          mapfile -t catalogs < <(find .exp015-catalog-input -type f -name catalog.json | sort)
          if [ "${#catalogs[@]}" -ne 1 ]; then
            echo 'expected exactly one frozen EXP-015 catalog' >&2
            exit 1
          fi
          cp "${catalogs[0]}" .exp015-catalog.json

      - name: Download and verify accepted Phase 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.dataset.artifact_id }}
          EXPECTED_ZIP_SHA256: ${{ matrix.dataset.zip_sha256 }}
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          zip_path=".phase2-accepted/${SYMBOL}.zip"
          mkdir -p "${root}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${zip_path}"
          actual_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${EXPECTED_ZIP_SHA256}" ]; then
            echo 'accepted Phase 2 artifact digest mismatch' >&2
            exit 1
          fi
          unzip -q "${zip_path}" -d "${root}"

      - name: Run frozen EXP-015 Stage A cell
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          manifest="${root}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json"
          out=".exp015-stage-a/${SYMBOL}-${TIMEFRAME}"
          test -f "${manifest}"
          python scripts/phase8a_exp015.py stage-a-cell \
            --dataset-root "${root}" \
            --manifest "${manifest}" \
            --symbol "${SYMBOL}" \
            --timeframe "${TIMEFRAME}" \
            --code-commit "${GITHUB_SHA}" \
            --out "${out}"

      - name: Verify frozen EXP-015 Stage A evidence
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fmp.portfolio.challenger_discovery_stage_a import exp015_strategy_source_sha256

          root = Path('.exp015-stage-a') / f"{os.environ['SYMBOL']}-{os.environ['TIMEFRAME']}"
          cell = json.loads((root / 'cell.json').read_text(encoding='utf-8'))
          gate = json.loads((root / 'gate.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('.exp015-catalog.json').read_text(encoding='utf-8'))
          source_sha = exp015_strategy_source_sha256()
          expected = sorted(
              item['fingerprint']
              for item in catalog['strategies']
              if item['symbol'] == os.environ['SYMBOL'] and item['timeframe'] == os.environ['TIMEFRAME']
          )

          for payload in (cell, gate):
              assert payload['experiment_id'] == 'EXP-20260922-015', payload
              assert payload['evidence_label'] == 'RETROSPECTIVE_ALREADY_SEEN', payload
              assert payload['untouched_oos'] is False, payload
              assert payload['promotion_authorized'] is False, payload
              assert payload['historical_status_mutation_authorized'] is False, payload
              assert payload['runner_code_commit'] == os.environ['GITHUB_SHA'], payload
              assert payload['catalog_identity_sha256'] == catalog['catalog_identity_sha256'], payload
              assert payload['strategy_source_sha256'] == source_sha, payload
              assert payload['symbol'] == os.environ['SYMBOL'], payload
              assert payload['timeframe'] == os.environ['TIMEFRAME'], payload
              assert payload['strategy_fingerprints'] == expected, payload

          assert cell['protocol'] == 'fmp-phase8a-exp015-stage-a-cell-v1', cell
          assert cell['range_start'] == '2015-01-01', cell
          assert cell['range_end_exclusive'] == '2019-01-01', cell
          assert cell['strategy_identity_count'] == 63, cell
          assert cell['scenario_run_count'] == 189, cell
          assert cell['slippage_scenarios'] == [0.2, 0.5, 1.0], cell

          assert gate['protocol'] == 'fmp-phase8a-exp015-stage-a-gate-v1', gate
          assert len(gate['family_rankings']) == 6, gate
          assert len(gate['strategy_gates']) == 63, gate
          assert len(gate['survivor_fingerprints']) <= 12, gate

          assert manifest['protocol'] == 'fmp-phase8a-exp015-stage-a-cell-artifacts-v1', manifest
          assert manifest['promotion_authorized'] is False, manifest
          assert len(manifest['artifacts']) == 2, manifest
          PY

      - name: Upload EXP-015 Stage A cell evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp015-stage-a-${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}-${{ github.sha }}
          path: .exp015-stage-a/${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}
          include-hidden-files: true
          if-no-files-found: error

  stage-a-authorize:
    needs: [catalog-freeze, stage-a-cell]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact result-producing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download frozen catalog
        uses: actions/download-artifact@v6
        with:
          name: phase8a-exp015-catalog-${{ github.sha }}
          path: .exp015-catalog-authorization-input

      - name: Download all Stage A gate evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase8a-exp015-stage-a-*-${{ github.sha }}
          path: .exp015-stage-a-inputs
          merge-multiple: false

      - name: Derive exact Stage A survivor authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_exp015.py stage-a-authorize \
            --inputs-root .exp015-stage-a-inputs \
            --out .exp015-stage-a-authorization

      - name: Verify authorization remains retrospective and non-promotional
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fmp.portfolio.challenger_discovery_stage_a import exp015_strategy_source_sha256

          root = Path('.exp015-stage-a-authorization')
          authorization = json.loads((root / 'authorization.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          catalogs = list(Path('.exp015-catalog-authorization-input').rglob('catalog.json'))
          assert len(catalogs) == 1, catalogs
          catalog = json.loads(catalogs[0].read_text(encoding='utf-8'))

          assert authorization['protocol'] == 'fmp-phase8a-exp015-stage-a-authorization-v1', authorization
          assert authorization['experiment_id'] == 'EXP-20260922-015', authorization
          assert authorization['evidence_label'] == 'RETROSPECTIVE_ALREADY_SEEN', authorization
          assert authorization['untouched_oos'] is False, authorization
          assert authorization['promotion_authorized'] is False, authorization
          assert authorization['historical_status_mutation_authorized'] is False, authorization
          assert authorization['runner_code_commit'] == os.environ['GITHUB_SHA'], authorization
          assert authorization['catalog_identity_sha256'] == catalog['catalog_identity_sha256'], authorization
          assert authorization['strategy_source_sha256'] == exp015_strategy_source_sha256(), authorization
          assert authorization['cell_count'] == 9, authorization
          assert authorization['ranking_cell_count'] == 54, authorization
          assert authorization['strategy_identity_count'] == 567, authorization
          assert authorization['maximum_stage_a_survivors'] == 108, authorization
          assert authorization['survivor_count'] == len(authorization['survivor_fingerprints']), authorization
          assert authorization['survivor_count'] <= 108, authorization
          assert authorization['stage_b_source_open_authorized'] == bool(authorization['survivor_fingerprints']), authorization

          assert manifest['protocol'] == 'fmp-phase8a-exp015-stage-a-authorization-artifacts-v1', manifest
          assert manifest['promotion_authorized'] is False, manifest
          PY

      - name: Upload EXP-015 Stage A authorization
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp015-stage-a-authorization-${{ github.sha }}
          path: .exp015-stage-a-authorization
          include-hidden-files: true
          if-no-files-found: error
