name: phase5-features

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - symbol: EURUSD
            artifact_id: '10325737935'
            zip_sha256: db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3
            manifest_sha256: fd7676282e6e667c39754b09b43a43288a0a877fec588cd2601a601e2b0edf6a
          - symbol: GBPUSD
            artifact_id: '10326096831'
            zip_sha256: fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2
            manifest_sha256: a6ee73e94781f48a43f2792328528d242455d4f7f4f2e0a5760446df21ba4d94
          - symbol: USDJPY
            artifact_id: '10327600628'
            zip_sha256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72
            manifest_sha256: e47ee5339868a741097404bed49411cca36b03609ebe395261bb70b6e63bdd3d
        timeframe: [5m, 15m, 1h]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download and verify accepted Phase 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.dataset.artifact_id }}
          EXPECTED_ZIP_SHA256: ${{ matrix.dataset.zip_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ matrix.dataset.manifest_sha256 }}
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          zip_path=".phase2-accepted/${SYMBOL}.zip"
          manifest_path="${root}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json"
          mkdir -p "${root}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${zip_path}"
          actual_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          test "${actual_sha256}" = "${EXPECTED_ZIP_SHA256}"
          unzip -q "${zip_path}" -d "${root}"
          test -f "${manifest_path}"
          actual_manifest_sha256="$(sha256sum "${manifest_path}" | awk '{print $1}')"
          test "${actual_manifest_sha256}" = "${EXPECTED_MANIFEST_SHA256}"

      - name: Generate first feature artifact set
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          out=".phase5-a/${SYMBOL}-${TIMEFRAME}"
          python scripts/phase5_features.py \
            --dataset-root ".phase2-accepted/${SYMBOL}" \
            --manifest ".phase2-accepted/${SYMBOL}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json" \
            --symbol "${SYMBOL}" \
            --timeframe "${TIMEFRAME}" \
            --start 2015-01-01 \
            --end-exclusive 2024-01-01 \
            --out "${out}" \
            --code-commit "${GITHUB_SHA}"

      - name: Generate second feature artifact set
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          out=".phase5-b/${SYMBOL}-${TIMEFRAME}"
          python scripts/phase5_features.py \
            --dataset-root ".phase2-accepted/${SYMBOL}" \
            --manifest ".phase2-accepted/${SYMBOL}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json" \
            --symbol "${SYMBOL}" \
            --timeframe "${TIMEFRAME}" \
            --start 2015-01-01 \
            --end-exclusive 2024-01-01 \
            --out "${out}" \
            --code-commit "${GITHUB_SHA}"

      - name: Verify deterministic regeneration and locked coverage
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          a=".phase5-a/${SYMBOL}-${TIMEFRAME}"
          b=".phase5-b/${SYMBOL}-${TIMEFRAME}"
          cmp "${a}/manifest.json" "${b}/manifest.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ['SYMBOL']
          timeframe = os.environ['TIMEFRAME']
          a = Path('.phase5-a') / f'{symbol}-{timeframe}'
          b = Path('.phase5-b') / f'{symbol}-{timeframe}'
          manifest = json.loads((a / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['feature_set_version'] == 'fmp-feature-v1'
          assert manifest['symbol'] == symbol
          assert manifest['timeframe'] == timeframe
          assert manifest['code_commit'] == os.environ['GITHUB_SHA']
          assert all(month < '2024-01' for month in manifest['opened_source_months'])
          assert manifest['output_end_utc'] <= '2024-01-01T00:00:00Z'
          for artifact in manifest['artifacts']:
              relative = artifact['path']
              left = a / relative
              right = b / relative
              assert left.is_file() and right.is_file(), relative
              assert left.read_bytes() == right.read_bytes(), relative
          PY

      - name: Upload Phase 5 evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase5-features-${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}-${{ github.sha }}
          path: .phase5-a/${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}
          include-hidden-files: true
          if-no-files-found: error
