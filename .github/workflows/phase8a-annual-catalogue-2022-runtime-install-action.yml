name: phase8a-annual-catalogue-2022-runtime-install-action

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2022-runtime-install-action.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-install-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC594_RUN_ID: "37616348059"
      DEC594_HEAD_SHA: "ae0949d54a55d2a71a7cd78f153c391be0c6ff23"
      DEC594_ARTIFACT_ID: "11480120937"
      DEC594_ARTIFACT_DIGEST: "sha256:17334ae595a45bfb8174b7bcb41cab169b4185064ca33c05a79dcaa548fdafd1"
      DEC594_PREFLIGHT_FINGERPRINT: "56c3ff244ed7ad47a07ab64efbea68e41acb61cfdba24303f2d265a2e690b08c"
      DEC594_PREFLIGHT_CANONICAL_SHA256: "6927206445b32ea2cd8a1e78b0511f70e9815a9204d771712c5976a5d79af4e4"

    steps:
      - name: Checkout exact DEC-595 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only action push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-595 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization_install_action.py)" = "90fbc26b51d50d019e39c467d461bd7ba6b4f22b"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2022_runtime_authorization_install_action.py)" = "e4fc3e1d1d0336136cdaa72a931c2b490e80463b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization_install_preflight.py)" = "8d1fce9c947fd7a579a6ab581d605293a02329a3"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization_plan.py)" = "d7710ab16dde2eea6b0d93dc6387c6cc489b30d7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2022_runtime_authorization.py.disabled)" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2022_authorization.py.disabled)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py

      - name: Fetch and verify exact DEC-594 preflight artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC594_RUN_ID" > "$RUNNER_TEMP/dec594-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC594_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec594-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec594-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC594_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2022-runtime-install-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2022-runtime-install-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC594_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec594-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row
              for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC594_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2022-dec594-runtime-install-preflight-"
              + os.environ["DEC594_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC594_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC594_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec594.zip"
          expected_sha="${DEC594_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec594.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec594"
          unzip -q "$RUNNER_TEMP/dec594.zip" -d "$RUNNER_TEMP/dec594"
          preflight="$(find "$RUNNER_TEMP/dec594" -type f -name dec594-2022-runtime-install-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec594-2022-runtime-install-preflight.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec594-2022-runtime-install-preflight.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC594_PREFLIGHT_CANONICAL_SHA256"
          ]
          assert value["preflight_fingerprint_sha256"] == os.environ[
              "DEC594_PREFLIGHT_FINGERPRINT"
          ]
          assert value["decision"] == "DEC-594"
          assert value["expected_head_sha"] == os.environ["DEC594_HEAD_SHA"]
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["activation_mutation_file_count"] == 2
          assert value["preflight_read_only"] is True
          assert value["repository_mutation_authorized"] is False
          assert value["runtime_authorization_installed"] is False
          assert value["runtime_gate_active"] is False
          assert value["annual_workflow_dispatch_authorized"] is False
          PY

      - name: Recheck current main, runtime, and unconsumed run-383 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-branch.json").read_text(encoding="utf-8"))
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]

          rows = json.loads(
              (temp / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383}
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
              383: (37531960014, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 384
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned action dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean action checkout
        run: test -z "$(git status --porcelain)"

      - name: Compile concrete DEC-595 install action
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2022_runtime_authorization_install_action.py             compile             --preflight-json "$RUNNER_TEMP/dec594-2022-runtime-install-preflight.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec595-2022-runtime-install-action.json"

      - name: Verify DEC-595 exact two-file action and non-dispatching boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec595-2022-runtime-install-action.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-595"
          assert value["source_preflight_workflow_run_id"] == 37616348059
          assert value["source_preflight_artifact_id"] == 11480120937
          assert value["source_preflight_artifact_digest"] == (
              "sha256:17334ae595a45bfb8174b7bcb41cab169b4185064ca33c05a79dcaa548fdafd1"
          )
          assert value["source_preflight_fingerprint_sha256"] == (
              "56c3ff244ed7ad47a07ab64efbea68e41acb61cfdba24303f2d265a2e690b08c"
          )
          assert value["source_preflight_canonical_sha256"] == (
              "6927206445b32ea2cd8a1e78b0511f70e9815a9204d771712c5976a5d79af4e4"
          )
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["action_count"] == 2
          create, update = value["actions"]
          assert create["order"] == 1
          assert create["operation"] == "create"
          assert create["target_path"] == "src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py"
          assert create["expected_target_absent"] is True
          assert create["expected_result_blob_sha"] == (
              "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          )
          assert update["order"] == 2
          assert update["operation"] == "update"
          assert update["target_path"] == (
              "src/fmp/discovery/annual_pattern_catalogue_runtime.py"
          )
          assert update["expected_current_blob_sha"] == (
              "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          )
          assert update["expected_result_blob_sha"] == (
              "f2734c7ea32355b1024d1097812578b23fc4409d"
          )
          assert value["repository_mutation_authorized"] is True
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_385_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-595 install action
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2022-dec595-runtime-install-action-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec594-run.json
            ${{ runner.temp }}/dec594-artifacts.json
            ${{ runner.temp }}/dec594-2022-runtime-install-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec595-2022-runtime-install-action.json
          if-no-files-found: error
