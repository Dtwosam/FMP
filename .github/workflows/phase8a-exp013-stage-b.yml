name: phase8a-exp013-stage-b

on:
  workflow_dispatch:
    inputs:
      stage_a_run_id:
        description: Successful phase8a-exp013-stage-a workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact Stage B runner commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Verify Stage A workflow run identity
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_A_RUN_ID: ${{ inputs.stage_a_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGE_A_RUN_ID}" > stage-a-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("stage-a-run.json").read_text(encoding="utf-8"))
          assert run["name"] == "phase8a-exp013-stage-a", run
          assert run["event"] == "workflow_dispatch", run
          assert run["status"] == "completed", run
          assert run["conclusion"] == "success", run
          head_sha = run["head_sha"]
          assert isinstance(head_sha, str) and len(head_sha) == 40, run
          Path("stage-a-head-sha.txt").write_text(head_sha, encoding="utf-8")
          PY

      - name: Download Stage A authorization only
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.stage_a_run_id }}
          github-token: ${{ github.token }}
          pattern: phase8a-exp013-stage-a-authorization-*
          path: .exp013-stage-a-authorization-input
          merge-multiple: false

      - name: Verify exact Stage A authorization
        run: |
          set -euo pipefail
          mapfile -t authorization_files < <(find .exp013-stage-a-authorization-input -type f -name authorization.json | sort)
          if [ "${#authorization_files[@]}" -ne 1 ]; then
            echo "expected exactly one Stage A authorization.json" >&2
            exit 1
          fi
          cp "${authorization_files[0]}" stage-a-authorization.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          authorization_path = Path("stage-a-authorization.json")
          authorization = json.loads(authorization_path.read_text(encoding="utf-8"))
          stage_a_head = Path("stage-a-head-sha.txt").read_text(encoding="utf-8").strip()
          source_sha = hashlib.sha256(
              Path("src/fmp/strategies/opening_range_momentum.py").read_bytes()
          ).hexdigest()

          assert authorization["protocol"] == "fmp-phase8a-exp013-stage-a-authorization-v1", authorization
          assert authorization["experiment_id"] == "EXP-20260922-013", authorization
          assert authorization["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", authorization
          assert authorization["untouched_oos"] is False, authorization
          assert authorization["promotion_authorized"] is False, authorization
          assert authorization["historical_status_mutation_authorized"] is False, authorization
          assert authorization["runner_code_commit"] == stage_a_head, authorization
          assert authorization["strategy_source_sha256"] == source_sha, authorization
          assert authorization["cell_count"] == 9, authorization
          assert authorization["strategy_identity_count"] == 36, authorization
          assert authorization["survivor_count"] == len(authorization["survivor_fingerprints"]), authorization
          assert authorization["survivor_count"] > 0, authorization
          assert authorization["stage_b_source_open_authorized"] is True, authorization

          survivor_set = set(authorization["survivor_fingerprints"])
          required_symbols = []
          for cell in authorization["cells"]:
              if survivor_set.intersection(cell["survivor_fingerprints"]):
                  required_symbols.append(cell["symbol"])
          required_symbols = sorted(set(required_symbols))
          assert required_symbols, authorization
          Path("required-symbols.txt").write_text("\n".join(required_symbols) + "\n", encoding="utf-8")
          Path("stage-a-authorization-sha256.txt").write_text(
              hashlib.sha256(authorization_path.read_bytes()).hexdigest(),
              encoding="utf-8",
          )
          PY

      - name: Download required accepted Phase 2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .phase2-accepted
          while IFS= read -r symbol; do
            case "${symbol}" in
              EURUSD)
                artifact_id='10325737935'
                expected_sha='db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3'
                ;;
              GBPUSD)
                artifact_id='10326096831'
                expected_sha='fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2'
                ;;
              USDJPY)
                artifact_id='10327600628'
                expected_sha='6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72'
                ;;
              *)
                echo "unsupported survivor symbol: ${symbol}" >&2
                exit 1
                ;;
            esac
            root=".phase2-accepted/${symbol}"
            zip_path=".phase2-accepted/${symbol}.zip"
            mkdir -p "${root}"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "${zip_path}"
            actual_sha="$(sha256sum "${zip_path}" | awk '{print $1}')"
            if [ "${actual_sha}" != "${expected_sha}" ]; then
              echo "accepted Phase 2 artifact digest mismatch for ${symbol}" >&2
              exit 1
            fi
            unzip -q "${zip_path}" -d "${root}"
          done < required-symbols.txt

      - name: Run frozen EXP-013 Stage B confirmation
        run: |
          set -euo pipefail
          args=(
            python scripts/phase8a_exp013.py stage-b-run
            --authorization stage-a-authorization.json
            --code-commit "${GITHUB_SHA}"
            --out .exp013-stage-b
          )
          while IFS= read -r symbol; do
            root=".phase2-accepted/${symbol}"
            manifest="${root}/manifests/processed/fmp-canonical-1m-v1/${symbol}.json"
            test -f "${manifest}"
            args+=(--dataset-source "${symbol}=${root}::${manifest}")
          done < required-symbols.txt
          "${args[@]}"

      - name: Verify frozen Stage B evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(".exp013-stage-b/stage-b.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path(".exp013-stage-b/manifest.json").read_text(encoding="utf-8"))
          stage_a_head = Path("stage-a-head-sha.txt").read_text(encoding="utf-8").strip()
          authorization_sha = Path("stage-a-authorization-sha256.txt").read_text(encoding="utf-8").strip()
          source_sha = hashlib.sha256(
              Path("src/fmp/strategies/opening_range_momentum.py").read_bytes()
          ).hexdigest()

          assert result["protocol"] == "fmp-phase8a-exp013-stage-b-v1", result
          assert result["experiment_id"] == "EXP-20260922-013", result
          assert result["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", result
          assert result["untouched_oos"] is False, result
          assert result["promotion_authorized"] is False, result
          assert result["historical_status_mutation_authorized"] is False, result
          assert result["stage_a_authorization_sha256"] == authorization_sha, result
          assert result["stage_a_runner_code_commit"] == stage_a_head, result
          assert result["stage_b_runner_code_commit"] == os.environ["GITHUB_SHA"], result
          assert result["strategy_source_sha256"] == source_sha, result
          assert result["range_start"] == "2024-01-01", result
          assert result["range_end_exclusive"] == "2026-08-21", result
          assert result["scenario_run_count"] == result["strategy_identity_count"] * 3, result
          assert result["historical_qualification_review_authorized"] == bool(
              result["historical_qualification_candidate_fingerprints"]
          ), result
          assert set(result["historical_qualification_candidate_fingerprints"]).issubset(
              result["survivor_fingerprints"]
          ), result

          assert manifest["protocol"] == "fmp-phase8a-exp013-stage-b-artifacts-v1", manifest
          assert manifest["promotion_authorized"] is False, manifest
          PY

      - name: Upload EXP-013 Stage B evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp013-stage-b-${{ github.sha }}
          path: .exp013-stage-b
          include-hidden-files: true
          if-no-files-found: error
