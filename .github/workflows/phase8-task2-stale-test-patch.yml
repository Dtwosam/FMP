name: phase8-task2-stale-test-patch

on:
  push:
    branches:
      - phase8-mt5-bridge-amendment

permissions:
  contents: write

jobs:
  patch-stale-identity:
    if: github.event.head_commit.message == '[phase1-no-source] Add one-shot Task 2 stale identity patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-mt5-bridge-amendment
          fetch-depth: 0
      - name: Patch only the superseded experiment assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_phase8_campaign.py')
          text = path.read_text(encoding='utf-8')
          old = 'self.assertEqual(record["phase8_experiment"], "EXP-20260915-009")'
          new = 'self.assertEqual(record["phase8_experiment"], "EXP-20260917-010")'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale experiment assertion')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/phase8-task2-stale-test-patch.yml').unlink()
          PY
      - name: Commit Task 2 compatibility fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[phase1-no-source] Align campaign test with active Phase 8 experiment'
          git push origin HEAD:phase8-mt5-bridge-amendment
