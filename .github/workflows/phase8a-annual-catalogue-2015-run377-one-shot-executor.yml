name: phase8a-annual-catalogue-2015-run377-one-shot-executor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2015-run377-one-shot-executor.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify source-ready recovery contract
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2015_run376_failure_receipt.py)" = "b57b055129f57be1e3164c3b24a53bf5a0277a57"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2015_run377_execution_authorization.py)" = "f65d13b2ddac075af65a86d08e8902e29fd18cfe"
