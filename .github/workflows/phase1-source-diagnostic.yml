name: phase1-source-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/phase1-source-diagnostic.yml'

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  serial-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe previously failing URLs serially
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import date
          from fmp.data.dukascopy import DukascopySource, UrllibTransport
          from fmp.data.types import RawChunkKey

          probes = [
              RawChunkKey('USDJPY', 'ASK', date(2024, 1, 4)),
              RawChunkKey('GBPUSD', 'ASK', date(2022, 1, 4)),
              RawChunkKey('EURUSD', 'ASK', date(2019, 1, 4)),
          ]
          source = DukascopySource()
          transport = UrllibTransport()
          for idx, key in enumerate(probes):
              url = source.url_for(key)
              response = transport.get(url, 30.0)
              print(f'{key.pair} {key.day} {key.side} status={response.status} bytes={len(response.body)} url={url}', flush=True)
              if idx + 1 < len(probes):
                  time.sleep(10)
          PY
