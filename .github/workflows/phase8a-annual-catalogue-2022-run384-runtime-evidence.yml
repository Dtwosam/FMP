name: phase8a-annual-catalogue-2022-run384-runtime-evidence

on:
  workflow_run:
    workflows:
      - phase8a-annual-pattern-catalogue
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_run_id:
        required: true
        type: string
      target_head_sha:
        required: true
        type: string
      target_run_number:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review-bind-run384:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.run_number == 384 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_id || github.event.workflow_run.id }}
      TARGET_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_head_sha || github.event.workflow_run.head_sha }}
      TARGET_RUN_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_number || github.event.workflow_run.run_number }}

    steps:
      - name: Checkout exact run-383 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Require exact successful 2022 run 383
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$TARGET_RUN_NUMBER" = "384"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"             > "$RUNNER_TEMP/run384.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "run384.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 384,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

      - name: Require frozen DEC-601 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_run384_evidence_review.py)" = "7048781474ce74b8bbed0fd380f8edf4ec51491d"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2022_run384_evidence_review.py)" = "2d6a436c61b13fbd502b3807dc98087bcfa7ccea"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2022-run384-dispatch.yml)" = "818cf0bb73cc7cd479e8718e3f868c05a17fcccf"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_dispatch_action_preflight.py)" = "34a805b3ab9038e847097f51a3fcc1d5c1806a53"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py)" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Resolve exact successful DEC-600 dispatcher
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2022-run384-dispatch.yml/runs?event=push&branch=main&per_page=100"
          found=0
          for _ in $(seq 1 30); do
            gh api "$endpoint" > "$RUNNER_TEMP/dec600-runs.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec600-runs.json").read_text(
                  encoding="utf-8"
              )
          ).get("workflow_runs")
          assert isinstance(rows, list)
          matches = [
              row
              for row in rows
              if row.get("name")
              == "phase8a-annual-catalogue-2022-run384-dispatch"
              and row.get("path")
              == ".github/workflows/phase8a-annual-catalogue-2022-run384-dispatch.yml"
              and row.get("event") == "push"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["TARGET_HEAD_SHA"]
              and row.get("run_number") == 1
              and row.get("run_attempt") == 1
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
          ]
          assert len(matches) <= 1
          if len(matches) == 1:
              (
                  Path(os.environ["RUNNER_TEMP"]) / "dec600-run-id.txt"
              ).write_text(str(matches[0]["id"]) + "\n", encoding="utf-8")
          raise SystemExit(0 if len(matches) == 1 else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Download exact DEC-600 dispatch receipt
        run: |
          set -euo pipefail
          source_run_id="$(cat "$RUNNER_TEMP/dec600-run-id.txt")"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100"             > "$RUNNER_TEMP/dec600-artifacts.json"

          artifact_id="$(
            jq -r               '.artifacts[]
               | select(.name | startswith("annual-catalogue-2022-dec600-run384-dispatch-"))
               | select(.expired == false)
               | .id'               "$RUNNER_TEMP/dec600-artifacts.json"
          )"
          artifact_digest="$(
            jq -r               '.artifacts[]
               | select(.name | startswith("annual-catalogue-2022-dec600-run384-dispatch-"))
               | select(.expired == false)
               | .digest'               "$RUNNER_TEMP/dec600-artifacts.json"
          )"
          test "$(printf '%s\n' "$artifact_id" | sed '/^$/d' | wc -l)" = "1"
          test -n "$artifact_digest"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/dec600.zip"
          expected_sha="${artifact_digest#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec600.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec600"
          unzip -q "$RUNNER_TEMP/dec600.zip" -d "$RUNNER_TEMP/dec600"
          receipt="$(
            find "$RUNNER_TEMP/dec600"               -type f -name 'dec600-run384-dispatch-receipt.json' -print
          )"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec600-run384-dispatch-receipt.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec600-run384-dispatch-receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert receipt["decision"] == "DEC-600"
          assert receipt["source_preflight_decision"] == "DEC-599"
          assert receipt["source_preflight_workflow_run_id"] == 37657193417
          assert receipt["source_preflight_artifact_id"] == 11500265123
          assert receipt["source_preflight_artifact_digest"] == (
              "sha256:05b22b33b49c10e5650a3fe7862846ee8ca7f7be8d042f39952161254043135a"
          )
          assert receipt["source_preflight_fingerprint_sha256"] == (
              "c046f502b6e231cb506e5b8c6430e259983ac2eb93d1d632840185aae40897bf"
          )
          assert receipt["dispatch_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["annual_segment_label"] == "2022"
          assert receipt["previous_annual_freeze_run_id"] == 37531960014
          assert receipt["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert receipt["run_number"] == 383
          assert receipt["run_attempt"] == 1
          assert receipt["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["dispatch_submitted"] is True
          assert receipt["result_claimed"] is False
          assert receipt["run_385_or_later_authorized"] is False
          assert receipt["protected_history_access_authorized"] is False
          assert receipt["cross_year_comparison_authorized"] is False
          assert receipt["trading_authorized"] is False
          PY

      - name: Fetch jobs and artifacts
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/run384-jobs.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/run384-artifacts.json"

      - name: Download and verify 2022 annual freeze
        run: |
          set -euo pipefail
          expected_name="phase8a-annual-catalogue-freeze-2022-$TARGET_HEAD_SHA"
          artifact_id="$(
            jq -r --arg name "$expected_name"               '.artifacts[]
               | select(.name == $name and .expired == false)
               | .id'               "$RUNNER_TEMP/run384-artifacts.json"
          )"
          expected_digest="$(
            jq -r --arg name "$expected_name"               '.artifacts[]
               | select(.name == $name and .expired == false)
               | .digest'               "$RUNNER_TEMP/run384-artifacts.json"
          )"
          test "$(printf '%s\n' "$artifact_id" | sed '/^$/d' | wc -l)" = "1"
          case "$expected_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${expected_digest#sha256:}"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/run384-freeze.zip"
          actual_sha="$(sha256sum "$RUNNER_TEMP/run384-freeze.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha"             > "$RUNNER_TEMP/run384-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run384-freeze"
          unzip -q "$RUNNER_TEMP/run384-freeze.zip"             -d "$RUNNER_TEMP/run384-freeze"
          freeze="$(
            find "$RUNNER_TEMP/run384-freeze"               -type f -name annual-freeze.json -print
          )"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2022.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean review checkout
        run: test -z "$(git status --porcelain)"

      - name: Review and bind exact run 383
        run: |
          set -euo pipefail
          freeze_sha="$(cat "$RUNNER_TEMP/run384-freeze-zip-sha256.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2022_run384_evidence_review.py             review             --run-json "$RUNNER_TEMP/run384.json"             --jobs-json "$RUNNER_TEMP/run384-jobs.json"             --artifacts-json "$RUNNER_TEMP/run384-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2022.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dec600-run384-dispatch-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2022.json"

      - name: Verify DEC-601 binding remains non-authorizing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"]) / "runtime-binding-2022.json"
              ).read_text(encoding="utf-8")
          )
          assert binding["decision"] == "DEC-601"
          assert binding["annual_segment_label"] == "2022"
          assert binding["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert binding["run_number"] == 384
          assert binding["run_attempt"] == 1
          assert binding["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert binding["previous_annual_freeze_run_id"] == 37531960014
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["dispatch_receipt_bound"] is True
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          assert binding["final_required_annual_segment_bound"] is True
          assert binding["rerun_authorized"] is False
          assert binding["retry_authorized"] is False
          assert binding["replacement_run_authorized"] is False
          assert binding["run_385_or_later_authorized"] is False
          assert binding["protected_history_access_authorized"] is False
          assert binding["cross_year_comparison_authorized"] is False
          assert binding["next_segment_execution_authorized"] is False
          assert binding["strategy_v1_synthesis_authorized"] is False
          assert binding["promotion_authorized"] is False
          assert binding["broker_mutation_authorized"] is False
          assert binding["live_order_authorized"] is False
          assert binding["real_money_authorized"] is False
          assert binding["trading_authorized"] is False
          assert binding["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_CROSS_YEAR_COMPARISON_PREFLIGHT"
          )
          PY

      - name: Upload immutable DEC-601 runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2022-dec601-runtime-binding-${{ env.TARGET_RUN_ID }}
          path: |
            ${{ runner.temp }}/run384.json
            ${{ runner.temp }}/run384-jobs.json
            ${{ runner.temp }}/run384-artifacts.json
            ${{ runner.temp }}/dec600-runs.json
            ${{ runner.temp }}/dec600-artifacts.json
            ${{ runner.temp }}/dec600-run384-dispatch-receipt.json
            ${{ runner.temp }}/run384-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2022.json
            ${{ runner.temp }}/runtime-binding-2022.json
          if-no-files-found: error
