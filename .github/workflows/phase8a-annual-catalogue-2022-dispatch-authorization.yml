name: phase8a-annual-catalogue-2022-dispatch-authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2022-dispatch-authorization.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC597_RUN_ID: "37643850671"
      DEC597_HEAD_SHA: "1fafdacab1df0bc2df24b6fa8cd822b031e5cda8"
      DEC597_ARTIFACT_ID: "11492114816"
      DEC597_ARTIFACT_DIGEST: "sha256:440254694717b13d2fe346a0aae4b247beb02dd9cb18feab7ad6a947968d13d2"
      DEC597_PREFLIGHT_FINGERPRINT: "090b8c7e9a1e835387bb7e1579d6db902d359e537c67caa1357a1d96ff938c92"
      DEC597_PREFLIGHT_CANONICAL_SHA256: "015a894dca744889a6fdb56b64190e48c43a13e62c149363e248778660c53481"

    steps:
      - name: Checkout exact DEC-598 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only authorization push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-598 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_dispatch_authorization.py)" = "2f234ac4a420eaacdf7a61007e442d15a61ed374"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2022_dispatch_authorization.py)" = "1d3279f0d2a554d7e57eeb69c2d25be367ffb696"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_dispatch_preflight.py)" = "6680b571765622653bf53a006a1cb7126cf7ea80"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py)" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-597 preflight evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC597_RUN_ID" > "$RUNNER_TEMP/dec597-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC597_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec597-artifacts.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec597-run.json").read_text())
          exact = {
              "id": 37643850671,
              "name": "phase8a-annual-catalogue-2022-dispatch-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2022-dispatch-preflight-recovery.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "1fafdacab1df0bc2df24b6fa8cd822b031e5cda8",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads((temp / "dec597-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11492114816]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2022-dec597-dispatch-preflight-"
              "1fafdacab1df0bc2df24b6fa8cd822b031e5cda8"
          )
          assert artifact["digest"] == (
              "sha256:440254694717b13d2fe346a0aae4b247beb02dd9cb18feab7ad6a947968d13d2"
          )
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC597_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec597.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec597.zip" | awk '{print $1}')"
          test "$actual" = "440254694717b13d2fe346a0aae4b247beb02dd9cb18feab7ad6a947968d13d2"

          mkdir -p "$RUNNER_TEMP/dec597"
          unzip -q "$RUNNER_TEMP/dec597.zip" -d "$RUNNER_TEMP/dec597"
          preflight="$(find "$RUNNER_TEMP/dec597" -type f -name dec597-2022-dispatch-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "dec597-2022-dispatch-preflight.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(value, sort_keys=True, separators=(",", ":"), allow_nan=False)
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC597_PREFLIGHT_CANONICAL_SHA256"
          ]
          PY

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "DEC-597"
          test "$(jq -r '.expected_head_sha' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "$DEC597_HEAD_SHA"
          test "$(jq -r '.preflight_fingerprint_sha256' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "$DEC597_PREFLIGHT_FINGERPRINT"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "383"
          test "$(jq -r '.expected_run_attempt' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "1"
          test "$(jq -r '.previous_annual_freeze_run_id' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "37443770076"
          test "$(jq -r '.preflight_read_only' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "true"
          test "$(jq -r '.annual_workflow_dispatch_authorized' "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json")" = "false"

      - name: Recheck current main and unconsumed run-384 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py)" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"

          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text()
          )["workflow_runs"]
          assert len(rows) == 9
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383}
          assert not any(
              isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 384
              for row in rows
          )
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
              383: (37531960014, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned authorization dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean authorization checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-598 authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2022_dispatch_authorization.py \
            authorize \
            --preflight-json "$RUNNER_TEMP/dec597-2022-dispatch-preflight.json" \
            --authorization-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec598-2022-dispatch-authorization.json"

      - name: Verify DEC-598 is source-only and run-384 exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec598-2022-dispatch-authorization.json"
              ).read_text()
          )
          assert value["decision"] == "DEC-598"
          assert value["source_preflight_workflow_run_id"] == 37643850671
          assert value["source_preflight_artifact_id"] == 11492114816
          assert value["source_preflight_artifact_digest"] == (
              "sha256:440254694717b13d2fe346a0aae4b247beb02dd9cb18feab7ad6a947968d13d2"
          )
          assert value["source_preflight_fingerprint_sha256"] == (
              "090b8c7e9a1e835387bb7e1579d6db902d359e537c67caa1357a1d96ff938c92"
          )
          assert value["source_preflight_canonical_sha256"] == (
              "015a894dca744889a6fdb56b64190e48c43a13e62c149363e248778660c53481"
          )
          assert value["authorization_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["annual_segment_label"] == "2022"
          assert value["prior_segment_label"] == "2021"
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["historical_artifact_read_authorized"] is True
          assert value["historical_catalogue_execution_authorized"] is True
          assert value["historical_result_production_authorized"] is True
          assert value["authorization_contract_validated"] is True
          assert value["source_only_authorization"] is True
          for field in (
              "dispatch_command_present",
              "dispatch_action_executed",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_385_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-598 authorization
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2022-dec598-dispatch-authorization-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec597-run.json
            ${{ runner.temp }}/dec597-artifacts.json
            ${{ runner.temp }}/dec597-2022-dispatch-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec598-2022-dispatch-authorization.json
          if-no-files-found: error
