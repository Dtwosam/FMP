name: phase8a-annual-catalogue-2022-runtime-authorization-plan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2022-runtime-authorization-plan.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-runtime-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC592_RUN_ID: "37608559036"
      DEC592_HEAD_SHA: "0d9b8deec0b6cd26f447596fc59a682f7c536e0b"
      DEC592_ARTIFACT_ID: "11475911390"
      DEC592_ARTIFACT_DIGEST: "sha256:a70abd5972c0aa78459c6540ffc863f0a463183e880baa8b96752b0336fd5d85"
      DEC592_AUTHORIZATION_FINGERPRINT: "5365ca95855d97df7ad28ff7d4e6f5c2ec51183899da7f88048d78b5d381bf54"
      DEC592_AUTHORIZATION_CANONICAL_SHA256: "b335202460f6cd61d30f54717c97de5451fdc251e08fab45beffccdd2bd5df3d"

    steps:
      - name: Checkout exact DEC-593 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first DEC-593 landing run
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-593 sources and dormant targets
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization_plan.py)" = "d7710ab16dde2eea6b0d93dc6387c6cc489b30d7"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2022_runtime_authorization_plan.py)" = "fc1c5fe9d6dbbb7ecb6441fb4292fef00fab6f2f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_execution_authorization.py)" = "e68e9f1ee41ca89f0ae3d7758d59b4ce8c5823bb"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_execution_preflight.py)" = "a52661d8abd910856bc5260898a7f21cc4958f94"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2022_runtime_authorization.py.disabled)" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2022_authorization.py.disabled)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py

      - name: Fetch and verify exact DEC-592 authorization artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC592_RUN_ID"             > "$RUNNER_TEMP/dec592-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC592_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec592-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec592-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC592_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2022-execution-authorization",
              "path": ".github/workflows/phase8a-annual-catalogue-2022-execution-authorization.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC592_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec592-artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC592_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2022-dec592-execution-authorization-"
              + os.environ["DEC592_HEAD_SHA"]
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC592_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC592_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec592-authorization.zip"
          expected_sha="${DEC592_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec592-authorization.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec592-authorization"
          unzip -q "$RUNNER_TEMP/dec592-authorization.zip"             -d "$RUNNER_TEMP/dec592-authorization"
          authorization="$(
            find "$RUNNER_TEMP/dec592-authorization"               -type f -name dec592-2022-execution-authorization.json -print
          )"
          test "$(printf '%s\n' "$authorization" | sed '/^$/d' | wc -l)" = "1"
          cp "$authorization" "$RUNNER_TEMP/dec592-2022-execution-authorization.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "dec592-2022-execution-authorization.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == (
              os.environ["DEC592_AUTHORIZATION_CANONICAL_SHA256"]
          )
          assert value["decision"] == "DEC-592"
          assert value["authorization_fingerprint_sha256"] == (
              os.environ["DEC592_AUTHORIZATION_FINGERPRINT"]
          )
          assert value["annual_segment_label"] == "2022"
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["runtime_authorization_installed"] is False
          assert value["runtime_gate_active"] is False
          assert value["dispatch_action_executed"] is False
          assert value["run_385_or_later_authorized"] is False
          assert value["protected_history_access_authorized"] is False
          assert value["cross_year_comparison_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Fetch exact current main and annual history
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 9
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383}
          expected = {
              1: (37126711695, "failure", "fd85a886d07234ad584dcca08692b37e6af54b2e"),
              376: (37191637168, "failure", "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3"),
              377: (37198002653, "success", "a89db974be9a94481e7ed0990476bc661012f1e4"),
              378: (37206992367, "success", "2524fde355349581c9440a172d0384c3cbce31ed"),
              379: (37227536041, "success", "7b4c1ef8573e280c067443b72f1534d9091d5b7f"),
              380: (37237817538, "success", "30971a996f514670a6f836d8e45cf80137197a4f"),
              381: (37310525635, "success", "8bcee3a7a834743f08bd9ad73109bfc09609a2fe"),
              382: (37443770076, "success", "681e81e021d4970a67b18370142d55b17ec68864"),
              383: (37531960014, "success", "a1e194907c273a2fcdddfb4c24d64a96cfd8d263"),
          }
          for number, (run_id, conclusion, head_sha) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 384 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned runtime-plan dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean runtime-plan checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-593 runtime authorization plan
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2022_runtime_authorization_plan.py             plan             --authorization-json "$RUNNER_TEMP/dec592-2022-execution-authorization.json"             --out "$RUNNER_TEMP/dec593-2022-runtime-authorization-plan.json"

      - name: Verify DEC-593 remains dormant and source-only
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec593-2022-runtime-authorization-plan.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-593"
          assert value["source_authorization_workflow_run_id"] == 37608559036
          assert value["source_authorization_artifact_id"] == 11475911390
          assert value["source_authorization_fingerprint_sha256"] == (
              "5365ca95855d97df7ad28ff7d4e6f5c2ec51183899da7f88048d78b5d381bf54"
          )
          assert value["source_authorization_canonical_sha256"] == (
              "b335202460f6cd61d30f54717c97de5451fdc251e08fab45beffccdd2bd5df3d"
          )
          assert value["annual_segment_label"] == "2022"
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["expected_previous_annual_freeze_run_id"] == 37531960014
          assert value["target_gate_source_blob_sha"] == (
              "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          )
          assert value["target_runtime_source_blob_sha"] == (
              "f2734c7ea32355b1024d1097812578b23fc4409d"
          )
          assert value["plan_source_only"] is True
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "repository_mutation_authorized",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_385_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-593 runtime plan
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2022-dec593-runtime-authorization-plan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec592-run.json
            ${{ runner.temp }}/dec592-artifacts.json
            ${{ runner.temp }}/dec592-2022-execution-authorization.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec593-2022-runtime-authorization-plan.json
          if-no-files-found: error
