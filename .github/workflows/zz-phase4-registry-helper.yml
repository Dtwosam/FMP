- Conclusion: REJECT
- Reason: no exact predeclared buffer achieved positive net return, positive expectancy, and PF > 1 on both development and validation at 0.2-pip baseline.
- Follow-up: promote nothing; retain EXP-001 and EXP-005 candidates frozen unchanged. This completes all six planned Phase 4 baseline families and leaves final-test access locked pending explicit later authorization. Detailed evidence: `docs/phase4-session-sweep-rejection-evidence.md`.
'''
              log = log.rstrip() + '\n\n' + entries.strip() + '\n'
          for exp_id in ('EXP-20260914-003', 'EXP-20260914-004', 'EXP-20260914-005', 'EXP-20260914-006'):
              if log.count(f'### {exp_id} —') != 1:
                  raise SystemExit(f'experiment registry count mismatch: {exp_id}')
          log_path.write_text(log, encoding='utf-8')

          replacements = {
              Path('docs/phase4-volatility-breakout-evidence.md'): (
                  '**Outcome decision:** DEC-025 — pending evidence-closure merge',
                  '**Outcome decision:** DEC-025 — APPROVED',
              ),
              Path('docs/phase4-session-sweep-rejection-evidence.md'): (
                  '**Outcome decision:** DEC-027 — pending evidence-closure merge',
                  '**Outcome decision:** DEC-027 — APPROVED',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'stale outcome marker missing: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_phase4_experiment_registry_state.py').write_text(r'''from pathlib import Path
import unittest


ROOT = Path(__file__).resolve().parents[1]


class Phase4ExperimentRegistryTests(unittest.TestCase):
    def test_all_six_baseline_experiments_are_logged_and_outcomes_are_final(self) -> None:
        registry = (ROOT / "docs/experiment-log.md").read_text(encoding="utf-8")
        vol = (ROOT / "docs/phase4-volatility-breakout-evidence.md").read_text(encoding="utf-8")
        sweep = (ROOT / "docs/phase4-session-sweep-rejection-evidence.md").read_text(encoding="utf-8")

        for number in range(1, 7):
            exp_id = f"EXP-20260914-{number:03d}"
            self.assertEqual(registry.count(f"### {exp_id} —"), 1, exp_id)
        self.assertIn("### EXP-20260914-003 — Mean reversion baseline", registry)
        self.assertIn("### EXP-20260914-004 — Previous-day high/low rejection baseline", registry)
        self.assertIn("### EXP-20260914-005 — Rolling volatility-breakout baseline", registry)
        self.assertIn("### EXP-20260914-006 — Session high/low sweep-rejection baseline", registry)
        self.assertGreaterEqual(registry.count("Final-test touched?: NO"), 6)
        self.assertIn("- Conclusion: REJECT", registry)
        self.assertIn("- Conclusion: PROMOTE", registry)
        self.assertIn("**Outcome decision:** DEC-025 — APPROVED", vol)
        self.assertIn("**Outcome decision:** DEC-027 — APPROVED", sweep)
        self.assertNotIn("pending evidence-closure merge", vol)
        self.assertNotIn("pending evidence-closure merge", sweep)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          Path('.github/workflows/zz-phase4-registry-helper.yml').unlink()
          PY
      - name: Verify bounded registry completion
        run: |
          git diff --check
          python -m unittest discover -s tests -p 'test_phase4_experiment_registry_state.py' -v
          grep -q 'EXP-20260914-006' docs/experiment-log.md
          grep -q 'DEC-025 — APPROVED' docs/phase4-volatility-breakout-evidence.md
          grep -q 'DEC-027 — APPROVED' docs/phase4-session-sweep-rejection-evidence.md
          test ! -e .github/workflows/zz-phase4-registry-helper.yml
      - name: Commit registry completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiment-log.md docs/phase4-volatility-breakout-evidence.md docs/phase4-session-sweep-rejection-evidence.md tests/test_phase4_experiment_registry_state.py .github/workflows/zz-phase4-registry-helper.yml
          git commit -m '[phase1-no-source] Complete Phase 4 experiment registry'
          git push origin HEAD:phase4-registry-completion
