name: zz-phase4-registry-helper

on:
  push:
    branches:
      - phase4-registry-completion
    paths:
      - .github/workflows/zz-phase4-registry-helper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-registry-completion
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Complete Phase 4 experiment registry
        run: |
          python - <<'PY'
          from pathlib import Path

          fields = [
              'Date', 'Status', 'Hypothesis', 'Code commit', 'Data manifest/version', 'Pair(s)', 'Timeframe(s)',
              'Data range', 'Train period', 'Validation period', 'Final-test touched?', 'Strategy/model', 'Features',
              'Parameters/search space', 'Random seed (if relevant)', 'Spread/cost model', 'Slippage model',
              'Risk assumptions', 'Trade count', 'Net return after costs', 'Expectancy/trade', 'Profit factor',
              'Max drawdown', 'Key subperiod results', 'Robustness/cost sensitivity', 'Result summary',
              'Conclusion', 'Reason', 'Follow-up',
          ]
          manifests = 'accepted Phase 2 processed manifests, schema `fmp-canonical-1m-v1`; EURUSD `fd7676282e6e667c39754b09b43a43288a0a877fec588cd2601a601e2b0edf6a`, GBPUSD `a6ee73e94781f48a43f2792328528d242455d4f7f4f2e0a5760446df21ba4d94`, USDJPY `e47ee5339868a741097404bed49411cca36b03609ebe395261bb70b6e63bdd3d`.'
          common = {
              'Date': '2026-09-14',
              'Data manifest/version': manifests,
              'Pair(s)': 'EURUSD, GBPUSD, USDJPY',
              'Timeframe(s)': '5m, 15m, 1h',
              'Data range': 'accepted Phase 2 coverage 2015-01-01 through 2026-08-20 inclusive; development and validation only.',
              'Train period': '2015-01-01 through 2020-12-31 inclusive',
              'Validation period': '2021-01-01 through 2023-12-31 inclusive',
              'Final-test touched?': 'NO',
              'Random seed (if relevant)': 'not applicable; deterministic strategy and backtester.',
              'Spread/cost model': 'historical BID/ASK spread; zero commission; zero financing.',
              'Slippage model': '0.2, 0.5, 1.0 pips per fill, adverse on every execution side.',
              'Risk assumptions': 'accepted Phase 3 policy unchanged: 0.25% requested risk, 0.50% hard per-trade max, 1.00% simultaneous max, 1.50% UTC day-start realized-loss halt.',
          }
          records = [
              ('EXP-20260914-003', 'Mean reversion baseline', {
                  **common, 'Status': 'FAIL', 'Hypothesis': 'Fresh intraday displacement from a preceding rolling midpoint-close distribution may revert toward its pre-existing mean strongly enough to overcome costs. No profitability was assumed.',
                  'Code commit': '`87003a3982ca61eb6fd030c5291616d98dbb0c1a`', 'Strategy/model': 'deterministic London-session mean-reversion baseline using preceding-N midpoint-close population mean/std, fresh z-score excursions, first signal only, and exact 16:00 Europe/London flat.',
                  'Features': 'midpoint close; rolling mean; rolling population standard deviation; current/previous z-score; Phase 3 BID/ASK execution.', 'Parameters/search space': 'lookbacks 4h/8h/16h × fresh-excursion thresholds 1.5σ/2.0σ; exactly 6 configurations per pair/timeframe.',
                  'Trade count': 'no promoted candidate; full 324-row matrix retained in evidence.', 'Net return after costs': 'no promoted candidate; all 54 baseline development rows and all 54 baseline validation rows were negative.',
                  'Expectancy/trade': 'no promoted candidate; all baseline rows were negative on both splits.', 'Profit factor': 'no promoted candidate; development range 0.6150–0.9596 and validation range 0.5396–0.9582 at baseline.',
                  'Max drawdown': 'no candidate-level value; fixed-risk drawdowns remain in the benchmark evidence.', 'Key subperiod results': 'the family failed broadly rather than through a narrow chronology reversal.',
                  'Robustness/cost sensitivity': 'zero 0.2-pip survivors; 0.5/1.0-pip rows remain diagnostic evidence only and cannot rescue the family.', 'Result summary': 'benchmark run `34875463677` SUCCESS; 18/18 artifacts and 324/324 rows independently verified with zero errors.',
                  'Conclusion': 'REJECT', 'Reason': 'zero of 54 pair/timeframe/lookback/threshold points passed the two-split profitability gate at 0.2 pips.', 'Follow-up': 'retain EXP-001 unchanged and proceed to previous-day rejection; detailed evidence: `docs/phase4-mean-reversion-evidence.md`.'}),
              ('EXP-20260914-004', 'Previous-day high/low rejection baseline', {
                  **common, 'Status': 'FAIL', 'Hypothesis': 'Penetration beyond the previous completed New-York-close FX session high/low followed by a close back inside may revert toward the frozen previous-day midpoint strongly enough to overcome costs.',
                  'Code commit': '`7db3a747236942fa393521e5866e3245d1a22a99`', 'Strategy/model': 'deterministic previous-day high/low rejection using the most recent completed New-York-close FX session, first directional rejection only, and exact 16:00 Europe/London flat.',
                  'Features': 'previous-day midpoint high/low/midpoint; current midpoint penetration/rejection; Phase 3 BID/ASK execution.', 'Parameters/search space': 'penetration buffers 0/2/5 pips; no post-result expansion.',
                  'Trade count': 'sole baseline survivor USDJPY 5m / 5-pip buffer: 29 development, 28 validation trades.', 'Net return after costs': '+4.0039% development and +0.0657% validation at 0.2 pips for the sole baseline survivor.',
                  'Expectancy/trade': '+$138.0644 development and +$2.3461 validation.', 'Profit factor': '1.9002 development and 1.0133 validation.', 'Max drawdown': '2.0245% development and 1.7179% validation.',
                  'Key subperiod results': 'validation negative in 2021 and 2022 and positive only in 2023; top three winners about 85.38% of validation positive R.', 'Robustness/cost sensitivity': 'validation turns negative at 0.5 pips (-0.2343%, PF 0.9547); neighboring buffers fail; 1.0-pip validation -0.7324%, PF 0.8683.',
                  'Result summary': 'benchmark run `34883815436` SUCCESS; 18/18 artifacts and 162/162 rows independently verified with zero errors.', 'Conclusion': 'REJECT',
                  'Reason': 'the only baseline survivor was thin, isolated, cost-sensitive, chronologically concentrated, and winner-dependent.', 'Follow-up': 'no candidate promoted; proceed to volatility breakout; detailed evidence: `docs/phase4-previous-day-rejection-evidence.md`.'}),
              ('EXP-20260914-005', 'Rolling volatility-breakout baseline', {
                  **common, 'Status': 'PASS', 'Hypothesis': 'A close outside a preceding rolling 8h midpoint channel accompanied by contemporaneous range expansion may continue far enough to overcome costs.',
                  'Code commit': '`3bf36186900f5065e9e3ddced0305865433b9d69`', 'Strategy/model': 'deterministic rolling 8h volatility breakout; strict close beyond channel plus range expansion; first signal only; signal-bar extreme stop; fixed 1.0R target; exact 16:00 flat.',
                  'Features': 'rolling midpoint high/low, median reference bar range, current midpoint range, expansion multiple.', 'Parameters/search space': 'range-expansion multipliers 1.0x/1.5x/2.0x; fixed 1.0R target.',
                  'Trade count': 'promoted USDJPY 1h / 2.0x: 596 development and 364 validation trades.', 'Net return after costs': '+11.4235% development and +5.5971% validation at 0.2 pips.',
                  'Expectancy/trade': '+$19.1670 development and +$15.3766 validation.', 'Profit factor': '1.2321 development and 1.1931 validation.', 'Max drawdown': '2.5228% development and 1.9853% validation.',
                  'Key subperiod results': 'all six development years positive; validation negative in 2021 but positive in 2022 and 2023; top-three winner dependence about 1.30%/2.22%.', 'Robustness/cost sensitivity': 'survives 0.5-pip stress on both splits (+6.5350%/+3.2953%) but fails 1.0-pip diagnostic; neighboring multipliers/timeframes do not confirm development edge.',
                  'Result summary': 'benchmark run `34888225242` SUCCESS; 18/18 artifacts and 162/162 rows independently verified; exactly one of 27 baseline points survived.', 'Conclusion': 'PROMOTE',
                  'Reason': 'the exact predeclared point clears both chronological splits, survives required 0.5-pip stress, has a substantial sample and low drawdown, broad development-year support, and low winner dependence.', 'Follow-up': 'freeze USDJPY 1h / 2.0x / fixed 1.0R alongside EXP-001 and proceed to session sweep-rejection; detailed evidence: `docs/phase4-volatility-breakout-evidence.md`.'}),
              ('EXP-20260914-006', 'Session high/low sweep-rejection baseline', {
                  **common, 'Status': 'FAIL', 'Hypothesis': 'Intrabar penetration beyond the frozen 00:00–08:00 Europe/London session high/low followed by a strict close back inside may revert toward the frozen session midpoint strongly enough to overcome costs.',
                  'Code commit': '`120348d4a5df806f674551590610b216a9bc33ac`', 'Strategy/model': 'deterministic session high/low sweep-rejection; frozen 00:00–08:00 Europe/London midpoint range; first signal only; signal-bar extreme stop; session-midpoint target; exact 16:00 flat.',
                  'Features': 'frozen session midpoint high/low/midpoint and current midpoint sweep/rejection state.', 'Parameters/search space': 'penetration buffers 0/2/5 pips; no alternate session or rescue grid.',
                  'Trade count': 'no promoted candidate; clearest split-only point USDJPY 5m / 2 pips: 337 development and 240 validation trades.', 'Net return after costs': 'that point reversed from +1.9167% development to -15.4056% validation at baseline.',
                  'Expectancy/trade': '+$5.6874 development versus -$64.1899 validation.', 'Profit factor': '1.0282 development versus 0.6706 validation.', 'Max drawdown': '7.6380% development versus 16.7821% validation.',
                  'Key subperiod results': 'zero of 27 points cleared the required two-split gate; two USDJPY 1h validation-only qualifiers failed development.', 'Robustness/cost sensitivity': 'no baseline survivor, so downstream cost rows cannot rescue any point.',
                  'Result summary': 'benchmark run `34895426037` SUCCESS; 18/18 artifacts and 162/162 rows independently verified with zero errors.', 'Conclusion': 'REJECT',
                  'Reason': 'no exact predeclared buffer achieved positive net return, positive expectancy, and PF > 1 on both development and validation at 0.2 pips.', 'Follow-up': 'retain EXP-001 and EXP-005 frozen; all six planned Phase 4 families are complete; detailed evidence: `docs/phase4-session-sweep-rejection-evidence.md`.'}),
          ]

          log_path = Path('docs/experiment-log.md')
          log = log_path.read_text(encoding='utf-8')
          if '### EXP-20260914-003 —' not in log:
              chunks = []
              for exp_id, title, record in records:
                  missing = [field for field in fields if field not in record]
                  if missing:
                      raise SystemExit(f'missing registry fields for {exp_id}: {missing}')
                  lines = [f'### {exp_id} — {title}', '']
                  lines.extend(f'- {field}: {record[field]}' for field in fields)
                  chunks.append('\n'.join(lines))
              log = log.rstrip() + '\n\n' + '\n\n'.join(chunks) + '\n'
          for exp_id, _, _ in records:
              if log.count(f'### {exp_id} —') != 1:
                  raise SystemExit(f'experiment registry count mismatch: {exp_id}')
          log_path.write_text(log, encoding='utf-8')

          replacements = {
              Path('docs/phase4-volatility-breakout-evidence.md'): ('**Outcome decision:** DEC-025 — pending evidence-closure merge', '**Outcome decision:** DEC-025 — APPROVED'),
              Path('docs/phase4-session-sweep-rejection-evidence.md'): ('**Outcome decision:** DEC-027 — pending evidence-closure merge', '**Outcome decision:** DEC-027 — APPROVED'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'stale outcome marker missing: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_lines = [
              'from pathlib import Path', 'import unittest', '', '', 'ROOT = Path(__file__).resolve().parents[1]', '', '',
              'class Phase4ExperimentRegistryTests(unittest.TestCase):',
              '    def test_all_six_baseline_experiments_are_logged_and_outcomes_are_final(self) -> None:',
              '        registry = (ROOT / "docs/experiment-log.md").read_text(encoding="utf-8")',
              '        vol = (ROOT / "docs/phase4-volatility-breakout-evidence.md").read_text(encoding="utf-8")',
              '        sweep = (ROOT / "docs/phase4-session-sweep-rejection-evidence.md").read_text(encoding="utf-8")',
              '        for number in range(1, 7):',
              '            exp_id = f"EXP-20260914-{number:03d}"',
              '            self.assertEqual(registry.count(f"### {exp_id} —"), 1, exp_id)',
              '        self.assertGreaterEqual(registry.count("Final-test touched?: NO"), 6)',
              '        self.assertIn("### EXP-20260914-006 — Session high/low sweep-rejection baseline", registry)',
              '        self.assertIn("**Outcome decision:** DEC-025 — APPROVED", vol)',
              '        self.assertIn("**Outcome decision:** DEC-027 — APPROVED", sweep)',
              '        self.assertNotIn("pending evidence-closure merge", vol)',
              '        self.assertNotIn("pending evidence-closure merge", sweep)',
              '', '', 'if __name__ == "__main__":', '    unittest.main()', '',
          ]
          Path('tests/test_phase4_experiment_registry_state.py').write_text('\n'.join(test_lines), encoding='utf-8')
          Path('.github/workflows/zz-phase4-registry-helper.yml').unlink()
          PY
      - name: Verify bounded registry completion
        run: |
          git diff --check
          python -m unittest discover -s tests -p 'test_phase4_experiment_registry_state.py' -v
          grep -q 'EXP-20260914-006' docs/experiment-log.md
          grep -q 'DEC-025 — APPROVED' docs/phase4-volatility-breakout-evidence.md
          grep -q 'DEC-027 — APPROVED' docs/phase4-session-sweep-rejection-evidence.md
          test ! -e .github/workflows/zz-phase4-registry-helper.yml
      - name: Commit registry completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiment-log.md docs/phase4-volatility-breakout-evidence.md docs/phase4-session-sweep-rejection-evidence.md tests/test_phase4_experiment_registry_state.py .github/workflows/zz-phase4-registry-helper.yml
          git commit -m '[phase1-no-source] Complete Phase 4 experiment registry'
          git push origin HEAD:phase4-registry-completion
