name: phase5-closure-patch-temp

on:
  pull_request:
    paths:
      - scripts/_phase5_closure_patch.py
      - .github/workflows/phase5-closure-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 103
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase5-feature-acceptance
          fetch-depth: 0
      - name: Apply bounded closure patch
        run: python scripts/_phase5_closure_patch.py
      - name: Verify bounded diff and focused state tests
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/decision-log.md docs/project-state.md tests/test_phase4_acceptance_state.py tests/test_phase4_checkpoint_state.py tests/test_phase5_feature_protocol_state.py | sort)"
          test "${changed}" = "${expected}"
          PYTHONPATH=src python -m unittest \
            tests.test_phase4_acceptance_state \
            tests.test_phase4_checkpoint_state \
            tests.test_phase5_feature_protocol_state \
            tests.test_phase5_acceptance_state -v
      - name: Commit durable closure state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/decision-log.md docs/project-state.md \
            tests/test_phase4_acceptance_state.py \
            tests/test_phase4_checkpoint_state.py \
            tests/test_phase5_feature_protocol_state.py
          git commit -m '[phase1-no-source] Record Phase 5 acceptance state'
          git push origin HEAD:phase5-feature-acceptance
