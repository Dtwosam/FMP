name: zz-phase4-acceptance-test-fix

on:
  push:
    branches:
      - phase4-acceptance-closure
    paths:
      - scripts/_phase4_acceptance_stale_test_fix_once.py
      - .github/workflows/zz-phase4-acceptance-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-acceptance-closure
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update stale Phase 4 status assertions only
        run: python scripts/_phase4_acceptance_stale_test_fix_once.py
      - name: Verify bounded stale-test update
        run: |
          git diff --check
          grep -R --line-number --fixed-strings '**Phase status:** ACTIVE' \
            tests/test_phase4_mean_reversion_evidence_state.py \
            tests/test_phase4_mean_reversion_state.py \
            tests/test_phase4_previous_day_rejection_state.py \
            tests/test_phase4_research_state.py \
            tests/test_phase4_session_breakout_evidence_state.py \
            tests/test_phase4_session_sweep_state.py \
            tests/test_phase4_trend_continuation_evidence_state.py \
            tests/test_phase4_trend_continuation_state.py \
            tests/test_phase4_volatility_breakout_state.py && exit 1 || true
          python -m unittest \
            tests.test_phase4_mean_reversion_evidence_state \
            tests.test_phase4_mean_reversion_state \
            tests.test_phase4_previous_day_rejection_state \
            tests.test_phase4_research_state \
            tests.test_phase4_session_breakout_evidence_state \
            tests.test_phase4_session_sweep_state \
            tests.test_phase4_trend_continuation_evidence_state \
            tests.test_phase4_trend_continuation_state \
            tests.test_phase4_volatility_breakout_state -v
      - name: Commit stale-test update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_phase4_mean_reversion_evidence_state.py \
            tests/test_phase4_mean_reversion_state.py \
            tests/test_phase4_previous_day_rejection_state.py \
            tests/test_phase4_research_state.py \
            tests/test_phase4_session_breakout_evidence_state.py \
            tests/test_phase4_session_sweep_state.py \
            tests/test_phase4_trend_continuation_evidence_state.py \
            tests/test_phase4_trend_continuation_state.py \
            tests/test_phase4_volatility_breakout_state.py
          git commit -m '[phase1-no-source] Update Phase 4 closed-state assertions'
          git push origin HEAD:phase4-acceptance-closure
