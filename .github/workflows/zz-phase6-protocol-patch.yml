name: zz-phase6-protocol-patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'phase6-ml-filter-protocol'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: phase6-ml-filter-protocol
      - name: Apply bounded protocol patch
        run: python scripts/zz_phase6_protocol_patch.py
      - name: Commit bounded protocol patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/decision-log.md docs/project-state.md docs/superpowers/specs/2026-09-15-phase6-statistical-ml-filter-design.md
          git commit -m '[phase1-no-source] Freeze Phase 6 ML filter protocol'
          git push origin HEAD:phase6-ml-filter-protocol
