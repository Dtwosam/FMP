name: zz-phase4-registry-helper-fix

on:
  push:
    branches:
      - phase4-registry-completion
    paths:
      - .github/workflows/zz-phase4-registry-helper-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-registry-completion
      - name: Patch helper whitespace handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/zz-phase4-registry-helper.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "('**Outcome decision:** DEC-025 — pending evidence-closure merge', '**Outcome decision:** DEC-025 — APPROVED')",
              "('**Outcome decision:** DEC-025 — pending evidence-closure merge  ', '**Outcome decision:** DEC-025 — APPROVED')",
              1,
          )
          text = text.replace(
              "('**Outcome decision:** DEC-027 — pending evidence-closure merge', '**Outcome decision:** DEC-027 — APPROVED')",
              "('**Outcome decision:** DEC-027 — pending evidence-closure merge  ', '**Outcome decision:** DEC-027 — APPROVED')",
              1,
          )
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/zz-phase4-registry-helper-fix.yml').unlink()
          PY
          grep -q "pending evidence-closure merge  '" .github/workflows/zz-phase4-registry-helper.yml
          git diff --check
      - name: Commit helper fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zz-phase4-registry-helper.yml .github/workflows/zz-phase4-registry-helper-fix.yml
          git commit -m '[phase1-no-source] Fix registry outcome whitespace handling'
          git push origin HEAD:phase4-registry-completion
