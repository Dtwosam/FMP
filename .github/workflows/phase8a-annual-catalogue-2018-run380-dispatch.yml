name: phase8a-annual-catalogue-2018-run380-dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-run380-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEC553_RUN_ID: "37235949110"
      DEC553_HEAD_SHA: "67b8baa1f6a5770c2add27189f86f65f46a263d6"
      DEC553_ARTIFACT_ID: "11315522989"
      DEC553_ARTIFACT_DIGEST: "sha256:e4d9b6c8661442c1a1debebac843f2dabf07bca6e36054dc7d2ed43a74f1375e"
      DEC553_PREFLIGHT_FINGERPRINT: "ba609f06481c1b08e10d16dc772290cd0f3988de9ba32eaa56c13b5561ab86c2"

    steps:
      - name: Checkout exact DEC-554/555 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first one-shot dispatcher push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_dispatch_action_preflight.py)" = "67e2f0de14fe9ffcc8dce5473f816ed5c1ca9cb7"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2018_dispatch_action_preflight.py)" = "bc1d76fc99a18b1e4b3f31682822b2d84efa3764"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_run380_evidence_review.py)" = "c44123cb04a8f476cf3efdb635bd1efb1d072df1"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py)" = "ff47d2f2ef43039dfcb88c1b9c65ce3d34428044"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_runtime_authorization.py)" = "cd50f50156cf74c34cd97d69d24291dc373b390f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "410180c34a9e3500bbbb42310a5253b993ac7785"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test -f .github/workflows/phase8a-annual-catalogue-2018-run380-runtime-evidence.yml

      - name: Require only the atomic DEC-554/555 landing delta
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$DEC553_HEAD_SHA" "$GITHUB_SHA"
          git diff --name-only "$DEC553_HEAD_SHA" "$GITHUB_SHA"             > "$RUNNER_TEMP/landing-changed-files.txt"

          python - <<'PY'
          import os
          from pathlib import Path

          changed = {
              line.strip()
              for line in (
                  Path(os.environ["RUNNER_TEMP"]) / "landing-changed-files.txt"
              ).read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          expected = {
              ".github/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml",
              ".github/workflows/phase8a-annual-catalogue-2018-run380-runtime-evidence.yml",
              ".github/workflows/tests.yml",
              "docs/decision-log.md",
              "docs/project-state.md",
              "docs/source-of-truth-changelog.md",
              "docs/superpowers/specs/2026-10-04-phase8a-annual-catalogue-2018-run380-dispatch-and-evidence.md",
              "scripts/phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py",
              "src/fmp/discovery/annual_pattern_catalogue_2018_run380_evidence_review.py",
              "tests/test_phase8a_annual_pattern_catalogue_2018_run380_dispatch_workflow.py",
              "tests/test_phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py",
              "tests/test_phase8a_annual_pattern_catalogue_2018_run380_runtime_evidence_workflow.py",
          }
          assert changed == expected, (sorted(changed), sorted(expected))
          PY

      - name: Fetch and verify exact DEC-553 final preflight
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC553_RUN_ID"             > "$RUNNER_TEMP/dec553-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC553_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec553-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec553-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC553_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2018-dispatch-action-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2018-dispatch-action-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC553_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec553-artifacts.json").read_text(encoding="utf-8")
          )
          matches = [
              row
              for row in artifacts.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC553_ARTIFACT_ID"])
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC553_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          assert matches[0]["name"] == (
              "annual-catalogue-2018-dec553-dispatch-action-preflight-"
              + os.environ["DEC553_HEAD_SHA"]
          )
          PY

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC553_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec553.zip"
          expected_sha="${DEC553_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec553.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec553"
          unzip -q "$RUNNER_TEMP/dec553.zip" -d "$RUNNER_TEMP/dec553"
          preflight_path="$(
            find "$RUNNER_TEMP/dec553"               -type f -name 'dec553-2018-dispatch-action-preflight.json' -print
          )"
          test "$(printf '%s\n' "$preflight_path" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight_path" "$RUNNER_TEMP/dec553-2018-dispatch-action-preflight.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec553-2018-dispatch-action-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-553"
          assert value["expected_head_sha"] == os.environ["DEC553_HEAD_SHA"]
          assert (
              value["preflight_fingerprint_sha256"]
              == os.environ["DEC553_PREFLIGHT_FINGERPRINT"]
          )
          assert value["annual_segment_label"] == "2018"
          assert value["previous_annual_freeze_run_id"] == 37227536041
          assert value["expected_run_number"] == 380
          assert value["expected_run_attempt"] == 1
          assert value["dispatch_ref"] == "main"
          assert value["dispatch_input_annual_segment_label"] == "2018"
          assert (
              value["dispatch_input_previous_annual_freeze_run_id"]
              == "37227536041"
          )
          assert value["dispatch_parameters_frozen"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["dispatch_command_present"] is False
          assert value["dispatch_action_executed"] is False
          assert value["run_381_or_later_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Recheck main and exact annual slot immediately before dispatch
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main-before-dispatch.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-before-dispatch.json")" = "$GITHUB_SHA"

          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-before-380.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"]) / "annual-before-380.json"
              ).read_text(encoding="utf-8")
          ).get("workflow_runs")
          assert isinstance(rows, list)
          assert len(rows) == 5
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379}
          exact = {
              1: (
                  37126711695,
                  "fd85a886d07234ad584dcca08692b37e6af54b2e",
                  "failure",
              ),
              376: (
                  37191637168,
                  "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3",
                  "failure",
              ),
              377: (
                  37198002653,
                  "a89db974be9a94481e7ed0990476bc661012f1e4",
                  "success",
              ),
              378: (
                  37206992367,
                  "2524fde355349581c9440a172d0384c3cbce31ed",
                  "success",
              ),
              379: (
                  37227536041,
                  "7b4c1ef8573e280c067443b72f1534d9091d5b7f",
                  "success",
              ),
          }
          for number, (run_id, head_sha, conclusion) in exact.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["name"] == "phase8a-annual-pattern-catalogue"
              assert row["path"] == ".github/workflows/phase8a-annual-pattern-catalogue.yml"
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["run_attempt"] == 1
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 380 for row in rows)
          PY

      - name: Dispatch exact 2018 annual run 380
        run: |
          set -euo pipefail
          gh workflow run phase8a-annual-pattern-catalogue.yml             --ref main             -f annual_segment_label=2018             -f previous_annual_freeze_run_id=37227536041

      - name: Resolve exact run 380 attempt 1
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"
          found=0
          for _ in $(seq 1 30); do
            gh api "$endpoint" > "$RUNNER_TEMP/annual-after-380.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"]) / "annual-after-380.json"
              ).read_text(encoding="utf-8")
          ).get("workflow_runs")
          assert isinstance(rows, list)
          targets = [
              row
              for row in rows
              if row.get("run_number") == 380
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          assert len(targets) <= 1
          unexpected = [
              row
              for row in rows
              if isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 381
          ]
          assert not unexpected
          raise SystemExit(0 if len(targets) == 1 else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Write immutable DEC-554 dispatch receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          rows = json.loads(
              (temp / "annual-after-380.json").read_text(encoding="utf-8")
          )["workflow_runs"]
          targets = [
              row
              for row in rows
              if row.get("run_number") == 380
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          assert len(targets) == 1
          target = targets[0]
          receipt = {
              "decision": "DEC-554",
              "stage": "ANNUAL_CATALOGUE_2018_RUN_380_DISPATCH_SUBMITTED",
              "source_preflight_decision": "DEC-553",
              "source_preflight_workflow_run_id": int(os.environ["DEC553_RUN_ID"]),
              "source_preflight_workflow_head_sha": os.environ["DEC553_HEAD_SHA"],
              "source_preflight_artifact_id": int(os.environ["DEC553_ARTIFACT_ID"]),
              "source_preflight_artifact_digest": os.environ["DEC553_ARTIFACT_DIGEST"],
              "source_preflight_fingerprint_sha256": os.environ["DEC553_PREFLIGHT_FINGERPRINT"],
              "dispatch_head_sha": os.environ["GITHUB_SHA"],
              "annual_segment_label": "2018",
              "previous_annual_freeze_run_id": 37227536041,
              "run_id": target["id"],
              "run_number": 380,
              "run_attempt": 1,
              "run_head_sha": target["head_sha"],
              "dispatch_submitted": True,
              "result_claimed": False,
              "rerun_authorized": False,
              "retry_authorized": False,
              "replacement_run_authorized": False,
              "run_381_or_later_authorized": False,
              "next_segment_execution_authorized": False,
              "cross_year_result_production_authorized": False,
              "strategy_v1_synthesis_authorized": False,
              "promotion_authorized": False,
              "phase8b_authorized": False,
              "demo_order_authorized": False,
              "broker_mutation_authorized": False,
              "live_order_authorized": False,
              "real_money_authorized": False,
              "trading_authorized": False,
              "next_gate": "REVIEW_2018_RUN_380_BEFORE_ANY_2019_EXECUTION",
          }
          (temp / "dec554-run380-dispatch-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable DEC-554 dispatch evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2018-dec554-run380-dispatch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/landing-changed-files.txt
            ${{ runner.temp }}/dec553-run.json
            ${{ runner.temp }}/dec553-artifacts.json
            ${{ runner.temp }}/dec553-2018-dispatch-action-preflight.json
            ${{ runner.temp }}/main-before-dispatch.json
            ${{ runner.temp }}/annual-before-380.json
            ${{ runner.temp }}/annual-after-380.json
            ${{ runner.temp }}/dec554-run380-dispatch-receipt.json
          if-no-files-found: error
