name: phase2-full-history

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  materialize-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        pair: [EURUSD, GBPUSD, USDJPY]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Materialize frozen Phase 2 history
        env:
          PYTHONPATH: src
        run: |
          python -m fmp.data.phase2.full_history_cli \
            --endpoint https://htjqqzlezyguveuajuat.supabase.co/functions/v1/fmp-raw-read \
            --pair "${{ matrix.pair }}" \
            --out ".phase2-full-history/${{ matrix.pair }}" \
            --code-commit "${{ github.sha }}" \
            --workers 4
      - name: Verify full-history evidence shape
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pair = os.environ['PAIR']
          root = Path('.phase2-full-history') / pair
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert summary['protocol'] == 'fmp-phase2-full-history-v1', summary
          assert summary['pair'] == pair, summary
          assert summary['requested_start_utc'] == '2015-01-01', summary
          assert summary['requested_end_inclusive_utc'] == '2026-08-20', summary
          assert summary['month_count'] == 140, summary
          assert summary['raw_read_count'] == 8500, summary
          assert summary['raw_read_counts'] == {'ASK': 4250, 'BID': 4250}, summary
          assert set(summary['row_counts']) == {'1m', '5m', '15m', '1h'}, summary
          assert all(int(value) > 0 for value in summary['row_counts'].values()), summary
          for name in ('raw_ledger', 'quality', 'processed_manifest'):
              item = summary[name]
              path = root / item['path']
              assert path.is_file(), path
              assert item['size_bytes'] > 0, item
              digest = item['sha256']
              assert len(digest) == 64 and all(ch in '0123456789abcdef' for ch in digest), item
          manifest = json.loads((root / summary['processed_manifest']['path']).read_text(encoding='utf-8'))
          assert manifest['symbol'] == pair, manifest
          assert manifest['source_snapshot']['checkpoint'] == 'fmp-v1-phase1-source-of-truth', manifest
          assert manifest['source_snapshot']['frozen_plan_sha256'] == '2328a5417e04dcda862bd93066243ebf95d480443e8d098d08c9e0e1f78b3be6', manifest
          assert len(manifest['artifacts']) == 561, len(manifest['artifacts'])
          PY
      - name: Upload pair materialization
        uses: actions/upload-artifact@v6
        with:
          name: phase2-full-history-${{ matrix.pair }}
          path: .phase2-full-history/${{ matrix.pair }}
          include-hidden-files: true
          if-no-files-found: error
