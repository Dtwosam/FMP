name: phase8a-annual-catalogue-2017-runtime-install-action

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2017-runtime-install-action.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-install-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC537_RUN_ID: "37215789401"
      DEC537_HEAD_SHA: "f8a8de09adc4b64b84b2129eacbc38d0eb00e645"
      DEC537_ARTIFACT_ID: "11308490990"
      DEC537_ARTIFACT_DIGEST: "sha256:892512ac79d2b372372871a143d887f01e5c96d9ed60ea8243f1cbfb4b7cc6ea"

    steps:
      - name: Checkout exact DEC-538 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only action push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-538 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization_install_action.py)" = "b6fd22c5eca66ca373d0479e63af51cd39068ed9"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2017_runtime_authorization_install_action.py)" = "247b78dd727689494f0c070b3d95d8b296528f96"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization_install_preflight.py)" = "446fb95265ee222aa40ffa3f11ef869a1ede8090"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization_plan.py)" = "441b411cdae5b541226d3c0ef88b6cf687ce70da"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2017_runtime_authorization.py.disabled)" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2017_authorization.py.disabled)" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"

      - name: Fetch and verify exact DEC-537 preflight artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC537_RUN_ID" > "$RUNNER_TEMP/dec537-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC537_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec537-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec537-run.json").read_text())
          exact = {
              "id": 37215789401,
              "name": "phase8a-annual-catalogue-2017-runtime-install-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2017-runtime-install-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "f8a8de09adc4b64b84b2129eacbc38d0eb00e645",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          payload = json.loads((temp / "dec537-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11308490990]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == "annual-catalogue-2017-dec537-runtime-install-preflight-f8a8de09adc4b64b84b2129eacbc38d0eb00e645"
          assert artifact["digest"] == "sha256:892512ac79d2b372372871a143d887f01e5c96d9ed60ea8243f1cbfb4b7cc6ea"
          assert artifact["expired"] is False
          PY
          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC537_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec537.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec537.zip" | awk '{print $1}')"
          test "$actual" = "892512ac79d2b372372871a143d887f01e5c96d9ed60ea8243f1cbfb4b7cc6ea"
          mkdir -p "$RUNNER_TEMP/dec537"
          unzip -q "$RUNNER_TEMP/dec537.zip" -d "$RUNNER_TEMP/dec537"
          preflight="$(find "$RUNNER_TEMP/dec537" -type f -name dec537-2017-runtime-install-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec537-2017-runtime-install-preflight.json"

      - name: Recheck current main, runtime, and annual run-379 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-branch.json").read_text())
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]
          rows = json.loads((temp / "annual-runs.json").read_text()).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378}
          assert by_number[1]["conclusion"] == "failure"
          assert by_number[376]["conclusion"] == "failure"
          assert by_number[377]["conclusion"] == "success"
          assert by_number[378]["conclusion"] == "success"
          assert not any(row["run_number"] >= 379 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned action dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean action checkout
        run: test -z "$(git status --porcelain)"

      - name: Compile concrete DEC-538 install action
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2017_runtime_authorization_install_action.py             compile             --preflight-json "$RUNNER_TEMP/dec537-2017-runtime-install-preflight.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec538-2017-runtime-install-action.json"

      - name: Verify DEC-538 exact two-file action and non-dispatching boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dec538-2017-runtime-install-action.json").read_text())
          assert value["decision"] == "DEC-538"
          assert value["source_preflight_workflow_run_id"] == 37215789401
          assert value["source_preflight_artifact_id"] == 11308490990
          assert value["source_preflight_artifact_digest"] == "sha256:892512ac79d2b372372871a143d887f01e5c96d9ed60ea8243f1cbfb4b7cc6ea"
          assert value["expected_run_number"] == 379
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37206992367
          assert value["action_count"] == 2
          create, update = value["actions"]
          assert create["operation"] == "create"
          assert create["target_path"] == "src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py"
          assert create["expected_result_blob_sha"] == "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          assert update["operation"] == "update"
          assert update["target_path"] == "src/fmp/discovery/annual_pattern_catalogue_runtime.py"
          assert update["expected_current_blob_sha"] == "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          assert update["expected_result_blob_sha"] == "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"
          assert value["repository_mutation_authorized"] is True
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-538 install action
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2017-dec538-runtime-install-action-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec537-run.json
            ${{ runner.temp }}/dec537-artifacts.json
            ${{ runner.temp }}/dec537-2017-runtime-install-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec538-2017-runtime-install-action.json
          if-no-files-found: error
