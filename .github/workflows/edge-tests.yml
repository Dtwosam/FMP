name: edge-tests

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-tests.yml'

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Edge Function tests
        run: deno test supabase/functions/fmp-raw-ingest/validation_test.ts
      - name: Type-check Edge Function entrypoint
        run: deno check supabase/functions/fmp-raw-ingest/index.ts
