name: zz-phase5-protocol-record

on:
  push:
    branches:
      - phase5-feature-engine-protocol
    paths:
      - 'scripts/_phase5_protocol_record_once.py'
      - '.github/workflows/zz-phase5-protocol-record.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase5-feature-engine-protocol
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record approved Phase 5 protocol
        run: python scripts/_phase5_protocol_record_once.py
      - name: Verify bounded protocol update
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/decision-log.md
          docs/project-state.md
          docs/superpowers/specs/2026-09-14-phase5-leakage-safe-feature-engine-design.md
          tests/test_phase5_feature_protocol_state.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          python -m unittest tests.test_phase5_feature_protocol_state -v
      - name: Commit protocol record
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/decision-log.md docs/project-state.md docs/superpowers/specs/2026-09-14-phase5-leakage-safe-feature-engine-design.md tests/test_phase5_feature_protocol_state.py
          git commit -m '[phase1-no-source] Record DEC-029 Phase 5 protocol'
          git push origin HEAD:phase5-feature-engine-protocol
