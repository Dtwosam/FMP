name: phase8-provider-closure-wiring-fix

on:
  push:
    branches:
      - phase8-activation-helper
    paths:
      - .github/workflows/phase8-provider-closure-wiring-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-shadow-implementation
          fetch-depth: 0
      - name: Load helper patch script
        run: |
          git fetch origin phase8-activation-helper
          git show origin/phase8-activation-helper:scripts/phase8_provider_closure_wiring_fix.py > /tmp/fix.py
      - name: Repair review closure argument wiring
        run: python /tmp/fix.py
      - name: Commit and push target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fmp/shadow/review_compiler.py
          git commit -m "[phase1-no-source] Fix Phase 8 closure review wiring"
          git push origin HEAD:phase8-shadow-implementation
