name: phase8a-annual-catalogue-2018-run380-runtime-evidence-recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2018-run380-runtime-evidence-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  recover-dec555-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: "37237817538"
      TARGET_HEAD_SHA: "30971a996f514670a6f836d8e45cf80137197a4f"
      TARGET_RUN_NUMBER: "380"
      DISPATCHER_RUN_ID: "37237807553"
      DISPATCHER_ARTIFACT_ID: "11316382138"
      DISPATCHER_ARTIFACT_DIGEST: "sha256:684b436c37ad31d4933b8253495acb4dfbdd912adfca3a354e90cde49e355ed9"
      FREEZE_ARTIFACT_ID: "11315584379"
      FREEZE_ARTIFACT_DIGEST: "sha256:ce2cdb7b4aa5fa9a0c7130e444b067463f333c0324942d57166d60b0af42e2c1"

    steps:
      - name: Checkout exact run-379 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Require exact first recovery push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$TARGET_RUN_NUMBER" = "380"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main.json")" = "$GITHUB_SHA"

      - name: Require frozen DEC-555 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_run380_evidence_review.py)" = "c44123cb04a8f476cf3efdb635bd1efb1d072df1"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py)" = "ff47d2f2ef43039dfcb88c1b9c65ce3d34428044"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml)" = "aaf2b566804182e064f84dc7956c20e4f99661fe"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_dispatch_action_preflight.py)" = "67e2f0de14fe9ffcc8dce5473f816ed5c1ca9cb7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_runtime_authorization.py)" = "cd50f50156cf74c34cd97d69d24291dc373b390f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "410180c34a9e3500bbbb42310a5253b993ac7785"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Require exact annual history and absent prior DEC-555 run
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2018-run380-runtime-evidence.yml/runs?per_page=100"             > "$RUNNER_TEMP/dec555-runs.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          rows = json.loads((temp / "annual-runs.json").read_text(encoding="utf-8")).get("workflow_runs")
          assert isinstance(rows, list)
          assert len(rows) == 6
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380}
          exact = {
              1: (37126711695, "fd85a886d07234ad584dcca08692b37e6af54b2e", "failure"),
              376: (37191637168, "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3", "failure"),
              377: (37198002653, "a89db974be9a94481e7ed0990476bc661012f1e4", "success"),
              378: (37206992367, "2524fde355349581c9440a172d0384c3cbce31ed", "success"),
              379: (37227536041, "7b4c1ef8573e280c067443b72f1534d9091d5b7f", "success"),
              380: (37237817538, "30971a996f514670a6f836d8e45cf80137197a4f", "success"),
          }
          for number, (run_id, head_sha, conclusion) in exact.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["run_attempt"] == 1
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 381 for row in rows)

          prior = json.loads((temp / "dec555-runs.json").read_text(encoding="utf-8")).get("workflow_runs")
          assert isinstance(prior, list)
          assert len(prior) == 0
          PY

      - name: Fetch exact run 379 and dispatcher evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"             > "$RUNNER_TEMP/run380.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/run380-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/run380-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISPATCHER_RUN_ID"             > "$RUNNER_TEMP/dec554-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISPATCHER_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec554-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "run380.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 380,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          dispatcher = json.loads((temp / "dec554-run.json").read_text(encoding="utf-8"))
          exact_dispatcher = {
              "id": int(os.environ["DISPATCHER_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2018-run380-dispatch",
              "path": ".github/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact_dispatcher.items():
              assert dispatcher.get(field) == expected, (field, dispatcher.get(field), expected)

          artifacts = json.loads((temp / "dec554-artifacts.json").read_text(encoding="utf-8"))
          matches = [
              row for row in artifacts.get("artifacts", [])
              if row.get("id") == int(os.environ["DISPATCHER_ARTIFACT_ID"])
              and row.get("expired") is False
              and row.get("digest") == os.environ["DISPATCHER_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          assert matches[0]["name"] == (
              "annual-catalogue-2018-dec554-run380-dispatch-"
              + os.environ["DISPATCHER_RUN_ID"]
          )

          run_artifacts = json.loads((temp / "run380-artifacts.json").read_text(encoding="utf-8"))
          freeze = [
              row for row in run_artifacts.get("artifacts", [])
              if row.get("id") == int(os.environ["FREEZE_ARTIFACT_ID"])
              and row.get("expired") is False
              and row.get("digest") == os.environ["FREEZE_ARTIFACT_DIGEST"]
          ]
          assert len(freeze) == 1
          assert freeze[0]["name"] == (
              "phase8a-annual-catalogue-freeze-2018-"
              + os.environ["TARGET_HEAD_SHA"]
          )
          PY

      - name: Download exact DEC-554 receipt
        run: |
          set -euo pipefail
          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DISPATCHER_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec554.zip"
          expected_sha="${DISPATCHER_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec554.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec554"
          unzip -q "$RUNNER_TEMP/dec554.zip" -d "$RUNNER_TEMP/dec554"
          receipt="$(find "$RUNNER_TEMP/dec554" -type f -name 'dec554-run380-dispatch-receipt.json' -print)"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec554-run380-dispatch-receipt.json"

      - name: Download exact 2018 annual freeze
        run: |
          set -euo pipefail
          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$FREEZE_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/run380-freeze.zip"
          expected_sha="${FREEZE_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/run380-freeze.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha" > "$RUNNER_TEMP/run380-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run380-freeze"
          unzip -q "$RUNNER_TEMP/run380-freeze.zip" -d "$RUNNER_TEMP/run380-freeze"
          freeze="$(find "$RUNNER_TEMP/run380-freeze" -type f -name annual-freeze.json -print)"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2018.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean review checkout
        run: test -z "$(git status --porcelain)"

      - name: Review and bind exact run 379
        run: |
          set -euo pipefail
          freeze_sha="$(cat "$RUNNER_TEMP/run380-freeze-zip-sha256.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py             review             --run-json "$RUNNER_TEMP/run380.json"             --jobs-json "$RUNNER_TEMP/run380-jobs.json"             --artifacts-json "$RUNNER_TEMP/run380-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2018.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dec554-run380-dispatch-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2018.json"

      - name: Verify recovered DEC-555 binding remains non-authorizing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "runtime-binding-2018.json").read_text(
                  encoding="utf-8"
              )
          )
          assert binding["decision"] == "DEC-555"
          assert binding["annual_segment_label"] == "2018"
          assert binding["run_id"] == 37237817538
          assert binding["run_number"] == 380
          assert binding["run_attempt"] == 1
          assert binding["run_head_sha"] == "30971a996f514670a6f836d8e45cf80137197a4f"
          assert binding["previous_annual_freeze_run_id"] == 37227536041
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["dispatch_receipt_bound"] is True
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          assert binding["next_segment_execution_authorized"] is False
          assert binding["strategy_v1_synthesis_authorized"] is False
          assert binding["promotion_authorized"] is False
          assert binding["broker_mutation_authorized"] is False
          assert binding["live_order_authorized"] is False
          assert binding["real_money_authorized"] is False
          assert binding["trading_authorized"] is False
          assert binding["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2019_EXECUTION_PREFLIGHT"
          )
          PY

      - name: Upload immutable recovered DEC-555 runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2018-dec555-runtime-binding-recovery-${{ env.TARGET_RUN_ID }}
          path: |
            ${{ runner.temp }}/run380.json
            ${{ runner.temp }}/run380-jobs.json
            ${{ runner.temp }}/run380-artifacts.json
            ${{ runner.temp }}/dec554-run.json
            ${{ runner.temp }}/dec554-artifacts.json
            ${{ runner.temp }}/dec554-run380-dispatch-receipt.json
            ${{ runner.temp }}/run380-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2018.json
            ${{ runner.temp }}/runtime-binding-2018.json
          if-no-files-found: error
