name: phase8a-annual-catalogue-2017-dispatch-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2017-dispatch-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC539_RUN_ID: "37219929487"
      DEC539_HEAD_SHA: "9c3e2e6042b5a00109ee1f07ad6fd24c9ac33308"
      DEC539_ARTIFACT_ID: "11309927463"
      DEC539_ARTIFACT_DIGEST: "sha256:6672b0642a763424541d971d84b273f8c2fde5089fcd736e6152fe8dc9a7e32e"
      DEC539_INSTALL_COMMIT_SHA: "dcdf7210b0039077efa3a23c65c2ed8fa41e2427"

    steps:
      - name: Checkout exact DEC-540 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$DEC539_INSTALL_COMMIT_SHA" "$GITHUB_SHA"

      - name: Require frozen DEC-540 sources and installed runtime
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_dispatch_preflight.py)" = "0e048756a1a9ca5f8d45896c6ff212d386996ed0"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2017_dispatch_preflight.py)" = "0650e9ef326cc5517fcc3b19d1811062a51dd857"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization_install_receipt.py)" = "c3662046efc7daf2c00637066aa78c885b85fa8e"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py)" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-539 install evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC539_RUN_ID" > "$RUNNER_TEMP/dec539-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC539_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec539-artifacts.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec539-run.json").read_text())
          exact = {
              "id": 37219929487,
              "name": "phase8a-annual-catalogue-2017-runtime-install-executor",
              "path": ".github/workflows/phase8a-annual-catalogue-2017-runtime-install-executor.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "9c3e2e6042b5a00109ee1f07ad6fd24c9ac33308",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads((temp / "dec539-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11309927463]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2017-dec539-runtime-install-"
              "9c3e2e6042b5a00109ee1f07ad6fd24c9ac33308"
          )
          assert artifact["digest"] == (
              "sha256:6672b0642a763424541d971d84b273f8c2fde5089fcd736e6152fe8dc9a7e32e"
          )
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC539_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec539.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec539.zip" | awk '{print $1}')"
          test "$actual" = "6672b0642a763424541d971d84b273f8c2fde5089fcd736e6152fe8dc9a7e32e"

          mkdir -p "$RUNNER_TEMP/dec539"
          unzip -q "$RUNNER_TEMP/dec539.zip" -d "$RUNNER_TEMP/dec539"
          receipt="$(find "$RUNNER_TEMP/dec539" -type f -name dec539-2017-runtime-install-receipt.json -print)"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec539-2017-runtime-install-receipt.json"

      - name: Recheck current main and unconsumed run-379 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py)" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"

          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text()
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378}
          assert by_number[1]["id"] == 37126711695
          assert by_number[1]["conclusion"] == "failure"
          assert by_number[376]["id"] == 37191637168
          assert by_number[376]["conclusion"] == "failure"
          assert by_number[377]["id"] == 37198002653
          assert by_number[377]["conclusion"] == "success"
          assert by_number[378]["id"] == 37206992367
          assert by_number[378]["conclusion"] == "success"
          assert not any(row["run_number"] >= 379 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-540 dispatch preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2017_dispatch_preflight.py \
            plan \
            --install-receipt-json "$RUNNER_TEMP/dec539-2017-runtime-install-receipt.json" \
            --main-branch-json "$RUNNER_TEMP/main-branch.json" \
            --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json" \
            --expected-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json"

      - name: Verify DEC-540 remains read-only and exact
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec540-2017-dispatch-preflight.json").read_text()
          )
          assert value["decision"] == "DEC-540"
          assert value["source_installer_workflow_run_id"] == 37219929487
          assert value["source_install_artifact_id"] == 11309927463
          assert value["source_install_artifact_digest"] == (
              "sha256:6672b0642a763424541d971d84b273f8c2fde5089fcd736e6152fe8dc9a7e32e"
          )
          assert value["source_install_commit_sha"] == (
              "dcdf7210b0039077efa3a23c65c2ed8fa41e2427"
          )
          assert value["expected_run_number"] == 379
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37206992367
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["dispatch_command_present"] is False
          assert value["preflight_read_only"] is True
          for field in (
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-540 dispatch preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2017-dec540-dispatch-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec539-run.json
            ${{ runner.temp }}/dec539-artifacts.json
            ${{ runner.temp }}/dec539-2017-runtime-install-receipt.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec540-2017-dispatch-preflight.json
          if-no-files-found: error
