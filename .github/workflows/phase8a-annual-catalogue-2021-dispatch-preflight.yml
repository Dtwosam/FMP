name: phase8a-annual-catalogue-2021-dispatch-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2021-dispatch-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC585_RUN_ID: "37496446082"
      DEC585_HEAD_SHA: "3f128ce83dc8d88b3951d5e4b17312f3139d9100"
      DEC585_ARTIFACT_ID: "11427632507"
      DEC585_ARTIFACT_DIGEST: "sha256:0eec90cdfdd9b4ab68fd4989e7114d3d40baf41fc7e5f1129bd6cac182f48d74"
      DEC585_INSTALL_COMMIT_SHA: "4833c86f74af3febfc2592048916d9ce20aa051a"
      DEC585_RECEIPT_FINGERPRINT: "6fcbfeb2d2f7a8154925ac7fb5d08d68050a0ea2f2bbf2b3612015fd08b422c5"
      DEC585_RECEIPT_CANONICAL_SHA256: "2aac3060fad9a5d3f538a46c09a0ece58a41c3b863b34ca670593675a0175f2e"

    steps:
      - name: Checkout exact DEC-586 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-586 sources and installed runtime
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_dispatch_preflight.py)" = "a2454464ad9445dfd3ac788797f1c7633b67e116"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2021_dispatch_preflight.py)" = "469f7e56e6a9051971e55bb78bcf6a489c03937c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization_install_receipt.py)" = "b088a8483ea555b28107462e88b8c16ec72b66b8"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-585 install evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC585_RUN_ID" > "$RUNNER_TEMP/dec585-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC585_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec585-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec585-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC585_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2021-runtime-install-executor",
              "path": ".github/workflows/phase8a-annual-catalogue-2021-runtime-install-executor.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC585_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec585-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC585_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2021-dec585-runtime-install-"
              + os.environ["DEC585_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC585_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC585_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec585.zip"
          expected_sha="${DEC585_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec585.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec585"
          unzip -q "$RUNNER_TEMP/dec585.zip" -d "$RUNNER_TEMP/dec585"
          receipt="$(find "$RUNNER_TEMP/dec585" -type f -name dec585-2021-runtime-install-receipt.json -print)"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec585-2021-runtime-install-receipt.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec585-2021-runtime-install-receipt.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC585_RECEIPT_CANONICAL_SHA256"
          ]
          assert value["install_receipt_fingerprint_sha256"] == os.environ[
              "DEC585_RECEIPT_FINGERPRINT"
          ]
          assert value["decision"] == "DEC-585"
          assert value["install_commit_sha"] == os.environ["DEC585_INSTALL_COMMIT_SHA"]
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["install_action_consumed"] is True
          assert value["annual_workflow_dispatch_authorized"] is False
          PY

      - name: Recheck installed main and unconsumed run-383 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$DEC585_INSTALL_COMMIT_SHA" "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382}
          exact = {
              1: (37126711695, "fd85a886d07234ad584dcca08692b37e6af54b2e", "failure"),
              376: (37191637168, "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3", "failure"),
              377: (37198002653, "a89db974be9a94481e7ed0990476bc661012f1e4", "success"),
              378: (37206992367, "2524fde355349581c9440a172d0384c3cbce31ed", "success"),
              379: (37227536041, "7b4c1ef8573e280c067443b72f1534d9091d5b7f", "success"),
              380: (37237817538, "30971a996f514670a6f836d8e45cf80137197a4f", "success"),
              381: (37310525635, "8bcee3a7a834743f08bd9ad73109bfc09609a2fe", "success"),
              382: (37443770076, "681e81e021d4970a67b18370142d55b17ec68864", "success"),
          }
          for number, (run_id, head_sha, conclusion) in exact.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 383
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-586 dispatch preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2021_dispatch_preflight.py             plan             --install-receipt-json "$RUNNER_TEMP/dec585-2021-runtime-install-receipt.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec586-2021-dispatch-preflight.json"

      - name: Verify DEC-586 remains read-only and exact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec586-2021-dispatch-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-586"
          assert value["source_installer_workflow_run_id"] == 37496446082
          assert value["source_install_artifact_id"] == 11427632507
          assert value["source_install_artifact_digest"] == (
              "sha256:0eec90cdfdd9b4ab68fd4989e7114d3d40baf41fc7e5f1129bd6cac182f48d74"
          )
          assert value["source_install_commit_sha"] == (
              "4833c86f74af3febfc2592048916d9ce20aa051a"
          )
          assert value["source_install_receipt_fingerprint_sha256"] == (
              "6fcbfeb2d2f7a8154925ac7fb5d08d68050a0ea2f2bbf2b3612015fd08b422c5"
          )
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["annual_workflow_run_count"] == 8
          assert value["successful_2020_run_id"] == 37443770076
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["dispatch_command_present"] is False
          assert value["preflight_read_only"] is True
          for field in (
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-586 dispatch preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2021-dec586-dispatch-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec585-run.json
            ${{ runner.temp }}/dec585-artifacts.json
            ${{ runner.temp }}/dec585-2021-runtime-install-receipt.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec586-2021-dispatch-preflight.json
          if-no-files-found: error
