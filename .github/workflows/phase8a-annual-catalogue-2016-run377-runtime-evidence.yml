name: phase8a-annual-catalogue-2016-run378-runtime-evidence

on:
  workflow_run:
    workflows:
      - phase8a-annual-pattern-catalogue
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Exact successful annual run 378 ID to review
        required: true
        type: string
      target_head_sha:
        description: Exact annual run 378 head SHA
        required: true
        type: string
      target_run_number:
        description: Must be 378
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review-bind-run378:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.run_number == 378 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_id || github.event.workflow_run.id }}
      TARGET_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_head_sha || github.event.workflow_run.head_sha }}
      TARGET_RUN_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_number || github.event.workflow_run.run_number }}

    steps:
      - name: Checkout reviewer source from current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact successful 2016 run 378
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$TARGET_RUN_NUMBER" = "378"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"             > "$RUNNER_TEMP/run377.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "run377.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 378,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

      - name: Require exact DEC-522 reviewer sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_run377_evidence_review.py)" = "ad182ce30d32aff985558f3b2fd9370ca1141cc2"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2016_run377_evidence_review.py)" = "9acc6bc7ce284dd7e82f037fa999d2fee02af44a"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2016-runtime-install-executor.yml)" = "c9cd42d41994760248009725adc12fd6a13d4511"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2016-post-install-recovery.yml)" = "bd2ecdead7cf560cc560c266cbf5d796350807b3"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review runtime
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean reviewer checkout
        run: test -z "$(git status --porcelain)"

      - name: Resolve exact DEC-521 or DEC-532 dispatch evidence source
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2016-runtime-install-executor.yml/runs?branch=main&per_page=100" \
            > "$RUNNER_TEMP/installer-runs.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2016-post-install-recovery.yml/runs?branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/recovery-runs.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          installer = json.loads(
              (temp / "installer-runs.json").read_text(encoding="utf-8")
          )["workflow_runs"]
          recovery = json.loads(
              (temp / "recovery-runs.json").read_text(encoding="utf-8")
          )["workflow_runs"]

          successful_installers = [
              row
              for row in installer
              if row.get("status") == "completed"
              and row.get("conclusion") == "success"
              and row.get("event") in {"workflow_run", "workflow_dispatch"}
          ]
          successful_recoveries = [
              row
              for row in recovery
              if row.get("name")
              == "phase8a-annual-catalogue-2016-post-install-recovery"
              and row.get("path")
              == ".github/workflows/phase8a-annual-catalogue-2016-post-install-recovery.yml"
              and row.get("event") == "push"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["TARGET_HEAD_SHA"]
              and row.get("run_number") == 1
              and row.get("run_attempt") == 1
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
          ]

          choices = []
          if len(successful_installers) == 1:
              choices.append(("DEC-521", successful_installers[0]["id"]))
          if len(successful_recoveries) == 1:
              choices.append(("DEC-532", successful_recoveries[0]["id"]))
          assert len(choices) == 1, choices

          decision, run_id = choices[0]
          (temp / "dispatch-source.json").write_text(
              json.dumps(
                  {"decision": decision, "run_id": run_id},
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Download exact dispatch receipt
        run: |
          set -euo pipefail
          decision="$(jq -r '.decision' "$RUNNER_TEMP/dispatch-source.json")"
          source_run_id="$(jq -r '.run_id' "$RUNNER_TEMP/dispatch-source.json")"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" \
            > "$RUNNER_TEMP/dispatch-source-artifacts.json"

          case "$decision" in
            DEC-521)
              artifact_prefix="annual-catalogue-2016-dec521-run378-dispatch-"
              receipt_name="dec521-run378-dispatch-receipt.json"
              ;;
            DEC-532)
              artifact_prefix="annual-catalogue-2016-dec532-run378-dispatch-"
              receipt_name="dec532-run378-dispatch-receipt.json"
              ;;
            *)
              exit 1
              ;;
          esac

          artifact_id="$(
            jq -r --arg prefix "$artifact_prefix" '
              [
                .artifacts[]
                | select(
                    (.expired == false)
                    and (.name | startswith($prefix))
                  )
              ]
              | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/dispatch-source-artifacts.json"
          )"
          artifact_digest="$(
            jq -r --arg prefix "$artifact_prefix" '
              [
                .artifacts[]
                | select(
                    (.expired == false)
                    and (.name | startswith($prefix))
                  )
              ]
              | if length == 1 then .[0].digest else empty end
            ' "$RUNNER_TEMP/dispatch-source-artifacts.json"
          )"
          test -n "$artifact_id"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${artifact_digest#sha256:}"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$RUNNER_TEMP/dispatch-source.zip"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dispatch-source.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dispatch-source"
          unzip -q "$RUNNER_TEMP/dispatch-source.zip" -d "$RUNNER_TEMP/dispatch-source"
          receipt="$(
            find "$RUNNER_TEMP/dispatch-source" \
              -type f -name "$receipt_name" -print
          )"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dispatch-receipt.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/dispatch-receipt.json")" = "$decision"
          test "$(jq -r '.run_id' "$RUNNER_TEMP/dispatch-receipt.json")" = "$TARGET_RUN_ID"
          test "$(jq -r '.run_head_sha' "$RUNNER_TEMP/dispatch-receipt.json")" = "$TARGET_HEAD_SHA"

      - name: Fetch exact run 378 jobs and artifacts
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/run377-jobs.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/run377-artifacts.json"

      - name: Download and verify exact 2016 freeze artifact
        run: |
          set -euo pipefail
          expected_name="phase8a-annual-catalogue-freeze-2016-$TARGET_HEAD_SHA"
          artifact_id="$(
            jq -r --arg name "$expected_name" '
              [
                .artifacts[]
                | select(.name == $name and .expired == false)
              ]
              | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/run377-artifacts.json"
          )"
          artifact_digest="$(
            jq -r --arg name "$expected_name" '
              [
                .artifacts[]
                | select(.name == $name and .expired == false)
              ]
              | if length == 1 then .[0].digest else empty end
            ' "$RUNNER_TEMP/run377-artifacts.json"
          )"
          test -n "$artifact_id"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${artifact_digest#sha256:}"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/run377-freeze.zip"
          actual_sha="$(
            sha256sum "$RUNNER_TEMP/run377-freeze.zip" | awk '{print $1}'
          )"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha"             > "$RUNNER_TEMP/run377-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run377-freeze"
          unzip -q "$RUNNER_TEMP/run377-freeze.zip"             -d "$RUNNER_TEMP/run377-freeze"
          freeze="$(
            find "$RUNNER_TEMP/run377-freeze"               -type f -name annual-freeze.json -print
          )"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2016.json"

      - name: Bind exact successful 2016 runtime evidence
        run: |
          set -euo pipefail
          freeze_sha="$(
            cat "$RUNNER_TEMP/run377-freeze-zip-sha256.txt"
          )"
          python scripts/phase8a_annual_pattern_catalogue_2016_run377_evidence_review.py             review             --run-json "$RUNNER_TEMP/run377.json"             --jobs-json "$RUNNER_TEMP/run377-jobs.json"             --artifacts-json "$RUNNER_TEMP/run377-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2016.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dispatch-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2016.json"

      - name: Verify DEC-522 remains read-only and 2017-locked
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "runtime-binding-2016.json"
              ).read_text(encoding="utf-8")
          )
          assert binding["decision"] == "DEC-522"
          assert binding["annual_segment_label"] == "2016"
          assert binding["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert binding["run_number"] == 378
          assert binding["run_attempt"] == 1
          assert binding["run_conclusion"] == "success"
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["dispatch_receipt_bound"] is True
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          for field in (
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert binding[field] is False, field
          PY

      - name: Upload immutable DEC-522 2016 runtime binding
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2016-dec522-runtime-binding-${{ env.TARGET_RUN_ID }}
          path: |
            ${{ runner.temp }}/run377.json
            ${{ runner.temp }}/run377-jobs.json
            ${{ runner.temp }}/run377-artifacts.json
            ${{ runner.temp }}/installer-runs.json
            ${{ runner.temp }}/recovery-runs.json
            ${{ runner.temp }}/dispatch-source.json
            ${{ runner.temp }}/dispatch-source-artifacts.json
            ${{ runner.temp }}/dispatch-receipt.json
            ${{ runner.temp }}/run377-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2016.json
            ${{ runner.temp }}/runtime-binding-2016.json
          if-no-files-found: error
