name: phase8a-annual-catalogue-2016-run377-runtime-evidence

on:
  workflow_run:
    workflows:
      - phase8a-annual-pattern-catalogue
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  review-bind-run377:
    if: ${{ github.event.workflow_run.run_number == 377 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}

    steps:
      - name: Checkout reviewer source from current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact successful 2016 run 377
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$TARGET_RUN_NUMBER" = "377"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"             > "$RUNNER_TEMP/run377.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "run377.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 377,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

      - name: Require exact DEC-522 reviewer sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_run377_evidence_review.py)" = "REVIEW_SOURCE_BLOB"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2016_run377_evidence_review.py)" = "REVIEW_CLI_BLOB"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2016-runtime-install-executor.yml)" = "b5abc5ac723890c0f2fef975dfbc7e5703f81aa1"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review runtime
        run: python -m pip install -r requirements/exp061-discovery-run.txt -e .

      - name: Require clean reviewer checkout
        run: test -z "$(git status --porcelain)"

      - name: Resolve unique successful DEC-518 to DEC-521 workflow run
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2016-runtime-install-executor.yml/runs?event=workflow_run&branch=main&per_page=100"             > "$RUNNER_TEMP/installer-runs.json"

          installer_run_id="$(
            jq -r '
              [
                .workflow_runs[]
                | select(
                    (.status == "completed")
                    and (.conclusion == "success")
                  )
              ]
              | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/installer-runs.json"
          )"
          test -n "$installer_run_id"
          printf '%s\n' "$installer_run_id"             > "$RUNNER_TEMP/installer-run-id.txt"

      - name: Download exact DEC-521 dispatch receipt
        run: |
          set -euo pipefail
          installer_run_id="$(cat "$RUNNER_TEMP/installer-run-id.txt")"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$installer_run_id/artifacts?per_page=100"             > "$RUNNER_TEMP/installer-artifacts.json"

          artifact_id="$(
            jq -r '
              [
                .artifacts[]
                | select(
                    (.expired == false)
                    and (.name | startswith("annual-catalogue-2016-dec521-run377-dispatch-"))
                  )
              ]
              | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/installer-artifacts.json"
          )"
          artifact_digest="$(
            jq -r '
              [
                .artifacts[]
                | select(
                    (.expired == false)
                    and (.name | startswith("annual-catalogue-2016-dec521-run377-dispatch-"))
                  )
              ]
              | if length == 1 then .[0].digest else empty end
            ' "$RUNNER_TEMP/installer-artifacts.json"
          )"
          test -n "$artifact_id"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${artifact_digest#sha256:}"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/dec521.zip"
          actual_sha="$(
            sha256sum "$RUNNER_TEMP/dec521.zip" | awk '{print $1}'
          )"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec521"
          unzip -q "$RUNNER_TEMP/dec521.zip" -d "$RUNNER_TEMP/dec521"
          receipt="$(
            find "$RUNNER_TEMP/dec521"               -type f -name dec521-run377-dispatch-receipt.json -print
          )"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec521-receipt.json"

          test "$(jq -r '.run_id' "$RUNNER_TEMP/dec521-receipt.json")" = "$TARGET_RUN_ID"
          test "$(jq -r '.run_head_sha' "$RUNNER_TEMP/dec521-receipt.json")" = "$TARGET_HEAD_SHA"

      - name: Fetch exact run 377 jobs and artifacts
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/run377-jobs.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/run377-artifacts.json"

      - name: Download and verify exact 2016 freeze artifact
        run: |
          set -euo pipefail
          expected_name="phase8a-annual-catalogue-freeze-2016-$TARGET_HEAD_SHA"
          artifact_id="$(
            jq -r --arg name "$expected_name" '
              [
                .artifacts[]
                | select(.name == $name and .expired == false)
              ]
              | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/run377-artifacts.json"
          )"
          artifact_digest="$(
            jq -r --arg name "$expected_name" '
              [
                .artifacts[]
                | select(.name == $name and .expired == false)
              ]
              | if length == 1 then .[0].digest else empty end
            ' "$RUNNER_TEMP/run377-artifacts.json"
          )"
          test -n "$artifact_id"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${artifact_digest#sha256:}"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/run377-freeze.zip"
          actual_sha="$(
            sha256sum "$RUNNER_TEMP/run377-freeze.zip" | awk '{print $1}'
          )"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha"             > "$RUNNER_TEMP/run377-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run377-freeze"
          unzip -q "$RUNNER_TEMP/run377-freeze.zip"             -d "$RUNNER_TEMP/run377-freeze"
          freeze="$(
            find "$RUNNER_TEMP/run377-freeze"               -type f -name annual-freeze.json -print
          )"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2016.json"

      - name: Bind exact successful 2016 runtime evidence
        run: |
          set -euo pipefail
          freeze_sha="$(
            cat "$RUNNER_TEMP/run377-freeze-zip-sha256.txt"
          )"
          python scripts/phase8a_annual_pattern_catalogue_2016_run377_evidence_review.py             review             --run-json "$RUNNER_TEMP/run377.json"             --jobs-json "$RUNNER_TEMP/run377-jobs.json"             --artifacts-json "$RUNNER_TEMP/run377-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2016.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dec521-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2016.json"

      - name: Verify DEC-522 remains read-only and 2017-locked
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "runtime-binding-2016.json"
              ).read_text(encoding="utf-8")
          )
          assert binding["decision"] == "DEC-522"
          assert binding["annual_segment_label"] == "2016"
          assert binding["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert binding["run_number"] == 377
          assert binding["run_attempt"] == 1
          assert binding["run_conclusion"] == "success"
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["dispatch_receipt_bound"] is True
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          for field in (
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert binding[field] is False, field
          PY

      - name: Upload immutable DEC-522 2016 runtime binding
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2016-dec522-runtime-binding-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/run377.json
            ${{ runner.temp }}/run377-jobs.json
            ${{ runner.temp }}/run377-artifacts.json
            ${{ runner.temp }}/installer-runs.json
            ${{ runner.temp }}/installer-artifacts.json
            ${{ runner.temp }}/dec521-receipt.json
            ${{ runner.temp }}/run377-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2016.json
            ${{ runner.temp }}/runtime-binding-2016.json
          if-no-files-found: error
