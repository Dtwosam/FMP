name: phase8a-annual-catalogue-2023-execution-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-execution-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC601_RECOVERY_RUN_ID: "37670106681"
      DEC601_RECOVERY_HEAD_SHA: "a08512973deb127f16e199c6ecd2876e0fc8d8e0"
      DEC601_ARTIFACT_ID: "11504596272"
      DEC601_ARTIFACT_DIGEST: "sha256:45e4436ce5536c7df7ed8a3af99d9dc911025ec441a554de627d4adf8de1f755"
      DEC601_BINDING_CANONICAL_SHA256: "7e36345fc0ca8592e5f5ede41b9afcfdc9becff72d2415b7e6741ed2352923ac"
      DEC601_BINDING_FINGERPRINT: "926832634d5836b158d780e21886692e762709104a6d0048c54a75c77ad2f352"

    steps:
      - name: Checkout exact DEC-602 landing
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require exact first DEC-602 landing run
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-602 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_execution_preflight.py)" = "d7e0823bc0d7513b6d7ee27a02fb5b519bc4818b"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_execution_preflight.py)" = "11ef1e46a8242455fc5eeff3d596b705951969a5"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_run384_evidence_review.py)" = "7048781474ce74b8bbed0fd380f8edf4ec51491d"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_method.py)" = "d7486296c2e953d6b4e7602c753c5529ccf5eef2"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_protocol.py)" = "5ddd987cc480e6e31c0cd45328eba16cf690dee9"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2022-run384-runtime-evidence.yml)" = "2d0160338a7791cc98e4aaed22c49ee6541f8c33"

      - name: Fetch and verify exact DEC-601 recovery artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC601_RECOVERY_RUN_ID" > "$RUNNER_TEMP/dec601-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC601_RECOVERY_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec601-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec601-run.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["DEC601_RECOVERY_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2022-run384-runtime-evidence",
              "path": ".github/workflows/phase8a-annual-catalogue-2022-run384-runtime-evidence.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC601_RECOVERY_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec601-artifacts.json").read_text(
                  encoding="utf-8"
              )
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC601_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2022-dec601-runtime-binding-37663157285"
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC601_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC601_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec601-binding.zip"
          expected_sha="${DEC601_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec601-binding.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec601-binding"
          unzip -q "$RUNNER_TEMP/dec601-binding.zip" -d "$RUNNER_TEMP/dec601-binding"
          binding="$(
            find "$RUNNER_TEMP/dec601-binding"               -type f -name runtime-binding-2022.json -print
          )"
          test "$(printf '%s\n' "$binding" | sed '/^$/d' | wc -l)" = "1"
          cp "$binding" "$RUNNER_TEMP/runtime-binding-2022.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "runtime-binding-2022.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == (
              os.environ["DEC601_BINDING_CANONICAL_SHA256"]
          )
          assert value["decision"] == "DEC-601"
          assert value["annual_segment_label"] == "2022"
          assert value["run_id"] == 37663157285
          assert value["run_number"] == 384
          assert value["run_attempt"] == 1
          assert value["run_conclusion"] == "success"
          assert value["binding_fingerprint_sha256"] == (
              os.environ["DEC601_BINDING_FINGERPRINT"]
          )
          assert value["runtime_evidence_bound"] is True
          assert value["final_required_annual_segment_bound"] is True
          assert value["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_CROSS_YEAR_COMPARISON_PREFLIGHT"
          )
          for field in (
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_385_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Fetch exact current main and annual dispatch inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 10
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383, 384}
          expected = {
              1: (37126711695, "failure", "fd85a886d07234ad584dcca08692b37e6af54b2e"),
              376: (37191637168, "failure", "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3"),
              377: (37198002653, "success", "a89db974be9a94481e7ed0990476bc661012f1e4"),
              378: (37206992367, "success", "2524fde355349581c9440a172d0384c3cbce31ed"),
              379: (37227536041, "success", "7b4c1ef8573e280c067443b72f1534d9091d5b7f"),
              380: (37237817538, "success", "30971a996f514670a6f836d8e45cf80137197a4f"),
              381: (37310525635, "success", "8bcee3a7a834743f08bd9ad73109bfc09609a2fe"),
              382: (37443770076, "success", "681e81e021d4970a67b18370142d55b17ec68864"),
              383: (37531960014, "success", "a1e194907c273a2fcdddfb4c24d64a96cfd8d263"),
              384: (37663157285, "success", "dd79687adc4ec179c56f91939cb600e6746fab5d"),
          }
          for number, (run_id, conclusion, head_sha) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 385 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-602 2023 execution preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_execution_preflight.py             plan             --runtime-binding-json "$RUNNER_TEMP/runtime-binding-2022.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec602-2023-execution-preflight.json"

      - name: Verify DEC-602 opens no protected execution authority
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec602-2023-execution-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-602"
          assert value["source_runtime_binding_decision"] == "DEC-601"
          assert value["source_runtime_binding_workflow_run_id"] == 37670106681
          assert value["source_runtime_binding_artifact_id"] == 11504596272
          assert value["source_runtime_binding_canonical_sha256"] == (
              "7e36345fc0ca8592e5f5ede41b9afcfdc9becff72d2415b7e6741ed2352923ac"
          )
          assert value["source_final_required_annual_segment_bound_claim"] is True
          assert value["source_terminal_successor_claim_superseded_by_dec469_dec470"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["collection_segment_count"] == 12
          assert value["protected_catalogue_segment"] is True
          assert value["protocol_full_collection_catalogue_use_authorized"] is True
          assert value["protocol_2023_2026_catalogue_use_authorized"] is True
          assert (
              value["protocol_2023_2026_remains_untouched_oos_for_strategy_v1"]
              is False
          )
          assert value["annual_segment_label"] == "2023"
          assert value["prior_segment_label"] == "2022"
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["annual_workflow_run_count"] == 10
          assert value["successful_2022_run_number"] == 384
          assert value["expected_next_run_number"] == 385
          assert value["expected_next_run_attempt"] == 1
          assert value["preflight_read_only"] is True
          for field in (
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_386_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          assert value["next_gate"] == (
              "ANNUAL_PATTERN_CATALOGUE_2023_EXECUTION_AUTHORIZATION_BEFORE_RUN"
          )
          PY

      - name: Upload immutable DEC-602 preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec602-execution-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec601-run.json
            ${{ runner.temp }}/dec601-artifacts.json
            ${{ runner.temp }}/runtime-binding-2022.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec602-2023-execution-preflight.json
          if-no-files-found: error
