name: phase8a-annual-catalogue-2022-runtime-install-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2022-runtime-install-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-install-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC593_RUN_ID: "37611869958"
      DEC593_HEAD_SHA: "9d53e2f11746ccff7e525a1df1d10427fdfdd2be"
      DEC593_ARTIFACT_ID: "11477773270"
      DEC593_ARTIFACT_DIGEST: "sha256:ff974250ff9a09069e77f8c61e96649c9318e83dfcccab74e8dfd3dd07fed420"
      DEC593_PLAN_CANONICAL_SHA256: "2ed8681de71e27f9767f75a9e47861044c81c3886639195e412495613acd09fd"

    steps:
      - name: Checkout exact DEC-594 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only install-preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-594 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization_install_preflight.py)" = "8d1fce9c947fd7a579a6ab581d605293a02329a3"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2022_runtime_authorization_install_preflight.py)" = "7328c94907198d80e8a201772ce6d23561983aa5"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization_plan.py)" = "d7710ab16dde2eea6b0d93dc6387c6cc489b30d7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_execution_authorization.py)" = "e68e9f1ee41ca89f0ae3d7758d59b4ce8c5823bb"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2022_runtime_authorization.py.disabled)" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2022_authorization.py.disabled)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py

      - name: Fetch and verify exact DEC-593 plan artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC593_RUN_ID" > "$RUNNER_TEMP/dec593-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC593_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec593-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec593-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC593_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2022-runtime-authorization-plan",
              "path": ".github/workflows/phase8a-annual-catalogue-2022-runtime-authorization-plan.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC593_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec593-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row
              for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC593_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2022-dec593-runtime-authorization-plan-"
              + os.environ["DEC593_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC593_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC593_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec593.zip"
          expected_sha="${DEC593_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec593.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec593"
          unzip -q "$RUNNER_TEMP/dec593.zip" -d "$RUNNER_TEMP/dec593"
          auth="$(find "$RUNNER_TEMP/dec593" -type f -name dec592-2022-execution-authorization.json -print)"
          plan="$(find "$RUNNER_TEMP/dec593" -type f -name dec593-2022-runtime-authorization-plan.json -print)"
          test "$(printf '%s\n' "$auth" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$plan" | sed '/^$/d' | wc -l)" = "1"
          cp "$auth" "$RUNNER_TEMP/dec592-2022-execution-authorization.json"
          cp "$plan" "$RUNNER_TEMP/dec593-2022-runtime-authorization-plan.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec593-2022-runtime-authorization-plan.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  plan,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC593_PLAN_CANONICAL_SHA256"
          ]
          assert plan["decision"] == "DEC-593"
          assert plan["expected_run_number"] == 384
          assert plan["expected_run_attempt"] == 1
          assert plan["expected_previous_annual_freeze_run_id"] == 37531960014
          assert plan["runtime_authorization_installed"] is False
          assert plan["runtime_gate_active"] is False
          assert plan["repository_mutation_authorized"] is False
          assert plan["annual_workflow_dispatch_authorized"] is False
          assert plan["plan_source_only"] is True
          PY

      - name: Recheck current main and unconsumed run-383 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-branch.json").read_text(encoding="utf-8"))
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]

          rows = json.loads(
              (temp / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383}
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
              383: (37531960014, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 384
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-594 install preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2022_runtime_authorization_install_preflight.py             plan             --authorization-json "$RUNNER_TEMP/dec592-2022-execution-authorization.json"             --plan-json "$RUNNER_TEMP/dec593-2022-runtime-authorization-plan.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec594-2022-runtime-install-preflight.json"

      - name: Verify DEC-594 remains read-only and exact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec594-2022-runtime-install-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-594"
          assert value["source_plan_workflow_run_id"] == 37611869958
          assert value["source_plan_artifact_id"] == 11477773270
          assert value["source_plan_artifact_digest"] == (
              "sha256:ff974250ff9a09069e77f8c61e96649c9318e83dfcccab74e8dfd3dd07fed420"
          )
          assert value["source_plan_canonical_sha256"] == (
              "2ed8681de71e27f9767f75a9e47861044c81c3886639195e412495613acd09fd"
          )
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["activation_mutation_file_count"] == 2
          assert value["runtime_install_preflight_ready"] is True
          assert value["preflight_read_only"] is True
          assert value["next_gate"] == (
              "EXACT_ANNUAL_PATTERN_CATALOGUE_2022_RUNTIME_"
              "AUTHORIZATION_INSTALL_MUTATION_AFTER_DEC594"
          )
          for field in (
              "repository_mutation_authorized",
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_385_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-594 install preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2022-dec594-runtime-install-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec593-run.json
            ${{ runner.temp }}/dec593-artifacts.json
            ${{ runner.temp }}/dec592-2022-execution-authorization.json
            ${{ runner.temp }}/dec593-2022-runtime-authorization-plan.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec594-2022-runtime-install-preflight.json
          if-no-files-found: error
