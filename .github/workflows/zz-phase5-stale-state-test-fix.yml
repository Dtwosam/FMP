name: zz-phase5-stale-state-test-fix

on:
  push:
    branches:
      - phase5-feature-engine-protocol
    paths:
      - 'scripts/_phase5_stale_state_test_fix_once.py'
      - '.github/workflows/zz-phase5-stale-state-test-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase5-feature-engine-protocol
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update stale Phase 4/5 state assertions only
        run: python scripts/_phase5_stale_state_test_fix_once.py
      - name: Verify bounded stale-test update
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          tests/test_phase4_acceptance_state.py
          tests/test_phase4_checkpoint_state.py
          tests/test_phase4_mean_reversion_evidence_state.py
          tests/test_phase4_mean_reversion_state.py
          tests/test_phase4_previous_day_rejection_state.py
          tests/test_phase4_research_state.py
          tests/test_phase4_session_breakout_evidence_state.py
          tests/test_phase4_session_sweep_state.py
          tests/test_phase4_trend_continuation_evidence_state.py
          tests/test_phase4_trend_continuation_state.py
          tests/test_phase4_volatility_breakout_state.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          python -m unittest \
            tests.test_phase4_acceptance_state \
            tests.test_phase4_checkpoint_state \
            tests.test_phase4_mean_reversion_evidence_state \
            tests.test_phase4_mean_reversion_state \
            tests.test_phase4_previous_day_rejection_state \
            tests.test_phase4_research_state \
            tests.test_phase4_session_breakout_evidence_state \
            tests.test_phase4_session_sweep_state \
            tests.test_phase4_trend_continuation_evidence_state \
            tests.test_phase4_trend_continuation_state \
            tests.test_phase4_volatility_breakout_state -v
      - name: Commit stale-test update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_phase4_acceptance_state.py \
            tests/test_phase4_checkpoint_state.py \
            tests/test_phase4_mean_reversion_evidence_state.py \
            tests/test_phase4_mean_reversion_state.py \
            tests/test_phase4_previous_day_rejection_state.py \
            tests/test_phase4_research_state.py \
            tests/test_phase4_session_breakout_evidence_state.py \
            tests/test_phase4_session_sweep_state.py \
            tests/test_phase4_trend_continuation_evidence_state.py \
            tests/test_phase4_trend_continuation_state.py \
            tests/test_phase4_volatility_breakout_state.py
          git commit -m '[phase1-no-source] Update Phase 4 guards for Phase 5 start'
          git push origin HEAD:phase5-feature-engine-protocol
