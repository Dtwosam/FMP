            feature_zip_sha256: bc8936d2a02bfc6cde9d11eae23330bfc047374f03fe265ed15eaa6d4d0bd3b4
            outcome_artifact_id: "10757692733"
            outcome_zip_sha256: aa7fda1ca6e43c3b41a2ee1fb3729de61bb7dc6ea55e98fda70e8434770a8ee4
          - symbol: USDJPY
            timeframe: 1h
