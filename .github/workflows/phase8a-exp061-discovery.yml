name: phase8a-exp061-discovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exp061_preflight:
    name: exp061-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require exact merged main manual dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned EXP-061 runtime
        run: python -m pip install -r requirements/exp061-discovery-run.txt -e .

      - name: Fetch exact accepted EXP-044 source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .preflight
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35867307338" > .preflight/feature-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35867307338/artifacts?per_page=100" > .preflight/feature-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35876715434" > .preflight/outcome-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35876715434/artifacts?per_page=100" > .preflight/outcome-artifacts.json

      - name: Validate exact accepted EXP-044 source snapshots
        run: |
          set -euo pipefail
          python scripts/phase8a_exp061.py preflight \
            --feature-run-json .preflight/feature-run.json \
            --feature-artifacts-json .preflight/feature-artifacts.json \
            --outcome-run-json .preflight/outcome-run.json \
            --outcome-artifacts-json .preflight/outcome-artifacts.json \
            --code-commit "$GITHUB_SHA" \
            --out .preflight/preflight.json

      - name: Require separately authorized EXP-061 execution
        run: |
          python scripts/phase8a_exp061.py require-execution \
            --code-commit "$GITHUB_SHA"

      - name: Upload EXP-061 preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp061-preflight-${{ github.sha }}
          path: .preflight/preflight.json
          if-no-files-found: error

  exp061_cell:
    needs: exp061_preflight
    name: exp061-cell-${{ matrix.dataset.symbol }}-${{ matrix.dataset.timeframe }}-${{ matrix.dataset.horizon }}m
