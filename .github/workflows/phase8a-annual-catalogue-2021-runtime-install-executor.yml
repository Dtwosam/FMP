name: phase8a-annual-catalogue-2021-runtime-install-executor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2021-runtime-install-executor.yml

permissions:
  contents: write
  actions: read

jobs:
  install-runtime-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC584_RUN_ID: "37490417862"
      DEC584_HEAD_SHA: "32927e836fcf6888a7f8567b28f5ba2fd0b48315"
      DEC584_ARTIFACT_ID: "11425666284"
      DEC584_ARTIFACT_DIGEST: "sha256:d8e77b482e83250a56aafc99e4e6d2b81d94d1adb1227abbd1a0e49397e45ebe"
      DEC584_ACTION_FINGERPRINT: "bffb48b795c1fc76f792aa8b00f5b8b94d23554cbc958bf3d11249eaa1058b04"
      DEC584_ACTION_CANONICAL_SHA256: "e0ec651509a6ff20afcf60029f413710faf3b232d5ba5924832ce2da5af071d2"

    steps:
      - name: Checkout exact DEC-585 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first installer push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-585 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization_install_action.py)" = "9ea8f4574ed1a85cbf0b95031a7450cc4f7fa705"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization_install_receipt.py)" = "b088a8483ea555b28107462e88b8c16ec72b66b8"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2021_runtime_authorization_install_receipt.py)" = "9fc4fe670afd120b5cff90bca3b5ea4639260b02"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2021_runtime_authorization.py.disabled)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2021_authorization.py.disabled)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py

      - name: Fetch and verify exact DEC-584 install action
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC584_RUN_ID" > "$RUNNER_TEMP/dec584-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC584_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec584-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec584-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC584_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2021-runtime-install-action",
              "path": ".github/workflows/phase8a-annual-catalogue-2021-runtime-install-action.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC584_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec584-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row
              for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC584_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2021-dec584-runtime-install-action-"
              + os.environ["DEC584_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC584_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC584_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec584.zip"
          expected_sha="${DEC584_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec584.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec584"
          unzip -q "$RUNNER_TEMP/dec584.zip" -d "$RUNNER_TEMP/dec584"
          action="$(find "$RUNNER_TEMP/dec584" -type f -name dec584-2021-runtime-install-action.json -print)"
          test "$(printf '%s\n' "$action" | sed '/^$/d' | wc -l)" = "1"
          cp "$action" "$RUNNER_TEMP/dec584-2021-runtime-install-action.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec584-2021-runtime-install-action.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC584_ACTION_CANONICAL_SHA256"
          ]
          assert value["install_action_fingerprint_sha256"] == os.environ[
              "DEC584_ACTION_FINGERPRINT"
          ]
          assert value["decision"] == "DEC-584"
          assert value["expected_head_sha"] == os.environ["DEC584_HEAD_SHA"]
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["action_count"] == 2
          assert value["repository_mutation_authorized"] is True
          assert value["runtime_authorization_installed"] is False
          assert value["runtime_gate_active"] is False
          assert value["annual_workflow_dispatch_authorized"] is False
          PY

      - name: Recheck current main and unconsumed run-383 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-before-install.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs-before-install.json"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads(
              (temp / "main-before-install.json").read_text(encoding="utf-8")
          )
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]

          rows = json.loads(
              (temp / "annual-runs-before-install.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382}
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 383
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned installer dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean installer checkout
        run: test -z "$(git status --porcelain)"

      - name: Validate concrete DEC-584 action
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fmp.discovery.annual_pattern_catalogue_2021_runtime_authorization_install_action import (
              validate_2021_runtime_authorization_install_action,
          )

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec584-2021-runtime-install-action.json"
              ).read_text(encoding="utf-8")
          )
          validate_2021_runtime_authorization_install_action(value)
          assert value["decision"] == "DEC-584"
          assert value["source_preflight_workflow_run_id"] == 37486048003
          assert value["source_preflight_artifact_id"] == 11423396654
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["action_count"] == 2
          assert value["install_action_fingerprint_sha256"] == (
              "bffb48b795c1fc76f792aa8b00f5b8b94d23554cbc958bf3d11249eaa1058b04"
          )
          assert value["repository_mutation_authorized"] is True
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Apply exact two-file 2021 runtime authorization install
        run: |
          set -euo pipefail
          cp             docs/superpowers/templates/annual_pattern_catalogue_2021_runtime_authorization.py.disabled             src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py
          cp             docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2021_authorization.py.disabled             src/fmp/discovery/annual_pattern_catalogue_runtime.py

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed-files.txt"

          cat > "$RUNNER_TEMP/expected-changed-files.txt" <<'EOF'
          src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py
          src/fmp/discovery/annual_pattern_catalogue_runtime.py
          EOF
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" "$RUNNER_TEMP/changed-files.txt"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"

          git add             src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py             src/fmp/discovery/annual_pattern_catalogue_runtime.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" <(git diff --cached --name-only)

      - name: Prove installed runtime imports and exact run-383 gate
        run: |
          set -euo pipefail
          python -m py_compile             src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py             src/fmp/discovery/annual_pattern_catalogue_runtime.py

          python - <<'PY'
          from fmp.discovery.annual_pattern_catalogue_runtime import (
              require_historical_catalogue_execution_authorized,
          )

          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2021",
              run_number=383,
              run_attempt=1,
              previous_annual_freeze_run_id=37443770076,
          )
          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2020",
              run_number=382,
              run_attempt=1,
              previous_annual_freeze_run_id=37310525635,
          )
          try:
              require_historical_catalogue_execution_authorized(
                  code_commit="a" * 40,
                  annual_segment_label="2021",
                  run_number=384,
                  run_attempt=1,
                  previous_annual_freeze_run_id=37443770076,
              )
          except (PermissionError, ValueError):
              pass
          else:
              raise AssertionError("run 384 must remain unauthorized")
          PY

      - name: Commit and push exact install
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase8a: install 2021 runtime authorization (DEC-585)"
          git rev-parse HEAD > "$RUNNER_TEMP/install-commit-sha.txt"
          git push origin HEAD:main

      - name: Verify installed main and build DEC-585 receipt
        run: |
          set -euo pipefail
          install_sha="$(cat "$RUNNER_TEMP/install-commit-sha.txt")"
          found=0
          for _ in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-after-install.json"
            if test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-after-install.json")" = "$install_sha"; then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

          gate_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py)"
          runtime_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)"

          python scripts/phase8a_annual_pattern_catalogue_2021_runtime_authorization_install_receipt.py             review             --action-json "$RUNNER_TEMP/dec584-2021-runtime-install-action.json"             --install-commit-sha "$install_sha"             --changed-files "$RUNNER_TEMP/changed-files.txt"             --installed-gate-blob-sha "$gate_sha"             --installed-runtime-blob-sha "$runtime_sha"             --out "$RUNNER_TEMP/dec585-2021-runtime-install-receipt.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec585-2021-runtime-install-receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-585"
          assert value["source_action_workflow_run_id"] == 37490417862
          assert value["source_action_artifact_id"] == 11425666284
          assert value["source_action_fingerprint_sha256"] == (
              "bffb48b795c1fc76f792aa8b00f5b8b94d23554cbc958bf3d11249eaa1058b04"
          )
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["install_action_consumed"] is True
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["historical_artifact_read_authorized"] is False
          assert value["historical_catalogue_execution_authorized"] is False
          assert value["historical_result_production_authorized"] is False
          assert value["next_segment_execution_authorized"] is False
          assert value["trading_authorized"] is False
          assert value["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2021_DISPATCH_PREFLIGHT"
          )
          PY

      - name: Upload immutable DEC-585 install evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2021-dec585-runtime-install-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec584-run.json
            ${{ runner.temp }}/dec584-artifacts.json
            ${{ runner.temp }}/dec584-2021-runtime-install-action.json
            ${{ runner.temp }}/annual-runs-before-install.json
            ${{ runner.temp }}/main-before-install.json
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/install-commit-sha.txt
            ${{ runner.temp }}/main-after-install.json
            ${{ runner.temp }}/dec585-2021-runtime-install-receipt.json
          if-no-files-found: error
