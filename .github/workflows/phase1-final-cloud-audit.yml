name: phase1-final-cloud-audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: phase1-final-cloud-audit
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  verify-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse audit while Phase 1 acquisition is active
        id: acquisition-baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone

          started = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          print(f"audit_guard_started_at_utc={started}")
          PY
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase1-full-acquisition.yml/runs?per_page=100" \
            > .phase1-final-acquisition-workflow-pages.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          from fmp.data.acquisition_runs import select_acquisition_baseline

          pages = json.loads(
              Path(".phase1-final-acquisition-workflow-pages.json").read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(pages, list):
              raise SystemExit(
                  "GitHub acquisition workflow pagination response must be a list"
              )

          runs = []
          for index, page in enumerate(pages):
              if not isinstance(page, dict):
                  raise SystemExit(
                      f"GitHub acquisition workflow page {index} must be an object"
                  )
              page_runs = page.get("workflow_runs")
              if not isinstance(page_runs, list):
                  raise SystemExit(
                      f"GitHub acquisition workflow page {index} is missing workflow_runs"
                  )
              runs.extend(page_runs)

          try:
              baseline = select_acquisition_baseline(runs)
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc

          print(f"latest_run_id={baseline['latest_run_id']}")
          print(
              "baseline_completed_at_utc="
              f"{baseline['baseline_completed_at_utc']}"
          )
          print(
              "no_source_runs_ignored="
              f"{baseline['no_source_runs_ignored']}"
          )
          PY
          rm -f .phase1-final-acquisition-workflow-pages.json
      - name: Verify full frozen cloud provenance
        run: |
          set -o pipefail
          python -m fmp.data.cli verify-cloud \
            --endpoint https://htjqqzlezyguveuajuat.supabase.co/functions/v1/fmp-raw-audit \
            --pair ALL \
            --start 2015-01-01 \
            --end 2026-08-21 \
            --batch-size 100 \
            --timeout 60 \
            | tee phase1-cloud-provenance.json
      - name: Refuse audit if acquisition changed during verification
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ steps.acquisition-baseline.outputs.latest_run_id }}
          BASELINE_COMPLETED_AT_UTC: ${{ steps.acquisition-baseline.outputs.baseline_completed_at_utc }}
          AUDIT_GUARD_STARTED_AT_UTC: ${{ steps.acquisition-baseline.outputs.audit_guard_started_at_utc }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase1-full-acquisition.yml/runs?per_page=100" \
            > .phase1-final-acquisition-workflow-pages.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          from fmp.data.acquisition_runs import select_acquisition_baseline
          from fmp.data.repair_plan import (
              ensure_no_source_capable_acquisition_updates_since,
          )

          pages_path = Path(".phase1-final-acquisition-workflow-pages.json")
          pages = json.loads(pages_path.read_text(encoding="utf-8"))
          if not isinstance(pages, list):
              raise SystemExit(
                  "GitHub acquisition workflow pagination response must be a list"
              )

          runs = []
          for index, page in enumerate(pages):
              if not isinstance(page, dict):
                  raise SystemExit(
                      f"GitHub acquisition workflow page {index} must be an object"
                  )
              page_runs = page.get("workflow_runs")
              if not isinstance(page_runs, list):
                  raise SystemExit(
                      f"GitHub acquisition workflow page {index} is missing workflow_runs"
                  )
              runs.extend(page_runs)

          raw_started = os.environ["AUDIT_GUARD_STARTED_AT_UTC"]
          try:
              guard_started = datetime.fromisoformat(
                  raw_started.replace("Z", "+00:00")
              )
          except ValueError as exc:
              raise SystemExit(
                  "invalid final cloud audit guard start timestamp"
              ) from exc

          try:
              summary = ensure_no_source_capable_acquisition_updates_since(
                  runs,
                  guard_started_at_utc=guard_started,
              )
              current = select_acquisition_baseline(runs)
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc

          Path(".phase1-final-acquisition-run-guard.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )

          baseline = os.environ["BASELINE_RUN_ID"]
          baseline_completed_at = os.environ["BASELINE_COMPLETED_AT_UTC"]
          if not baseline.isdigit():
              raise SystemExit("invalid acquisition baseline run id")
          if current["latest_run_id"] != int(baseline):
              raise SystemExit(
                  "Phase 1 source-capable acquisition changed during final cloud "
                  "verification; discard this mixed-snapshot audit."
              )
          if current["baseline_completed_at_utc"] != baseline_completed_at:
              raise SystemExit(
                  "Phase 1 acquisition baseline activity changed during final "
                  "cloud verification."
              )

          path = Path("phase1-cloud-provenance.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["acquisition_baseline_run_id"] = int(baseline)
          report["acquisition_baseline_completed_at_utc"] = baseline_completed_at
          report["acquisition_history_guard_version"] = summary["guard_version"]
          report["acquisition_history_guard_started_at_utc"] = summary[
              "guard_started_at_utc"
          ]
          report["acquisition_unchanged_during_verification"] = True
          path.write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
          rm -f .phase1-final-acquisition-workflow-pages.json
      - name: Persist final cloud provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-cloud-provenance-${{ github.run_id }}
          path: |
            phase1-cloud-provenance.json
            .phase1-final-acquisition-run-guard.json
          if-no-files-found: warn
          retention-days: 90
