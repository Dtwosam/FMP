name: phase8a-annual-catalogue-2017-dispatch-authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2017-dispatch-authorization.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC540_RUN_ID: "37223000759"
      DEC540_HEAD_SHA: "f7983f960ae141f15c83b3cc05f6d6030140c802"
      DEC540_ARTIFACT_ID: "11311031268"
      DEC540_ARTIFACT_DIGEST: "sha256:a54675bd49ef6bb17d32f44b1d21a4adb10b541e3a248f583b05293505ef498d"
      DEC540_PREFLIGHT_FINGERPRINT: "7329cf4238c1aa8b608d7b4e41eaaaf643f78c3fb99f7ae399f6db303a75ffad"

    steps:
      - name: Checkout exact DEC-541 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only authorization push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_dispatch_authorization.py)" = "ba4a59867bba225bcdc683dde451151922074cdb"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2017_dispatch_authorization.py)" = "3ce43345ce2121181168cff68c82d8123a854ce1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_dispatch_preflight.py)" = "0e048756a1a9ca5f8d45896c6ff212d386996ed0"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py)" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Fetch and verify exact DEC-540 preflight artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC540_RUN_ID"             > "$RUNNER_TEMP/dec540-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC540_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec540-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec540-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC540_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2017-dispatch-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2017-dispatch-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC540_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec540-artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC540_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2017-dec540-dispatch-preflight-"
              + os.environ["DEC540_HEAD_SHA"]
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC540_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC540_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec540-preflight.zip"

          expected_sha="${DEC540_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec540-preflight.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec540-preflight"
          unzip -q "$RUNNER_TEMP/dec540-preflight.zip"             -d "$RUNNER_TEMP/dec540-preflight"
          preflight="$(
            find "$RUNNER_TEMP/dec540-preflight"               -type f -name dec540-2017-dispatch-preflight.json -print
          )"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "DEC-540"
          test "$(jq -r '.expected_head_sha' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "$DEC540_HEAD_SHA"
          test "$(jq -r '.preflight_fingerprint_sha256' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "$DEC540_PREFLIGHT_FINGERPRINT"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "379"
          test "$(jq -r '.expected_run_attempt' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "1"
          test "$(jq -r '.previous_annual_freeze_run_id' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "37206992367"
          test "$(jq -r '.preflight_read_only' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "true"
          test "$(jq -r '.annual_workflow_dispatch_authorized' "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json")" = "false"

      - name: Recheck current main and unconsumed run-379 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 4
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378}
          assert not any(
              isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 379
              for row in rows
          )
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned authorization dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean authorization checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-541 authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2017_dispatch_authorization.py             authorize             --preflight-json "$RUNNER_TEMP/dec540-2017-dispatch-preflight.json"             --authorization-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec541-2017-dispatch-authorization.json"

      - name: Verify DEC-541 is source-only and run-379 exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec541-2017-dispatch-authorization.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-541"
          assert value["source_preflight_workflow_run_id"] == 37223000759
          assert value["source_preflight_artifact_id"] == 11311031268
          assert value["source_preflight_fingerprint_sha256"] == (
              "7329cf4238c1aa8b608d7b4e41eaaaf643f78c3fb99f7ae399f6db303a75ffad"
          )
          assert value["authorization_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["annual_segment_label"] == "2017"
          assert value["previous_annual_freeze_run_id"] == 37206992367
          assert value["expected_run_number"] == 379
          assert value["expected_run_attempt"] == 1
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["historical_artifact_read_authorized"] is True
          assert value["historical_catalogue_execution_authorized"] is True
          assert value["historical_result_production_authorized"] is True
          assert value["authorization_contract_validated"] is True
          assert value["source_only_authorization"] is True
          for field in (
              "dispatch_command_present",
              "dispatch_action_executed",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_380_or_later_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-541 authorization
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2017-dec541-dispatch-authorization-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec540-run.json
            ${{ runner.temp }}/dec540-artifacts.json
            ${{ runner.temp }}/dec540-2017-dispatch-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec541-2017-dispatch-authorization.json
          if-no-files-found: error
