name: phase8a-annual-catalogue-2021-dispatch-authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2021-dispatch-authorization.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC586_RUN_ID: "37501665304"
      DEC586_HEAD_SHA: "b62616de10cc4362ff4f372e44e73fcd2be91366"
      DEC586_ARTIFACT_ID: "11430072006"
      DEC586_ARTIFACT_DIGEST: "sha256:e973c65ad1b72531e372a86cb028687733b8dfd9414fd901009c83d396621837"
      DEC586_PREFLIGHT_FINGERPRINT: "55a2c7cbeec4a0ae54b96f1a2687e79e929b79cc4e484b442a9729e62da8f84a"
      DEC586_PREFLIGHT_CANONICAL_SHA256: "6039cf03b7b22f6982a3fdebda7b3be8d709c70a4ad5e84890f164bd47d2cf33"

    steps:
      - name: Checkout exact DEC-587 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only authorization push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-587 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_dispatch_authorization.py)" = "17a7b4de05f3d27bc96ecbc182347ac1fc7926af"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2021_dispatch_authorization.py)" = "2bf19008e1d4011847775ebdf0afc1118c9c99cf"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_dispatch_preflight.py)" = "a2454464ad9445dfd3ac788797f1c7633b67e116"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-586 preflight evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC586_RUN_ID" > "$RUNNER_TEMP/dec573-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC586_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec573-artifacts.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec573-run.json").read_text())
          exact = {
              "id": 37501665304,
              "name": "phase8a-annual-catalogue-2021-dispatch-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2021-dispatch-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "b62616de10cc4362ff4f372e44e73fcd2be91366",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads((temp / "dec573-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11430072006]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2021-dec573-dispatch-preflight-"
              "b62616de10cc4362ff4f372e44e73fcd2be91366"
          )
          assert artifact["digest"] == (
              "sha256:e973c65ad1b72531e372a86cb028687733b8dfd9414fd901009c83d396621837"
          )
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC586_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec573.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec573.zip" | awk '{print $1}')"
          test "$actual" = "bba88547a36138109e6178936fd632e9bc61e81f8725e12124d739477916c5fa"

          mkdir -p "$RUNNER_TEMP/dec573"
          unzip -q "$RUNNER_TEMP/dec573.zip" -d "$RUNNER_TEMP/dec573"
          preflight="$(find "$RUNNER_TEMP/dec573" -type f -name dec573-2021-dispatch-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "DEC-586"
          test "$(jq -r '.expected_head_sha' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "$DEC586_HEAD_SHA"
          test "$(jq -r '.preflight_fingerprint_sha256' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "$DEC586_PREFLIGHT_FINGERPRINT"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "382"
          test "$(jq -r '.expected_run_attempt' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "1"
          test "$(jq -r '.previous_annual_freeze_run_id' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "37310525635"
          test "$(jq -r '.preflight_read_only' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "true"
          test "$(jq -r '.annual_workflow_dispatch_authorized' "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json")" = "false"

      - name: Recheck current main and unconsumed run-382 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"

          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text()
          )["workflow_runs"]
          assert len(rows) == 8
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382}
          assert not any(
              isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 383
              for row in rows
          )
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned authorization dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean authorization checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-587 authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2021_dispatch_authorization.py \
            authorize \
            --preflight-json "$RUNNER_TEMP/dec573-2021-dispatch-preflight.json" \
            --authorization-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec574-2021-dispatch-authorization.json"

      - name: Verify DEC-587 is source-only and run-382 exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec574-2021-dispatch-authorization.json"
              ).read_text()
          )
          assert value["decision"] == "DEC-587"
          assert value["source_preflight_workflow_run_id"] == 37501665304
          assert value["source_preflight_artifact_id"] == 11430072006
          assert value["source_preflight_artifact_digest"] == (
              "sha256:e973c65ad1b72531e372a86cb028687733b8dfd9414fd901009c83d396621837"
          )
          assert value["source_preflight_fingerprint_sha256"] == (
              "55a2c7cbeec4a0ae54b96f1a2687e79e929b79cc4e484b442a9729e62da8f84a"
          )
          assert value["authorization_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["annual_segment_label"] == "2021"
          assert value["prior_segment_label"] == "2020"
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["historical_artifact_read_authorized"] is True
          assert value["historical_catalogue_execution_authorized"] is True
          assert value["historical_result_production_authorized"] is True
          assert value["authorization_contract_validated"] is True
          assert value["source_only_authorization"] is True
          for field in (
              "dispatch_command_present",
              "dispatch_action_executed",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_384_or_later_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-587 authorization
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2021-dec574-dispatch-authorization-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec573-run.json
            ${{ runner.temp }}/dec573-artifacts.json
            ${{ runner.temp }}/dec573-2021-dispatch-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec574-2021-dispatch-authorization.json
          if-no-files-found: error
