name: phase3-acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Generate deterministic Phase 3 acceptance evidence
        run: |
          rm -rf .phase3-acceptance
          python scripts/phase3_acceptance_fixture.py \
            --out .phase3-acceptance \
            --code-commit "${GITHUB_SHA}"

      - name: Verify evidence shape
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.phase3-acceptance')
          index = json.loads((root / 'acceptance-index.json').read_text(encoding='utf-8'))
          expected = [
              'ambiguity',
              'daily-halt-reset',
              'long-cost',
              'short-target',
              'simultaneous-risk',
          ]
          assert index['protocol'] == 'fmp-phase3-acceptance-fixture-v1'
          assert index['fixture_id'] == 'phase3-merged-main-acceptance-v1'
          assert index['code_commit'] == os.environ['GITHUB_SHA']
          assert index['scenario_count'] == 5
          assert [item['name'] for item in index['scenarios']] == expected
          assert all(item['bytes_equal'] for item in index['scenarios'])
          for scenario in expected:
              for copy in ('primary', 'repeat'):
                  base = root / copy / scenario
                  for name in ('summary.json', 'trades.jsonl', 'rejections.jsonl', 'metrics.json', 'manifest.json'):
                      assert (base / name).is_file(), base / name
          PY

      - name: Upload Phase 3 acceptance evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase3-backtester-acceptance-${{ github.sha }}
          path: .phase3-acceptance
          include-hidden-files: true
          if-no-files-found: error
