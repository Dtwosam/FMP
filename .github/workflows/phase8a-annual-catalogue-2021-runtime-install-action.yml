name: phase8a-annual-catalogue-2021-runtime-install-action

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2021-runtime-install-action.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-install-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC583_RUN_ID: "37486048003"
      DEC583_HEAD_SHA: "0925e7d51d9c1d513cb737c6b9a00809bad61080"
      DEC583_ARTIFACT_ID: "11423396654"
      DEC583_ARTIFACT_DIGEST: "sha256:4a9de7f416f2297ce315b43f6869a17db34341686c12deced02000fda5342e79"
      DEC583_PREFLIGHT_FINGERPRINT: "54bb157ee055a5c625f1cb05094e7c4f8228f48766ccdfb163e4d2b07223d575"
      DEC583_PREFLIGHT_CANONICAL_SHA256: "0798fd16435012b319e4507b48dbd93e95951f0b9986e921340ec4d5d736d77f"

    steps:
      - name: Checkout exact DEC-584 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only action push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-584 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization_install_action.py)" = "9ea8f4574ed1a85cbf0b95031a7450cc4f7fa705"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2021_runtime_authorization_install_action.py)" = "fe600e0eda57a144e81519deab53412a7354e92f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization_install_preflight.py)" = "b8ba899634fe1b45ee7a50dc13da97440c3d45d0"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization_plan.py)" = "de1643991d85cd63e5505401b871e3c02315e0e9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2021_runtime_authorization.py.disabled)" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2021_authorization.py.disabled)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py

      - name: Fetch and verify exact DEC-583 preflight artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC583_RUN_ID" > "$RUNNER_TEMP/dec583-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC583_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec583-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec583-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC583_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2021-runtime-install-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2021-runtime-install-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC583_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec583-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row
              for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC583_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2021-dec583-runtime-install-preflight-"
              + os.environ["DEC583_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC583_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC583_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec583.zip"
          expected_sha="${DEC583_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec583.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec583"
          unzip -q "$RUNNER_TEMP/dec583.zip" -d "$RUNNER_TEMP/dec583"
          preflight="$(find "$RUNNER_TEMP/dec583" -type f -name dec583-2021-runtime-install-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec583-2021-runtime-install-preflight.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec583-2021-runtime-install-preflight.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC583_PREFLIGHT_CANONICAL_SHA256"
          ]
          assert value["preflight_fingerprint_sha256"] == os.environ[
              "DEC583_PREFLIGHT_FINGERPRINT"
          ]
          assert value["decision"] == "DEC-583"
          assert value["expected_head_sha"] == os.environ["DEC583_HEAD_SHA"]
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["activation_mutation_file_count"] == 2
          assert value["preflight_read_only"] is True
          assert value["repository_mutation_authorized"] is False
          assert value["runtime_authorization_installed"] is False
          assert value["runtime_gate_active"] is False
          assert value["annual_workflow_dispatch_authorized"] is False
          PY

      - name: Recheck current main, runtime, and unconsumed run-383 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-branch.json").read_text(encoding="utf-8"))
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]

          rows = json.loads(
              (temp / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382}
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 383
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned action dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean action checkout
        run: test -z "$(git status --porcelain)"

      - name: Compile concrete DEC-584 install action
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2021_runtime_authorization_install_action.py             compile             --preflight-json "$RUNNER_TEMP/dec583-2021-runtime-install-preflight.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec584-2021-runtime-install-action.json"

      - name: Verify DEC-584 exact two-file action and non-dispatching boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec584-2021-runtime-install-action.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-584"
          assert value["source_preflight_workflow_run_id"] == 37486048003
          assert value["source_preflight_artifact_id"] == 11423396654
          assert value["source_preflight_artifact_digest"] == (
              "sha256:4a9de7f416f2297ce315b43f6869a17db34341686c12deced02000fda5342e79"
          )
          assert value["source_preflight_fingerprint_sha256"] == (
              "54bb157ee055a5c625f1cb05094e7c4f8228f48766ccdfb163e4d2b07223d575"
          )
          assert value["expected_run_number"] == 383
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37443770076
          assert value["action_count"] == 2
          create, update = value["actions"]
          assert create["order"] == 1
          assert create["operation"] == "create"
          assert create["target_path"] == "src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py"
          assert create["expected_target_absent"] is True
          assert create["expected_result_blob_sha"] == (
              "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          )
          assert update["order"] == 2
          assert update["operation"] == "update"
          assert update["target_path"] == (
              "src/fmp/discovery/annual_pattern_catalogue_runtime.py"
          )
          assert update["expected_current_blob_sha"] == (
              "4e124365430672fa63825b272001937c60151644"
          )
          assert update["expected_result_blob_sha"] == (
              "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          )
          assert value["repository_mutation_authorized"] is True
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-584 install action
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2021-dec584-runtime-install-action-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec583-run.json
            ${{ runner.temp }}/dec583-artifacts.json
            ${{ runner.temp }}/dec583-2021-runtime-install-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec584-2021-runtime-install-action.json
          if-no-files-found: error
