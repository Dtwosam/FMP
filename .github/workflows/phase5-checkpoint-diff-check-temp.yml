name: phase5-checkpoint-diff-check-temp

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase5-checkpoint-diff-check-temp.yml

permissions:
  contents: read

jobs:
  diff-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase5-checkpoint-record
          fetch-depth: 0
      - name: Verify complete PR diff whitespace
        run: git diff --check origin/main...HEAD
