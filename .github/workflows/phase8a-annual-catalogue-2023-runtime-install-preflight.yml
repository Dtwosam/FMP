name: phase8a-annual-catalogue-2023-runtime-install-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-runtime-install-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-install-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC604_RUN_ID: "37688619041"
      DEC604_HEAD_SHA: "affbb533a320f639c8e4d1a955c2b1fd907b0d63"
      DEC604_ARTIFACT_ID: "11512058473"
      DEC604_ARTIFACT_DIGEST: "sha256:a43cd3c767082ae3c20587690e202f98da32c9824b0cda2f33d211ac19e21de8"
      DEC604_PLAN_CANONICAL_SHA256: "9c5841d3842bc1c342c0e4032460c30ec66c33d0d144c47c4cf1a3523a7d1440"

    steps:
      - name: Checkout exact DEC-605 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only install-preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-605 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization_install_preflight.py)" = "2faa9d4ccb8029d5cac73f98d06b5726169599e2"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_runtime_authorization_install_preflight.py)" = "2335f0c106c628ff817e904f40a29b0f589fafca"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization_plan.py)" = "fe5c18f8ffa5e3d698f91060ec8c28e0d0692318"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_execution_authorization.py)" = "2c4292abadbffb9dd87edaab67d9e32783facae7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2023_runtime_authorization.py.disabled)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2023_authorization.py.disabled)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py

      - name: Fetch and verify exact DEC-604 plan artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC604_RUN_ID" > "$RUNNER_TEMP/dec604-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC604_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec604-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec604-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC604_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2023-runtime-authorization-plan",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-runtime-authorization-plan.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC604_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec604-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row
              for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC604_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2023-dec604-runtime-authorization-plan-"
              + os.environ["DEC604_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC604_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC604_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec604.zip"
          expected_sha="${DEC604_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec604.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec604"
          unzip -q "$RUNNER_TEMP/dec604.zip" -d "$RUNNER_TEMP/dec604"
          auth="$(find "$RUNNER_TEMP/dec604" -type f -name dec603-2023-execution-authorization.json -print)"
          plan="$(find "$RUNNER_TEMP/dec604" -type f -name dec604-2023-runtime-authorization-plan.json -print)"
          test "$(printf '%s\n' "$auth" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$plan" | sed '/^$/d' | wc -l)" = "1"
          cp "$auth" "$RUNNER_TEMP/dec603-2023-execution-authorization.json"
          cp "$plan" "$RUNNER_TEMP/dec604-2023-runtime-authorization-plan.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec604-2023-runtime-authorization-plan.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  plan,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC604_PLAN_CANONICAL_SHA256"
          ]
          assert plan["decision"] == "DEC-604"
          assert plan["expected_run_number"] == 385
          assert plan["expected_run_attempt"] == 1
          assert plan["expected_previous_annual_freeze_run_id"] == 37663157285
          assert plan["runtime_authorization_installed"] is False
          assert plan["runtime_gate_active"] is False
          assert plan["repository_mutation_authorized"] is False
          assert plan["annual_workflow_dispatch_authorized"] is False
          assert plan["source_authorization_protected_history_access_authorized"] is True
          assert plan["protected_catalogue_segment"] is True
          assert plan["governing_method_decision"] == "DEC-469"
          assert plan["governing_protocol_decision"] == "DEC-470"
          assert plan["protected_history_access_authorized"] is False
          assert plan["plan_source_only"] is True
          PY

      - name: Recheck current main and unconsumed run-385 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-branch.json").read_text(encoding="utf-8"))
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]

          rows = json.loads(
              (temp / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383, 384}
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
              383: (37531960014, "success"),
              384: (37663157285, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 385
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-605 install preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_runtime_authorization_install_preflight.py             plan             --authorization-json "$RUNNER_TEMP/dec603-2023-execution-authorization.json"             --plan-json "$RUNNER_TEMP/dec604-2023-runtime-authorization-plan.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec605-2023-runtime-install-preflight.json"

      - name: Verify DEC-605 remains read-only and exact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec605-2023-runtime-install-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-605"
          assert value["source_plan_workflow_run_id"] == 37688619041
          assert value["source_plan_artifact_id"] == 11512058473
          assert value["source_plan_artifact_digest"] == (
              "sha256:a43cd3c767082ae3c20587690e202f98da32c9824b0cda2f33d211ac19e21de8"
          )
          assert value["source_plan_canonical_sha256"] == (
              "9c5841d3842bc1c342c0e4032460c30ec66c33d0d144c47c4cf1a3523a7d1440"
          )
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["activation_mutation_file_count"] == 2
          assert value["runtime_install_preflight_ready"] is True
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_catalogue_segment"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["preflight_read_only"] is True
          assert value["next_gate"] == (
              "EXACT_ANNUAL_PATTERN_CATALOGUE_2023_RUNTIME_"
              "AUTHORIZATION_INSTALL_MUTATION_AFTER_DEC605"
          )
          for field in (
              "repository_mutation_authorized",
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_386_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-605 install preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec605-runtime-install-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec604-run.json
            ${{ runner.temp }}/dec604-artifacts.json
            ${{ runner.temp }}/dec603-2023-execution-authorization.json
            ${{ runner.temp }}/dec604-2023-runtime-authorization-plan.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec605-2023-runtime-install-preflight.json
          if-no-files-found: error
