name: phase6-ml-filter

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: session_breakout
            timeframe: 15m
            phase5_artifact_id: '10374600839'
            phase5_zip_sha256: 2e9b19935fc2699c94e5c3b91675c332892da9448e994438e479cf501e3c6215
          - strategy: volatility_breakout
            timeframe: 1h
            phase5_artifact_id: '10374645600'
            phase5_zip_sha256: 3db4d9d4fd4613c9e91f4c3fc1d815750038e33ea993608513066cec53aa617f

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download and verify accepted Phase 2 USDJPY artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10327600628'
          EXPECTED_ZIP_SHA256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72
          EXPECTED_MANIFEST_SHA256: e47ee5339868a741097404bed49411cca36b03609ebe395261bb70b6e63bdd3d
        run: |
          set -euo pipefail
          root=".phase2-accepted"
          zip_path=".phase2-accepted.zip"
          manifest_path="${root}/manifests/processed/fmp-canonical-1m-v1/USDJPY.json"
          mkdir -p "${root}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${zip_path}"
          actual_zip_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          test "${actual_zip_sha256}" = "${EXPECTED_ZIP_SHA256}"
          unzip -q "${zip_path}" -d "${root}"
          test -f "${manifest_path}"
          actual_manifest_sha256="$(sha256sum "${manifest_path}" | awk '{print $1}')"
          test "${actual_manifest_sha256}" = "${EXPECTED_MANIFEST_SHA256}"

      - name: Download and verify accepted Phase 5 feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE5_ARTIFACT_ID: ${{ matrix.phase5_artifact_id }}
          EXPECTED_PHASE5_ZIP_SHA256: ${{ matrix.phase5_zip_sha256 }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          root=".phase5-accepted/${TIMEFRAME}"
          zip_path=".phase5-accepted/${TIMEFRAME}.zip"
          mkdir -p "${root}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PHASE5_ARTIFACT_ID}/zip" \
            > "${zip_path}"
          actual_zip_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          test "${actual_zip_sha256}" = "${EXPECTED_PHASE5_ZIP_SHA256}"
          unzip -q "${zip_path}" -d "${root}"
          test -f "${root}/manifest.json"

      - name: Execute first frozen Phase 6 cell
        env:
          STRATEGY: ${{ matrix.strategy }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          python scripts/phase6_ml_filter.py \
            --dataset-root ".phase2-accepted" \
            --processed-manifest ".phase2-accepted/manifests/processed/fmp-canonical-1m-v1/USDJPY.json" \
            --feature-root ".phase5-accepted/${TIMEFRAME}" \
            --feature-manifest ".phase5-accepted/${TIMEFRAME}/manifest.json" \
            --strategy "${STRATEGY}" \
            --out ".phase6-a/${STRATEGY}" \
            --code-commit "${GITHUB_SHA}"

      - name: Execute second frozen Phase 6 cell
        env:
          STRATEGY: ${{ matrix.strategy }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          python scripts/phase6_ml_filter.py \
            --dataset-root ".phase2-accepted" \
            --processed-manifest ".phase2-accepted/manifests/processed/fmp-canonical-1m-v1/USDJPY.json" \
            --feature-root ".phase5-accepted/${TIMEFRAME}" \
            --feature-manifest ".phase5-accepted/${TIMEFRAME}/manifest.json" \
            --strategy "${STRATEGY}" \
            --out ".phase6-b/${STRATEGY}" \
            --code-commit "${GITHUB_SHA}"

      - name: Verify deterministic evidence and locked coverage
        env:
          STRATEGY: ${{ matrix.strategy }}
        run: |
          set -euo pipefail
          a=".phase6-a/${STRATEGY}"
          b=".phase6-b/${STRATEGY}"
          for name in selection.json result.json manifest.json; do
            cmp "${a}/${name}" "${b}/${name}"
          done
          diff \
            <(find "${a}" -type f -printf '%P\n' | sort) \
            <(find "${b}" -type f -printf '%P\n' | sort)
          if grep -R -E '2024-[0-9]{2}-[0-9]{2}|[/\\]2024[/\\]' "${a}"; then
            echo 'locked 2024+ evidence detected' >&2
            exit 1
          fi
          python - "${a}" "${GITHUB_SHA}" "${STRATEGY}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected_commit = sys.argv[2]
          expected_strategy = sys.argv[3]
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          result = json.loads((root / 'result.json').read_text(encoding='utf-8'))
          selection = json.loads((root / 'selection.json').read_text(encoding='utf-8'))
          assert manifest['experiment_id'] == 'EXP-20260915-007'
          assert result['experiment_id'] == 'EXP-20260915-007'
          assert selection['experiment_id'] == 'EXP-20260915-007'
          assert manifest['strategy_id'] == expected_strategy
          assert result['strategy_id'] == expected_strategy
          assert selection['strategy_id'] == expected_strategy
          assert manifest['code_commit'] == expected_commit
          assert result['code_commit'] == expected_commit
          assert selection['code_commit'] == expected_commit
          assert manifest['feature_set_version'] == 'fmp-feature-v1'
          assert manifest['phase5_checkpoint_sha'] == 'e0b2fc7bf12b0c9cd9d76668564df6b7714b1fe0'
          assert manifest['processed_manifest_sha256'] == 'e47ee5339868a741097404bed49411cca36b03609ebe395261bb70b6e63bdd3d'
          assert selection['feature_set_version'] == 'fmp-feature-v1'
          assert set(selection['models']) == {'logistic_regression', 'hist_gradient_boosting'}
          assert result['validation']['status'] in {
              'NO_ML_CHALLENGER', 'PROMOTE_ML_FILTER', 'REJECT_ML_FILTER'
          }
          PY

      - name: Upload Phase 6 evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase6-ml-filter-${{ matrix.strategy }}-${{ github.sha }}
          path: .phase6-a/${{ matrix.strategy }}
          include-hidden-files: true
          if-no-files-found: error
