name: phase8a-exp062-historical-executor-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-exp062-historical-executor-preflight.yml
      - .github/workflows/phase8a-exp062-discovery.yml
      - src/fmp/discovery/exp062_historical_dispatch_runtime_freeze.py
      - src/fmp/discovery/exp062_historical_executor_contract.py
      - src/fmp/discovery/exp062_historical_executor_preflight.py
      - scripts/phase8a_exp062_historical_executor_preflight.py
      - requirements/exp061-discovery-run.txt

permissions:
  contents: read
  actions: read

jobs:
  read-only-historical-executor-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact first merged-main DEC-326 proof push
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Require frozen DEC-323/324/325 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/exp062_historical_dispatch_runtime_freeze.py)" = "44815c9ff23fcd022346558e8c043673154ca0b3"
          test "$(git hash-object src/fmp/discovery/exp062_historical_executor_contract.py)" = "12d514e86a2b458dd692810450e69b30f554a6bd"
          test "$(git hash-object src/fmp/discovery/exp062_historical_executor_preflight.py)" = "7aca87376dcbcbb4b30ea72a4da6b6f502799bd8"
          test "$(git hash-object scripts/phase8a_exp062_historical_executor_preflight.py)" = "a7a9ce90ab42b746fea1ef3ee5880abe2992fbf7"
          test "$(git hash-object .github/workflows/phase8a-exp062-discovery.yml)" = "1a7d42fd8d03d6ca3eae722209b1ad2a5dd2bc50"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned planning runtime without editable checkout
        run: python -m pip install -r requirements/exp061-discovery-run.txt

      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Fetch current main and exact EXP-062 run inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-discovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"

      - name: Run exact DEC-325 read-only executor preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_exp062_historical_executor_preflight.py plan \
            --main-json "$RUNNER_TEMP/main.json" \
            --runs-json "$RUNNER_TEMP/runs.json" \
            --expected-head "$GITHUB_SHA" \
            > "$RUNNER_TEMP/historical-executor-preflight.json"

      - name: Verify slot-available preflight and all locks
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "historical-executor-preflight.json"
              ).read_text(encoding="utf-8")
          )

          assert plan["decision"] == "DEC-325"
          assert plan["version"] == "fmp-exp062-historical-executor-preflight-v1"
          assert plan["executor_contract_decision"] == "DEC-324"
          assert plan["executor_contract_version"] == (
              "fmp-exp062-historical-executor-contract-v1"
          )
          assert plan["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert plan["stage"] == (
              "EXP062_ONE_SHOT_EXECUTOR_PREFLIGHT_SLOT_AVAILABLE"
          )
          assert plan["proof_run_id"] == 36358289723
          assert plan["proof_run_count"] == 1
          assert plan["historical_result_attempt_count"] == 0
          assert plan["historical_result_run_id"] is None
          assert plan["historical_result_slot_consumed"] is False
          assert plan["expected_target_run_number"] == 2
          assert plan["expected_target_run_attempt"] == 1
          assert plan["planned_dispatch_command"] == (
              "gh workflow run phase8a-exp062-discovery.yml --ref main"
          )
          assert plan["one_shot_executor_source_authorized"] is True

          for field in (
              "historical_executor_available",
              "historical_result_dispatch_authorized",
              "historical_execute_mode_available",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "reserved_robustness_access_authorized",
              "candidate_compilation_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert plan[field] is False, field
          PY

      - name: Upload immutable DEC-326 historical executor preflight proof
        uses: actions/upload-artifact@v6
        with:
          name: exp062-dec326-historical-executor-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/historical-executor-preflight.json
          if-no-files-found: error
