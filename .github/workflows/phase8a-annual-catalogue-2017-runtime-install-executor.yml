name: phase8a-annual-catalogue-2017-runtime-install-executor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2017-runtime-install-executor.yml

permissions:
  contents: write
  actions: read

jobs:
  install-runtime-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC538_RUN_ID: "37219170862"
      DEC538_HEAD_SHA: "7dfcf6cacca63719ac40a88858c69895fc68670b"
      DEC538_ARTIFACT_ID: "11310165235"
      DEC538_ARTIFACT_DIGEST: "sha256:e210042872cbe191f4383fcba4a6ac9305fbdeb96acaed32d46e034acff1681d"

    steps:
      - name: Checkout exact DEC-539 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first installer push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-539 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization_install_action.py)" = "b6fd22c5eca66ca373d0479e63af51cd39068ed9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization_install_receipt.py)" = "c3662046efc7daf2c00637066aa78c885b85fa8e"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2017_runtime_authorization_install_receipt.py)" = "62faa349bd8768990f5af03a25082bdfc17d1706"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2017_runtime_authorization.py.disabled)" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2017_authorization.py.disabled)" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-538 install action
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC538_RUN_ID" > "$RUNNER_TEMP/dec538-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC538_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec538-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec538-run.json").read_text())
          exact = {
              "id": 37219170862,
              "name": "phase8a-annual-catalogue-2017-runtime-install-action",
              "path": ".github/workflows/phase8a-annual-catalogue-2017-runtime-install-action.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "7dfcf6cacca63719ac40a88858c69895fc68670b",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          payload = json.loads((temp / "dec538-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11310165235]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == "annual-catalogue-2017-dec538-runtime-install-action-7dfcf6cacca63719ac40a88858c69895fc68670b"
          assert artifact["digest"] == "sha256:e210042872cbe191f4383fcba4a6ac9305fbdeb96acaed32d46e034acff1681d"
          assert artifact["expired"] is False
          PY
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC538_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec538.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec538.zip" | awk '{print $1}')"
          test "$actual" = "e210042872cbe191f4383fcba4a6ac9305fbdeb96acaed32d46e034acff1681d"
          mkdir -p "$RUNNER_TEMP/dec538"
          unzip -q "$RUNNER_TEMP/dec538.zip" -d "$RUNNER_TEMP/dec538"
          action="$(find "$RUNNER_TEMP/dec538" -type f -name dec538-2017-runtime-install-action.json -print)"
          test "$(printf '%s\n' "$action" | sed '/^$/d' | wc -l)" = "1"
          cp "$action" "$RUNNER_TEMP/dec538-2017-runtime-install-action.json"

      - name: Recheck current main and unconsumed run-379 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-before-install.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs-before-install.json"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-before-install.json").read_text())
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]
          rows = json.loads((temp / "annual-runs-before-install.json").read_text()).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378}
          assert by_number[1]["conclusion"] == "failure"
          assert by_number[376]["conclusion"] == "failure"
          assert by_number[377]["conclusion"] == "success"
          assert by_number[378]["conclusion"] == "success"
          assert not any(row["run_number"] >= 379 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned installer dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean installer checkout
        run: test -z "$(git status --porcelain)"

      - name: Validate concrete DEC-538 action
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from fmp.discovery.annual_pattern_catalogue_2017_runtime_authorization_install_action import (
              validate_2017_runtime_authorization_install_action,
          )
          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec538-2017-runtime-install-action.json").read_text()
          )
          validate_2017_runtime_authorization_install_action(value)
          assert value["decision"] == "DEC-538"
          assert value["source_preflight_workflow_run_id"] == 37215789401
          assert value["source_preflight_artifact_id"] == 11308490990
          assert value["expected_run_number"] == 379
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37206992367
          assert value["action_count"] == 2
          assert value["repository_mutation_authorized"] is True
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Apply exact two-file runtime authorization install
        run: |
          set -euo pipefail
          cp \
            docs/superpowers/templates/annual_pattern_catalogue_2017_runtime_authorization.py.disabled \
            src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py
          cp \
            docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2017_authorization.py.disabled \
            src/fmp/discovery/annual_pattern_catalogue_runtime.py

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed-files.txt"

          cat > "$RUNNER_TEMP/expected-changed-files.txt" <<'EOF'
          src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py
          src/fmp/discovery/annual_pattern_catalogue_runtime.py
          EOF
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" "$RUNNER_TEMP/changed-files.txt"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py)" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"

          git add \
            src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py \
            src/fmp/discovery/annual_pattern_catalogue_runtime.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" <(git diff --cached --name-only)

      - name: Prove installed runtime imports and exact run-379 gate
        run: |
          set -euo pipefail
          python -m py_compile \
            src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py \
            src/fmp/discovery/annual_pattern_catalogue_runtime.py
          python - <<'PY'
          from fmp.discovery.annual_pattern_catalogue_runtime import (
              require_historical_catalogue_execution_authorized,
          )
          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2017",
              run_number=379,
              run_attempt=1,
              previous_annual_freeze_run_id=37206992367,
          )
          try:
              require_historical_catalogue_execution_authorized(
                  code_commit="a" * 40,
                  annual_segment_label="2017",
                  run_number=380,
                  run_attempt=1,
                  previous_annual_freeze_run_id=37206992367,
              )
          except (PermissionError, ValueError):
              pass
          else:
              raise AssertionError("run 380 must remain unauthorized")
          PY

      - name: Commit and push exact install
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase8a: install 2017 runtime authorization (DEC-539)"
          git rev-parse HEAD > "$RUNNER_TEMP/install-commit-sha.txt"
          git push origin HEAD:main

      - name: Verify installed main and build DEC-539 receipt
        run: |
          set -euo pipefail
          install_sha="$(cat "$RUNNER_TEMP/install-commit-sha.txt")"
          found=0
          for _ in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-after-install.json"
            if test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-after-install.json")" = "$install_sha"; then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

          gate_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py)"
          runtime_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)"
          python scripts/phase8a_annual_pattern_catalogue_2017_runtime_authorization_install_receipt.py \
            review \
            --action-json "$RUNNER_TEMP/dec538-2017-runtime-install-action.json" \
            --install-commit-sha "$install_sha" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --installed-gate-blob-sha "$gate_sha" \
            --installed-runtime-blob-sha "$runtime_sha" \
            --out "$RUNNER_TEMP/dec539-2017-runtime-install-receipt.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec539-2017-runtime-install-receipt.json").read_text()
          )
          assert value["decision"] == "DEC-539"
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["install_action_consumed"] is True
          assert value["expected_run_number"] == 379
          assert value["previous_annual_freeze_run_id"] == 37206992367
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["next_segment_execution_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Upload immutable DEC-539 install evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2017-dec539-runtime-install-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec538-run.json
            ${{ runner.temp }}/dec538-artifacts.json
            ${{ runner.temp }}/dec538-2017-runtime-install-action.json
            ${{ runner.temp }}/annual-runs-before-install.json
            ${{ runner.temp }}/main-before-install.json
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/install-commit-sha.txt
            ${{ runner.temp }}/main-after-install.json
            ${{ runner.temp }}/dec539-2017-runtime-install-receipt.json
          if-no-files-found: error
