name: phase8a-annual-catalogue-2023-dispatch-immutability-audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-dispatch-immutability-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  record-run385-immutability-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC610_RUN_ID: "37773291427"
      DEC610_HEAD_SHA: "58d17adbaf2238b6b774cb69f0434259984d1cb7"
      DEC610_ARTIFACT_ID: "11547739610"
      DEC610_ARTIFACT_DIGEST: "sha256:e093274fc52e8e5abdb1bd08455f0fcdb2374bab15f3d507abfea59b91a60143"
      DEC610_FINGERPRINT: "07f391338fe3d20c5e823f72a14cecdf454aec87a6e7638bdd8774f3c9b4b063"
      DEC610_CANONICAL_SHA256: "176cadda04eac41454d401bbabeeadc91e701307bbdd94054890ae89bf65689e"

    steps:
      - name: Checkout exact DEC-611 audit landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require first main push and pinned read-only audit
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_immutability_audit.py)" = "39b3898240b887a4f1418a9980fbe3b7b2c6f2d3"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_dispatch_immutability_audit.py)" = "f973680f11eeefa69c243c306fed5ecf70411a1c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_action_preflight.py)" = "60923763b844b8a1348cbfcf2612b739b8c7c28a"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_authorization.py)" = "b7f55dd68d5054c472b4e070521c411c02a4da3c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Revalidate exact DEC-610 concrete evidence
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$DEC610_RUN_ID" > "$RUNNER_TEMP/dec610-run.json"
          gh api "repos/$GH_REPO/actions/runs/$DEC610_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec610-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec610-run.json").read_text())
          exact = {
              "id": 37773291427,
              "name": "phase8a-annual-catalogue-2023-dispatch-action-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-dispatch-action-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC610_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in exact.items():
              assert type(run.get(key)) is type(value) and run.get(key) == value, key
          rows = json.loads((temp / "dec610-artifacts.json").read_text())["artifacts"]
          matches = [x for x in rows if x.get("id") == 11547739610]
          assert len(matches) == 1
          row = matches[0]
          assert row["expired"] is False
          assert row["digest"] == os.environ["DEC610_ARTIFACT_DIGEST"]
          assert row["name"] == (
              "annual-catalogue-2023-dec610-dispatch-action-preflight-"
              + os.environ["DEC610_HEAD_SHA"]
          )
          PY
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/actions/artifacts/$DEC610_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec610.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec610.zip" | awk '{print $1}')"
          test "sha256:$actual" = "$DEC610_ARTIFACT_DIGEST"
          mkdir -p "$RUNNER_TEMP/dec610"
          unzip -q "$RUNNER_TEMP/dec610.zip" -d "$RUNNER_TEMP/dec610"
          path="$RUNNER_TEMP/dec610/dec610-2023-dispatch-action-preflight.json"
          test -f "$path"
          test "$(find "$RUNNER_TEMP/dec610" -name dec610-2023-dispatch-action-preflight.json -type f | wc -l)" = "1"
          cp "$path" "$RUNNER_TEMP/dec610-2023-dispatch-action-preflight.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "dec610-2023-dispatch-action-preflight.json"
          value = json.loads(path.read_text())
          canon = (json.dumps(value, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n").encode()
          assert hashlib.sha256(canon).hexdigest() == os.environ["DEC610_CANONICAL_SHA256"]
          assert value["decision"] == "DEC-610"
          assert value["expected_head_sha"] == os.environ["DEC610_HEAD_SHA"]
          assert value["preflight_fingerprint_sha256"] == os.environ["DEC610_FINGERPRINT"]
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["preflight_read_only"] is True
          assert value["dispatch_action_executed"] is False
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["trading_authorized"] is False
          PY

      - name: Snapshot current main and annual run inventory
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GH_REPO/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(jq -r '.name' "$RUNNER_TEMP/main-branch.json")" = "main"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json"
          rows = json.loads(path.read_text())["workflow_runs"]
          assert len(rows) == 10
          assert {r["run_number"] for r in rows} == {1,376,377,378,379,380,381,382,383,384}
          assert not any(r.get("run_number", 0) >= 385 for r in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned read-only audit dependencies
        run: >-
          python -m pip install -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Audit atomic dispatch impossibility, never dispatch
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_dispatch_immutability_audit.py \
            audit \
            --dec610-preflight-json "$RUNNER_TEMP/dec610-2023-dispatch-action-preflight.json" \
            --main-branch-json "$RUNNER_TEMP/main-branch.json" \
            --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json" \
            --expected-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec611-2023-dispatch-immutability-audit.json"

      - name: Verify no dispatch or authority was granted
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec611-2023-dispatch-immutability-audit.json").read_text()
          )
          assert value["decision"] == "DEC-611"
          assert value["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["main_exclusive_lock_proven"] is False
          assert value["dispatch_atomic_to_vetted_sha"] is False
          assert value["dispatch_blocked"] is True
          assert value["audit_read_only"] is True
          assert value["dispatch_command_present"] is False
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["dispatch_action_executed"] is False
          assert value["trading_authorized"] is False
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["next_gate"] == (
              "EXCLUSIVE_MAIN_LOCK_OR_REAUTHORIZED_IMMUTABLE_REF_DESIGN"
          )
          PY

      - name: Upload immutable read-only DEC-611 audit evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec611-dispatch-immutability-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec610-run.json
            ${{ runner.temp }}/dec610-artifacts.json
            ${{ runner.temp }}/dec610-2023-dispatch-action-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec611-2023-dispatch-immutability-audit.json
          if-no-files-found: error
