name: zz-phase4-checkpoint-tag

on:
  push:
    branches:
      - phase4-checkpoint-tag
    paths:
      - .github/workflows/zz-phase4-checkpoint-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-checkpoint-tag
          fetch-depth: 0
      - name: Create immutable Phase 4 checkpoint tag
        env:
          TARGET_SHA: 115bb8080e951db16ca1a1174227ffa181a03d1b
          TAG_NAME: fmp-v1-phase4-baselines
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          existing="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}")"
          if [ -n "$existing" ]; then
            echo "tag already exists: $existing"
            exit 1
          fi
          git tag "${TAG_NAME}" "${TARGET_SHA}"
          git push origin "refs/tags/${TAG_NAME}"
