name: phase5-diff-check-temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff-check:
    if: github.event.pull_request.number == 102
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
