name: phase8-review-compiler-fix

on:
  push:
    branches:
      - phase8-activation-helper
    paths:
      - .github/workflows/phase8-review-compiler-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-shadow-implementation
          fetch-depth: 0
      - name: Wire derived review evidence compiler
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fmp/shadow/gates.py')
          text = path.read_text(encoding='utf-8')
          old = '''def review_campaign(campaign_dir: Path) -> Phase8ReviewOutcome:\n    evidence = load_review_evidence(Path(campaign_dir) / "review-evidence.json")\n    return evaluate_phase8_review(evidence)\n'''
          new = '''def review_campaign(campaign_dir: Path) -> Phase8ReviewOutcome:\n    from .review_compiler import compile_review_evidence\n\n    campaign_dir = Path(campaign_dir)\n    compile_review_evidence(campaign_dir)\n    evidence = load_review_evidence(campaign_dir / "review-evidence.json")\n    return evaluate_phase8_review(evidence)\n'''
          if old not in text:
              raise SystemExit('expected review_campaign block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fmp/shadow/gates.py
          git commit -m "[phase1-no-source] Wire derived Phase 8 review evidence"
          git push origin HEAD:phase8-shadow-implementation
