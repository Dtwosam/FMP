name: phase8a-annual-catalogue-2023-admin-handoff-freeze

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-admin-handoff-freeze.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze-read-only-dec614-admin-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC612_RUN_ID: "37791444781"
      DEC612_HEAD_SHA: "895b9ad311bd5159b2591dcfc8da714191574d00"
      DEC612_ARTIFACT_ID: "11555414803"
      DEC612_ARTIFACT_ZIP_SHA256: "48b4512002af76c4fe88a256cff8ddc558d185d18411f2f9d8fd9b32fba80bf3"
      DEC612_CANONICAL_SHA256: "cc89cf90e820341a48d41cdd5518105dd99f3c867c9ec43b8c7d989a2535d0c5"
      DEC612_FINGERPRINT_SHA256: "d9555c20a7d7a5a2d4bc79f9dd621e7a6d73e1ac9340cfec81348dc4e5f6a787"
      DEC613_MERGE_SHA: "29a47639d80caf5e02fe33586c1fa5718603c614"

    steps:
      - name: Checkout exact DEC-614 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require first main push, exact provenance and immutable sources
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$DEC613_MERGE_SHA" "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_admin_lock_handoff.py)" = "6de695a5ea0c27f4fb16b5eae3289c0014155e3b"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_admin_lock_handoff.py)" = "cb17f4fba2eccd19077a8a057d5781bf81950759"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_main_lock_readiness.py)" = "e4c76ef4993f03d51200139dee708250cf40e80f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_immutability_audit.py)" = "39b3898240b887a4f1418a9980fbe3b7b2c6f2d3"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Require exact DEC-614 landing delta
        run: |
          set -euo pipefail
          git diff --name-only "$DEC613_MERGE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/dec614-changed-files.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          actual = set((Path(os.environ["RUNNER_TEMP"]) / "dec614-changed-files.txt").read_text().splitlines())
          expected = {
              ".github/workflows/phase8a-annual-catalogue-2023-admin-handoff-freeze.yml",
              ".github/workflows/tests.yml",
              "tests/test_phase8a_annual_pattern_catalogue_2023_admin_handoff_freeze_workflow.py",
              "docs/project-state.md",
              "docs/decision-log.md",
          }
          assert actual == expected, (sorted(actual), sorted(expected))
          PY

      - name: Authenticate exact successful DEC-612 workflow and artifact metadata
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$DEC612_RUN_ID" > "$RUNNER_TEMP/dec612-run.json"
          gh api "repos/$GH_REPO/actions/runs/$DEC612_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec612-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec612-run.json").read_text())
          exact = {
              "id": 37791444781,
              "name": "phase8a-annual-catalogue-2023-main-lock-readiness",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-main-lock-readiness.yml",
              "head_branch": "main",
              "head_sha": os.environ["DEC612_HEAD_SHA"],
              "event": "push",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for key, expected in exact.items():
              assert type(run.get(key)) is type(expected) and run[key] == expected, key
          artifacts = json.loads((temp / "dec612-artifacts.json").read_text())["artifacts"]
          rows = [a for a in artifacts if a.get("id") == 11555414803]
          assert len(rows) == 1
          a = rows[0]
          assert a["expired"] is False
          assert a["digest"] == (
              "sha256:" + os.environ["DEC612_ARTIFACT_ZIP_SHA256"]
          )
          assert a["name"] == (
              "annual-catalogue-2023-dec612-main-lock-readiness-"
              + os.environ["DEC612_HEAD_SHA"] + "-" + os.environ["DEC612_RUN_ID"]
          )
          PY
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/actions/artifacts/$DEC612_ARTIFACT_ID/zip" > "$RUNNER_TEMP/dec612.zip"
          sha="$(sha256sum "$RUNNER_TEMP/dec612.zip" | awk '{print $1}')"
          test "$sha" = "$DEC612_ARTIFACT_ZIP_SHA256"
          mkdir -p "$RUNNER_TEMP/dec612"
          unzip -q "$RUNNER_TEMP/dec612.zip" -d "$RUNNER_TEMP/dec612"
          test "$(find "$RUNNER_TEMP/dec612" -name dec612-main-lock-readiness.json -type f | wc -l)" = "1"
          cp "$RUNNER_TEMP/dec612/dec612-main-lock-readiness.json" "$RUNNER_TEMP/dec612-readiness.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          obj = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dec612-readiness.json").read_text())
          data = (json.dumps(obj, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n").encode()
          assert hashlib.sha256(data).hexdigest() == os.environ["DEC612_CANONICAL_SHA256"]
          assert obj["readiness_fingerprint_sha256"] == os.environ["DEC612_FINGERPRINT_SHA256"]
          assert obj["decision"] == "DEC-612"
          assert obj["expected_head_sha"] == os.environ["DEC612_HEAD_SHA"]
          assert obj["dispatch_blocked"] is True
          assert obj["dispatch_action_executed"] is False
          assert obj["main_exclusive_lock_proven"] is False
          assert obj["trading_authorized"] is False
          PY

      - name: Snapshot exact current main and unconsumed annual history
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api \
            "repos/$GH_REPO/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"
          test "$(jq -r '.name' "$RUNNER_TEMP/main-branch.json")" = main
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads((Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text())["workflow_runs"]
          assert len(rows) == 10
          assert {r["run_number"] for r in rows} == {1,376,377,378,379,380,381,382,383,384}
          assert not any(r.get("run_number", 0) >= 385 for r in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned read-only handoff requirements
        run: >-
          python -m pip install -r requirements/exp061-discovery-run.txt scikit-learn==1.9.1

      - name: Freeze deterministic read-only DEC-614 administrator packet
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_admin_lock_handoff.py \
            prepare \
            --dec612-readiness-json "$RUNNER_TEMP/dec612-readiness.json" \
            --main-branch-json "$RUNNER_TEMP/main-branch.json" \
            --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json" \
            --expected-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec614-2023-admin-lock-handoff.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from fmp.discovery.annual_pattern_catalogue_2023_admin_lock_handoff import (
              validate_2023_admin_lock_handoff,
          )
          path = Path(os.environ["RUNNER_TEMP"]) / "dec614-2023-admin-lock-handoff.json"
          value = json.loads(path.read_text())
          validate_2023_admin_lock_handoff(value)
          assert value["decision"] == "DEC-613"
          assert value["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["admin_evidence_gathered_by_this_packet"] is False
          assert value["human_proof_required"] is True
          assert value["dispatch_blocked"] is True
          assert value["dispatch_action_executed"] is False
          assert value["main_exclusive_lock_proven"] is False
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Upload immutable read-only DEC-614 handoff evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec614-admin-handoff-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec614-changed-files.txt
            ${{ runner.temp }}/dec612-run.json
            ${{ runner.temp }}/dec612-artifacts.json
            ${{ runner.temp }}/dec612-readiness.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec614-2023-admin-lock-handoff.json
          if-no-files-found: error
