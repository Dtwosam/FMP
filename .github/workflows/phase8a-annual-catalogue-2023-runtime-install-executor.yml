name: phase8a-annual-catalogue-2023-runtime-install-executor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-runtime-install-executor.yml

permissions:
  contents: write
  actions: read

jobs:
  install-runtime-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC606_RUN_ID: "37693786078"
      DEC606_HEAD_SHA: "14478b3d8e6026a834d4e5d5d34bdf0b0d0dfd30"
      DEC606_ARTIFACT_ID: "11514552382"
      DEC606_ARTIFACT_DIGEST: "sha256:9ef098ec8f9e91ad640ce1e08c94b0942b5a18115a4b0257269845688d06fdde"
      DEC606_ACTION_FINGERPRINT: "585af9488ef0a2f6df018bc86051979fc68d151810a0575cc5091f051f18e763"
      DEC606_ACTION_CANONICAL_SHA256: "927c05ce7d59782a10e148d7345a3a93bedc6587e3acb0632c9dcd531eb262b4"

    steps:
      - name: Checkout exact DEC-607 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first installer push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-607 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization_install_action.py)" = "42477932452d07a445d7c85650a01b3692fa755c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization_install_receipt.py)" = "a8cc32730ab16e9d876725363ddc6d53fa09890a"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_runtime_authorization_install_receipt.py)" = "0442532abc272e2046b3722560ac3e687dba919f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2023_runtime_authorization.py.disabled)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2023_authorization.py.disabled)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py

      - name: Fetch and verify exact DEC-606 install action
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC606_RUN_ID" > "$RUNNER_TEMP/dec606-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC606_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec606-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec606-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC606_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2023-runtime-install-action",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-runtime-install-action.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC606_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec606-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row
              for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC606_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2023-dec606-runtime-install-action-"
              + os.environ["DEC606_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC606_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC606_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec606.zip"
          expected_sha="${DEC606_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec606.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec606"
          unzip -q "$RUNNER_TEMP/dec606.zip" -d "$RUNNER_TEMP/dec606"
          action="$(find "$RUNNER_TEMP/dec606" -type f -name dec606-2023-runtime-install-action.json -print)"
          test "$(printf '%s\n' "$action" | sed '/^$/d' | wc -l)" = "1"
          cp "$action" "$RUNNER_TEMP/dec606-2023-runtime-install-action.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec606-2023-runtime-install-action.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC606_ACTION_CANONICAL_SHA256"
          ]
          assert value["install_action_fingerprint_sha256"] == os.environ[
              "DEC606_ACTION_FINGERPRINT"
          ]
          assert value["decision"] == "DEC-606"
          assert value["expected_head_sha"] == os.environ["DEC606_HEAD_SHA"]
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["action_count"] == 2
          assert value["repository_mutation_authorized"] is True
          assert value["runtime_authorization_installed"] is False
          assert value["runtime_gate_active"] is False
          assert value["annual_workflow_dispatch_authorized"] is False
          PY

      - name: Recheck current main and unconsumed run-383 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-before-install.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs-before-install.json"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads(
              (temp / "main-before-install.json").read_text(encoding="utf-8")
          )
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]

          rows = json.loads(
              (temp / "annual-runs-before-install.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383, 384}
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
              383: (37531960014, "success"),
              384: (37663157285, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 385
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned installer dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean installer checkout
        run: test -z "$(git status --porcelain)"

      - name: Validate concrete DEC-606 action
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fmp.discovery.annual_pattern_catalogue_2023_runtime_authorization_install_action import (
              validate_2023_runtime_authorization_install_action,
          )

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec606-2023-runtime-install-action.json"
              ).read_text(encoding="utf-8")
          )
          validate_2023_runtime_authorization_install_action(value)
          assert value["decision"] == "DEC-606"
          assert value["source_preflight_workflow_run_id"] == 37486048003
          assert value["source_preflight_artifact_id"] == 11423396654
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["action_count"] == 2
          assert value["install_action_fingerprint_sha256"] == (
              "585af9488ef0a2f6df018bc86051979fc68d151810a0575cc5091f051f18e763"
          )
          assert value["repository_mutation_authorized"] is True
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_386_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Apply exact two-file 2023 runtime authorization install
        run: |
          set -euo pipefail
          cp             docs/superpowers/templates/annual_pattern_catalogue_2023_runtime_authorization.py.disabled             src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py
          cp             docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2023_authorization.py.disabled             src/fmp/discovery/annual_pattern_catalogue_runtime.py

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed-files.txt"

          cat > "$RUNNER_TEMP/expected-changed-files.txt" <<'EOF'
          src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py
          src/fmp/discovery/annual_pattern_catalogue_runtime.py
          EOF
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" "$RUNNER_TEMP/changed-files.txt"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"

          git add             src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py             src/fmp/discovery/annual_pattern_catalogue_runtime.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" <(git diff --cached --name-only)

      - name: Prove installed runtime imports and exact run-385 gate
        run: |
          set -euo pipefail
          python -m py_compile             src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py             src/fmp/discovery/annual_pattern_catalogue_runtime.py

          python - <<'PY'
          from fmp.discovery.annual_pattern_catalogue_runtime import (
              require_historical_catalogue_execution_authorized,
          )

          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2023",
              run_number=385,
              run_attempt=1,
              previous_annual_freeze_run_id=37663157285,
          )
          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2022",
              run_number=384,
              run_attempt=1,
              previous_annual_freeze_run_id=37531960014,
          )
          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2021",
              run_number=383,
              run_attempt=1,
              previous_annual_freeze_run_id=37443770076,
          )
          try:
              require_historical_catalogue_execution_authorized(
                  code_commit="a" * 40,
                  annual_segment_label="2023",
                  run_number=386,
                  run_attempt=1,
                  previous_annual_freeze_run_id=37663157285,
              )
          except (PermissionError, ValueError):
              pass
          else:
              raise AssertionError("run 386 must remain unauthorized")
          PY

      - name: Commit and push exact install
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase8a: install 2023 runtime authorization (DEC-607)"
          git rev-parse HEAD > "$RUNNER_TEMP/install-commit-sha.txt"
          git push origin HEAD:main

      - name: Verify installed main and build DEC-607 receipt
        run: |
          set -euo pipefail
          install_sha="$(cat "$RUNNER_TEMP/install-commit-sha.txt")"
          found=0
          for _ in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-after-install.json"
            if test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-after-install.json")" = "$install_sha"; then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

          gate_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)"
          runtime_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)"

          python scripts/phase8a_annual_pattern_catalogue_2023_runtime_authorization_install_receipt.py             review             --action-json "$RUNNER_TEMP/dec606-2023-runtime-install-action.json"             --install-commit-sha "$install_sha"             --changed-files "$RUNNER_TEMP/changed-files.txt"             --installed-gate-blob-sha "$gate_sha"             --installed-runtime-blob-sha "$runtime_sha"             --out "$RUNNER_TEMP/dec607-2023-runtime-install-receipt.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec607-2023-runtime-install-receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-607"
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_catalogue_segment"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["source_action_workflow_run_id"] == 37693786078
          assert value["source_action_artifact_id"] == 11514552382
          assert value["source_action_fingerprint_sha256"] == (
              "585af9488ef0a2f6df018bc86051979fc68d151810a0575cc5091f051f18e763"
          )
          assert value["source_action_canonical_sha256"] == (
              "927c05ce7d59782a10e148d7345a3a93bedc6587e3acb0632c9dcd531eb262b4"
          )
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["install_action_consumed"] is True
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["historical_artifact_read_authorized"] is False
          assert value["historical_catalogue_execution_authorized"] is False
          assert value["historical_result_production_authorized"] is False
          assert value["rerun_authorized"] is False
          assert value["retry_authorized"] is False
          assert value["replacement_run_authorized"] is False
          assert value["run_386_or_later_authorized"] is False
          assert value["next_segment_execution_authorized"] is False
          assert value["protected_history_access_authorized"] is False
          assert value["cross_year_comparison_authorized"] is False
          assert value["cross_year_result_production_authorized"] is False
          assert value["strategy_v1_synthesis_authorized"] is False
          assert value["promotion_authorized"] is False
          assert value["phase8b_authorized"] is False
          assert value["demo_order_authorized"] is False
          assert value["broker_mutation_authorized"] is False
          assert value["live_order_authorized"] is False
          assert value["real_money_authorized"] is False
          assert value["trading_authorized"] is False
          assert value["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2023_DISPATCH_PREFLIGHT"
          )
          PY

      - name: Upload immutable DEC-607 install evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec607-runtime-install-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec606-run.json
            ${{ runner.temp }}/dec606-artifacts.json
            ${{ runner.temp }}/dec606-2023-runtime-install-action.json
            ${{ runner.temp }}/annual-runs-before-install.json
            ${{ runner.temp }}/main-before-install.json
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/install-commit-sha.txt
            ${{ runner.temp }}/main-after-install.json
            ${{ runner.temp }}/dec607-2023-runtime-install-receipt.json
          if-no-files-found: error
