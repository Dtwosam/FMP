name: phase8-provider-closure-fix

on:
  push:
    branches:
      - phase8-activation-helper
    paths:
      - .github/workflows/phase8-provider-closure-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-shadow-implementation
          fetch-depth: 0
      - name: Load helper patch script
        run: |
          git fetch origin phase8-activation-helper
          git show origin/phase8-activation-helper:scripts/phase8_provider_closure_patch.py > /tmp/phase8_provider_closure_patch.py
      - name: Add durable provider closure ledger and review wiring
        run: python /tmp/phase8_provider_closure_patch.py
      - name: Commit and push target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fmp/shadow/campaign.py src/fmp/shadow/cli.py src/fmp/shadow/review_compiler.py
          git commit -m "[phase1-no-source] Persist Phase 8 provider closures"
          git push origin HEAD:phase8-shadow-implementation
