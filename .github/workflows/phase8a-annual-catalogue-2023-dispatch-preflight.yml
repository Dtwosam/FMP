name: phase8a-annual-catalogue-2023-dispatch-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-dispatch-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC607_RUN_ID: "37763604645"
      DEC607_HEAD_SHA: "f0243b9782b6f8a7fe18b02308410352a3f7f1d8"
      DEC607_ARTIFACT_ID: "11542709585"
      DEC607_ARTIFACT_DIGEST: "sha256:e055c0e1d6727451c52c4cc3d3f7530fa6afc65faf87cf0d6e95e013f1b2eef8"
      DEC607_INSTALL_COMMIT_SHA: "3eb688a0e69afba4a04d2b91a61fa7189135eeab"
      DEC607_RECEIPT_FINGERPRINT: "1a13067292e6e52eff69d606e968b15e362ef19e8a14278d80cd594a64f5fc9c"
      DEC607_RECEIPT_CANONICAL_SHA256: "dde50dd5d4a7ad7d0fb92cc69eda83090f08958c391706b283cef9796dbfcaef"

    steps:
      - name: Checkout exact DEC-608 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-608 sources and installed runtime
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_preflight.py)" = "fb4f8fa390e94a75a8d52c99cbc041e9bf1e8164"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_dispatch_preflight.py)" = "1cb36a2ba837c38eae7b9419dfd6ef25e9333490"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization_install_receipt.py)" = "a8cc32730ab16e9d876725363ddc6d53fa09890a"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-607 install evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC607_RUN_ID" > "$RUNNER_TEMP/dec607-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC607_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec607-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec607-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC607_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2023-runtime-install-executor-recovery",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-runtime-install-executor-recovery.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC607_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads(
              (temp / "dec607-artifacts.json").read_text(encoding="utf-8")
          )
          rows = [
              row for row in payload.get("artifacts", [])
              if row.get("id") == int(os.environ["DEC607_ARTIFACT_ID"])
          ]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2023-dec607-runtime-install-"
              + os.environ["DEC607_HEAD_SHA"]
          )
          assert artifact["digest"] == os.environ["DEC607_ARTIFACT_DIGEST"]
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC607_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec607.zip"
          expected_sha="${DEC607_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec607.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec607"
          unzip -q "$RUNNER_TEMP/dec607.zip" -d "$RUNNER_TEMP/dec607"
          receipt="$(find "$RUNNER_TEMP/dec607" -type f -name dec607-2023-runtime-install-receipt.json -print)"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec607-2023-runtime-install-receipt.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec607-2023-runtime-install-receipt.json"
              ).read_text(encoding="utf-8")
          )
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC607_RECEIPT_CANONICAL_SHA256"
          ]
          assert value["install_receipt_fingerprint_sha256"] == os.environ[
              "DEC607_RECEIPT_FINGERPRINT"
          ]
          assert value["decision"] == "DEC-607"
          assert value["install_commit_sha"] == os.environ["DEC607_INSTALL_COMMIT_SHA"]
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["install_action_consumed"] is True
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_catalogue_segment"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["annual_workflow_dispatch_authorized"] is False
          PY

      - name: Recheck installed main and unconsumed run-385 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$DEC607_INSTALL_COMMIT_SHA" "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383, 384}
          exact = {
              1: (37126711695, "fd85a886d07234ad584dcca08692b37e6af54b2e", "failure"),
              376: (37191637168, "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3", "failure"),
              377: (37198002653, "a89db974be9a94481e7ed0990476bc661012f1e4", "success"),
              378: (37206992367, "2524fde355349581c9440a172d0384c3cbce31ed", "success"),
              379: (37227536041, "7b4c1ef8573e280c067443b72f1534d9091d5b7f", "success"),
              380: (37237817538, "30971a996f514670a6f836d8e45cf80137197a4f", "success"),
              381: (37310525635, "8bcee3a7a834743f08bd9ad73109bfc09609a2fe", "success"),
              382: (37443770076, "681e81e021d4970a67b18370142d55b17ec68864", "success"),
              383: (37531960014, "a1e194907c273a2fcdddfb4c24d64a96cfd8d263", "success"),
              384: (37663157285, "dd79687adc4ec179c56f91939cb600e6746fab5d", "success"),
          }
          for number, (run_id, head_sha, conclusion) in exact.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 385
              for row in rows
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-608 dispatch preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_dispatch_preflight.py             plan             --install-receipt-json "$RUNNER_TEMP/dec607-2023-runtime-install-receipt.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json"

      - name: Verify DEC-608 remains read-only and exact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec608-2023-dispatch-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-608"
          assert value["source_installer_workflow_run_id"] == 37763604645
          assert value["source_install_artifact_id"] == 11542709585
          assert value["source_install_artifact_digest"] == (
              "sha256:e055c0e1d6727451c52c4cc3d3f7530fa6afc65faf87cf0d6e95e013f1b2eef8"
          )
          assert value["source_install_commit_sha"] == (
              "3eb688a0e69afba4a04d2b91a61fa7189135eeab"
          )
          assert value["source_install_receipt_fingerprint_sha256"] == (
              "1a13067292e6e52eff69d606e968b15e362ef19e8a14278d80cd594a64f5fc9c"
          )
          assert value["source_install_receipt_canonical_sha256"] == (
              "dde50dd5d4a7ad7d0fb92cc69eda83090f08958c391706b283cef9796dbfcaef"
          )
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["annual_workflow_run_count"] == 10
          assert value["successful_2021_run_id"] == 37531960014
          assert value["successful_2022_run_id"] == 37663157285
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["dispatch_command_present"] is False
          assert value["preflight_read_only"] is True
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_catalogue_segment"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          for field in (
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_386_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-608 dispatch preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec608-dispatch-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec607-run.json
            ${{ runner.temp }}/dec607-artifacts.json
            ${{ runner.temp }}/dec607-2023-runtime-install-receipt.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec608-2023-dispatch-preflight.json
          if-no-files-found: error
