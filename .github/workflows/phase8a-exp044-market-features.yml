name: phase8a-exp044-market-features

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require merged main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Fetch frozen Phase 2 artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .phase2-source-metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10325737935" > .phase2-source-metadata/EURUSD.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10326096831" > .phase2-source-metadata/GBPUSD.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10327600628" > .phase2-source-metadata/USDJPY.json

      - name: Validate source availability and identity
        run: |
          set -euo pipefail
          python scripts/phase8a_market_source_preflight.py \
            --metadata-root .phase2-source-metadata \
            --minimum-valid-hours 12 \
            --out .exp044-source-preflight/source-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".exp044-source-preflight/source-preflight.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["source_ready"] is True
          assert report["historical_source"] == "Dukascopy"
          assert report["new_acquisition_performed"] is False
          assert len(report["artifacts"]) == 3
          assert report["model_fit_authorized"] is False
          assert report["promotion_authorized"] is False
          assert report["shadow_authorized"] is False
          assert report["demo_order_authorized"] is False
          assert report["broker_mutation_authorized"] is False
          assert report["live_order_authorized"] is False
          assert report["real_money_authorized"] is False
          PY

      - name: Upload Phase 2 source preflight
        uses: actions/upload-artifact@v6
        with:
          name: exp044-phase2-source-preflight-${{ github.sha }}
          path: .exp044-source-preflight/source-preflight.json
          if-no-files-found: error

  generate:
    needs: source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset:
          - symbol: EURUSD
            artifact_id: '10325737935'
            zip_sha256: db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3
            manifest_sha256: fd7676282e6e667c39754b09b43a43288a0a877fec588cd2601a601e2b0edf6a
          - symbol: GBPUSD
            artifact_id: '10326096831'
            zip_sha256: fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2
            manifest_sha256: a6ee73e94781f48a43f2792328528d242455d4f7f4f2e0a5760446df21ba4d94
          - symbol: USDJPY
            artifact_id: '10327600628'
            zip_sha256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72
            manifest_sha256: e47ee5339868a741097404bed49411cca36b03609ebe395261bb70b6e63bdd3d

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require merged main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download and verify accepted Phase 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.dataset.artifact_id }}
          EXPECTED_ZIP_SHA256: ${{ matrix.dataset.zip_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ matrix.dataset.manifest_sha256 }}
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          zip_path=".phase2-accepted/${SYMBOL}.zip"
          manifest_path="${root}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json"
          mkdir -p "${root}"
          gh api             -H 'Accept: application/vnd.github+json'             "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             > "${zip_path}"
          actual_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          test "${actual_sha256}" = "${EXPECTED_ZIP_SHA256}"
          unzip -q "${zip_path}" -d "${root}"
          test -f "${manifest_path}"
          actual_manifest_sha256="$(sha256sum "${manifest_path}" | awk '{print $1}')"
          test "${actual_manifest_sha256}" = "${EXPECTED_MANIFEST_SHA256}"

      - name: Generate first full-history feature artifact sets
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          for timeframe in 5m 15m 1h; do
            out=".exp044-a/${SYMBOL}-${timeframe}"
            python scripts/phase8a_market_features.py \
              --dataset-root ".phase2-accepted/${SYMBOL}" \
              --manifest ".phase2-accepted/${SYMBOL}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json" \
              --symbol "${SYMBOL}" \
              --timeframe "${timeframe}" \
              --start 2015-01-01 \
              --end-exclusive 2026-08-21 \
              --out "${out}" \
              --code-commit "${GITHUB_SHA}"
          done

      - name: Generate second full-history feature artifact sets
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          for timeframe in 5m 15m 1h; do
            out=".exp044-b/${SYMBOL}-${timeframe}"
            python scripts/phase8a_market_features.py \
              --dataset-root ".phase2-accepted/${SYMBOL}" \
              --manifest ".phase2-accepted/${SYMBOL}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json" \
              --symbol "${SYMBOL}" \
              --timeframe "${timeframe}" \
              --start 2015-01-01 \
              --end-exclusive 2026-08-21 \
              --out "${out}" \
              --code-commit "${GITHUB_SHA}"
          done

      - name: Verify deterministic regeneration and full accepted coverage
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          symbol = os.environ["SYMBOL"]
          for timeframe in ("5m", "15m", "1h"):
              a = Path(".exp044-a") / f"{symbol}-{timeframe}"
              b = Path(".exp044-b") / f"{symbol}-{timeframe}"
              assert (a / "manifest.json").read_bytes() == (b / "manifest.json").read_bytes()

              manifest = json.loads((a / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["experiment_id"] == "EXP-20260923-044"
              assert manifest["feature_set_version"] == "fmp-market-feature-v1"
              assert manifest["base_feature_definition_version"] == "fmp-feature-v1"
              assert manifest["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN"
              assert manifest["untouched_oos"] is False
              assert manifest["model_training_authorized"] is False
              assert manifest["promotion_authorized"] is False
              assert manifest["symbol"] == symbol
              assert manifest["timeframe"] == timeframe
              assert manifest["code_commit"] == os.environ["GITHUB_SHA"]
              assert len(manifest["opened_source_months"]) == 140
              assert manifest["opened_source_months"][0] == "2015-01"
              assert manifest["opened_source_months"][-1] == "2026-08"
              assert manifest["output_end_utc"] <= "2026-08-21T00:00:00Z"
              for artifact in manifest["artifacts"]:
                  relative = artifact["path"]
                  left = a / relative
                  right = b / relative
                  assert left.is_file() and right.is_file(), relative
                  assert left.read_bytes() == right.read_bytes(), relative
          PY

      - name: Upload EXP-044 5m feature evidence
        uses: actions/upload-artifact@v6
        with:
          name: exp044-market-features-${{ matrix.dataset.symbol }}-5m-${{ github.sha }}
          path: .exp044-a/${{ matrix.dataset.symbol }}-5m
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload EXP-044 15m feature evidence
        uses: actions/upload-artifact@v6
        with:
          name: exp044-market-features-${{ matrix.dataset.symbol }}-15m-${{ github.sha }}
          path: .exp044-a/${{ matrix.dataset.symbol }}-15m
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload EXP-044 1h feature evidence
        uses: actions/upload-artifact@v6
        with:
          name: exp044-market-features-${{ matrix.dataset.symbol }}-1h-${{ github.sha }}
          path: .exp044-a/${{ matrix.dataset.symbol }}-1h
          include-hidden-files: true
          if-no-files-found: error


  verify-evidence:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download all nine generated feature artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: exp044-market-features-*-*-${{ github.sha }}
          path: .exp044-feature-evidence-input
          merge-multiple: false

      - name: Verify exact accepted Dukascopy feature evidence
        run: |
          set -euo pipefail
          python scripts/phase8a_market_feature_evidence.py \
            --root .exp044-feature-evidence-input \
            --code-commit "$GITHUB_SHA" \
            --out .exp044-feature-evidence/feature-evidence.json

      - name: Assert research-only evidence boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path(".exp044-feature-evidence/feature-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          assert evidence["feature_evidence_complete"] is True
          assert evidence["verified_cell_count"] == 9
          assert evidence["historical_source"]["provider"] == "Dukascopy"
          assert evidence["historical_source"]["reuse_existing_accepted_history"] is True
          assert evidence["historical_source"]["new_acquisition_performed"] is False
          assert evidence["model_fit_authorized"] is False
          assert evidence["shadow_authorized"] is False
          assert evidence["demo_order_authorized"] is False
          assert evidence["broker_mutation_authorized"] is False
          assert evidence["live_order_authorized"] is False
          assert evidence["real_money_authorized"] is False
          PY

      - name: Upload aggregate EXP-044 feature evidence index
        uses: actions/upload-artifact@v6
        with:
          name: exp044-market-feature-evidence-${{ github.sha }}
          path: .exp044-feature-evidence/feature-evidence.json
          if-no-files-found: error
