name: phase8a-annual-catalogue-2023-runtime-authorization-plan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-runtime-authorization-plan.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-runtime-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC603_RUN_ID: "37685394468"
      DEC603_HEAD_SHA: "a4235aa2bc8501da8a7273d80a133e712cd04721"
      DEC603_ARTIFACT_ID: "11511180606"
      DEC603_ARTIFACT_DIGEST: "sha256:ee25e982971a0c3ce65f4a6b25a2229e35e7a2f3285b30f2bfcdff87734c311a"
      DEC603_AUTHORIZATION_FINGERPRINT: "dc1f6dc96e4bdbf527ffba49be9df175310389737bd7c70ca945bd260baf3946"
      DEC603_AUTHORIZATION_CANONICAL_SHA256: "aa9b4e8c4bceee20f5d03d8579e1b0407bc21b6597528707f003f5f0bc5aef7d"

    steps:
      - name: Checkout exact DEC-604 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first DEC-604 landing run
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-604 sources and dormant targets
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization_plan.py)" = "fe5c18f8ffa5e3d698f91060ec8c28e0d0692318"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_runtime_authorization_plan.py)" = "9176e4e1e8d55751af3b444bd804ef3f5fc08f3d"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_execution_authorization.py)" = "2c4292abadbffb9dd87edaab67d9e32783facae7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_execution_preflight.py)" = "d7e0823bc0d7513b6d7ee27a02fb5b519bc4818b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f2734c7ea32355b1024d1097812578b23fc4409d"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2023_runtime_authorization.py.disabled)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2023_authorization.py.disabled)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py

      - name: Fetch and verify exact DEC-603 authorization artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC603_RUN_ID"             > "$RUNNER_TEMP/dec603-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC603_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec603-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec603-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC603_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2023-execution-authorization-recovery",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-execution-authorization-recovery.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC603_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec603-artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC603_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2023-dec603-execution-authorization-"
              + os.environ["DEC603_HEAD_SHA"]
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC603_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC603_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec603-authorization.zip"
          expected_sha="${DEC603_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec603-authorization.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec603-authorization"
          unzip -q "$RUNNER_TEMP/dec603-authorization.zip"             -d "$RUNNER_TEMP/dec603-authorization"
          authorization="$(
            find "$RUNNER_TEMP/dec603-authorization"               -type f -name dec603-2023-execution-authorization.json -print
          )"
          test "$(printf '%s\n' "$authorization" | sed '/^$/d' | wc -l)" = "1"
          cp "$authorization" "$RUNNER_TEMP/dec603-2023-execution-authorization.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "dec603-2023-execution-authorization.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == (
              os.environ["DEC603_AUTHORIZATION_CANONICAL_SHA256"]
          )
          assert value["decision"] == "DEC-603"
          assert value["authorization_fingerprint_sha256"] == (
              os.environ["DEC603_AUTHORIZATION_FINGERPRINT"]
          )
          assert value["annual_segment_label"] == "2023"
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["runtime_authorization_installed"] is False
          assert value["runtime_gate_active"] is False
          assert value["dispatch_action_executed"] is False
          assert value["run_386_or_later_authorized"] is False
          assert value["protected_history_access_authorized"] is True
          assert value["cross_year_comparison_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Fetch exact current main and annual history
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 10
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383, 384}
          expected = {
              1: (37126711695, "failure", "fd85a886d07234ad584dcca08692b37e6af54b2e"),
              376: (37191637168, "failure", "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3"),
              377: (37198002653, "success", "a89db974be9a94481e7ed0990476bc661012f1e4"),
              378: (37206992367, "success", "2524fde355349581c9440a172d0384c3cbce31ed"),
              379: (37227536041, "success", "7b4c1ef8573e280c067443b72f1534d9091d5b7f"),
              380: (37237817538, "success", "30971a996f514670a6f836d8e45cf80137197a4f"),
              381: (37310525635, "success", "8bcee3a7a834743f08bd9ad73109bfc09609a2fe"),
              382: (37443770076, "success", "681e81e021d4970a67b18370142d55b17ec68864"),
              383: (37531960014, "success", "a1e194907c273a2fcdddfb4c24d64a96cfd8d263"),
              384: (37663157285, "success", "dd79687adc4ec179c56f91939cb600e6746fab5d"),
          }
          for number, (run_id, conclusion, head_sha) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 385 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned runtime-plan dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean runtime-plan checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-604 runtime authorization plan
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_runtime_authorization_plan.py             plan             --authorization-json "$RUNNER_TEMP/dec603-2023-execution-authorization.json"             --out "$RUNNER_TEMP/dec604-2023-runtime-authorization-plan.json"

      - name: Verify DEC-604 remains dormant and source-only
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec604-2023-runtime-authorization-plan.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-604"
          assert value["source_authorization_workflow_run_id"] == 37685394468
          assert value["source_authorization_artifact_id"] == 11511180606
          assert value["source_authorization_fingerprint_sha256"] == (
              "dc1f6dc96e4bdbf527ffba49be9df175310389737bd7c70ca945bd260baf3946"
          )
          assert value["source_authorization_canonical_sha256"] == (
              "aa9b4e8c4bceee20f5d03d8579e1b0407bc21b6597528707f003f5f0bc5aef7d"
          )
          assert value["annual_segment_label"] == "2023"
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["expected_previous_annual_freeze_run_id"] == 37663157285
          assert value["target_gate_source_blob_sha"] == (
              "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          )
          assert value["target_runtime_source_blob_sha"] == (
              "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          )
          assert value["plan_source_only"] is True
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_catalogue_segment"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["protocol_full_collection_catalogue_use_authorized"] is True
          assert value["protocol_2023_2026_catalogue_use_authorized"] is True
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "repository_mutation_authorized",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_386_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-604 runtime plan
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec604-runtime-authorization-plan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec603-run.json
            ${{ runner.temp }}/dec603-artifacts.json
            ${{ runner.temp }}/dec603-2023-execution-authorization.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec604-2023-runtime-authorization-plan.json
          if-no-files-found: error
