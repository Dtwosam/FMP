name: phase8a-annual-catalogue-2017-execution-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2017-execution-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC522_RUN_ID: "37208993431"
      DEC522_ARTIFACT_ID: "11305284883"
      DEC522_ARTIFACT_DIGEST: "sha256:6282a6765f659a5a5801e2b1c8804d0dd23b96c4f235a770cd8e0e6053caab8c"

    steps:
      - name: Checkout exact DEC-534 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact second read-only preflight push after bootstrap failure
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37209674158" \
            > "$RUNNER_TEMP/failed-dec534-run1.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "failed-dec534-run1.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": 37209674158,
              "name": "phase8a-annual-catalogue-2017-execution-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2017-execution-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "0d6640f4833f2ddf377e4004cce9df7ea845f7da",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "failure",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2017_execution_preflight.py)" = "7e6e6a54d4111a44a68218e551c379fa342d3e27"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2017_execution_preflight.py)" = "0d22cd83b38c9a976ac98534d9fa9e4b626808b7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_run377_evidence_review.py)" = "ad182ce30d32aff985558f3b2fd9370ca1141cc2"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Fetch and verify exact concrete DEC-522 binding
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC522_RUN_ID"             > "$RUNNER_TEMP/dec522-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC522_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec522-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec522-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC522_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2016-run378-runtime-evidence",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec522-artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC522_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2016-dec522-runtime-binding-37206992367"
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC522_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC522_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec522-binding.zip"
          expected_sha="${DEC522_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec522-binding.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec522-binding"
          unzip -q "$RUNNER_TEMP/dec522-binding.zip" -d "$RUNNER_TEMP/dec522-binding"
          binding="$(
            find "$RUNNER_TEMP/dec522-binding"               -type f -name runtime-binding-2016.json -print
          )"
          test "$(printf '%s\n' "$binding" | sed '/^$/d' | wc -l)" = "1"
          cp "$binding" "$RUNNER_TEMP/runtime-binding-2016.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/runtime-binding-2016.json")" = "DEC-522"
          test "$(jq -r '.run_id' "$RUNNER_TEMP/runtime-binding-2016.json")" = "37206992367"
          test "$(jq -r '.run_number' "$RUNNER_TEMP/runtime-binding-2016.json")" = "378"
          test "$(jq -r '.binding_fingerprint_sha256' "$RUNNER_TEMP/runtime-binding-2016.json")" = "c95d28505fab6a8c55c9889ba5da6565be3b63cb98321eea58d26196b60a2b40"
          test "$(jq -r '.freeze_evidence_fingerprint' "$RUNNER_TEMP/runtime-binding-2016.json")" = "01e15f5081523136af12af7ccc443b79c44d102732a31cb9075a29ea67e80b99"

      - name: Fetch exact current main and annual dispatch inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 4
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378}
          expected = {
              1: (
                  37126711695,
                  "failure",
                  "fd85a886d07234ad584dcca08692b37e6af54b2e",
              ),
              376: (
                  37191637168,
                  "failure",
                  "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3",
              ),
              377: (
                  37198002653,
                  "success",
                  "a89db974be9a94481e7ed0990476bc661012f1e4",
              ),
              378: (
                  37206992367,
                  "success",
                  "2524fde355349581c9440a172d0384c3cbce31ed",
              ),
          }
          for number, (run_id, conclusion, head_sha) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-534 2017 execution preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2017_execution_preflight.py             plan             --runtime-binding-json "$RUNNER_TEMP/runtime-binding-2016.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec534-2017-execution-preflight.json"

      - name: Verify DEC-534 remains read-only and run-379 locked
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec534-2017-execution-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-534"
          assert value["annual_segment_label"] == "2017"
          assert value["prior_segment_label"] == "2016"
          assert value["previous_annual_freeze_run_id"] == 37206992367
          assert value["annual_workflow_run_count"] == 4
          assert value["successful_2015_run_number"] == 377
          assert value["successful_2016_run_number"] == 378
          assert value["expected_next_run_number"] == 379
          assert value["expected_next_run_attempt"] == 1
          assert value["preflight_read_only"] is True
          for field in (
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-534 preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2017-dec534-execution-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/failed-dec534-run1.json
            ${{ runner.temp }}/dec522-run.json
            ${{ runner.temp }}/dec522-artifacts.json
            ${{ runner.temp }}/runtime-binding-2016.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec534-2017-execution-preflight.json
          if-no-files-found: error
