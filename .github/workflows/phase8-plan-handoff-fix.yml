name: phase8-plan-handoff-fix

on:
  push:
    branches:
      - phase8-activation-helper
    paths:
      - .github/workflows/phase8-plan-handoff-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-shadow-implementation
          fetch-depth: 0

      - name: Patch replay handoff command exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-09-15-phase8-live-shadow.md')
          text = path.read_text(encoding='utf-8')
          old = 'python scripts/phase8_shadow.py replay --campaign-dir evidence/phase8/campaign'
          new = 'python scripts/phase8_shadow.py replay --segment-dir evidence/phase8/campaign/<segment>'
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count != 1:
              raise SystemExit(f'expected one stale replay command, found {old_count}')
          text = text.replace(old, new, 1)
          if text.count(old) != 0 or text.count(new) != new_count + 1:
              raise SystemExit('replay command replacement did not converge exactly')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/superpowers/plans/2026-09-15-phase8-live-shadow.md

      - name: Commit and push target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-15-phase8-live-shadow.md
          git commit -m "[phase1-no-source] Fix Phase 8 segment replay handoff"
          git push origin HEAD:phase8-shadow-implementation
