name: phase8a-annual-catalogue-2019-execution-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2019-execution-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC555_RUN_ID: "37240186365"
      DEC555_HEAD_SHA: "b0de575d0ba564de523ba8e23ed05f052ae756a3"
      DEC555_ARTIFACT_ID: "11317140969"
      DEC555_ARTIFACT_DIGEST: "sha256:2d158ae5dc2040570c1738c6700b96d34d05820abe3cd71f91b3389c469094b5"
      DEC555_BINDING_FINGERPRINT: "09950f6bfb577c4abe17a2466e466a08585fbcd05359ad5fa6c4bad16cce5fda"
      DEC555_FREEZE_FINGERPRINT: "355a1e5ca9282300a7a38e24dd3009ebe8470d1f029e62c38860bf710ac80559"

    steps:
      - name: Checkout exact DEC-556 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_execution_preflight.py)" = "a813a8db59927eaf9108e010a5db84f6c6dafa27"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2019_execution_preflight.py)" = "277cf9d2c8df3a341c747546496ff712535d07af"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_run380_evidence_review.py)" = "c44123cb04a8f476cf3efdb635bd1efb1d072df1"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Fetch and verify exact recovered DEC-555 binding
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC555_RUN_ID" > "$RUNNER_TEMP/dec555-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC555_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec555-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec555-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC555_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2018-run380-runtime-evidence-recovery",
              "path": ".github/workflows/phase8a-annual-catalogue-2018-run380-runtime-evidence-recovery.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC555_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec555-artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC555_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2018-dec555-runtime-binding-recovery-37237817538"
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC555_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC555_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec555-binding.zip"
          expected_sha="${DEC555_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec555-binding.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec555-binding"
          unzip -q "$RUNNER_TEMP/dec555-binding.zip" -d "$RUNNER_TEMP/dec555-binding"
          binding="$(
            find "$RUNNER_TEMP/dec555-binding"               -type f -name runtime-binding-2018.json -print
          )"
          test "$(printf '%s\n' "$binding" | sed '/^$/d' | wc -l)" = "1"
          cp "$binding" "$RUNNER_TEMP/runtime-binding-2018.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/runtime-binding-2018.json")" = "DEC-555"
          test "$(jq -r '.run_id' "$RUNNER_TEMP/runtime-binding-2018.json")" = "37237817538"
          test "$(jq -r '.run_number' "$RUNNER_TEMP/runtime-binding-2018.json")" = "380"
          test "$(jq -r '.binding_fingerprint_sha256' "$RUNNER_TEMP/runtime-binding-2018.json")" = "$DEC555_BINDING_FINGERPRINT"
          test "$(jq -r '.freeze_evidence_fingerprint' "$RUNNER_TEMP/runtime-binding-2018.json")" = "$DEC555_FREEZE_FINGERPRINT"
          test "$(jq -r '.runtime_evidence_bound' "$RUNNER_TEMP/runtime-binding-2018.json")" = "true"
          test "$(jq -r '.trading_authorized' "$RUNNER_TEMP/runtime-binding-2018.json")" = "false"

      - name: Fetch exact current main and annual dispatch inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 6
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380}
          expected = {
              1: (
                  37126711695,
                  "failure",
                  "fd85a886d07234ad584dcca08692b37e6af54b2e",
              ),
              376: (
                  37191637168,
                  "failure",
                  "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3",
              ),
              377: (
                  37198002653,
                  "success",
                  "a89db974be9a94481e7ed0990476bc661012f1e4",
              ),
              378: (
                  37206992367,
                  "success",
                  "2524fde355349581c9440a172d0384c3cbce31ed",
              ),
              379: (
                  37227536041,
                  "success",
                  "7b4c1ef8573e280c067443b72f1534d9091d5b7f",
              ),
              380: (
                  37237817538,
                  "success",
                  "30971a996f514670a6f836d8e45cf80137197a4f",
              ),
          }
          for number, (run_id, conclusion, head_sha) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 381 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-556 2019 execution preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2019_execution_preflight.py             plan             --runtime-binding-json "$RUNNER_TEMP/runtime-binding-2018.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec556-2019-execution-preflight.json"

      - name: Verify DEC-556 remains read-only and run-381 locked
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec556-2019-execution-preflight.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-556"
          assert value["annual_segment_label"] == "2019"
          assert value["prior_segment_label"] == "2018"
          assert value["previous_annual_freeze_run_id"] == 37237817538
          assert value["annual_workflow_run_count"] == 6
          assert value["successful_2015_run_number"] == 377
          assert value["successful_2016_run_number"] == 378
          assert value["successful_2017_run_number"] == 379
          assert value["successful_2018_run_number"] == 380
          assert value["expected_next_run_number"] == 381
          assert value["expected_next_run_attempt"] == 1
          assert value["source_runtime_binding_artifact_id"] == 11317140969
          assert value["preflight_read_only"] is True
          for field in (
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-556 preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2019-dec556-execution-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec555-run.json
            ${{ runner.temp }}/dec555-artifacts.json
            ${{ runner.temp }}/runtime-binding-2018.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec556-2019-execution-preflight.json
          if-no-files-found: error
