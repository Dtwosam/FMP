name: phase8a-annual-catalogue-2022-execution-authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2022-execution-authorization.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC591_RUN_ID: "37603215074"
      DEC591_HEAD_SHA: "ed7589b1e63591c6508271ff75dcfc7a63893421"
      DEC591_ARTIFACT_ID: "11474170578"
      DEC591_ARTIFACT_DIGEST: "sha256:cc129455cda4fe6ec8835f436abc3ef39f009d073a4dc2efac859313f753cd50"
      DEC591_PREFLIGHT_FINGERPRINT: "4dcd96a91c673559f0aecbb0e8cf61c437fb49e0f1831ebb9fc40d4428a1bdda"
      DEC591_PREFLIGHT_CANONICAL_SHA256: "c8a481c2040ad6d61e74c1624c6b040b968854da25304e0c4ee6877451480b60"

    steps:
      - name: Checkout exact DEC-592 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first authorization push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_execution_authorization.py)" = "e68e9f1ee41ca89f0ae3d7758d59b4ce8c5823bb"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2022_execution_preflight.py)" = "a52661d8abd910856bc5260898a7f21cc4958f94"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "d0db13ae9ae8dfbedf9c17ebe09d53f2ec4ff7e6"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py

      - name: Fetch and verify exact DEC-591 preflight artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC591_RUN_ID"             > "$RUNNER_TEMP/dec591-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC591_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec591-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec591-run.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["DEC591_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2022-execution-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2022-execution-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC591_HEAD_SHA"],
              "run_number": 2,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          artifacts = json.loads(
              (temp / "dec591-artifacts.json").read_text(encoding="utf-8")
          )["artifacts"]
          matches = [
              row
              for row in artifacts
              if row.get("id") == int(os.environ["DEC591_ARTIFACT_ID"])
              and row.get("name")
              == "annual-catalogue-2022-dec591-execution-preflight-"
              + os.environ["DEC591_HEAD_SHA"]
              and row.get("expired") is False
              and row.get("digest") == os.environ["DEC591_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC591_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec591-preflight.zip"
          expected_sha="${DEC591_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec591-preflight.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec591-preflight"
          unzip -q "$RUNNER_TEMP/dec591-preflight.zip"             -d "$RUNNER_TEMP/dec591-preflight"
          preflight="$(
            find "$RUNNER_TEMP/dec591-preflight"               -type f -name dec591-2022-execution-preflight.json -print
          )"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec591-2022-execution-preflight.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "dec591-2022-execution-preflight.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == (
              os.environ["DEC591_PREFLIGHT_CANONICAL_SHA256"]
          )
          assert value["decision"] == "DEC-591"
          assert value["expected_head_sha"] == os.environ["DEC591_HEAD_SHA"]
          assert value["preflight_fingerprint_sha256"] == (
              os.environ["DEC591_PREFLIGHT_FINGERPRINT"]
          )
          assert value["annual_segment_label"] == "2022"
          assert value["prior_segment_label"] == "2021"
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["expected_next_run_number"] == 384
          assert value["expected_next_run_attempt"] == 1
          assert value["source_terminal_successor_claim_superseded_by_dec469"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["preflight_read_only"] is True
          PY

      - name: Fetch exact current main and annual history
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          assert len(rows) == 9
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383}
          expected = {
              1: (37126711695, "failure", "fd85a886d07234ad584dcca08692b37e6af54b2e"),
              376: (37191637168, "failure", "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3"),
              377: (37198002653, "success", "a89db974be9a94481e7ed0990476bc661012f1e4"),
              378: (37206992367, "success", "2524fde355349581c9440a172d0384c3cbce31ed"),
              379: (37227536041, "success", "7b4c1ef8573e280c067443b72f1534d9091d5b7f"),
              380: (37237817538, "success", "30971a996f514670a6f836d8e45cf80137197a4f"),
              381: (37310525635, "success", "8bcee3a7a834743f08bd9ad73109bfc09609a2fe"),
              382: (37443770076, "success", "681e81e021d4970a67b18370142d55b17ec68864"),
              383: (37531960014, "success", "a1e194907c273a2fcdddfb4c24d64a96cfd8d263"),
          }
          for number, (run_id, conclusion, head_sha) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 384 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned authorization dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean authorization checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-592 authorization
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from fmp.discovery.annual_pattern_catalogue_2022_execution_authorization import (
              build_2022_execution_authorization,
              validate_2022_execution_authorization,
          )

          temp = Path(os.environ["RUNNER_TEMP"])
          preflight = json.loads(
              (temp / "dec591-2022-execution-preflight.json").read_text(
                  encoding="utf-8"
              )
          )
          value = build_2022_execution_authorization(
              preflight,
              repository_root=Path("."),
          )
          validate_2022_execution_authorization(value)
          (
              temp / "dec592-2022-execution-authorization.json"
          ).write_text(
              json.dumps(value, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify DEC-592 is source-only and run-384 exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec592-2022-execution-authorization.json"
              ).read_text(encoding="utf-8")
          )
          assert value["decision"] == "DEC-592"
          assert value["source_preflight_workflow_run_id"] == 37603215074
          assert value["source_preflight_artifact_id"] == 11474170578
          assert value["source_preflight_artifact_digest"] == (
              "sha256:cc129455cda4fe6ec8835f436abc3ef39f009d073a4dc2efac859313f753cd50"
          )
          assert value["source_preflight_fingerprint_sha256"] == (
              "4dcd96a91c673559f0aecbb0e8cf61c437fb49e0f1831ebb9fc40d4428a1bdda"
          )
          assert value["source_preflight_canonical_sha256"] == (
              "c8a481c2040ad6d61e74c1624c6b040b968854da25304e0c4ee6877451480b60"
          )
          assert value["annual_segment_label"] == "2022"
          assert value["prior_segment_label"] == "2021"
          assert value["previous_annual_freeze_run_id"] == 37531960014
          assert value["expected_run_number"] == 384
          assert value["expected_run_attempt"] == 1
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["historical_artifact_read_authorized"] is True
          assert value["historical_catalogue_execution_authorized"] is True
          assert value["historical_result_production_authorized"] is True
          assert value["authorization_contract_validated"] is True
          assert value["source_only_authorization"] is True
          assert value["source_terminal_successor_claim_superseded_by_dec469"] is True
          assert value["governing_method_decision"] == "DEC-469"
          for field in (
              "runtime_authorization_installed",
              "runtime_gate_active",
              "dispatch_command_present",
              "dispatch_action_executed",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_385_or_later_authorized",
              "next_segment_execution_authorized",
              "protected_history_access_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          assert value["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2022_RUNTIME_AUTHORIZATION_PLAN"
          )
          PY

      - name: Upload immutable DEC-592 authorization
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2022-dec592-execution-authorization-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec591-run.json
            ${{ runner.temp }}/dec591-artifacts.json
            ${{ runner.temp }}/dec591-2022-execution-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec592-2022-execution-authorization.json
          if-no-files-found: error
