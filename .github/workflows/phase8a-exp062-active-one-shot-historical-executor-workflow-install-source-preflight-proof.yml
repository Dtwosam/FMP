name: phase8a-exp062-active-one-shot-historical-executor-workflow-install-source-preflight-proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-exp062-active-one-shot-historical-executor-workflow-install-source-preflight-proof.yml
      - .github/workflows/phase8a-exp062-discovery.yml
      - docs/superpowers/templates/phase8a-exp062-one-shot-historical-executor.yml.disabled
      - src/fmp/discovery/exp062_historical_active_one_shot_executor_workflow_install_source_contract.py
      - src/fmp/discovery/exp062_historical_active_one_shot_executor_workflow_install_source_preflight.py
      - scripts/phase8a_exp062_active_one_shot_historical_executor_workflow_install_source_preflight.py
      - requirements/exp061-discovery-run.txt

permissions:
  contents: read
  actions: read

jobs:
  read-only-active-one-shot-historical-executor-workflow-install-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact DEC-407 recovery proof push
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_RUN_NUMBER" = "2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Pin failed DEC-404 proof provenance
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-active-one-shot-historical-executor-workflow-install-source-preflight-proof.yml/runs?branch=main&event=push&per_page=20" > "$RUNNER_TEMP/proof-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/36613664506/jobs?per_page=100" > "$RUNNER_TEMP/failed-proof-jobs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          runs = json.loads((temp / "proof-runs.json").read_text(encoding="utf-8"))
          prior = [
              run
              for run in runs["workflow_runs"]
              if run.get("run_number") == 1
          ]
          assert len(prior) == 1
          run = prior[0]
          assert run["id"] == 36613664506
          assert run["run_attempt"] == 1
          assert run["head_sha"] == "0db04ae49b3533778b08afa31e9ef9a26576b80c"
          assert run["status"] == "completed"
          assert run["conclusion"] == "failure"
          assert run["path"] == (
              ".github/workflows/"
              "phase8a-exp062-active-one-shot-historical-executor-"
              "workflow-install-source-preflight-proof.yml"
          )

          jobs = json.loads(
              (temp / "failed-proof-jobs.json").read_text(encoding="utf-8")
          )["jobs"]
          assert len(jobs) == 1
          job = jobs[0]
          assert job["id"] == 109561121322
          assert job["name"] == (
              "read-only-active-one-shot-historical-executor-"
              "workflow-install-source-preflight"
          )
          assert job["conclusion"] == "failure"
          steps = {
              step["name"]: step["conclusion"]
              for step in job["steps"]
          }
          assert steps[
              "Run exact DEC-403 read-only install-source preflight"
          ] == "success"
          assert steps[
              "Verify install-source-ready active path absent preflight and all locks"
          ] == "failure"
          assert steps[
              "Upload immutable DEC-404 install-source-preflight proof"
          ] == "skipped"
          PY

      - name: Require frozen DEC-402/403 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/exp062_historical_active_one_shot_executor_workflow_install_source_contract.py)" = "a09eca21a8b5e7b88182040ada5d9298eb922282"
          test "$(git hash-object src/fmp/discovery/exp062_historical_active_one_shot_executor_workflow_install_source_preflight.py)" = "cb8ca1ca5b65e9703844d3df9b0a622e2e3ed1bc"
          test "$(git hash-object scripts/phase8a_exp062_active_one_shot_historical_executor_workflow_install_source_preflight.py)" = "1c9615b7ee55ff1387cd95464abf2202f8dd9d3f"
          test "$(git hash-object docs/superpowers/templates/phase8a-exp062-one-shot-historical-executor.yml.disabled)" = "51ce87584369be957482460d81649adb1cb9f05d"
          test "$(git hash-object .github/workflows/phase8a-exp062-discovery.yml)" = "1a7d42fd8d03d6ca3eae722209b1ad2a5dd2bc50"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Require active executor workflow path still absent
        run: |
          set -euo pipefail
          test ! -e .github/workflows/phase8a-exp062-one-shot-historical-executor.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned planning runtime without editable checkout
        run: python -m pip install -r requirements/exp061-discovery-run.txt

      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Fetch current main and exact EXP-062 run inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-discovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"

      - name: Run exact DEC-403 read-only install-source preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_exp062_active_one_shot_historical_executor_workflow_install_source_preflight.py plan \
            --main-json "$RUNNER_TEMP/main.json" \
            --runs-json "$RUNNER_TEMP/runs.json" \
            --expected-head "$GITHUB_SHA" \
            > "$RUNNER_TEMP/active-one-shot-historical-executor-workflow-install-source-preflight.json"

      - name: Verify recovered install-source preflight and all locks
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "active-one-shot-historical-executor-workflow-install-source-preflight.json"
              ).read_text(encoding="utf-8")
          )

          assert plan["decision"] == "DEC-403"
          assert plan["version"] == (
              "fmp-exp062-active-one-shot-historical-executor-"
              "workflow-install-source-preflight-v1"
          )
          assert plan["install_source_contract_decision"] == "DEC-402"
          assert plan["install_source_contract_version"] == (
              "fmp-exp062-active-one-shot-historical-executor-"
              "workflow-install-source-contract-v1"
          )
          assert plan["dec402_install_source_contract"] == (
              "a09eca21a8b5e7b88182040ada5d9298eb922282"
          )
          assert plan["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert plan["stage"] == (
              "EXP062_ACTIVE_ONE_SHOT_HISTORICAL_EXECUTOR_WORKFLOW_INSTALL_"
              "SOURCE_PREFLIGHT_ACTIVE_WORKFLOW_ABSENT_SLOT_AVAILABLE"
          )
          assert plan["executor_workflow_path_exists"] is False
          assert plan["proof_run_id"] == 36358289723
          assert plan["proof_run_count"] == 1
          assert plan["historical_result_attempt_count"] == 0
          assert plan["historical_result_run_id"] is None
          assert plan["historical_result_slot_consumed"] is False
          assert plan["historical_result_slot_verified_available"] is True
          assert plan["expected_target_run_number"] == 2
          assert plan["expected_target_run_attempt"] == 1

          for field in (
              "active_one_shot_historical_executor_workflow_install_authorization_source_authorized",
              "active_one_shot_historical_executor_workflow_install_decision_source_authorized",
              "active_one_shot_historical_executor_workflow_install_execution_authorization_source_authorized",
              "active_one_shot_historical_executor_workflow_install_execution_contract_source_authorized",
              "active_one_shot_historical_executor_workflow_install_activation_source_authorized",
              "active_one_shot_historical_executor_workflow_install_source_authorized",
          ):
              assert plan[field] is True, field

          for field in (
              "historical_executor_workflow_install_authorized",
              "historical_executor_workflow_installed",
              "historical_executor_available",
              "historical_result_dispatch_authorized",
              "historical_execute_mode_available",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "reserved_robustness_access_authorized",
              "candidate_compilation_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert plan[field] is False, field
          PY

      - name: Upload immutable DEC-407 recovery proof
        uses: actions/upload-artifact@v6
        with:
          name: exp062-dec407-active-one-shot-historical-executor-workflow-install-source-preflight-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/active-one-shot-historical-executor-workflow-install-source-preflight.json
          if-no-files-found: error
