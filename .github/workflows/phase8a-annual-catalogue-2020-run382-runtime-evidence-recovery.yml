name: phase8a-annual-catalogue-2020-run382-runtime-evidence-recovery

on:
  workflow_run:
    workflows:
      - phase8a-annual-pattern-catalogue
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_run_id:
        required: true
        type: string
      target_head_sha:
        required: true
        type: string
      target_run_number:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review-bind-recovered-run382:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.run_number == 382 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_id || github.event.workflow_run.id }}
      TARGET_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_head_sha || github.event.workflow_run.head_sha }}
      TARGET_RUN_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_number || github.event.workflow_run.run_number }}

    steps:
      - name: Checkout exact recovered run-382 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Require exact successful 2020 run 382
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$TARGET_RUN_NUMBER" = "382"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"             > "$RUNNER_TEMP/run382.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "run382.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 382,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

      - name: Require frozen DEC-579 recovery sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_run382_recovery_evidence_review.py)" = "7c721121197b83e687fd2c76773773f8ab4c07ae"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2020_run382_recovery_evidence_review.py)" = "260d38c31182eafaeb64741f447df297b2640ef4"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2020-run382-dispatch-recovery.yml)" = "2185ee4597a0255ec607db3ac7ed3acb9cee0aba"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_run382_dispatch_recovery_authorization.py)" = "cd170c2386034930f53645498f7d24ec13442b71"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_dispatch_action_preflight.py)" = "26b2148f0d1f49eb8b817f2b2504a11dcb99199a"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py)" = "695a50b418da752e1bd37d6302f209033ab611f5"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Resolve exact successful DEC-578 recovery dispatcher
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2020-run382-dispatch-recovery.yml/runs?event=push&branch=main&per_page=100"
          found=0
          for _ in $(seq 1 30); do
            gh api "$endpoint" > "$RUNNER_TEMP/dec578-runs.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec578-runs.json").read_text(
                  encoding="utf-8"
              )
          ).get("workflow_runs")
          assert isinstance(rows, list)
          matches = [
              row
              for row in rows
              if row.get("name")
              == "phase8a-annual-catalogue-2020-run382-dispatch-recovery"
              and row.get("path")
              == ".github/workflows/phase8a-annual-catalogue-2020-run382-dispatch-recovery.yml"
              and row.get("event") == "push"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["TARGET_HEAD_SHA"]
              and row.get("run_number") == 1
              and row.get("run_attempt") == 1
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
          ]
          assert len(matches) <= 1
          if len(matches) == 1:
              (
                  Path(os.environ["RUNNER_TEMP"]) / "dec578-run-id.txt"
              ).write_text(str(matches[0]["id"]) + "\n", encoding="utf-8")
          raise SystemExit(0 if len(matches) == 1 else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Download exact DEC-578 recovery dispatch receipt
        run: |
          set -euo pipefail
          source_run_id="$(cat "$RUNNER_TEMP/dec578-run-id.txt")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" > "$RUNNER_TEMP/dec578-artifacts.json"

          artifact_id="$(
            jq -r --arg prefix "annual-catalogue-2020-dec578-run382-recovery-dispatch-" '
              .artifacts[]
              | select(.name | startswith($prefix))
              | select(.expired == false)
              | .id
            ' "$RUNNER_TEMP/dec578-artifacts.json"
          )"
          artifact_digest="$(
            jq -r --arg prefix "annual-catalogue-2020-dec578-run382-recovery-dispatch-" '
              .artifacts[]
              | select(.name | startswith($prefix))
              | select(.expired == false)
              | .digest
            ' "$RUNNER_TEMP/dec578-artifacts.json"
          )"
          test "$(printf '%s\n' "$artifact_id" | sed '/^$/d' | wc -l)" = "1"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac

          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/dec578.zip"
          expected_sha="${artifact_digest#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec578.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec578"
          unzip -q "$RUNNER_TEMP/dec578.zip" -d "$RUNNER_TEMP/dec578"
          receipt="$(find "$RUNNER_TEMP/dec578" -type f -name 'dec578-run382-recovery-dispatch-receipt.json' -print)"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec578-run382-recovery-dispatch-receipt.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec578-run382-recovery-dispatch-receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert receipt["decision"] == "DEC-578"
          assert receipt["source_preflight_decision"] == "DEC-575"
          assert receipt["source_preflight_workflow_run_id"] == 37388217346
          assert receipt["source_preflight_artifact_id"] == 11380193702
          assert receipt["source_preflight_fingerprint_sha256"] == (
              "f0aad3d285539bbe2f0124db0a0869cc9a6813892c5be75252c46ade933a0a92"
          )
          assert receipt["failed_dispatcher_decision"] == "DEC-576"
          assert receipt["failed_dispatcher_run_id"] == 37390547252
          assert receipt["failed_dispatcher_job_id"] == 112034309419
          assert receipt["failed_dispatcher_head_sha"] == (
              "3baf4b86a53b4d53d2fc5788b9776006eeacfeee"
          )
          assert receipt["failed_dispatcher_dispatched_annual_run"] is False
          assert receipt["recovery_run_number"] == 1
          assert receipt["recovery_run_attempt"] == 1
          assert receipt["recovery_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["annual_segment_label"] == "2020"
          assert receipt["previous_annual_freeze_run_id"] == 37310525635
          assert receipt["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert receipt["run_number"] == 382
          assert receipt["run_attempt"] == 1
          assert receipt["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["dispatch_submitted"] is True
          assert receipt["result_claimed"] is False
          assert receipt["run_383_or_later_authorized"] is False
          assert receipt["trading_authorized"] is False
          fingerprint = receipt["recovery_authorization_fingerprint_sha256"]
          assert isinstance(fingerprint, str) and len(fingerprint) == 64
          int(fingerprint, 16)
          PY

      - name: Fetch jobs and artifacts
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/run382-jobs.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/run382-artifacts.json"

      - name: Download and verify 2020 annual freeze
        run: |
          set -euo pipefail
          expected_name="phase8a-annual-catalogue-freeze-2020-$TARGET_HEAD_SHA"
          artifact_id="$(
            jq -r --arg name "$expected_name"               '.artifacts[]
               | select(.name == $name and .expired == false)
               | .id'               "$RUNNER_TEMP/run382-artifacts.json"
          )"
          expected_digest="$(
            jq -r --arg name "$expected_name"               '.artifacts[]
               | select(.name == $name and .expired == false)
               | .digest'               "$RUNNER_TEMP/run382-artifacts.json"
          )"
          test "$(printf '%s\n' "$artifact_id" | sed '/^$/d' | wc -l)" = "1"
          case "$expected_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${expected_digest#sha256:}"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/run382-freeze.zip"
          actual_sha="$(sha256sum "$RUNNER_TEMP/run382-freeze.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha"             > "$RUNNER_TEMP/run382-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run382-freeze"
          unzip -q "$RUNNER_TEMP/run382-freeze.zip"             -d "$RUNNER_TEMP/run382-freeze"
          freeze="$(
            find "$RUNNER_TEMP/run382-freeze"               -type f -name annual-freeze.json -print
          )"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2020.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean review checkout
        run: test -z "$(git status --porcelain)"

      - name: Review and bind recovered run 382
        run: |
          set -euo pipefail
          freeze_sha="$(cat "$RUNNER_TEMP/run382-freeze-zip-sha256.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2020_run382_recovery_evidence_review.py             review             --run-json "$RUNNER_TEMP/run382.json"             --jobs-json "$RUNNER_TEMP/run382-jobs.json"             --artifacts-json "$RUNNER_TEMP/run382-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2020.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dec578-run382-recovery-dispatch-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2020-recovery.json"

      - name: Verify DEC-579 recovery binding remains non-authorizing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"]) / "runtime-binding-2020-recovery.json"
              ).read_text(encoding="utf-8")
          )
          assert binding["decision"] == "DEC-579"
          assert binding["annual_segment_label"] == "2020"
          assert binding["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert binding["run_number"] == 382
          assert binding["run_attempt"] == 1
          assert binding["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert binding["previous_annual_freeze_run_id"] == 37310525635
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["source_dispatch_receipt_decision"] == "DEC-578"
          assert binding["dispatch_receipt_bound"] is True
          assert binding["recovery_dispatch_receipt_bound"] is True
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          assert binding["next_segment_execution_authorized"] is False
          assert binding["strategy_v1_synthesis_authorized"] is False
          assert binding["promotion_authorized"] is False
          assert binding["broker_mutation_authorized"] is False
          assert binding["live_order_authorized"] is False
          assert binding["real_money_authorized"] is False
          assert binding["trading_authorized"] is False
          assert binding["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2021_EXECUTION_PREFLIGHT"
          )
          PY

      - name: Upload immutable DEC-579 recovered runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2020-dec579-runtime-binding-recovery-${{ env.TARGET_RUN_ID }}
          path: |
            ${{ runner.temp }}/run382.json
            ${{ runner.temp }}/run382-jobs.json
            ${{ runner.temp }}/run382-artifacts.json
            ${{ runner.temp }}/dec578-runs.json
            ${{ runner.temp }}/dec578-artifacts.json
            ${{ runner.temp }}/dec578-run382-recovery-dispatch-receipt.json
            ${{ runner.temp }}/run382-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2020.json
            ${{ runner.temp }}/runtime-binding-2020-recovery.json
          if-no-files-found: error
