name: phase8a-annual-catalogue-2020-runtime-install-executor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2020-runtime-install-executor.yml

permissions:
  contents: write
  actions: read

jobs:
  install-runtime-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC571_RUN_ID: "37327905209"
      DEC571_HEAD_SHA: "4ed1da1cdc5a8df1272fb1f06a803a57a8043427"
      DEC571_ARTIFACT_ID: "11352259131"
      DEC571_ARTIFACT_DIGEST: "sha256:082c09ed64042f2c63252676be1d63aab6553c3cd92e3995256498ac4744b423"

    steps:
      - name: Checkout exact DEC-572 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact second installer push after stale provenance failure
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37360538726" > "$RUNNER_TEMP/failed-dec572-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "failed-dec572-run.json").read_text()
          )
          exact = {
              "id": 37360538726,
              "name": "phase8a-annual-catalogue-2020-runtime-install-executor",
              "path": ".github/workflows/phase8a-annual-catalogue-2020-runtime-install-executor.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "ecbac06de8dd81acebbe6565651d8da2124d68f1",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "failure",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

      - name: Require frozen DEC-572 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization_install_action.py)" = "98043c92240d00a343087e4d5fcef56575ba319e"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization_install_receipt.py)" = "7bcf5c20c5dce845901bca200e299b8dfeb364b3"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2020_runtime_authorization_install_receipt.py)" = "95092037ce42fa4c25c0c194c67c9a1f6cd40ab6"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "07ddfe7a968de10cd1d4f8592760cc9eb9e6300e"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2020_runtime_authorization.py.disabled)" = "695a50b418da752e1bd37d6302f209033ab611f5"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2020_authorization.py.disabled)" = "4e124365430672fa63825b272001937c60151644"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-571 install action
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC571_RUN_ID" > "$RUNNER_TEMP/dec571-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC571_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec571-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec571-run.json").read_text())
          exact = {
              "id": 37327905209,
              "name": "phase8a-annual-catalogue-2020-runtime-install-action",
              "path": ".github/workflows/phase8a-annual-catalogue-2020-runtime-install-action.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "4ed1da1cdc5a8df1272fb1f06a803a57a8043427",
              "run_number": 2,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          payload = json.loads((temp / "dec571-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11352259131]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == "annual-catalogue-2020-dec571-runtime-install-action-4ed1da1cdc5a8df1272fb1f06a803a57a8043427"
          assert artifact["digest"] == "sha256:082c09ed64042f2c63252676be1d63aab6553c3cd92e3995256498ac4744b423"
          assert artifact["expired"] is False
          PY
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC571_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec571.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec571.zip" | awk '{print $1}')"
          test "$actual" = "082c09ed64042f2c63252676be1d63aab6553c3cd92e3995256498ac4744b423"
          mkdir -p "$RUNNER_TEMP/dec571"
          unzip -q "$RUNNER_TEMP/dec571.zip" -d "$RUNNER_TEMP/dec571"
          action="$(find "$RUNNER_TEMP/dec571" -type f -name dec571-2020-runtime-install-action.json -print)"
          test "$(printf '%s\n' "$action" | sed '/^$/d' | wc -l)" = "1"
          cp "$action" "$RUNNER_TEMP/dec571-2020-runtime-install-action.json"

      - name: Recheck current main and unconsumed run-382 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-before-install.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs-before-install.json"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "07ddfe7a968de10cd1d4f8592760cc9eb9e6300e"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-before-install.json").read_text())
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]
          rows = json.loads((temp / "annual-runs-before-install.json").read_text()).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381}
          assert by_number[1]["conclusion"] == "failure"
          assert by_number[376]["conclusion"] == "failure"
          assert by_number[377]["conclusion"] == "success"
          assert by_number[378]["conclusion"] == "success"
          assert by_number[379]["conclusion"] == "success"
          assert by_number[380]["conclusion"] == "success"
          assert by_number[381]["conclusion"] == "success"
          assert not any(row["run_number"] >= 382 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned installer dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean installer checkout
        run: test -z "$(git status --porcelain)"

      - name: Validate concrete DEC-571 action
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from fmp.discovery.annual_pattern_catalogue_2020_runtime_authorization_install_action import (
              validate_2020_runtime_authorization_install_action,
          )
          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec571-2020-runtime-install-action.json").read_text()
          )
          validate_2020_runtime_authorization_install_action(value)
          assert value["decision"] == "DEC-571"
          assert value["source_preflight_workflow_run_id"] == 37321690650
          assert value["source_preflight_artifact_id"] == 11350136423
          assert value["expected_run_number"] == 382
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37310525635
          assert value["action_count"] == 2
          assert value["install_action_fingerprint_sha256"] == "0d617a5261a25d1fbdcc661fcc9518be63081ca442fb2ac068a2206f875e6939"
          assert value["repository_mutation_authorized"] is True
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Apply exact two-file 2020 runtime authorization install
        run: |
          set -euo pipefail
          cp \
            docs/superpowers/templates/annual_pattern_catalogue_2020_runtime_authorization.py.disabled \
            src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py
          cp \
            docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2020_authorization.py.disabled \
            src/fmp/discovery/annual_pattern_catalogue_runtime.py

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed-files.txt"

          cat > "$RUNNER_TEMP/expected-changed-files.txt" <<'EOF'
          src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py
          src/fmp/discovery/annual_pattern_catalogue_runtime.py
          EOF
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" "$RUNNER_TEMP/changed-files.txt"

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py)" = "695a50b418da752e1bd37d6302f209033ab611f5"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"

          git add \
            src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py \
            src/fmp/discovery/annual_pattern_catalogue_runtime.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" <(git diff --cached --name-only)

      - name: Prove installed runtime imports and exact run-382 gate
        run: |
          set -euo pipefail
          python -m py_compile \
            src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py \
            src/fmp/discovery/annual_pattern_catalogue_runtime.py
          python - <<'PY'
          from fmp.discovery.annual_pattern_catalogue_runtime import (
              require_historical_catalogue_execution_authorized,
          )
          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2020",
              run_number=382,
              run_attempt=1,
              previous_annual_freeze_run_id=37310525635,
          )
          require_historical_catalogue_execution_authorized(
              code_commit="a" * 40,
              annual_segment_label="2019",
              run_number=381,
              run_attempt=1,
              previous_annual_freeze_run_id=37237817538,
          )
          try:
              require_historical_catalogue_execution_authorized(
                  code_commit="a" * 40,
                  annual_segment_label="2020",
                  run_number=383,
                  run_attempt=1,
                  previous_annual_freeze_run_id=37310525635,
              )
          except (PermissionError, ValueError):
              pass
          else:
              raise AssertionError("run 383 must remain unauthorized")
          PY

      - name: Commit and push exact install
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase8a: install 2020 runtime authorization (DEC-572)"
          git rev-parse HEAD > "$RUNNER_TEMP/install-commit-sha.txt"
          git push origin HEAD:main

      - name: Verify installed main and build DEC-572 receipt
        run: |
          set -euo pipefail
          install_sha="$(cat "$RUNNER_TEMP/install-commit-sha.txt")"
          found=0
          for _ in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-after-install.json"
            if test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-after-install.json")" = "$install_sha"; then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

          gate_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py)"
          runtime_sha="$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)"
          python scripts/phase8a_annual_pattern_catalogue_2020_runtime_authorization_install_receipt.py \
            review \
            --action-json "$RUNNER_TEMP/dec571-2020-runtime-install-action.json" \
            --install-commit-sha "$install_sha" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --installed-gate-blob-sha "$gate_sha" \
            --installed-runtime-blob-sha "$runtime_sha" \
            --out "$RUNNER_TEMP/dec572-2020-runtime-install-receipt.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec572-2020-runtime-install-receipt.json").read_text()
          )
          assert value["decision"] == "DEC-572"
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["install_action_consumed"] is True
          assert value["expected_run_number"] == 382
          assert value["previous_annual_freeze_run_id"] == 37310525635
          assert value["annual_workflow_dispatch_authorized"] is False
          assert value["next_segment_execution_authorized"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Upload immutable DEC-572 install evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2020-dec572-runtime-install-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec571-run.json
            ${{ runner.temp }}/dec571-artifacts.json
            ${{ runner.temp }}/dec571-2020-runtime-install-action.json
            ${{ runner.temp }}/annual-runs-before-install.json
            ${{ runner.temp }}/main-before-install.json
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/install-commit-sha.txt
            ${{ runner.temp }}/main-after-install.json
            ${{ runner.temp }}/dec572-2020-runtime-install-receipt.json
          if-no-files-found: error
