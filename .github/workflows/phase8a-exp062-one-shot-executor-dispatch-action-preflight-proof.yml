name: phase8a-exp062-one-shot-executor-dispatch-action-preflight-proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-exp062-one-shot-executor-dispatch-action-preflight-proof.yml
      - .github/workflows/phase8a-exp062-one-shot-historical-executor.yml
      - .github/workflows/phase8a-exp062-discovery.yml
      - src/fmp/discovery/exp062_historical_active_one_shot_executor_dispatch_authorization.py
      - src/fmp/discovery/exp062_historical_active_one_shot_executor_dispatch_action_preflight.py
      - scripts/phase8a_exp062_active_one_shot_historical_executor_dispatch_action_preflight.py
      - requirements/exp061-discovery-run.txt

permissions:
  contents: read
  actions: read

jobs:
  read-only-one-shot-executor-dispatch-action-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact first merged-main DEC-432 proof push
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Require frozen DEC-430/431 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/exp062_historical_active_one_shot_executor_dispatch_authorization.py)" = "87aada4c5224c633e8eb419f971c8f7f0699b18f"
          test "$(git hash-object src/fmp/discovery/exp062_historical_active_one_shot_executor_dispatch_action_preflight.py)" = "93ab88965e74df0b067ba09dbbb8d0622c53e578"
          test "$(git hash-object scripts/phase8a_exp062_active_one_shot_historical_executor_dispatch_action_preflight.py)" = "df486dd739952ab10b9ff31d6c35a01eab38618e"
          test "$(git hash-object .github/workflows/phase8a-exp062-one-shot-historical-executor.yml)" = "51ce87584369be957482460d81649adb1cb9f05d"
          test "$(git hash-object .github/workflows/phase8a-exp062-discovery.yml)" = "1a7d42fd8d03d6ca3eae722209b1ad2a5dd2bc50"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned planning runtime without editable checkout
        run: python -m pip install -r requirements/exp061-discovery-run.txt

      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Fetch current main and both one-shot inventories
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-one-shot-historical-executor.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/executor-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-discovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/discovery-runs.json"

      - name: Run exact DEC-431 read-only action preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_exp062_active_one_shot_historical_executor_dispatch_action_preflight.py plan \
            --main-json "$RUNNER_TEMP/main.json" \
            --executor-runs-json "$RUNNER_TEMP/executor-runs.json" \
            --discovery-runs-json "$RUNNER_TEMP/discovery-runs.json" \
            --expected-head "$GITHUB_SHA" \
            > "$RUNNER_TEMP/one-shot-executor-dispatch-action-preflight.json"

      - name: Verify authorized action preflight and downstream locks
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "one-shot-executor-dispatch-action-preflight.json"
              ).read_text(encoding="utf-8")
          )

          assert plan["decision"] == "DEC-431"
          assert plan["authorization_decision"] == "DEC-430"
          assert plan["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert plan["active_executor_workflow_present"] is True
          assert plan["executor_workflow_run_count"] == 0
          assert plan["expected_executor_run_number"] == 1
          assert plan["expected_executor_run_attempt"] == 1
          assert plan["historical_gate_proof_run_id"] == 36358289723
          assert plan["historical_result_attempt_count"] == 0
          assert plan["historical_result_slot_consumed"] is False
          assert plan["historical_result_slot_verified_available"] is True
          assert plan["expected_target_run_number"] == 2
          assert plan["expected_target_run_attempt"] == 1
          assert plan["planned_executor_dispatch_command"] == (
              "gh workflow run "
              "phase8a-exp062-one-shot-historical-executor.yml --ref main"
          )
          assert plan["explicit_one_shot_executor_dispatch_authorized"] is True
          assert plan["historical_result_dispatch_authorized"] is True
          assert plan["historical_execute_mode_available"] is False

          for field in (
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "reserved_robustness_access_authorized",
              "candidate_compilation_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert plan[field] is False, field
          PY

      - name: Upload immutable DEC-432 action-preflight proof
        uses: actions/upload-artifact@v6
        with:
          name: exp062-dec432-one-shot-executor-dispatch-action-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/one-shot-executor-dispatch-action-preflight.json
          if-no-files-found: error
