name: phase8a-annual-catalogue-2023-dispatch-authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-dispatch-authorization.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC608_RUN_ID: "37766405383"
      DEC608_HEAD_SHA: "d9194944f53d311a9030deaf3ee37bff465634ed"
      DEC608_ARTIFACT_ID: "11544233443"
      DEC608_ARTIFACT_DIGEST: "sha256:7750c5d3b68b21dc7a4199e97ee3ce2fd8fdcb53fb6170c5270a78f695a512fc"
      DEC608_PREFLIGHT_FINGERPRINT: "9f1533d5993c28c86f53d2c7bd0f219178465da2c0eb987ae923ac9af8aca695"
      DEC608_PREFLIGHT_CANONICAL_SHA256: "6044191b89bbd6b33338b86077715be7d925d30ac14cd38845c948523f6ae651"

    steps:
      - name: Checkout exact DEC-609 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only authorization push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-609 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_authorization.py)" = "a7065e073c29c5f965fbe7a5e8a92193597aa9bd"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_dispatch_authorization.py)" = "341091275d57b1222aa4a6b3e00212f7609ec37d"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_preflight.py)" = "fb4f8fa390e94a75a8d52c99cbc041e9bf1e8164"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-608 preflight evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC608_RUN_ID" > "$RUNNER_TEMP/dec608-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC608_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec608-artifacts.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec608-run.json").read_text())
          exact = {
              "id": 37766405383,
              "name": "phase8a-annual-catalogue-2023-dispatch-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-dispatch-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "d9194944f53d311a9030deaf3ee37bff465634ed",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads((temp / "dec608-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11544233443]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2023-dec608-dispatch-preflight-"
              "d9194944f53d311a9030deaf3ee37bff465634ed"
          )
          assert artifact["digest"] == (
              "sha256:7750c5d3b68b21dc7a4199e97ee3ce2fd8fdcb53fb6170c5270a78f695a512fc"
          )
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC608_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec608.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec608.zip" | awk '{print $1}')"
          test "$actual" = "7750c5d3b68b21dc7a4199e97ee3ce2fd8fdcb53fb6170c5270a78f695a512fc"

          mkdir -p "$RUNNER_TEMP/dec608"
          unzip -q "$RUNNER_TEMP/dec608.zip" -d "$RUNNER_TEMP/dec608"
          preflight="$(find "$RUNNER_TEMP/dec608" -type f -name dec608-2023-dispatch-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "dec608-2023-dispatch-preflight.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(value, sort_keys=True, separators=(",", ":"), allow_nan=False)
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ[
              "DEC608_PREFLIGHT_CANONICAL_SHA256"
          ]
          PY

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "DEC-608"
          test "$(jq -r '.expected_head_sha' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "$DEC608_HEAD_SHA"
          test "$(jq -r '.preflight_fingerprint_sha256' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "$DEC608_PREFLIGHT_FINGERPRINT"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "385"
          test "$(jq -r '.expected_run_attempt' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "1"
          test "$(jq -r '.previous_annual_freeze_run_id' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "37663157285"
          test "$(jq -r '.preflight_read_only' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "true"
          test "$(jq -r '.annual_workflow_dispatch_authorized' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "false"
          test "$(jq -r '.protected_history_access_authorized' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "false"
          test "$(jq -r '.source_authorization_protected_history_access_authorized' "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json")" = "true"

      - name: Recheck current main and unconsumed run-385 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"

          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text()
          )["workflow_runs"]
          assert len(rows) == 10
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382, 383, 384}
          assert not any(
              isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 385
              for row in rows
          )
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
              381: (37310525635, "success"),
              382: (37443770076, "success"),
              383: (37531960014, "success"),
              384: (37663157285, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned authorization dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean authorization checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-609 authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_dispatch_authorization.py \
            authorize \
            --preflight-json "$RUNNER_TEMP/dec608-2023-dispatch-preflight.json" \
            --authorization-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec609-2023-dispatch-authorization.json"

      - name: Verify DEC-609 is source-only and run-385 exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec609-2023-dispatch-authorization.json"
              ).read_text()
          )
          assert value["decision"] == "DEC-609"
          assert value["source_preflight_workflow_run_id"] == 37766405383
          assert value["source_preflight_artifact_id"] == 11544233443
          assert value["source_preflight_artifact_digest"] == (
              "sha256:7750c5d3b68b21dc7a4199e97ee3ce2fd8fdcb53fb6170c5270a78f695a512fc"
          )
          assert value["source_preflight_fingerprint_sha256"] == (
              "9f1533d5993c28c86f53d2c7bd0f219178465da2c0eb987ae923ac9af8aca695"
          )
          assert value["source_preflight_canonical_sha256"] == (
              "6044191b89bbd6b33338b86077715be7d925d30ac14cd38845c948523f6ae651"
          )
          assert value["authorization_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["annual_segment_label"] == "2023"
          assert value["prior_segment_label"] == "2022"
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["historical_artifact_read_authorized"] is True
          assert value["historical_catalogue_execution_authorized"] is True
          assert value["historical_result_production_authorized"] is True
          assert value["authorization_contract_validated"] is True
          assert value["source_only_authorization"] is True
          assert value["protected_history_access_authorized"] is True
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["authorization_scope"] == "2023_run_385_attempt_1_only"
          for field in (
              "dispatch_command_present",
              "dispatch_action_executed",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_386_or_later_authorized",
              "next_segment_execution_authorized",
              "cross_year_comparison_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-609 authorization
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec609-dispatch-authorization-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec608-run.json
            ${{ runner.temp }}/dec608-artifacts.json
            ${{ runner.temp }}/dec608-2023-dispatch-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec609-2023-dispatch-authorization.json
          if-no-files-found: error
