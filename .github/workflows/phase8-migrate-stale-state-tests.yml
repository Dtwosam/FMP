name: phase8-migrate-stale-state-tests

on:
  push:
    branches: [phase8-activation-helper]
    paths:
      - .github/workflows/phase8-migrate-stale-state-tests.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-shadow-implementation
      - name: Migrate obsolete global phase assertions only
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = sorted(Path('tests').glob('test_phase4*state.py')) + [
              Path('tests/test_phase6_protocol_state.py')
          ]
          replacements = {
              'self.assertIn("**Current phase:** Phase 7 — Walk-forward Evaluation", state)':
                  'self.assertIn("**Current phase:** Phase 8 — Live shadow mode", state)',
              'self.assertIn("**Current phase:** Phase 7 — Walk-forward Evaluation", text)':
                  'self.assertIn("**Current phase:** Phase 8 — Live shadow mode", text)',
              'self.assertIn("**Phase status:** PASS", state)':
                  'self.assertIn("**Phase status:** ACTIVE", state)',
              'self.assertIn("**Phase status:** PASS", text)':
                  'self.assertIn("**Phase status:** ACTIVE", text)',
              'self.assertNotIn("## Phase 8 — ACTIVE", state)':
                  'self.assertIn("## Phase 8 — ACTIVE", state)',
              'self.assertNotIn("## Phase 8 — ACTIVE", text)':
                  'self.assertIn("## Phase 8 — ACTIVE", text)',
          }
          changed = []
          for path in targets:
              content = path.read_text(encoding='utf-8')
              updated = content
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())
          if not changed:
              raise SystemExit('no stale Phase 7 global-state assertions found')
          print('\n'.join(changed))
          PY
      - name: Verify only test files changed
        run: |
          test -z "$(git status --short | awk '$2 !~ /^tests\// {print}')"
          git diff --check
      - name: Commit migration
        run: |
          git config user.name "Dtwosam"
          git config user.email "42391449+Dtwosam@users.noreply.github.com"
          git add tests
          git commit -m "[phase1-no-source] Update historical state guards for Phase 8"
          git push origin HEAD:phase8-shadow-implementation
