          runtime="src/fmp/discovery/annual_pattern_catalogue_runtime.py"
          gate2017="src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py"
          gate2018="src/fmp/discovery/annual_pattern_catalogue_2018_runtime_authorization.py"
          gate2019="src/fmp/discovery/annual_pattern_catalogue_2019_runtime_authorization.py"
          gate2020="src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py"
