          gate2022="src/fmp/discovery/annual_pattern_catalogue_2022_runtime_authorization.py"
          gate2023="src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py"
          fixture="tests/fixtures/phase8a_annual_pattern_catalogue_runtime_pre_dec539.py.snapshot"

