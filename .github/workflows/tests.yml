name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Validate workflow YAML syntax
        run: ruby scripts/validate_workflow_yaml.rb .github/workflows
      - name: Run installed-state unit tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_workflow_install_receipt.py'
          -v
      - name: Run installed executor dispatch-preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight.py'
          -v
