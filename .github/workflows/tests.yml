          test "$(git hash-object "$gate2018")" = "cd50f50156cf74c34cd97d69d24291dc373b390f"
          test "$(git hash-object "$gate2019")" = "d87fe85a5b426fa92caf7d6cc165445590f4097c"
          test "$(git hash-object "$gate2020")" = "695a50b418da752e1bd37d6302f209033ab611f5"
          test "$(git hash-object "$gate2021")" = "cac68c905bedf3105aa7e766eaa968c87bff6ce9"
          test "$(git hash-object "$gate2022")" = "ecb21dc7106e7bd43447f4135c3a696251a75e05"
          test "$(git hash-object "$gate2023")" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object "$fixture")" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"

          cp "$fixture" "$runtime"
          rm "$gate2017"
          rm "$gate2018"
          rm "$gate2019"
          rm "$gate2020"
          rm "$gate2021"
          rm "$gate2022"
          rm "$gate2023"

