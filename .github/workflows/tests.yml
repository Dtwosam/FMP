        run: |
          set -euo pipefail
          runtime="src/fmp/discovery/annual_pattern_catalogue_runtime.py"
          gate2017="src/fmp/discovery/annual_pattern_catalogue_2017_runtime_authorization.py"
          gate2018="src/fmp/discovery/annual_pattern_catalogue_2018_runtime_authorization.py"
          gate2019="src/fmp/discovery/annual_pattern_catalogue_2019_runtime_authorization.py"
          gate2020="src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py"
          gate2021="src/fmp/discovery/annual_pattern_catalogue_2021_runtime_authorization.py"
          runtime2017="docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2017_authorization.py.disabled"
          gate2017_template="docs/superpowers/templates/annual_pattern_catalogue_2017_runtime_authorization.py.disabled"

          cp "$runtime2017" "$runtime"
          cp "$gate2017_template" "$gate2017"
          rm -f "$gate2018"
          rm -f "$gate2019"
          rm -f "$gate2020"
          rm -f "$gate2021"

          test "$(git hash-object "$runtime")" = "e9cbc76dc9e6866e80088d223498fbcc3b870fd1"
          test "$(git hash-object "$gate2017")" = "c1853eeec55ee98b3155a6054f07cf360793ba9b"
          test ! -e "$gate2018"
          test ! -e "$gate2019"
          test ! -e "$gate2020"
          test ! -e "$gate2021"

          {
            git diff --name-only -- "$runtime" "$gate2017" "$gate2018" "$gate2019" "$gate2020" "$gate2021"
          } | sort -u > "$RUNNER_TEMP/dec539-temporary-state-diff.txt"
          cat > "$RUNNER_TEMP/dec539-temporary-state-expected.txt" <<'EOF'
