name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Validate workflow YAML syntax
        run: ruby scripts/validate_workflow_yaml.rb .github/workflows
      - name: Run installed-state unit tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_workflow_install_receipt.py'
          -v
      - name: Run installed executor dispatch-preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight.py'
          -v
      - name: Run installed dispatch-preflight proof-review tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight_proof_review.py'
          -v
      - name: Run installed dispatch-preflight runtime-binding tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight_proof_runtime_freeze.py'
          -v
      - name: Run installed one-shot dispatch-authorization tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_dispatch_authorization.py'
          -v
      - name: Run installed one-shot dispatch-action preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_active_one_shot_historical_executor_dispatch_action_preflight.py'
          -v
      - name: Run installed DEC-433 proof-review tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_one_shot_executor_dispatch_action_preflight_proof_review.py'
          -v
      - name: Run installed DEC-435 runtime-binding tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_one_shot_executor_dispatch_action_preflight_proof_runtime_freeze.py'
          -v
      - name: Run installed DEC-436 executor-recovery tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_one_shot_historical_executor_recovery.py'
          -v
      - name: Run installed DEC-437/438 recovery-receipt tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_one_shot_executor_recovery_receipt_review_freeze.py'
          -v
      - name: Run installed DEC-439 recovery-v2 tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_exp062_one_shot_historical_executor_recovery_v2.py'
          -v
      - name: Run installed annual-catalogue proof-workflow receipt tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_proof_workflow_install_receipt.py'
          -v
      - name: Run installed annual-catalogue proof-workflow dispatch-preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_proof_workflow_dispatch_preflight.py'
          -v
      - name: Run installed annual-catalogue proof-workflow dispatch-authorization tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_proof_workflow_dispatch_authorization.py'
          -v
      - name: Run pre-annual-install proof evidence tests
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          annual=".github/workflows/phase8a-annual-pattern-catalogue.yml"
          annual_hidden="$RUNNER_TEMP/phase8a-annual-pattern-catalogue.yml"
          annual_cli="scripts/phase8a_annual_pattern_catalogue.py"
          annual_cli_hidden="$RUNNER_TEMP/phase8a_annual_pattern_catalogue.py"
          mv "$annual" "$annual_hidden"
          cp "$annual_cli" "$annual_cli_hidden"
          cp tests/fixtures/phase8a_annual_pattern_catalogue_cli_dec478.py.snapshot "$annual_cli"
          trap 'mv "$annual_hidden" "$annual"; cp "$annual_cli_hidden" "$annual_cli"' EXIT
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_proof_workflow_run_review.py' -v
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_proof_workflow_run_freeze.py' -v
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_proof_workflow_runtime_evidence_binding.py' -v
      - name: Run pre-repair annual-catalogue state tests
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          annual=".github/workflows/phase8a-annual-pattern-catalogue.yml"
          annual_saved="$RUNNER_TEMP/phase8a-annual-pattern-catalogue.repaired.yml"
          runtime="src/fmp/discovery/annual_pattern_catalogue_runtime.py"
          runtime_saved="$RUNNER_TEMP/annual_pattern_catalogue_runtime.current.py"
          cp "$annual" "$annual_saved"
          cp "$runtime" "$runtime_saved"
          cp tests/fixtures/phase8a_annual_pattern_catalogue_workflow_dec493.yml.snapshot "$annual"
          trap 'cp "$annual_saved" "$annual"; cp "$runtime_saved" "$runtime"' EXIT
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_workflow_install_receipt.py' -v
          cp tests/fixtures/phase8a_annual_pattern_catalogue_runtime_dec475.py.snapshot "$runtime"
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_2015_execution_preflight.py' -v
          cp tests/fixtures/phase8a_annual_pattern_catalogue_runtime_dec493.py.snapshot "$runtime"
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_2015_execution_authorization.py' -v
          python -m unittest discover -s tests -p 'test_phase8a_annual_pattern_catalogue_2015_dispatch_preflight.py' -v
      - name: Run failed first-2015 run receipt tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_run1_failure_receipt.py'
          -v
      - name: Run annual-catalogue artifact-upload repair tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_artifact_upload_repair.py'
          -v
      - name: Run 2015 replacement-dispatch preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_replacement_dispatch_preflight.py'
          -v
      - name: Run 2015 replacement execution-authorization tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_replacement_execution_authorization.py'
          -v
      - name: Run final 2015 replacement dispatch-action preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_replacement_dispatch_action_preflight.py'
          -v
      - name: Run 2015 replacement-run reviewer tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_replacement_run_review.py'
          -v
      - name: Run deterministic 2015 replacement-run freeze tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_replacement_run_freeze.py'
          -v
      - name: Run concrete 2015 runtime evidence binding tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2015_runtime_evidence_binding.py'
          -v
      - name: Run read-only 2016 execution-preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2016_execution_preflight.py'
          -v
      - name: Run source-only 2016 execution-authorization tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2016_execution_authorization.py'
          -v
      - name: Run dormant 2016 runtime authorization-plan tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2016_runtime_authorization_plan.py'
          -v
      - name: Run read-only 2016 runtime authorization-install preflight tests
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_phase8a_annual_pattern_catalogue_2016_runtime_authorization_install_preflight.py'
          -v
      - name: Run historical snapshot and general unit tests
        env:
          PYTHONPATH: src
          FMP_PREINSTALL_SNAPSHOT: '1'
        run: |
          set -euo pipefail
          active=".github/workflows/phase8a-exp062-one-shot-historical-executor.yml"
          hidden="$RUNNER_TEMP/phase8a-exp062-one-shot-historical-executor.yml"
          recovery=".github/workflows/phase8a-exp062-one-shot-historical-executor-recovery.yml"
          recovery_hidden="$RUNNER_TEMP/phase8a-exp062-one-shot-historical-executor-recovery.yml"
          proof=".github/workflows/phase8a-annual-catalogue-workflow-install-preflight-proof.yml"
          proof_hidden="$RUNNER_TEMP/phase8a-annual-catalogue-workflow-install-preflight-proof.yml"
          annual=".github/workflows/phase8a-annual-pattern-catalogue.yml"
          annual_hidden="$RUNNER_TEMP/phase8a-annual-pattern-catalogue.yml"
          annual_cli="scripts/phase8a_annual_pattern_catalogue.py"
          annual_cli_hidden="$RUNNER_TEMP/phase8a_annual_pattern_catalogue.py"
          mv "$active" "$hidden"
          mv "$recovery" "$recovery_hidden"
          mv "$proof" "$proof_hidden"
          mv "$annual" "$annual_hidden"
          cp "$annual_cli" "$annual_cli_hidden"
          cp tests/fixtures/phase8a_annual_pattern_catalogue_cli_dec478.py.snapshot "$annual_cli"
          trap 'mv "$hidden" "$active"; mv "$recovery_hidden" "$recovery"; mv "$proof_hidden" "$proof"; mv "$annual_hidden" "$annual"; cp "$annual_cli_hidden" "$annual_cli"' EXIT
          python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src tests
