name: phase8a-annual-catalogue-2016-post-install-recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2016-post-install-recovery.yml
      - src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py
      - src/fmp/discovery/annual_pattern_catalogue_2016_post_install_runtime_repair.py
      - src/fmp/discovery/annual_pattern_catalogue_2016_post_install_dispatch_recovery.py
      - scripts/phase8a_annual_pattern_catalogue_2016_post_install_recovery.py

permissions:
  contents: read
  actions: write

jobs:
  recover-post-install-run378-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      INSTALL_COMMIT_SHA: "525386dd68955e9f02909f9692987968ab15e516"
      FAILED_INSTALLER_RUN_ID: "37205170186"
      DEC514_RUN_ID: "37205141103"
      DEC514_ARTIFACT_ID: "11304088642"
      DEC514_ARTIFACT_SHA256: "cd455bfae7a1c91f114d9a4e35b81fcd46d7921740f0c04ff27d79978ab93231"

    steps:
      - name: Checkout exact repair landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first post-install recovery push
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INSTALL_COMMIT_SHA" "$GITHUB_SHA"

      - name: Require exact repaired runtime sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py)" = "5b034fba697c3de0c0f8b6140d6f84771f1ae54b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_post_install_runtime_repair.py)" = "fce9214787b487f9dacf083adec39a4507958d92"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_post_install_dispatch_recovery.py)" = "4eb31197de89e9cb9f07c601425a3ec309188b4c"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2016_post_install_recovery.py)" = "637a727311b8c0af9d0001111ca18c1c2a8a6e6f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization_install_receipt.py)" = "3a5614af2393378ed664c4802806147d79ccd8c7"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned recovery dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean checkout after dependency install
        run: test -z "$(git status --porcelain)"

      - name: Prove failed installer and freeze DEC-531 repair
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_INSTALLER_RUN_ID"             > "$RUNNER_TEMP/installer-run.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_INSTALLER_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/installer-jobs.json"

          python scripts/phase8a_annual_pattern_catalogue_2016_post_install_recovery.py             repair             --installer-run-json "$RUNNER_TEMP/installer-run.json"             --installer-jobs-json "$RUNNER_TEMP/installer-jobs.json"             --repair-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec531-repair.json"

      - name: Download exact frozen DEC-514 run-2 plan
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC514_RUN_ID"             > "$RUNNER_TEMP/dec514-run.json"
          test "$(jq -r '.status' "$RUNNER_TEMP/dec514-run.json")" = "completed"
          test "$(jq -r '.conclusion' "$RUNNER_TEMP/dec514-run.json")" = "success"
          test "$(jq -r '.run_number' "$RUNNER_TEMP/dec514-run.json")" = "2"
          test "$(jq -r '.run_attempt' "$RUNNER_TEMP/dec514-run.json")" = "1"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC514_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec514.zip"
          test "$(sha256sum "$RUNNER_TEMP/dec514.zip" | awk '{print $1}')" = "$DEC514_ARTIFACT_SHA256"

          mkdir -p "$RUNNER_TEMP/dec514"
          unzip -q "$RUNNER_TEMP/dec514.zip" -d "$RUNNER_TEMP/dec514"
          test -f "$RUNNER_TEMP/dec514/dec507-install-action.json"
          test -f "$RUNNER_TEMP/dec514/runtime-binding.json"

      - name: Reconstruct exact historical DEC-508 install receipt
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2016_runtime_authorization_install_receipt.py             review             --install-action-json "$RUNNER_TEMP/dec514/dec507-install-action.json"             --install-commit-sha "$INSTALL_COMMIT_SHA"             --changed-file src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py             --changed-file src/fmp/discovery/annual_pattern_catalogue_runtime.py             --installed-gate-blob-sha 4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff             --installed-runtime-blob-sha b564f5a26fdef146fc6080962e7c4762b0b5949a             --out "$RUNNER_TEMP/dec508-reconstructed.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec508-reconstructed.json")" = "DEC-508"
          test "$(jq -r '.install_commit_sha' "$RUNNER_TEMP/dec508-reconstructed.json")" = "$INSTALL_COMMIT_SHA"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec508-reconstructed.json")" = "378"

      - name: Build exact DEC-532 dispatch recovery plan
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main.json")" = "$GITHUB_SHA"

          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-dispatch-runs.json"

          python scripts/phase8a_annual_pattern_catalogue_2016_post_install_recovery.py             plan             --repair-json "$RUNNER_TEMP/dec531-repair.json"             --install-receipt-json "$RUNNER_TEMP/dec508-reconstructed.json"             --runtime-binding-json "$RUNNER_TEMP/dec514/runtime-binding.json"             --main-branch-json "$RUNNER_TEMP/main.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-dispatch-runs.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec532-plan.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec532-plan.json")" = "DEC-532"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec532-plan.json")" = "378"
          test "$(jq -r '.annual_workflow_dispatch_authorized' "$RUNNER_TEMP/dec532-plan.json")" = "true"
          test "$(jq -r '.run_379_or_later_authorized' "$RUNNER_TEMP/dec532-plan.json")" = "false"
          test "$(jq -r '.trading_authorized' "$RUNNER_TEMP/dec532-plan.json")" = "false"

      - name: Recheck main and exact annual slot immediately before dispatch
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main-before-dispatch.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-before-dispatch.json")" = "$GITHUB_SHA"

          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?per_page=100"             > "$RUNNER_TEMP/annual-all-before-378.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-dispatch-before-378.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          all_runs = json.loads(
              (temp / "annual-all-before-378.json").read_text(encoding="utf-8")
          )["workflow_runs"]
          dispatch = json.loads(
              (temp / "annual-dispatch-before-378.json").read_text(encoding="utf-8")
          )["workflow_runs"]
          assert not any(
              isinstance(row.get("run_number"), int)
              and row["run_number"] >= 378
              for row in all_runs
          )
          by_number = {row["run_number"]: row for row in dispatch}
          assert set(by_number) == {1, 376, 377}
          assert by_number[1]["id"] == 37126711695
          assert by_number[1]["conclusion"] == "failure"
          assert by_number[376]["id"] == 37191637168
          assert by_number[376]["conclusion"] == "failure"
          assert by_number[377]["id"] == 37198002653
          assert by_number[377]["conclusion"] == "success"
          PY

      - name: Dispatch exact fresh 2016 annual run 378
        run: |
          set -euo pipefail
          previous_run_id="$(jq -r '.previous_annual_freeze_run_id' "$RUNNER_TEMP/dec532-plan.json")"
          test "$previous_run_id" = "37198002653"

          gh workflow run phase8a-annual-pattern-catalogue.yml             --ref main             -f annual_segment_label=2016             -f previous_annual_freeze_run_id="$previous_run_id"

      - name: Resolve exact annual run 378 and reject any later run
        run: |
          set -euo pipefail
          found=0
          for _ in $(seq 1 40); do
            gh api               "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?per_page=100"               > "$RUNNER_TEMP/annual-after-378.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-after-378.json")
              .read_text(encoding="utf-8")
          )["workflow_runs"]
          targets = [
              row for row in rows
              if row.get("run_number") == 378
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          later = [
              row for row in rows
              if isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 379
          ]
          raise SystemExit(0 if len(targets) == 1 and later == [] else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Write immutable DEC-532 run-378 dispatch receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          rows = json.loads(
              (temp / "annual-after-378.json").read_text(encoding="utf-8")
          )["workflow_runs"]
          target = [
              row for row in rows
              if row.get("run_number") == 378
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          assert len(target) == 1
          target = target[0]
          receipt = {
              "decision": "DEC-532",
              "stage": (
                  "ANNUAL_CATALOGUE_2016_RUN_378_POST_INSTALL_"
                  "REPAIR_DISPATCH_SUBMITTED"
              ),
              "source_repair_decision": "DEC-531",
              "source_install_receipt_decision": "DEC-508",
              "install_commit_sha": os.environ["INSTALL_COMMIT_SHA"],
              "repair_head_sha": os.environ["GITHUB_SHA"],
              "previous_annual_freeze_run_id": 37198002653,
              "annual_segment_label": "2016",
              "run_id": target["id"],
              "run_number": 378,
              "run_attempt": 1,
              "run_head_sha": os.environ["GITHUB_SHA"],
              "dispatch_submitted": True,
              "result_claimed": False,
              "rerun_authorized": False,
              "retry_authorized": False,
              "replacement_run_authorized": False,
              "run_379_or_later_authorized": False,
              "next_segment_execution_authorized": False,
              "cross_year_result_production_authorized": False,
              "strategy_v1_synthesis_authorized": False,
              "promotion_authorized": False,
              "phase8b_authorized": False,
              "demo_order_authorized": False,
              "broker_mutation_authorized": False,
              "live_order_authorized": False,
              "real_money_authorized": False,
              "trading_authorized": False,
              "next_gate": "REVIEW_2016_RUN_378_BEFORE_ANY_2017_EXECUTION",
          }
          (temp / "dec532-run378-dispatch-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable DEC-531 and DEC-532 recovery evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2016-dec532-run378-dispatch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/installer-run.json
            ${{ runner.temp }}/installer-jobs.json
            ${{ runner.temp }}/dec531-repair.json
            ${{ runner.temp }}/dec514-run.json
            ${{ runner.temp }}/dec514/dec507-install-action.json
            ${{ runner.temp }}/dec514/runtime-binding.json
            ${{ runner.temp }}/dec508-reconstructed.json
            ${{ runner.temp }}/dec532-plan.json
            ${{ runner.temp }}/main-before-dispatch.json
            ${{ runner.temp }}/annual-all-before-378.json
            ${{ runner.temp }}/annual-dispatch-before-378.json
            ${{ runner.temp }}/annual-after-378.json
            ${{ runner.temp }}/dec532-run378-dispatch-receipt.json
          if-no-files-found: error
