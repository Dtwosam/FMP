name: phase5-closure-diff-check-temp

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase5-closure-diff-check-temp.yml

permissions:
  contents: read

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: phase5-feature-acceptance
          fetch-depth: 0
      - name: Verify PR diff whitespace
        run: git diff --check origin/main...HEAD
