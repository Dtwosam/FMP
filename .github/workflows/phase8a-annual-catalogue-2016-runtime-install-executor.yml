      - name: Resolve exact 2016 run 378 attempt 1
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(
            cat "$RUNNER_TEMP/dec519-plan/install-commit-sha.txt"
          )"
          found=0
          for _ in $(seq 1 30); do
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?per_page=100" \
              > "$RUNNER_TEMP/annual-runs-after-378.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          install_sha = (
              temp / "dec519-plan/install-commit-sha.txt"
          ).read_text(encoding="utf-8").strip()
          runs = json.loads(
              (temp / "annual-runs-after-378.json").read_text(
                  encoding="utf-8"
              )
          )["workflow_runs"]
          target = [
              row
              for row in runs
              if row.get("run_number") == 378
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == install_sha
          ]
          later = [
              row
              for row in runs
              if isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 379
          ]
          raise SystemExit(0 if len(target) == 1 and later == [] else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

