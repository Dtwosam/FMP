name: phase8a-annual-catalogue-2016-runtime-install-executor

on:
  workflow_run:
    workflows:
      - phase8a-annual-catalogue-2016-activation-plan
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_plan_run_id:
        description: Exact successful DEC-514 activation-plan run ID
        required: true
        type: string
      source_head_sha:
        description: Exact activation-plan head SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  install-runtime-authorization:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      SOURCE_PLAN_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_plan_run_id || github.event.workflow_run.id }}
      SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_head_sha || github.event.workflow_run.head_sha }}
      EXPECTED_SOURCE_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'workflow_run' }}

    steps:
      - name: Checkout exact activation-plan head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0

      - name: Require exact successful DEC-514 plan run
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_PLAN_RUN_ID"             > "$RUNNER_TEMP/dec514-run.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec514-run.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["SOURCE_PLAN_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2016-activation-plan",
              "path": ".github/workflows/phase8a-annual-catalogue-2016-activation-plan.yml",
              "event": os.environ["EXPECTED_SOURCE_EVENT"],
              "head_branch": "main",
              "head_sha": os.environ["SOURCE_HEAD_SHA"],
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert int(os.environ["GITHUB_RUN_NUMBER"]) == 2
              assert int(os.environ["GITHUB_RUN_ATTEMPT"]) == 1
              assert run.get("run_number") == 2
              assert run.get("run_attempt") == 1
          PY

      - name: Require exact frozen installer sources
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2016-activation-plan.yml)" = "1893cd0d96e342ad30e8d5bdfc58b81781d28be6"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization_install_action.py)" = "0545f0474bdead4e479c07b9af889db842bf00dd"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization_install_receipt.py)" = "3a5614af2393378ed664c4802806147d79ccd8c7"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2016_runtime_authorization_install_receipt.py)" = "7d355784598c48d39ac0d3964145b46b878d18a3"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2016_runtime_authorization.py.disabled)" = "4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2016_authorization.py.disabled)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "f1fa50e7c862354931d919fe7da241de863f6834"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"
          test ! -e src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned annual catalogue install runtime
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean checkout after runtime install
        run: test -z "$(git status --porcelain)"

      - name: Download exact DEC-514 activation plan
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_PLAN_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/dec514-artifacts.json"

          artifact_id="$(
            jq -r '
              [
                .artifacts[]
                | select(
                    (.expired == false)
                    and (.name | startswith("annual-catalogue-2016-dec514-activation-plan-"))
                  )
              ]
              | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/dec514-artifacts.json"
          )"
          artifact_digest="$(
            jq -r '
              [
                .artifacts[]
                | select(
                    (.expired == false)
                    and (.name | startswith("annual-catalogue-2016-dec514-activation-plan-"))
                  )
              ]
              | if length == 1 then .[0].digest else empty end
            ' "$RUNNER_TEMP/dec514-artifacts.json"
          )"
          test -n "$artifact_id"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_zip_sha="$(printf '%s' "$artifact_digest" | sed 's/^sha256://')"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/dec514-plan.zip"

          actual_zip_sha="$(
            sha256sum "$RUNNER_TEMP/dec514-plan.zip" | awk '{print $1}'
          )"
          test "$actual_zip_sha" = "$expected_zip_sha"

          mkdir -p "$RUNNER_TEMP/dec514-plan"
          unzip -q "$RUNNER_TEMP/dec514-plan.zip" -d "$RUNNER_TEMP/dec514-plan"

          action_path="$(
            find "$RUNNER_TEMP/dec514-plan"               -type f -name dec507-install-action.json -print
          )"
          binding_path="$(
            find "$RUNNER_TEMP/dec514-plan"               -type f -name runtime-binding.json -print
          )"
          test "$(printf '%s\n' "$action_path" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$binding_path" | sed '/^$/d' | wc -l)" = "1"
          cp "$action_path" "$RUNNER_TEMP/dec507-install-action.json"
          cp "$binding_path" "$RUNNER_TEMP/runtime-binding.json"

      - name: Verify exact DEC-507 install action
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          action = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec507-install-action.json"
              ).read_text(encoding="utf-8")
          )
          assert action["decision"] == "DEC-507"
          assert action["repository_full_name"] == "Dtwosam/FMP"
          assert action["expected_head_sha"] == os.environ["SOURCE_HEAD_SHA"]
          assert action["annual_segment_label"] == "2016"
          assert action["expected_run_number"] == 378
          assert action["expected_run_attempt"] == 1
          assert action["action_count"] == 2
          assert action["repository_mutation_authorized"] is True
          assert action["runtime_authorization_installed"] is False
          assert action["runtime_gate_active"] is False
          assert action["annual_workflow_dispatch_authorized"] is False
          assert action["trading_authorized"] is False

          create, update = action["actions"]
          assert create == {
              "order": 1,
              "operation": "create",
              "target_path": (
                  "src/fmp/discovery/"
                  "annual_pattern_catalogue_2016_runtime_authorization.py"
              ),
              "expected_target_absent": True,
              "content_source_path": (
                  "docs/superpowers/templates/"
                  "annual_pattern_catalogue_2016_runtime_authorization.py.disabled"
              ),
              "content_source_blob_sha": (
                  "4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff"
              ),
              "expected_result_blob_sha": (
                  "4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff"
              ),
          }
          assert update == {
              "order": 2,
              "operation": "update",
              "target_path": "src/fmp/discovery/annual_pattern_catalogue_runtime.py",
              "expected_current_blob_sha": (
                  "f1fa50e7c862354931d919fe7da241de863f6834"
              ),
              "content_source_path": (
                  "docs/superpowers/templates/"
                  "annual_pattern_catalogue_runtime_with_2016_authorization.py.disabled"
              ),
              "content_source_blob_sha": (
                  "b564f5a26fdef146fc6080962e7c4762b0b5949a"
              ),
              "expected_result_blob_sha": (
                  "b564f5a26fdef146fc6080962e7c4762b0b5949a"
              ),
          }
          PY

      - name: Require current main unchanged immediately before mutation
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply exact two-file runtime authorization install
        run: |
          set -euo pipefail
          cp             docs/superpowers/templates/annual_pattern_catalogue_2016_runtime_authorization.py.disabled             src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py
          cp             docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2016_authorization.py.disabled             src/fmp/discovery/annual_pattern_catalogue_runtime.py

          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py)" = "4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed-files.txt"
          printf '%s\n'             "src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py"             "src/fmp/discovery/annual_pattern_catalogue_runtime.py"             > "$RUNNER_TEMP/expected-changed-files.txt"
          diff -u "$RUNNER_TEMP/expected-changed-files.txt" "$RUNNER_TEMP/changed-files.txt"

      - name: Commit exact DEC-518 install
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py             src/fmp/discovery/annual_pattern_catalogue_runtime.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "phase8a: install exact 2016 runtime authorization (DEC-518)"
          INSTALL_COMMIT_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$INSTALL_COMMIT_SHA" > "$RUNNER_TEMP/install-commit-sha.txt"

      - name: Push only the exact install commit to main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_HEAD_SHA"
          git push origin HEAD:main

      - name: Build concrete DEC-508 install receipt
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(cat "$RUNNER_TEMP/install-commit-sha.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2016_runtime_authorization_install_receipt.py             review             --install-action-json "$RUNNER_TEMP/dec507-install-action.json"             --install-commit-sha "$INSTALL_COMMIT_SHA"             --changed-file src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py             --changed-file src/fmp/discovery/annual_pattern_catalogue_runtime.py             --installed-gate-blob-sha 4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff             --installed-runtime-blob-sha b564f5a26fdef146fc6080962e7c4762b0b5949a             --out "$RUNNER_TEMP/dec508-install-receipt.json"

      - name: Verify post-install main and receipt
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(cat "$RUNNER_TEMP/install-commit-sha.txt")"
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main-after.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-after.json")" = "$INSTALL_COMMIT_SHA"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads(
              (temp / "dec508-install-receipt.json").read_text(encoding="utf-8")
          )
          install_sha = (temp / "install-commit-sha.txt").read_text(
              encoding="utf-8"
          ).strip()

          assert receipt["decision"] == "DEC-508"
          assert receipt["install_commit_sha"] == install_sha
          assert receipt["annual_segment_label"] == "2016"
          assert receipt["expected_run_number"] == 378
          assert receipt["expected_run_attempt"] == 1
          assert receipt["changed_file_count"] == 2
          assert receipt["runtime_authorization_installed"] is True
          assert receipt["runtime_gate_active"] is True
          assert receipt["annual_workflow_dispatch_authorized"] is False
          assert receipt["trading_authorized"] is False
          PY

      - name: Upload immutable DEC-518 install evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2016-dec518-runtime-install-${{ env.SOURCE_PLAN_RUN_ID }}
          path: |
            ${{ runner.temp }}/dec514-run.json
            ${{ runner.temp }}/dec514-artifacts.json
            ${{ runner.temp }}/dec507-install-action.json
            ${{ runner.temp }}/runtime-binding.json
            ${{ runner.temp }}/install-commit-sha.txt
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/dec508-install-receipt.json
            ${{ runner.temp }}/main-after.json
          if-no-files-found: error

  compile-post-install-dispatch-plan:
    needs: install-runtime-authorization
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      SOURCE_PLAN_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_plan_run_id || github.event.workflow_run.id }}

    steps:
      - name: Checkout installed main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact DEC-518 install evidence from this workflow
        uses: actions/download-artifact@v6
        with:
          name: annual-catalogue-2016-dec518-runtime-install-${{ env.SOURCE_PLAN_RUN_ID }}
          path: ${{ runner.temp }}/dec518-evidence

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned post-install planning runtime
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean installed checkout
        run: test -z "$(git status --porcelain)"

      - name: Require exact installed main and concrete evidence
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(cat "$RUNNER_TEMP/dec518-evidence/install-commit-sha.txt")"
          test "$(git rev-parse HEAD)" = "$INSTALL_COMMIT_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py)" = "4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "dec518-evidence"
          receipt = json.loads(
              (root / "dec508-install-receipt.json").read_text(encoding="utf-8")
          )
          binding = json.loads(
              (root / "runtime-binding.json").read_text(encoding="utf-8")
          )
          install_sha = (root / "install-commit-sha.txt").read_text(
              encoding="utf-8"
          ).strip()

          assert receipt["decision"] == "DEC-508"
          assert receipt["install_commit_sha"] == install_sha
          assert receipt["runtime_authorization_installed"] is True
          assert receipt["runtime_gate_active"] is True
          assert receipt["annual_workflow_dispatch_authorized"] is False
          assert receipt["trading_authorized"] is False

          assert binding["decision"] == "DEC-502"
          assert binding["annual_segment_label"] == "2015"
          assert binding["run_number"] == 377
          assert binding["run_attempt"] == 1
          assert binding["run_conclusion"] == "success"
          assert binding["runtime_evidence_bound"] is True
          assert receipt["previous_annual_freeze_run_id"] == binding["run_id"]
          PY

      - name: Fetch exact installed main and annual run inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main"             > "$RUNNER_TEMP/main-branch.json"
          INSTALL_COMMIT_SHA="$(cat "$RUNNER_TEMP/dec518-evidence/install-commit-sha.txt")"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$INSTALL_COMMIT_SHA"
          gh api             "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"             > "$RUNNER_TEMP/annual-runs.json"

      - name: Build DEC-509 installed-state dispatch preflight
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(cat "$RUNNER_TEMP/dec518-evidence/install-commit-sha.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2016_dispatch_preflight.py             plan             --install-receipt-json "$RUNNER_TEMP/dec518-evidence/dec508-install-receipt.json"             --runtime-binding-json "$RUNNER_TEMP/dec518-evidence/runtime-binding.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$INSTALL_COMMIT_SHA"             --out "$RUNNER_TEMP/dec509-dispatch-preflight.json"

      - name: Build DEC-510 exact run-3 authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2016_dispatch_authorization.py             authorize             --preflight-json "$RUNNER_TEMP/dec509-dispatch-preflight.json"             --out "$RUNNER_TEMP/dec510-dispatch-authorization.json"

      - name: Build DEC-511 final read-only dispatch-action preflight
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(cat "$RUNNER_TEMP/dec518-evidence/install-commit-sha.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2016_dispatch_action_preflight.py             plan             --authorization-json "$RUNNER_TEMP/dec510-dispatch-authorization.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json"             --expected-head-sha "$INSTALL_COMMIT_SHA"             --out "$RUNNER_TEMP/dec511-dispatch-action-preflight.json"

      - name: Verify DEC-519 exact future dispatch plan remains unexecuted
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          binding = json.loads(
              (temp / "dec518-evidence/runtime-binding.json").read_text(encoding="utf-8")
          )
          p509 = json.loads(
              (temp / "dec509-dispatch-preflight.json").read_text(encoding="utf-8")
          )
          a510 = json.loads(
              (temp / "dec510-dispatch-authorization.json").read_text(encoding="utf-8")
          )
          p511 = json.loads(
              (temp / "dec511-dispatch-action-preflight.json").read_text(encoding="utf-8")
          )

          assert p509["decision"] == "DEC-509"
          assert p509["annual_workflow_run_count"] == 3
          assert p509["expected_run_number"] == 378
          assert p509["expected_run_attempt"] == 1
          assert p509["annual_workflow_dispatch_authorized"] is False

          assert a510["decision"] == "DEC-510"
          assert a510["authorization_scope"] == "2016_run_378_attempt_1_only"
          assert a510["annual_workflow_dispatch_authorized"] is True
          assert a510["dispatch_command_present"] is False
          assert a510["dispatch_action_executed"] is False
          assert a510["trading_authorized"] is False

          assert p511["decision"] == "DEC-511"
          assert p511["dispatch_ref"] == "main"
          assert p511["dispatch_input_annual_segment_label"] == "2016"
          assert p511["dispatch_input_previous_annual_freeze_run_id"] == str(binding["run_id"])
          assert p511["expected_run_number"] == 378
          assert p511["expected_run_attempt"] == 1
          assert p511["dispatch_parameters_frozen"] is True
          assert p511["annual_workflow_dispatch_authorized"] is True
          assert p511["dispatch_command_present"] is False
          assert p511["dispatch_action_executed"] is False
          assert p511["preflight_read_only"] is True
          assert p511["fourth_or_later_run_authorized"] is False
          assert p511["next_segment_execution_authorized"] is False
          assert p511["trading_authorized"] is False
          PY

      - name: Upload immutable DEC-519 post-install dispatch plan
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2016-dec519-dispatch-plan-${{ env.SOURCE_PLAN_RUN_ID }}
          path: |
            ${{ runner.temp }}/dec518-evidence/dec508-install-receipt.json
            ${{ runner.temp }}/dec518-evidence/runtime-binding.json
            ${{ runner.temp }}/dec518-evidence/install-commit-sha.txt
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec509-dispatch-preflight.json
            ${{ runner.temp }}/dec510-dispatch-authorization.json
            ${{ runner.temp }}/dec511-dispatch-action-preflight.json
          if-no-files-found: error

  dispatch-exact-2016-run-378:
    needs:
      - install-runtime-authorization
      - compile-post-install-dispatch-plan
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_PLAN_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_plan_run_id || github.event.workflow_run.id }}

    steps:
      - name: Checkout exact installed main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact DEC-519 dispatch plan from this workflow
        uses: actions/download-artifact@v6
        with:
          name: annual-catalogue-2016-dec519-dispatch-plan-${{ env.SOURCE_PLAN_RUN_ID }}
          path: ${{ runner.temp }}/dec519-plan

      - name: Require exact installed main and DEC-519 plan
        run: |
          set -euo pipefail
          INSTALL_COMMIT_SHA="$(
            cat "$RUNNER_TEMP/dec519-plan/install-commit-sha.txt"
          )"
          test "$(git rev-parse HEAD)" = "$INSTALL_COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$INSTALL_COMMIT_SHA"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2016_runtime_authorization.py)" = "4bb008eedc2ca0676cf25dd3cfcebba5eac0eaff"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "b564f5a26fdef146fc6080962e7c4762b0b5949a"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "dec519-plan"
          install_sha = (root / "install-commit-sha.txt").read_text(
              encoding="utf-8"
          ).strip()
          binding = json.loads(
