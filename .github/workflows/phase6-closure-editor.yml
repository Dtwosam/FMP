name: phase6-closure-editor

on:
  push:
    branches:
      - phase6-acceptance-closure

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-acceptance-closure
          fetch-depth: 0
      - name: Apply closure records
        run: python scripts/phase6_closure_editor.py
      - name: Verify closure state
        run: |
          python -m unittest tests.test_phase5_acceptance_state tests.test_phase6_protocol_state tests.test_phase6_acceptance_state -v
          git diff --check
      - name: Commit closure and remove temporary helpers
        run: |
          rm .github/workflows/phase6-closure-editor.yml scripts/phase6_closure_editor.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[phase1-no-source] Record Phase 6 acceptance closure'
          git push origin HEAD:phase6-acceptance-closure
