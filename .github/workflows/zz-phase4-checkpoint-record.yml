name: zz-phase4-checkpoint-record

on:
  push:
    branches:
      - phase4-checkpoint-record
    paths:
      - scripts/_phase4_checkpoint_record_once.py
      - .github/workflows/zz-phase4-checkpoint-record.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-checkpoint-record
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record verified Phase 4 checkpoint
        run: python scripts/_phase4_checkpoint_record_once.py
      - name: Verify bounded checkpoint record
        run: |
          git diff --check
          python -m unittest discover -s tests -p 'test_phase4_checkpoint_state.py' -v
          grep -q 'fmp-v1-phase4-baselines' docs/project-state.md
          grep -q '115bb8080e951db16ca1a1174227ffa181a03d1b' docs/phase4-acceptance-evidence.md
          grep -q '## Phase 5 — UNSTARTED' docs/project-state.md
      - name: Commit checkpoint record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/phase4-acceptance-evidence.md docs/project-state.md tests/test_phase4_checkpoint_state.py
          git commit -m '[phase1-no-source] Record Phase 4 checkpoint'
          git push origin HEAD:phase4-checkpoint-record
