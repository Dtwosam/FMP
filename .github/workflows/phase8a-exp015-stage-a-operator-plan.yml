name: phase8a-exp015-stage-a-operator-plan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-exp015-stage-a-operator-plan.yml
      - requirements/exp015-stage-a-operator.txt
      - scripts/phase8a_exp015_stage_a_operator.py
      - src/fmp/portfolio/exp015_stage_a_operator.py
      - src/fmp/portfolio/exp015_stage_a_terminal_review.py
      - .github/workflows/phase8a-exp015-stage-a.yml

permissions:
  contents: read
  actions: read

jobs:
  read-only-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require push on merged main
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify frozen DEC-264 and DEC-265 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/phase8a-exp015-stage-a.yml)" = "ae8bdfbdb1bcfd62204a1bd0ec32dddfd9938930"
          test "$(git hash-object src/fmp/portfolio/exp015_stage_a_terminal_review.py)" = "751c886f2d00e46d3c0a20fabbe0db4231db0d5d"
          test "$(git hash-object src/fmp/portfolio/exp015_stage_a_operator.py)" = "3f2bca609ab6c1cd324f95c47be99584b11d9d90"
          test "$(git hash-object scripts/phase8a_exp015_stage_a_operator.py)" = "11010d32842b0f0ab829e0cc20d4654a7d5dcf2e"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned EXP-015 operator runtime without mutating checkout
        run: python -m pip install -r requirements/exp015-stage-a-operator.txt

      - name: Require clean checkout after dependency installation
        run: test -z "$(git status --porcelain)"

      - name: Run exact DEC-265 read-only operator plan
        run: |
          set -euo pipefail
          python scripts/phase8a_exp015_stage_a_operator.py next > "$RUNNER_TEMP/operator-plan.json"

      - name: Verify missing-slot read-only plan
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "operator-plan.json"
              ).read_text(encoding="utf-8")
          )

          assert plan["operator_decision"] == "DEC-265"
          assert plan["operator_read_only"] is True
          assert plan["dec264_merged_commit"] == "92ef2668b1a0cb416e7f772a8a061d2f280005a1"
          assert plan["dec264_guarded_workflow_blob_sha"] == (
              "ae8bdfbdb1bcfd62204a1bd0ec32dddfd9938930"
          )
          assert plan["dec264_terminal_review_blob_sha"] == (
              "751c886f2d00e46d3c0a20fabbe0db4231db0d5d"
          )
          assert plan["run_present"] is False
          assert plan["run_state"] == "MISSING"
          assert plan["run_id"] is None
          assert plan["stage"] == "EXP015_STAGE_A_READ_ONLY_PROOF_REQUIRED"
          assert plan["authoritative_slot_available"] is True
          assert plan["read_only_proof_required"] is True
          assert plan["planned_dispatch_command"] == (
              "gh workflow run "
              "phase8a-exp015-stage-a.yml "
              "--ref main -R Dtwosam/FMP"
          )

          for field in (
              "stage_a_dispatch_authorized",
              "stage_a_executor_authorized",
              "stage_a_retry_authorized",
              "stage_a_replacement_authorized",
              "stage_b_execution_authorized",
              "stage_c_execution_authorized",
              "portfolio_selection_authorized",
              "phase8a_acceptance_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert plan[field] is False, field
          PY

      - name: Upload immutable read-only operator plan
        uses: actions/upload-artifact@v6
        with:
          name: exp015-dec265-stage-a-read-only-plan-${{ github.sha }}
          path: ${{ runner.temp }}/operator-plan.json
          if-no-files-found: error
