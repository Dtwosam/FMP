name: phase8a-annual-catalogue-2020-run382-runtime-evidence-recovery-push

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2020-run382-runtime-evidence-recovery-push.yml

permissions:
  contents: read
  actions: read

jobs:
  recover-dec579-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: "37443770076"
      TARGET_HEAD_SHA: "681e81e021d4970a67b18370142d55b17ec68864"
      TARGET_RUN_NUMBER: "382"
      RECOVERY_DISPATCHER_RUN_ID: "37443726793"
      RECOVERY_DISPATCHER_ARTIFACT_ID: "11402975356"
      RECOVERY_DISPATCHER_ARTIFACT_DIGEST: "sha256:2f0c084420cff57989cc72f79b68dc63d730a5df29c6cbf03d30e2e70f75f25a"
      FREEZE_ARTIFACT_ID: "11402652816"
      FREEZE_ARTIFACT_DIGEST: "sha256:c42e50f8eba75f9626e179d6567ce78e9849393975ff59c8a1bc2e8a8a73e183"

    steps:
      - name: Checkout exact run-382 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Require exact first read-only recovery push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$TARGET_RUN_NUMBER" = "382"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main.json")" = "$GITHUB_SHA"

      - name: Require frozen DEC-579 recovery sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_run382_recovery_evidence_review.py)" = "7c721121197b83e687fd2c76773773f8ab4c07ae"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2020_run382_recovery_evidence_review.py)" = "260d38c31182eafaeb64741f447df297b2640ef4"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_run382_dispatch_recovery_authorization.py)" = "cd170c2386034930f53645498f7d24ec13442b71"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2020-run382-dispatch-recovery.yml)" = "74074bf13937f93e0f8014066e04151fce90893f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_dispatch_action_preflight.py)" = "26b2148f0d1f49eb8b817f2b2504a11dcb99199a"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2020_runtime_authorization.py)" = "695a50b418da752e1bd37d6302f209033ab611f5"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "4e124365430672fa63825b272001937c60151644"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Require exact annual history and absent prior DEC-579 run
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2020-run382-runtime-evidence-recovery.yml/runs?per_page=100" > "$RUNNER_TEMP/dec579-runs.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          rows = json.loads(
              (temp / "annual-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs")
          assert isinstance(rows, list)
          assert len(rows) == 8
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380, 381, 382}
          exact = {
              1: (
                  37126711695,
                  "fd85a886d07234ad584dcca08692b37e6af54b2e",
                  "failure",
              ),
              376: (
                  37191637168,
                  "4c14fa7db6eb812b89ecb79201f7e298fa9c04f3",
                  "failure",
              ),
              377: (
                  37198002653,
                  "a89db974be9a94481e7ed0990476bc661012f1e4",
                  "success",
              ),
              378: (
                  37206992367,
                  "2524fde355349581c9440a172d0384c3cbce31ed",
                  "success",
              ),
              379: (
                  37227536041,
                  "7b4c1ef8573e280c067443b72f1534d9091d5b7f",
                  "success",
              ),
              380: (
                  37237817538,
                  "30971a996f514670a6f836d8e45cf80137197a4f",
                  "success",
              ),
              381: (
                  37310525635,
                  "8bcee3a7a834743f08bd9ad73109bfc09609a2fe",
                  "success",
              ),
              382: (
                  37443770076,
                  "681e81e021d4970a67b18370142d55b17ec68864",
                  "success",
              ),
          }
          for number, (run_id, head_sha, conclusion) in exact.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["head_sha"] == head_sha
              assert row["run_attempt"] == 1
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          assert not any(row["run_number"] >= 383 for row in rows)

          prior = json.loads(
              (temp / "dec579-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs")
          assert isinstance(prior, list)
          assert prior == []
          PY

      - name: Fetch exact run 382 and DEC-578 recovery evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" > "$RUNNER_TEMP/run382.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/run382-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/run382-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_DISPATCHER_RUN_ID" > "$RUNNER_TEMP/dec578-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_DISPATCHER_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec578-artifacts.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "run382.json").read_text(encoding="utf-8"))
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 382,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          dispatcher = json.loads(
              (temp / "dec578-run.json").read_text(encoding="utf-8")
          )
          exact_dispatcher = {
              "id": int(os.environ["RECOVERY_DISPATCHER_RUN_ID"]),
              "name": "phase8a-annual-catalogue-2020-run382-dispatch-recovery",
              "path": ".github/workflows/phase8a-annual-catalogue-2020-run382-dispatch-recovery.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact_dispatcher.items():
              assert dispatcher.get(field) == expected, (
                  field,
                  dispatcher.get(field),
                  expected,
              )

          artifacts = json.loads(
              (temp / "dec578-artifacts.json").read_text(encoding="utf-8")
          )
          matches = [
              row
              for row in artifacts.get("artifacts", [])
              if row.get("id") == int(os.environ["RECOVERY_DISPATCHER_ARTIFACT_ID"])
              and row.get("expired") is False
              and row.get("digest") == os.environ["RECOVERY_DISPATCHER_ARTIFACT_DIGEST"]
          ]
          assert len(matches) == 1
          assert matches[0]["name"] == (
              "annual-catalogue-2020-dec578-run382-recovery-dispatch-"
              + os.environ["RECOVERY_DISPATCHER_RUN_ID"]
          )

          run_artifacts = json.loads(
              (temp / "run382-artifacts.json").read_text(encoding="utf-8")
          )
          assert len(run_artifacts.get("artifacts", [])) == 20
          freeze = [
              row
              for row in run_artifacts.get("artifacts", [])
              if row.get("id") == int(os.environ["FREEZE_ARTIFACT_ID"])
              and row.get("expired") is False
              and row.get("digest") == os.environ["FREEZE_ARTIFACT_DIGEST"]
          ]
          assert len(freeze) == 1
          assert freeze[0]["name"] == (
              "phase8a-annual-catalogue-freeze-2020-"
              + os.environ["TARGET_HEAD_SHA"]
          )
          PY

      - name: Download exact DEC-578 recovery receipt
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_DISPATCHER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/dec578.zip"
          expected_sha="${RECOVERY_DISPATCHER_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec578.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec578"
          unzip -q "$RUNNER_TEMP/dec578.zip" -d "$RUNNER_TEMP/dec578"
          receipt="$(
            find "$RUNNER_TEMP/dec578" -type f -name 'dec578-run382-recovery-dispatch-receipt.json' -print
          )"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec578-run382-recovery-dispatch-receipt.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec578-run382-recovery-dispatch-receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert receipt["decision"] == "DEC-578"
          assert receipt["recovery_run_id"] == 37443726793
          assert receipt["recovery_run_number"] == 1
          assert receipt["recovery_run_attempt"] == 1
          assert receipt["recovery_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["recovery_authorization_fingerprint_sha256"] == (
              "135e2d329ea1c3bf4b3e8e4fa3bfc8a0712471a8e347f905172767cba8ca058a"
          )
          assert receipt["failed_dispatcher_decision"] == "DEC-576"
          assert receipt["failed_dispatcher_run_id"] == 37390547252
          assert receipt["failed_dispatcher_job_id"] == 112034309419
          assert receipt["failed_dispatcher_dispatched_annual_run"] is False
          assert receipt["annual_segment_label"] == "2020"
          assert receipt["previous_annual_freeze_run_id"] == 37310525635
          assert receipt["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert receipt["run_number"] == 382
          assert receipt["run_attempt"] == 1
          assert receipt["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["dispatch_submitted"] is True
          assert receipt["result_claimed"] is False
          assert receipt["run_383_or_later_authorized"] is False
          assert receipt["trading_authorized"] is False
          PY

      - name: Download exact 2020 annual freeze
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$FREEZE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/run382-freeze.zip"
          expected_sha="${FREEZE_ARTIFACT_DIGEST#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/run382-freeze.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha" > "$RUNNER_TEMP/run382-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run382-freeze"
          unzip -q "$RUNNER_TEMP/run382-freeze.zip" -d "$RUNNER_TEMP/run382-freeze"
          freeze="$(
            find "$RUNNER_TEMP/run382-freeze" -type f -name annual-freeze.json -print
          )"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2020.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          freeze = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "annual-freeze-2020.json"
              ).read_text(encoding="utf-8")
          )
          assert freeze["annual_segment_label"] == "2020"
          assert freeze["code_commit"] == os.environ["TARGET_HEAD_SHA"]
          assert freeze["annual_cell_count"] == 18
          assert freeze["directional_record_count"] == 89460
          assert freeze["evidence_fingerprint"] == (
              "53cd4475b2e9f70252bc4962666ce421daf7795d3e78defbb38ec948448e1c3c"
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean review checkout
        run: test -z "$(git status --porcelain)"

      - name: Review and bind exact recovered run 382
        run: |
          set -euo pipefail
          freeze_sha="$(cat "$RUNNER_TEMP/run382-freeze-zip-sha256.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2020_run382_recovery_evidence_review.py             review             --run-json "$RUNNER_TEMP/run382.json"             --jobs-json "$RUNNER_TEMP/run382-jobs.json"             --artifacts-json "$RUNNER_TEMP/run382-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2020.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dec578-run382-recovery-dispatch-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2020-recovery.json"

      - name: Verify recovered DEC-579 binding remains non-authorizing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "runtime-binding-2020-recovery.json"
              ).read_text(encoding="utf-8")
          )
          assert binding["decision"] == "DEC-579"
          assert binding["annual_segment_label"] == "2020"
          assert binding["run_id"] == 37443770076
          assert binding["run_number"] == 382
          assert binding["run_attempt"] == 1
          assert binding["run_head_sha"] == (
              "681e81e021d4970a67b18370142d55b17ec68864"
          )
          assert binding["previous_annual_freeze_run_id"] == 37310525635
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["source_dispatch_receipt_decision"] == "DEC-578"
          assert binding["dispatch_receipt_bound"] is True
          assert binding["recovery_dispatch_receipt_bound"] is True
          assert binding["recovery_authorization_fingerprint_sha256"] == (
              "135e2d329ea1c3bf4b3e8e4fa3bfc8a0712471a8e347f905172767cba8ca058a"
          )
          assert binding["freeze_artifact_zip_sha256"] == (
              "c42e50f8eba75f9626e179d6567ce78e9849393975ff59c8a1bc2e8a8a73e183"
          )
          assert binding["freeze_evidence_fingerprint"] == (
              "53cd4475b2e9f70252bc4962666ce421daf7795d3e78defbb38ec948448e1c3c"
          )
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          assert binding["next_segment_execution_authorized"] is False
          assert binding["cross_year_result_production_authorized"] is False
          assert binding["strategy_v1_synthesis_authorized"] is False
          assert binding["promotion_authorized"] is False
          assert binding["phase8b_authorized"] is False
          assert binding["demo_order_authorized"] is False
          assert binding["broker_mutation_authorized"] is False
          assert binding["live_order_authorized"] is False
          assert binding["real_money_authorized"] is False
          assert binding["trading_authorized"] is False
          assert binding["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2021_EXECUTION_PREFLIGHT"
          )
          PY

      - name: Upload immutable recovered DEC-579 runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2020-dec579-runtime-binding-recovery-push-${{ env.TARGET_RUN_ID }}
          path: |
            ${{ runner.temp }}/main.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec579-runs.json
            ${{ runner.temp }}/run382.json
            ${{ runner.temp }}/run382-jobs.json
            ${{ runner.temp }}/run382-artifacts.json
            ${{ runner.temp }}/dec578-run.json
            ${{ runner.temp }}/dec578-artifacts.json
            ${{ runner.temp }}/dec578-run382-recovery-dispatch-receipt.json
            ${{ runner.temp }}/run382-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2020.json
            ${{ runner.temp }}/runtime-binding-2020-recovery.json
          if-no-files-found: error
