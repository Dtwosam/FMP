name: phase4-exp006-predeclare-patch

on:
  push:
    branches:
      - phase4-session-sweep-design
    paths:
      - .github/workflows/phase4-exp006-predeclare-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-session-sweep-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch approved EXP-006 predeclaration
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('docs/superpowers/specs/2026-09-14-phase4-session-sweep-rejection-design.md')
          text = spec.read_text(encoding='utf-8')
          old_status = '**Status:** APPROVED IN CHAT — written-spec review pending  '
          old_decision = '**Decision:** `DEC-026` (to be formalized only after written-spec approval)'
          assert old_status in text
          assert old_decision in text
          text = text.replace(old_status, '**Status:** APPROVED — PREDECLARED', 1)
          text = text.replace(old_decision, '**Decision:** `DEC-026` — APPROVED', 1)
          spec.write_text(text, encoding='utf-8')

          decision = Path('docs/decision-log.md')
          text = decision.read_text(encoding='utf-8')
          index_old = '- DEC-025 — Phase 4 volatility-breakout experiment outcome — APPROVED\n'
          index_new = index_old + '- DEC-026 — Phase 4 session high/low sweep-rejection baseline protocol — APPROVED\n'
          assert index_old in text
          assert '## DEC-026 — Phase 4 session high/low sweep-rejection baseline protocol' not in text
          text = text.replace(index_old, index_new, 1)
          text += '''\n\n## DEC-026 — Phase 4 session high/low sweep-rejection baseline protocol\n\n**Date:** 2026-09-14\n**Status:** APPROVED\n\nThe sixth sequential Phase 4 family is the deterministic Asian-session high/low sweep-rejection baseline recorded as `EXP-20260914-006`. The approved written design is `docs/superpowers/specs/2026-09-14-phase4-session-sweep-rejection-design.md`. DEC-018 remains authoritative for the chronological split, final-test isolation, left-labelled timing bridge, source-free research boundary, historical BID/ASK execution, shared cost model, and accepted Phase 3 risk policy.\n\n- Pairs are EURUSD, GBPUSD, and USDJPY; signal timeframes are 5m, 15m, and 1h.\n- The frozen reference session is exactly `[00:00, 08:00) Europe/London` at the tested timeframe, with exact cadence and finite midpoint OHLC required. The reference high, low, and midpoint are frozen for the London date.\n- Eligible current observation labels are 08:00 through 14:00 inclusive; exact mandatory flat is 16:00 London local. Time conversion must be DST-aware.\n- Penetration buffers are exactly 0, 2, and 5 pips. These are the only strategy configurations.\n- SHORT requires previous midpoint close `<= reference_high`, current midpoint high `>= reference_high + buffer`, and current midpoint close strictly `< reference_high`. LONG is symmetric at the frozen reference low.\n- A bar satisfying both directional predicates fails closed as `AMBIGUOUS_DUAL_SESSION_SWEEP`.\n- Only the first qualifying directional sweep/rejection per symbol/configuration/London date may become a candidate. A later Phase 3 rejection does not permit a retry that date.\n- LONG stop is the signal midpoint low; SHORT stop is the signal midpoint high; target is the frozen session midpoint. Invalid signal-time or executable geometry is never repaired, chased, widened, or retried.\n- Candidate generation and bytes for a fixed pair/timeframe/split/buffer are identical across costs.\n- Development/validation evidence is exactly 3 pairs × 3 timeframes × 2 splits × 3 buffers × 3 adverse-slippage scenarios = 162 benchmark rows.\n- Adverse slippage remains exactly 0.2, 0.5, and 1.0 pips per fill; commission and financing remain zero; historical BID/ASK spread remains authoritative.\n- Phase 3 risk settings remain unchanged: requested risk/trade 0.25%; hard max risk/trade 0.50%; maximum simultaneous open risk 1.00%; daily realized-loss halt 1.50% of UTC day-start realized risk equity.\n- Promotion begins at 0.2-pip slippage: the same buffer must have positive net return, positive expectancy/trade, and profit factor above one on both development and validation. Survivors then receive the established 0.5-pip robustness, neighboring-buffer, subperiod, sample-size, drawdown, and top-winner review; 1.0 pip remains diagnostic.\n- No post-result parameter expansion, alternate reference session, extra buffer, target retuning, stop retuning, or rescue rule is permitted under `EXP-20260914-006`.\n- Normal EXP-006 tooling cannot access the final 2024-01-01 through 2026-08-20 split.\n\nConsequences: EXP-006 implementation and development/validation benchmarking are authorized only after this protocol is present on the result-producing implementation head. The two serious candidates from EXP-001 and EXP-005 remain frozen unchanged. Phase 4 remains ACTIVE; final-test access, Phase 5, broker/live integration, and real-money trading remain locked; DEC-008 remains unchanged.\n'''
          decision.write_text(text, encoding='utf-8')

          state = Path('docs/project-state.md')
          text = state.read_text(encoding='utf-8')
          old_next = '**Next milestone:** Design and predeclare the sixth Phase 4 baseline family, session high/low sweep/rejection; both serious candidates remain frozen unchanged and final-test data remains locked'
          new_next = '**Next milestone:** Implement and benchmark the predeclared EXP-20260914-006 session high/low sweep-rejection family under DEC-026; both serious candidates remain frozen unchanged and final-test data remains locked'
          assert old_next in text
          text = text.replace(old_next, new_next, 1)
          old_decisions = 'DEC-024 freezes the EXP-005 rolling volatility-breakout protocol, and DEC-025 records the EXP-005 PASS / PROMOTE outcome while DEC-018 remains authoritative for shared research rules.'
          new_decisions = 'DEC-024 freezes the EXP-005 rolling volatility-breakout protocol, DEC-025 records the EXP-005 PASS / PROMOTE outcome, and DEC-026 freezes the EXP-006 session high/low sweep-rejection protocol while DEC-018 remains authoritative for shared research rules.'
          assert old_decisions in text
          text = text.replace(old_decisions, new_decisions, 1)
          marker = '\nPhase 4 remains ACTIVE. Two serious research candidates are retained unchanged:'
          assert marker in text
          block = '''\n\n### EXP-20260914-006 — Session high/low sweep-rejection baseline\n\n- experiment status: PREDECLARED\n- protocol decision: DEC-026 APPROVED\n- design / predeclaration: `docs/superpowers/specs/2026-09-14-phase4-session-sweep-rejection-design.md`\n- pairs/timeframes: EURUSD, GBPUSD, USDJPY × 5m/15m/1h\n- frozen reference: exact `[00:00, 08:00) Europe/London` midpoint session high/low/midpoint\n- frozen grid: penetration buffers exactly 0/2/5 pips\n- signal window: current labels 08:00 through 14:00 Europe/London; strict close back inside after boundary penetration\n- ambiguity: dual-side sweep fails closed; first qualifying directional setup only; no same-day retry\n- geometry: signal-bar midpoint extreme stop; frozen session-midpoint target; exact 16:00 London flat\n- cost scenarios: 0.2/0.5/1.0 pips adverse slippage per fill; zero commission/financing; historical BID/ASK spread authoritative\n- planned matrix: 18 pair/timeframe/split cells × 3 buffers × 3 costs = 162 benchmark rows\n- promotion gate: same buffer must have positive net return, positive expectancy, and PF > 1 on both development and validation at 0.2-pip baseline before downstream robustness review\n- final untouched test: 2024-01-01 through 2026-08-20 inclusive\n- Final-test touched: NO\n- no post-result parameter expansion, alternate reference session, extra buffer, target/stop retuning, or rescue rule is authorized\n'''
          text = text.replace(marker, block + marker, 1)
          text = text.replace(
              'The next baseline family is the sixth planned session high/low sweep/rejection family.',
              'EXP-20260914-006 is PREDECLARED under DEC-026 and authorized for implementation plus development/validation benchmarking only under the frozen protocol.',
              1,
          )
          state.write_text(text, encoding='utf-8')

          test = Path('tests/test_phase4_session_sweep_state.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass SessionSweepStateTests(unittest.TestCase):\n    def test_exp006_is_predeclared_and_locked_to_approved_protocol(self) -> None:\n        decisions = (ROOT / "docs/decision-log.md").read_text(encoding="utf-8")\n        spec = (ROOT / "docs/superpowers/specs/2026-09-14-phase4-session-sweep-rejection-design.md").read_text(encoding="utf-8")\n        state = (ROOT / "docs/project-state.md").read_text(encoding="utf-8")\n\n        self.assertIn("DEC-026 — Phase 4 session high/low sweep-rejection baseline protocol", decisions)\n        self.assertIn("**Status:** APPROVED — PREDECLARED", spec)\n        self.assertIn("**Decision:** `DEC-026` — APPROVED", spec)\n        self.assertIn("[00:00, 08:00) Europe/London", spec)\n        self.assertIn("0 pips;", spec)\n        self.assertIn("2 pips;", spec)\n        self.assertIn("5 pips.", spec)\n        self.assertIn("08:00 through 14:00", spec)\n        self.assertIn("16:00", spec)\n        self.assertIn("AMBIGUOUS_DUAL_SESSION_SWEEP", spec)\n        self.assertIn("There is no same-day retry", spec)\n        self.assertIn("18 × 3 × 3 = 162", spec)\n        self.assertIn("Normal EXP-006 tooling must reject any final-split request before loading market data", spec)\n\n        self.assertIn("experiment status: PREDECLARED", state)\n        self.assertIn("DEC-026 APPROVED", state)\n        self.assertIn("Final-test touched: NO", state)\n        self.assertIn("## Phase 5 — UNSTARTED", state)\n        self.assertIn("Real-money trading remains locked", state)\n        self.assertIn("USDJPY 15m", state)\n        self.assertIn("USDJPY 1h / 2.0x", state)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Commit predeclaration patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/decision-log.md docs/project-state.md docs/superpowers/specs/2026-09-14-phase4-session-sweep-rejection-design.md tests/test_phase4_session_sweep_state.py
          git diff --cached --check
          git commit -m "[phase1-no-source] Predeclare EXP-006 session sweep rejection"
          git push origin HEAD:phase4-session-sweep-design
