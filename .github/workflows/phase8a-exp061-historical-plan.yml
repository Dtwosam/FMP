name: phase8a-exp061-historical-plan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-exp061-historical-plan.yml
      - scripts/phase8a_exp061_historical_operator.py
      - src/fmp/discovery/historical_operator.py
      - src/fmp/discovery/historical_run_authorization.py
      - requirements/exp061-discovery-run.txt

permissions:
  contents: read
  actions: read

jobs:
  read-only-historical-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact merged-main push
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Require frozen DEC-280/281/282 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/proof_result_decision.py)" = "fbed3788ab0c1c1e00dccfe0f84a293ff04f6ccd"
          test "$(git hash-object src/fmp/discovery/historical_run_authorization.py)" = "1eab1cee2fc81441cf1c3168cc73275cd29addf5"
          test "$(git hash-object src/fmp/discovery/historical_operator.py)" = "1ffef37d94b04a8206f665c375dc0b2642c4caa9"
          test "$(git hash-object scripts/phase8a_exp061_historical_operator.py)" = "4d667d05ef2a5bd672cb9d98a81f13dd2ba9370c"
          test "$(git hash-object .github/workflows/phase8a-exp061-discovery.yml)" = "d4eb02d380ae8c9a5b95e6520cbb7ca192254cb9"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned EXP-061 runtime without editable checkout
        run: python -m pip install -r requirements/exp061-discovery-run.txt

      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Fetch current main and exact EXP-061 run inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp061-discovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"

      - name: Run exact DEC-282 read-only historical plan
        run: |
          set -euo pipefail
          python scripts/phase8a_exp061_historical_operator.py plan             --main-json "$RUNNER_TEMP/main.json"             --runs-json "$RUNNER_TEMP/runs.json"             --expected-head "$GITHUB_SHA"             > "$RUNNER_TEMP/historical-plan.json"

      - name: Verify slot-available plan and all locks
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "historical-plan.json"
              ).read_text(encoding="utf-8")
          )

          assert plan["decision"] == "DEC-282"
          assert plan["operator_version"] == "fmp-exp061-historical-operator-v1"
          assert plan["authorization_decision"] == "DEC-281"
          assert plan["authorization_version"] == (
              "fmp-exp061-historical-run-authorization-v1"
          )
          assert plan["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert plan["stage"] == "EXP061_HISTORICAL_RESULT_SLOT_AVAILABLE"
          assert plan["proof_run_id"] == 36319888985
          assert plan["proof_run_count"] == 1
          assert plan["historical_result_attempt_count"] == 0
          assert plan["historical_result_run_id"] is None
          assert plan["historical_result_slot_consumed"] is False
          assert plan["planned_dispatch_command"] == (
              "gh workflow run phase8a-exp061-discovery.yml --ref main"
          )
          assert plan["historical_result_slot_source_authorized"] is True

          for field in (
              "historical_result_dispatch_authorized",
              "historical_execute_mode_available",
              "historical_discovery_execution_authorized",
              "discovery_result_authorized",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "reserved_robustness_access_authorized",
              "candidate_compilation_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert plan[field] is False, field
          PY

      - name: Upload immutable DEC-283 historical plan proof
        uses: actions/upload-artifact@v6
        with:
          name: exp061-dec283-historical-plan-${{ github.sha }}
          path: ${{ runner.temp }}/historical-plan.json
          if-no-files-found: error
