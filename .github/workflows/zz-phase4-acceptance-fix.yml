name: zz-phase4-acceptance-fix

on:
  push:
    branches:
      - phase4-acceptance-closure
    paths:
      - .github/workflows/zz-phase4-acceptance-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-acceptance-closure
      - name: Remove new Phase status trailing spaces
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_phase4_acceptance_closure_once.py')
          text = path.read_text(encoding='utf-8')
          old = '**Phase status:** PASS  \\n**Next milestone:**'
          new = '**Phase status:** PASS\\n**Next milestone:**'
          if old not in text:
              raise SystemExit('target replacement not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit script-only fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/_phase4_acceptance_closure_once.py
          git commit -m '[phase1-no-source] Fix Phase 4 acceptance whitespace guard'
          git push origin HEAD:phase4-acceptance-closure
