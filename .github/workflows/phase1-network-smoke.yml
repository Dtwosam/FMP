name: phase1-network-smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/fmp/data/**'
      - 'tests/**'
      - '.github/workflows/phase1-network-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-dukascopy-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire paced multi-day EURUSD sample
        env:
          PYTHONPATH: src
        run: |
          python -m fmp.data.cli fetch \
            --pair EURUSD \
            --start 2024-01-02 \
            --end 2024-01-08 \
            --out .phase1-smoke \
            --attempts 8 \
            --source-delay 5 \
            --timeout 30
      - name: Verify full bounded sample provenance
        env:
          PYTHONPATH: src
        run: |
          python -m fmp.data.cli verify \
            --pair EURUSD \
            --start 2024-01-02 \
            --end 2024-01-08 \
            --out .phase1-smoke
      - name: Show acquisition coverage
        env:
          PYTHONPATH: src
        run: python -m fmp.data.cli coverage --out .phase1-smoke
