name: phase8a-annual-catalogue-2019-dispatch-authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2019-dispatch-authorization.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC562_RUN_ID: "37305622078"
      DEC562_HEAD_SHA: "236fc332c3d0fb0ad52a25038e764cd0f4e5d49f"
      DEC562_ARTIFACT_ID: "11344155034"
      DEC562_ARTIFACT_DIGEST: "sha256:b7245744efdd4cd646b8eac6f094e9198e0f4d0cd2d36883c70685fa0feffbb7"
      DEC562_PREFLIGHT_FINGERPRINT: "b02c7c68f682f9706e3f9e4a6e4ade7826e1abb47d01330f543279221063fe45"

    steps:
      - name: Checkout exact DEC-563 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only authorization push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-563 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_dispatch_authorization.py)" = "aa614fd67367a53be2889651a701b63f1ef2a7c9"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2019_dispatch_authorization.py)" = "f35a9de76f8db031109657eacce69a494e29beaa"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_dispatch_preflight.py)" = "4d1313ac3f79638e252c9d0e4f87844d387d73bc"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_runtime_authorization.py)" = "d87fe85a5b426fa92caf7d6cc165445590f4097c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "07ddfe7a968de10cd1d4f8592760cc9eb9e6300e"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Fetch and verify exact DEC-562 preflight evidence
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC562_RUN_ID" > "$RUNNER_TEMP/dec562-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC562_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec562-artifacts.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec562-run.json").read_text())
          exact = {
              "id": 37305622078,
              "name": "phase8a-annual-catalogue-2019-dispatch-preflight",
              "path": ".github/workflows/phase8a-annual-catalogue-2019-dispatch-preflight.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "236fc332c3d0fb0ad52a25038e764cd0f4e5d49f",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)

          payload = json.loads((temp / "dec562-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11344155034]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == (
              "annual-catalogue-2019-dec562-dispatch-preflight-"
              "236fc332c3d0fb0ad52a25038e764cd0f4e5d49f"
          )
          assert artifact["digest"] == (
              "sha256:b7245744efdd4cd646b8eac6f094e9198e0f4d0cd2d36883c70685fa0feffbb7"
          )
          assert artifact["expired"] is False
          PY

          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC562_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec562.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec562.zip" | awk '{print $1}')"
          test "$actual" = "b7245744efdd4cd646b8eac6f094e9198e0f4d0cd2d36883c70685fa0feffbb7"

          mkdir -p "$RUNNER_TEMP/dec562"
          unzip -q "$RUNNER_TEMP/dec562.zip" -d "$RUNNER_TEMP/dec562"
          preflight="$(find "$RUNNER_TEMP/dec562" -type f -name dec562-2019-dispatch-preflight.json -print)"
          test "$(printf '%s\n' "$preflight" | sed '/^$/d' | wc -l)" = "1"
          cp "$preflight" "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json"

          test "$(jq -r '.decision' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "DEC-562"
          test "$(jq -r '.expected_head_sha' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "$DEC562_HEAD_SHA"
          test "$(jq -r '.preflight_fingerprint_sha256' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "$DEC562_PREFLIGHT_FINGERPRINT"
          test "$(jq -r '.expected_run_number' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "381"
          test "$(jq -r '.expected_run_attempt' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "1"
          test "$(jq -r '.previous_annual_freeze_run_id' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "37237817538"
          test "$(jq -r '.preflight_read_only' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "true"
          test "$(jq -r '.annual_workflow_dispatch_authorized' "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json")" = "false"

      - name: Recheck current main and unconsumed run-381 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"

          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_runtime_authorization.py)" = "d87fe85a5b426fa92caf7d6cc165445590f4097c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "07ddfe7a968de10cd1d4f8592760cc9eb9e6300e"

          python - <<'PY'
          import json, os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text()
          )["workflow_runs"]
          assert len(rows) == 6
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380}
          assert not any(
              isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 381
              for row in rows
          )
          expected = {
              1: (37126711695, "failure"),
              376: (37191637168, "failure"),
              377: (37198002653, "success"),
              378: (37206992367, "success"),
              379: (37227536041, "success"),
              380: (37237817538, "success"),
          }
          for number, (run_id, conclusion) in expected.items():
              row = by_number[number]
              assert row["id"] == run_id
              assert row["run_attempt"] == 1
              assert row["event"] == "workflow_dispatch"
              assert row["head_branch"] == "main"
              assert row["status"] == "completed"
              assert row["conclusion"] == conclusion
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned authorization dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean authorization checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-563 authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2019_dispatch_authorization.py             authorize             --preflight-json "$RUNNER_TEMP/dec562-2019-dispatch-preflight.json"             --authorization-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec563-2019-dispatch-authorization.json"

      - name: Verify DEC-563 is source-only and run-381 exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          value = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec563-2019-dispatch-authorization.json"
              ).read_text()
          )
          assert value["decision"] == "DEC-563"
          assert value["source_preflight_workflow_run_id"] == 37305622078
          assert value["source_preflight_artifact_id"] == 11344155034
          assert value["source_preflight_fingerprint_sha256"] == (
              "b02c7c68f682f9706e3f9e4a6e4ade7826e1abb47d01330f543279221063fe45"
          )
          assert value["authorization_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["annual_segment_label"] == "2019"
          assert value["previous_annual_freeze_run_id"] == 37237817538
          assert value["expected_run_number"] == 381
          assert value["expected_run_attempt"] == 1
          assert value["runtime_authorization_installed"] is True
          assert value["runtime_gate_active"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["historical_artifact_read_authorized"] is True
          assert value["historical_catalogue_execution_authorized"] is True
          assert value["historical_result_production_authorized"] is True
          assert value["authorization_contract_validated"] is True
          assert value["source_only_authorization"] is True
          for field in (
              "dispatch_command_present",
              "dispatch_action_executed",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "run_382_or_later_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-563 authorization
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2019-dec563-dispatch-authorization-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec562-run.json
            ${{ runner.temp }}/dec562-artifacts.json
            ${{ runner.temp }}/dec562-2019-dispatch-preflight.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec563-2019-dispatch-authorization.json
          if-no-files-found: error
