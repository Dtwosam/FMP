name: phase8a-exp062-active-one-shot-historical-executor-dispatch-preflight-proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-exp062-active-one-shot-historical-executor-dispatch-preflight-proof.yml
      - .github/workflows/phase8a-exp062-one-shot-historical-executor.yml
      - .github/workflows/phase8a-exp062-discovery.yml
      - src/fmp/discovery/exp062_historical_active_one_shot_executor_workflow_install_receipt.py
      - src/fmp/discovery/exp062_historical_active_one_shot_executor_dispatch_preflight.py
      - scripts/phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight.py
      - requirements/exp061-discovery-run.txt

permissions:
  contents: read
  actions: read

jobs:
  read-only-active-one-shot-historical-executor-dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact first merged-main DEC-426 proof push
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Require frozen DEC-424/425 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/exp062_historical_active_one_shot_executor_workflow_install_receipt.py)" = "27e714620018413a09ceaf287fb7943bf884ee49"
          test "$(git hash-object src/fmp/discovery/exp062_historical_active_one_shot_executor_dispatch_preflight.py)" = "1978f71bb11097613d3820127f7a04ce2bf81adb"
          test "$(git hash-object scripts/phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight.py)" = "ef0f6df22d9208b6de8037585d706a1bb1e9eda4"
          test "$(git hash-object .github/workflows/phase8a-exp062-one-shot-historical-executor.yml)" = "51ce87584369be957482460d81649adb1cb9f05d"
          test "$(git hash-object .github/workflows/phase8a-exp062-discovery.yml)" = "1a7d42fd8d03d6ca3eae722209b1ad2a5dd2bc50"
          test "$(git hash-object requirements/exp061-discovery-run.txt)" = "1ff32214dee10d877a067e750cd69ffad96d5fe5"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned planning runtime without editable checkout
        run: python -m pip install -r requirements/exp061-discovery-run.txt

      - name: Require clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Fetch current main and exact EXP-062 inventories
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-one-shot-historical-executor.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/executor-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-exp062-discovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/discovery-runs.json"

      - name: Run exact DEC-425 read-only installed executor dispatch preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_exp062_active_one_shot_historical_executor_dispatch_preflight.py plan \
            --main-json "$RUNNER_TEMP/main.json" \
            --executor-runs-json "$RUNNER_TEMP/executor-runs.json" \
            --discovery-runs-json "$RUNNER_TEMP/discovery-runs.json" \
            --expected-head "$GITHUB_SHA" \
            > "$RUNNER_TEMP/active-one-shot-historical-executor-dispatch-preflight.json"

      - name: Verify installed executor preflight and all runtime locks
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "active-one-shot-historical-executor-dispatch-preflight.json"
              ).read_text(encoding="utf-8")
          )

          assert plan["decision"] == "DEC-425"
          assert plan["version"] == (
              "fmp-exp062-active-one-shot-historical-executor-"
              "dispatch-preflight-v1"
          )
          assert plan["install_receipt_decision"] == "DEC-424"
          assert plan["dec424_install_receipt_blob_sha"] == (
              "27e714620018413a09ceaf287fb7943bf884ee49"
          )
          assert plan["active_executor_workflow_blob_sha"] == (
              "51ce87584369be957482460d81649adb1cb9f05d"
          )
          assert plan["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert plan["stage"] == (
              "EXP062_ACTIVE_ONE_SHOT_HISTORICAL_EXECUTOR_"
              "DISPATCH_PREFLIGHT_INSTALLED_EXECUTOR_READY_RUNTIME_LOCKED"
          )
          assert plan["active_executor_workflow_present"] is True
          assert plan["historical_executor_workflow_install_authorized"] is True
          assert plan["historical_executor_workflow_installed"] is True
          assert plan["historical_executor_available"] is True
          assert plan["executor_workflow_run_count"] == 0
          assert plan["executor_workflow_run_id"] is None
          assert plan["historical_gate_proof_run_id"] == 36358289723
          assert plan["historical_result_attempt_count"] == 0
          assert plan["historical_result_slot_consumed"] is False
          assert plan["historical_result_slot_verified_available"] is True
          assert plan["expected_target_run_number"] == 2
          assert plan["expected_target_run_attempt"] == 1

          for field in (
              "historical_result_dispatch_authorized",
              "historical_execute_mode_available",
              "rerun_authorized",
              "retry_authorized",
              "replacement_run_authorized",
              "reserved_robustness_access_authorized",
              "candidate_compilation_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert plan[field] is False, field
          PY

      - name: Upload immutable DEC-426 installed executor dispatch-preflight proof
        uses: actions/upload-artifact@v6
        with:
          name: exp062-dec426-active-one-shot-historical-executor-dispatch-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/active-one-shot-historical-executor-dispatch-preflight.json
          if-no-files-found: error
