name: phase8a-annual-catalogue-2018-run380-runtime-evidence

on:
  workflow_run:
    workflows:
      - phase8a-annual-pattern-catalogue
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_run_id:
        required: true
        type: string
      target_head_sha:
        required: true
        type: string
      target_run_number:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review-bind-run380:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.run_number == 380 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      TARGET_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_id || github.event.workflow_run.id }}
      TARGET_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_head_sha || github.event.workflow_run.head_sha }}
      TARGET_RUN_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_run_number || github.event.workflow_run.run_number }}

    steps:
      - name: Checkout exact run-380 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Require exact successful 2018 run 380
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_run|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$TARGET_RUN_NUMBER" = "380"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"             > "$RUNNER_TEMP/run380.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "run380.json").read_text(
                  encoding="utf-8"
              )
          )
          exact = {
              "id": int(os.environ["TARGET_RUN_ID"]),
              "name": "phase8a-annual-pattern-catalogue",
              "path": ".github/workflows/phase8a-annual-pattern-catalogue.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": os.environ["TARGET_HEAD_SHA"],
              "run_number": 380,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          PY

      - name: Require frozen DEC-555 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_run380_evidence_review.py)" = "c44123cb04a8f476cf3efdb635bd1efb1d072df1"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py)" = "ff47d2f2ef43039dfcb88c1b9c65ce3d34428044"
          test "$(git hash-object .github/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml)" = "aaf2b566804182e064f84dc7956c20e4f99661fe"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_segment_evidence.py)" = "1b14279864f01a1284c5be31552eee9bb3a2220c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_dispatch_action_preflight.py)" = "67e2f0de14fe9ffcc8dce5473f816ed5c1ca9cb7"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2018_runtime_authorization.py)" = "cd50f50156cf74c34cd97d69d24291dc373b390f"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "410180c34a9e3500bbbb42310a5253b993ac7785"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Resolve exact successful DEC-554 dispatcher
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml/runs?event=push&branch=main&per_page=100"
          found=0
          for _ in $(seq 1 30); do
            gh api "$endpoint" > "$RUNNER_TEMP/dec554-runs.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec554-runs.json").read_text(
                  encoding="utf-8"
              )
          ).get("workflow_runs")
          assert isinstance(rows, list)
          matches = [
              row
              for row in rows
              if row.get("name")
              == "phase8a-annual-catalogue-2018-run380-dispatch"
              and row.get("path")
              == ".github/workflows/phase8a-annual-catalogue-2018-run380-dispatch.yml"
              and row.get("event") == "push"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["TARGET_HEAD_SHA"]
              and row.get("run_number") == 1
              and row.get("run_attempt") == 1
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
          ]
          assert len(matches) <= 1
          if len(matches) == 1:
              (
                  Path(os.environ["RUNNER_TEMP"]) / "dec554-run-id.txt"
              ).write_text(str(matches[0]["id"]) + "\n", encoding="utf-8")
          raise SystemExit(0 if len(matches) == 1 else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Download exact DEC-554 dispatch receipt
        run: |
          set -euo pipefail
          source_run_id="$(cat "$RUNNER_TEMP/dec554-run-id.txt")"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100"             > "$RUNNER_TEMP/dec554-artifacts.json"

          artifact_id="$(
            jq -r               '.artifacts[]
               | select(.name | startswith("annual-catalogue-2018-dec554-run380-dispatch-"))
               | select(.expired == false)
               | .id'               "$RUNNER_TEMP/dec554-artifacts.json"
          )"
          artifact_digest="$(
            jq -r               '.artifacts[]
               | select(.name | startswith("annual-catalogue-2018-dec554-run380-dispatch-"))
               | select(.expired == false)
               | .digest'               "$RUNNER_TEMP/dec554-artifacts.json"
          )"
          test "$(printf '%s\n' "$artifact_id" | sed '/^$/d' | wc -l)" = "1"
          test -n "$artifact_digest"
          case "$artifact_digest" in sha256:*) ;; *) exit 1 ;; esac

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/dec554.zip"
          expected_sha="${artifact_digest#sha256:}"
          actual_sha="$(sha256sum "$RUNNER_TEMP/dec554.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          mkdir -p "$RUNNER_TEMP/dec554"
          unzip -q "$RUNNER_TEMP/dec554.zip" -d "$RUNNER_TEMP/dec554"
          receipt="$(
            find "$RUNNER_TEMP/dec554"               -type f -name 'dec554-run380-dispatch-receipt.json' -print
          )"
          test "$(printf '%s\n' "$receipt" | sed '/^$/d' | wc -l)" = "1"
          cp "$receipt" "$RUNNER_TEMP/dec554-run380-dispatch-receipt.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "dec554-run380-dispatch-receipt.json"
              ).read_text(encoding="utf-8")
          )
          assert receipt["decision"] == "DEC-554"
          assert receipt["source_preflight_decision"] == "DEC-553"
          assert receipt["source_preflight_workflow_run_id"] == 37235949110
          assert receipt["source_preflight_artifact_id"] == 11315522989
          assert receipt["source_preflight_fingerprint_sha256"] == (
              "ba609f06481c1b08e10d16dc772290cd0f3988de9ba32eaa56c13b5561ab86c2"
          )
          assert receipt["dispatch_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["annual_segment_label"] == "2018"
          assert receipt["previous_annual_freeze_run_id"] == 37227536041
          assert receipt["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert receipt["run_number"] == 380
          assert receipt["run_attempt"] == 1
          assert receipt["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert receipt["dispatch_submitted"] is True
          assert receipt["result_claimed"] is False
          assert receipt["run_381_or_later_authorized"] is False
          assert receipt["trading_authorized"] is False
          PY

      - name: Fetch jobs and artifacts
        run: |
          set -euo pipefail
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/jobs?per_page=100"             > "$RUNNER_TEMP/run380-jobs.json"
          gh api             "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100"             > "$RUNNER_TEMP/run380-artifacts.json"

      - name: Download and verify 2018 annual freeze
        run: |
          set -euo pipefail
          expected_name="phase8a-annual-catalogue-freeze-2018-$TARGET_HEAD_SHA"
          artifact_id="$(
            jq -r --arg name "$expected_name"               '.artifacts[]
               | select(.name == $name and .expired == false)
               | .id'               "$RUNNER_TEMP/run380-artifacts.json"
          )"
          expected_digest="$(
            jq -r --arg name "$expected_name"               '.artifacts[]
               | select(.name == $name and .expired == false)
               | .digest'               "$RUNNER_TEMP/run380-artifacts.json"
          )"
          test "$(printf '%s\n' "$artifact_id" | sed '/^$/d' | wc -l)" = "1"
          case "$expected_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${expected_digest#sha256:}"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             > "$RUNNER_TEMP/run380-freeze.zip"
          actual_sha="$(sha256sum "$RUNNER_TEMP/run380-freeze.zip" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          printf '%s\n' "$actual_sha"             > "$RUNNER_TEMP/run380-freeze-zip-sha256.txt"

          mkdir -p "$RUNNER_TEMP/run380-freeze"
          unzip -q "$RUNNER_TEMP/run380-freeze.zip"             -d "$RUNNER_TEMP/run380-freeze"
          freeze="$(
            find "$RUNNER_TEMP/run380-freeze"               -type f -name annual-freeze.json -print
          )"
          test "$(printf '%s\n' "$freeze" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze" "$RUNNER_TEMP/annual-freeze-2018.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned review dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean review checkout
        run: test -z "$(git status --porcelain)"

      - name: Review and bind exact run 380
        run: |
          set -euo pipefail
          freeze_sha="$(cat "$RUNNER_TEMP/run380-freeze-zip-sha256.txt")"
          python scripts/phase8a_annual_pattern_catalogue_2018_run380_evidence_review.py             review             --run-json "$RUNNER_TEMP/run380.json"             --jobs-json "$RUNNER_TEMP/run380-jobs.json"             --artifacts-json "$RUNNER_TEMP/run380-artifacts.json"             --freeze-evidence "$RUNNER_TEMP/annual-freeze-2018.json"             --freeze-artifact-zip-sha256 "$freeze_sha"             --dispatch-receipt-json "$RUNNER_TEMP/dec554-run380-dispatch-receipt.json"             --expected-head-sha "$TARGET_HEAD_SHA"             --out "$RUNNER_TEMP/runtime-binding-2018.json"

      - name: Verify DEC-555 binding remains non-authorizing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"]) / "runtime-binding-2018.json"
              ).read_text(encoding="utf-8")
          )
          assert binding["decision"] == "DEC-555"
          assert binding["annual_segment_label"] == "2018"
          assert binding["run_id"] == int(os.environ["TARGET_RUN_ID"])
          assert binding["run_number"] == 380
          assert binding["run_attempt"] == 1
          assert binding["run_head_sha"] == os.environ["TARGET_HEAD_SHA"]
          assert binding["previous_annual_freeze_run_id"] == 37227536041
          assert binding["annual_cell_count"] == 18
          assert binding["directional_record_count"] == 89460
          assert binding["dispatch_receipt_bound"] is True
          assert binding["runtime_review_validated"] is True
          assert binding["runtime_evidence_bound"] is True
          assert binding["next_segment_execution_authorized"] is False
          assert binding["strategy_v1_synthesis_authorized"] is False
          assert binding["promotion_authorized"] is False
          assert binding["broker_mutation_authorized"] is False
          assert binding["live_order_authorized"] is False
          assert binding["real_money_authorized"] is False
          assert binding["trading_authorized"] is False
          assert binding["next_gate"] == (
              "READ_ONLY_ANNUAL_PATTERN_CATALOGUE_2019_EXECUTION_PREFLIGHT"
          )
          PY

      - name: Upload immutable DEC-555 runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2018-dec555-runtime-binding-${{ env.TARGET_RUN_ID }}
          path: |
            ${{ runner.temp }}/run380.json
            ${{ runner.temp }}/run380-jobs.json
            ${{ runner.temp }}/run380-artifacts.json
            ${{ runner.temp }}/dec554-runs.json
            ${{ runner.temp }}/dec554-artifacts.json
            ${{ runner.temp }}/dec554-run380-dispatch-receipt.json
            ${{ runner.temp }}/run380-freeze-zip-sha256.txt
            ${{ runner.temp }}/annual-freeze-2018.json
            ${{ runner.temp }}/runtime-binding-2018.json
          if-no-files-found: error
