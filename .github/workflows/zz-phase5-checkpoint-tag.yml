name: zz-phase5-checkpoint-tag

on:
  push:
    branches:
      - phase5-checkpoint-tag
    paths:
      - .github/workflows/zz-phase5-checkpoint-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase5-checkpoint-tag
          fetch-depth: 0
      - name: Create immutable Phase 5 checkpoint tag
        env:
          TARGET_SHA: e0b2fc7bf12b0c9cd9d76668564df6b7714b1fe0
          TAG_NAME: fmp-v1-phase5-features
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          existing="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}")"
          if [ -n "$existing" ]; then
            echo "tag already exists: $existing"
            exit 1
          fi
          git tag "${TAG_NAME}" "${TARGET_SHA}"
          git push origin "refs/tags/${TAG_NAME}"
