name: phase8a-annual-catalogue-2015-replacement-one-shot-executor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2015-replacement-one-shot-executor.yml

permissions:
  contents: read
  actions: write

jobs:
  execute-replacement-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: \${{ github.token }}
      GH_REPO: \${{ github.repository }}
      PYTHONPATH: \${{ github.workspace }}/src

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact first replacement executor push
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "f7e65ee95f472918e390bceedd7cf2f38bbf7e92"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "ef50c43fe6fe9c0cba3d220adf7d4b4883f5312b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2015_replacement_execution_authorization.py)" = "c63fc9f72ad34fa6fd903f2dde8e85570521c9b9"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2015_replacement_dispatch_action_preflight.py)" = "6701d3607d1576a81848810ec699ffd5b7a858a1"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2015_replacement_dispatch_action_preflight.py)" = "89ad05565fa1aff8ce97ac0eb6a8d5579781ee62"

      - name: Require this executor has never run before
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-catalogue-2015-replacement-one-shot-executor.yml/runs?branch=main&event=push&per_page=100"
          gh api "$endpoint" > "$RUNNER_TEMP/executor-runs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "executor-runs.json").read_text(
                  encoding="utf-8"
              )
          )
          current_id = int(os.environ["GITHUB_RUN_ID"])
          relevant = [
              row
              for row in payload.get("workflow_runs", [])
              if row.get("name")
              == "phase8a-annual-catalogue-2015-replacement-one-shot-executor"
              and row.get("path")
              == ".github/workflows/phase8a-annual-catalogue-2015-replacement-one-shot-executor.yml"
              and row.get("event") == "push"
              and row.get("head_branch") == "main"
          ]
          assert len(relevant) == 1
          run = relevant[0]
          assert run["id"] == current_id
          assert run["run_number"] == 1
          assert run["run_attempt"] == 1
          assert run["head_sha"] == os.environ["GITHUB_SHA"]
          PY

      - name: Fetch live main and annual workflow inventory
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            > "$RUNNER_TEMP/main-branch.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            > "$RUNNER_TEMP/annual-runs-before.json"

      - name: Build exact DEC-499 replacement dispatch preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2015_replacement_dispatch_action_preflight.py \
            plan \
            --main-branch-json "$RUNNER_TEMP/main-branch.json" \
            --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs-before.json" \
            --expected-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/replacement-dispatch-preflight.json"

      - name: Verify exact replacement preflight
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          preflight = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "replacement-dispatch-preflight.json"
              ).read_text(encoding="utf-8")
          )

          assert preflight["decision"] == "DEC-499"
          assert preflight["repository_full_name"] == "Dtwosam/FMP"
          assert preflight["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert preflight["prior_run_count"] == 1
          assert preflight["failed_first_run_id"] == 37126711695
          assert preflight["failed_first_run_number"] == 1
          assert preflight["failed_first_run_attempt"] == 1
          assert preflight["failed_first_run_conclusion"] == "failure"
          assert preflight["annual_segment_label"] == "2015"
          assert preflight["expected_replacement_run_number"] == 2
          assert preflight["expected_replacement_run_attempt"] == 1
          assert preflight["replacement_run_authorized"] is True
          assert preflight["historical_artifact_read_authorized"] is True
          assert preflight["historical_catalogue_execution_authorized"] is True
          assert preflight["historical_result_production_authorized"] is True
          assert preflight["dispatch_command_present"] is False
          assert preflight["preflight_read_only"] is True
          for field in (
              "rerun_failed_run_authorized",
              "retry_failed_run_authorized",
              "third_or_later_run_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert preflight[field] is False, field
          PY

      - name: Dispatch the sole authorized 2015 replacement run
        run: |
          set -euo pipefail
          gh workflow run phase8a-annual-pattern-catalogue.yml \
            --ref main \
            -f annual_segment_label=2015

      - name: Resolve exact replacement run 2 attempt 1
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100"
          found=0
          for _ in $(seq 1 30); do
            gh api "$endpoint" > "$RUNNER_TEMP/annual-runs-after.json"
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "annual-runs-after.json"
              ).read_text(encoding="utf-8")
          )
          runs = payload.get("workflow_runs")
          assert isinstance(runs, list)
          targets = [
              row
              for row in runs
              if row.get("name") == "phase8a-annual-pattern-catalogue"
              and row.get("path")
              == ".github/workflows/phase8a-annual-pattern-catalogue.yml"
              and row.get("run_number") == 2
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          later = [
              row
              for row in runs
              if isinstance(row.get("run_number"), int)
              and row.get("run_number") >= 3
          ]
          raise SystemExit(0 if len(targets) == 1 and later == [] else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Write immutable DEC-512 dispatch receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          payload = json.loads(
              (temp / "annual-runs-after.json").read_text(encoding="utf-8")
          )
          targets = [
              row
              for row in payload["workflow_runs"]
              if row.get("name") == "phase8a-annual-pattern-catalogue"
              and row.get("path")
              == ".github/workflows/phase8a-annual-pattern-catalogue.yml"
              and row.get("run_number") == 2
              and row.get("run_attempt") == 1
              and row.get("event") == "workflow_dispatch"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == os.environ["GITHUB_SHA"]
          ]
          assert len(targets) == 1
          target = targets[0]

          preflight_bytes = (
              temp / "replacement-dispatch-preflight.json"
          ).read_bytes()
          receipt = {
              "decision": "DEC-512",
              "executor_workflow": (
                  "phase8a-annual-catalogue-2015-replacement-one-shot-executor"
              ),
              "executor_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "executor_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "executor_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "executor_head_sha": os.environ["GITHUB_SHA"],
              "source_preflight_decision": "DEC-499",
              "source_preflight_sha256": hashlib.sha256(
                  preflight_bytes
              ).hexdigest(),
              "replacement_run_id": target["id"],
              "replacement_run_number": target["run_number"],
              "replacement_run_attempt": target["run_attempt"],
              "replacement_run_head_sha": target["head_sha"],
              "dispatch_command": (
                  "gh workflow run phase8a-annual-pattern-catalogue.yml "
                  "--ref main -f annual_segment_label=2015"
              ),
              "dispatch_submitted": True,
              "result_claimed": False,
              "rerun_authorized": False,
              "retry_authorized": False,
              "third_or_later_run_authorized": False,
              "next_segment_execution_authorized": False,
              "cross_year_result_production_authorized": False,
              "strategy_v1_synthesis_authorized": False,
              "promotion_authorized": False,
              "phase8b_authorized": False,
              "demo_order_authorized": False,
              "broker_mutation_authorized": False,
              "live_order_authorized": False,
              "real_money_authorized": False,
              "trading_authorized": False,
              "next_gate": "REVIEW_2015_REPLACEMENT_RUN_WITH_DEC_500",
          }
          (temp / "replacement-dispatch-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable replacement dispatch evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2015-replacement-dec512-dispatch-\${{ github.sha }}
          path: |
            \${{ runner.temp }}/replacement-dispatch-preflight.json
            \${{ runner.temp }}/replacement-dispatch-receipt.json
            \${{ runner.temp }}/annual-runs-before.json
            \${{ runner.temp }}/annual-runs-after.json
          if-no-files-found: warn
