name: phase8a-annual-catalogue-2019-runtime-install-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2019-runtime-install-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-install-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC558_RUN_ID: "37294642532"
      DEC558_HEAD_SHA: "2e8d66e515b9f87023f78ae06c644bf804440501"
      DEC558_ARTIFACT_ID: "11337484835"
      DEC558_ARTIFACT_DIGEST: "sha256:7ee0dbfd168a8a63664419cce85e41a65fde46f9e492dbee65868386d74975a8"

    steps:
      - name: Checkout exact DEC-559 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only install-preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require frozen DEC-559 sources
        run: |
          set -euo pipefail
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_runtime_authorization_install_preflight.py)" = "a3b087419f9b9dd8980139f5dc47db4de3f657fd"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2019_runtime_authorization_install_preflight.py)" = "80423970c62f71ac9a426e4c4d0190419a99c3c2"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_runtime_authorization_plan.py)" = "41e7adba8b5061028d8adc7ef93d1fc02424039e"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2019_execution_authorization.py)" = "084fa62c7fd4855fc561038d991e1215df2ff73b"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "410180c34a9e3500bbbb42310a5253b993ac7785"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_2019_runtime_authorization.py.disabled)" = "d87fe85a5b426fa92caf7d6cc165445590f4097c"
          test "$(git hash-object docs/superpowers/templates/annual_pattern_catalogue_runtime_with_2019_authorization.py.disabled)" = "07ddfe7a968de10cd1d4f8592760cc9eb9e6300e"

      - name: Fetch and verify exact DEC-558 plan artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC558_RUN_ID" > "$RUNNER_TEMP/dec558-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEC558_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec558-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec558-run.json").read_text())
          exact = {
              "id": 37294642532,
              "name": "phase8a-annual-catalogue-2019-runtime-authorization-plan",
              "path": ".github/workflows/phase8a-annual-catalogue-2019-runtime-authorization-plan.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": "2e8d66e515b9f87023f78ae06c644bf804440501",
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for field, expected in exact.items():
              assert run.get(field) == expected, (field, run.get(field), expected)
          payload = json.loads((temp / "dec558-artifacts.json").read_text())
          rows = [a for a in payload.get("artifacts", []) if a.get("id") == 11337484835]
          assert len(rows) == 1
          artifact = rows[0]
          assert artifact["name"] == "annual-catalogue-2019-dec558-runtime-authorization-plan-2e8d66e515b9f87023f78ae06c644bf804440501"
          assert artifact["digest"] == "sha256:7ee0dbfd168a8a63664419cce85e41a65fde46f9e492dbee65868386d74975a8"
          assert artifact["expired"] is False
          PY
          gh api -H 'Accept: application/vnd.github+json'             "repos/$GITHUB_REPOSITORY/actions/artifacts/$DEC558_ARTIFACT_ID/zip"             > "$RUNNER_TEMP/dec558.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec558.zip" | awk '{print $1}')"
          test "$actual" = "7ee0dbfd168a8a63664419cce85e41a65fde46f9e492dbee65868386d74975a8"
          mkdir -p "$RUNNER_TEMP/dec558"
          unzip -q "$RUNNER_TEMP/dec558.zip" -d "$RUNNER_TEMP/dec558"
          auth="$(find "$RUNNER_TEMP/dec558" -type f -name dec557-2019-execution-authorization.json -print)"
          plan="$(find "$RUNNER_TEMP/dec558" -type f -name dec558-2019-runtime-authorization-plan.json -print)"
          test "$(printf '%s\n' "$auth" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$plan" | sed '/^$/d' | wc -l)" = "1"
          cp "$auth" "$RUNNER_TEMP/dec557-2019-execution-authorization.json"
          cp "$plan" "$RUNNER_TEMP/dec558-2019-runtime-authorization-plan.json"

      - name: Recheck current main and annual run-381 slot
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/annual-runs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          main = json.loads((temp / "main-branch.json").read_text())
          assert main["commit"]["sha"] == os.environ["GITHUB_SHA"]
          rows = json.loads((temp / "annual-runs.json").read_text()).get("workflow_runs", [])
          by_number = {row["run_number"]: row for row in rows}
          assert set(by_number) == {1, 376, 377, 378, 379, 380}
          assert by_number[1]["conclusion"] == "failure"
          assert by_number[376]["conclusion"] == "failure"
          assert by_number[377]["conclusion"] == "success"
          assert by_number[378]["conclusion"] == "success"
          assert by_number[379]["conclusion"] == "success"
          assert by_number[380]["conclusion"] == "success"
          assert not any(row["run_number"] >= 381 for row in rows)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install
          -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean preflight checkout
        run: test -z "$(git status --porcelain)"

      - name: Build concrete DEC-559 install preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2019_runtime_authorization_install_preflight.py             plan             --authorization-json "$RUNNER_TEMP/dec557-2019-execution-authorization.json"             --plan-json "$RUNNER_TEMP/dec558-2019-runtime-authorization-plan.json"             --main-branch-json "$RUNNER_TEMP/main-branch.json"             --expected-head-sha "$GITHUB_SHA"             --out "$RUNNER_TEMP/dec559-2019-runtime-install-preflight.json"

      - name: Verify DEC-559 remains read-only and exact
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dec559-2019-runtime-install-preflight.json").read_text())
          assert value["decision"] == "DEC-559"
          assert value["source_plan_workflow_run_id"] == 37294642532
          assert value["source_plan_artifact_id"] == 11337484835
          assert value["source_plan_artifact_digest"] == "sha256:7ee0dbfd168a8a63664419cce85e41a65fde46f9e492dbee65868386d74975a8"
          assert value["expected_run_number"] == 381
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37237817538
          assert value["activation_mutation_file_count"] == 2
          assert value["runtime_install_preflight_ready"] is True
          assert value["preflight_read_only"] is True
          for field in (
              "repository_mutation_authorized",
              "runtime_authorization_installed",
              "runtime_gate_active",
              "annual_workflow_dispatch_authorized",
              "historical_artifact_read_authorized",
              "historical_catalogue_execution_authorized",
              "historical_result_production_authorized",
              "next_segment_execution_authorized",
              "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized",
              "promotion_authorized",
              "phase8b_authorized",
              "demo_order_authorized",
              "broker_mutation_authorized",
              "live_order_authorized",
              "real_money_authorized",
              "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-559 install preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2019-dec559-runtime-install-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec558-run.json
            ${{ runner.temp }}/dec558-artifacts.json
            ${{ runner.temp }}/dec557-2019-execution-authorization.json
            ${{ runner.temp }}/dec558-2019-runtime-authorization-plan.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec559-2019-runtime-install-preflight.json
          if-no-files-found: error
