name: phase8a-annual-catalogue-2023-dispatch-action-preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase8a-annual-catalogue-2023-dispatch-action-preflight.yml

permissions:
  contents: read
  actions: read

jobs:
  build-concrete-dispatch-action-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/src
      DEC609_RUN_ID: "37770601661"
      DEC609_HEAD_SHA: "7d40ccaf79270162dd96a8a1e7024dd94c3a72b7"
      DEC609_ARTIFACT_ID: "11547430955"
      DEC609_ARTIFACT_DIGEST: "sha256:8e33ab04cf87e0f2fe6b6b05fec53531dd0c9ff33fcc16abde920667ad154132"
      DEC609_FINGERPRINT: "af91a248811f0cf291aea1fd94f4fff72eddd7e016b8d2fce2afc543bccb88fe"
      DEC609_CANONICAL_SHA256: "044f7ec28570660fa04fb886e6ab194c4a986427b8df86754241b44e6efbf3ad"

    steps:
      - name: Checkout exact DEC-610 landing
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact first read-only action-preflight push
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Dtwosam/FMP"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_action_preflight.py)" = "60923763b844b8a1348cbfcf2612b739b8c7c28a"
          test "$(git hash-object scripts/phase8a_annual_pattern_catalogue_2023_dispatch_action_preflight.py)" = "8b8870e1e0d14ed0eb4208a7a0ec5fbff52a5764"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_authorization.py)" = "b7f55dd68d5054c472b4e070521c411c02a4da3c"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_dispatch_preflight.py)" = "fb4f8fa390e94a75a8d52c99cbc041e9bf1e8164"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_2023_runtime_authorization.py)" = "cb4d32507dc93fa8a7a1296e630ce3bc9ee9c191"
          test "$(git hash-object src/fmp/discovery/annual_pattern_catalogue_runtime.py)" = "0fb5cf4d5de1355ff8faffcff565cbbabaf1d7a3"
          test "$(git hash-object .github/workflows/phase8a-annual-pattern-catalogue.yml)" = "09b3a8f5ace25f9bf316827b9f4f82df7f72d4e1"

      - name: Fetch and verify exact DEC-609 authorization archive
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$DEC609_RUN_ID" > "$RUNNER_TEMP/dec609-run.json"
          gh api "repos/$GH_REPO/actions/runs/$DEC609_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dec609-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "dec609-run.json").read_text())
          expected = {
              "id": 37770601661,
              "name": "phase8a-annual-catalogue-2023-dispatch-authorization",
              "path": ".github/workflows/phase8a-annual-catalogue-2023-dispatch-authorization.yml",
              "event": "push",
              "head_branch": "main",
              "head_sha": os.environ["DEC609_HEAD_SHA"],
              "run_number": 1,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in expected.items():
              assert run.get(key) == value, (key, run.get(key), value)
          payload = json.loads((temp / "dec609-artifacts.json").read_text())
          rows = [a for a in payload["artifacts"] if a.get("id") == 11547430955]
          assert len(rows) == 1
          row = rows[0]
          assert row["expired"] is False
          assert row["digest"] == os.environ["DEC609_ARTIFACT_DIGEST"]
          assert row["name"] == (
              "annual-catalogue-2023-dec609-dispatch-authorization-"
              + os.environ["DEC609_HEAD_SHA"]
          )
          PY
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/actions/artifacts/$DEC609_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/dec609.zip"
          actual="$(sha256sum "$RUNNER_TEMP/dec609.zip" | awk '{print $1}')"
          test "$actual" = "8e33ab04cf87e0f2fe6b6b05fec53531dd0c9ff33fcc16abde920667ad154132"
          mkdir -p "$RUNNER_TEMP/dec609"
          unzip -q "$RUNNER_TEMP/dec609.zip" -d "$RUNNER_TEMP/dec609"
          value="$RUNNER_TEMP/dec609/dec609-2023-dispatch-authorization.json"
          test -f "$value"
          test "$(find "$RUNNER_TEMP/dec609" -name dec609-2023-dispatch-authorization.json -type f | wc -l)" = "1"
          cp "$value" "$RUNNER_TEMP/dec609-2023-dispatch-authorization.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "dec609-2023-dispatch-authorization.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          canonical = (
              json.dumps(value, sort_keys=True, separators=(",", ":"), allow_nan=False)
              + "\n"
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == os.environ["DEC609_CANONICAL_SHA256"]
          assert value["decision"] == "DEC-609"
          assert value["authorization_head_sha"] == os.environ["DEC609_HEAD_SHA"]
          assert value["authorization_fingerprint_sha256"] == os.environ["DEC609_FINGERPRINT"]
          assert value["authorization_scope"] == "2023_run_385_attempt_1_only"
          assert value["governing_method_decision"] == "DEC-469"
          assert value["governing_protocol_decision"] == "DEC-470"
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_history_access_authorized"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          assert value["dispatch_action_executed"] is False
          assert value["trading_authorized"] is False
          PY

      - name: Recheck exact main and unconsumed run-385 slot
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/branches/main" > "$RUNNER_TEMP/main-branch.json"
          gh api \
            "repos/$GH_REPO/actions/workflows/phase8a-annual-pattern-catalogue.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            > "$RUNNER_TEMP/annual-runs.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/main-branch.json")" = "$GITHUB_SHA"
          test "$(jq -r '.name' "$RUNNER_TEMP/main-branch.json")" = "main"
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "annual-runs.json").read_text()
          )["workflow_runs"]
          assert len(rows) == 10
          assert {x["run_number"] for x in rows} == {1,376,377,378,379,380,381,382,383,384}
          assert not any(x.get("run_number", 0) >= 385 for x in rows)
          predecessor = next(x for x in rows if x["run_number"] == 384)
          assert predecessor["id"] == 37663157285
          assert predecessor["run_attempt"] == 1
          assert predecessor["status"] == "completed"
          assert predecessor["conclusion"] == "success"
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned preflight dependencies
        run: >-
          python -m pip install -r requirements/exp061-discovery-run.txt
          scikit-learn==1.9.1

      - name: Require clean read-only checkout
        run: test -z "$(git status --porcelain)"

      - name: Build exact DEC-610 preflight
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue_2023_dispatch_action_preflight.py \
            plan \
            --authorization-json "$RUNNER_TEMP/dec609-2023-dispatch-authorization.json" \
            --main-branch-json "$RUNNER_TEMP/main-branch.json" \
            --annual-workflow-runs-json "$RUNNER_TEMP/annual-runs.json" \
            --expected-head-sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/dec610-2023-dispatch-action-preflight.json"

      - name: Verify DEC-610 is preflight only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "dec610-2023-dispatch-action-preflight.json").read_text()
          )
          assert value["decision"] == "DEC-610"
          assert value["expected_head_sha"] == os.environ["GITHUB_SHA"]
          assert value["expected_run_number"] == 385
          assert value["expected_run_attempt"] == 1
          assert value["previous_annual_freeze_run_id"] == 37663157285
          assert value["source_authorization_workflow_run_id"] == 37770601661
          assert value["source_authorization_artifact_id"] == 11547430955
          assert value["source_authorization_protected_history_access_authorized"] is True
          assert value["protected_history_access_authorized"] is False
          assert value["preflight_read_only"] is True
          assert value["dispatch_parameters_frozen"] is True
          assert value["annual_workflow_dispatch_authorized"] is True
          for field in (
              "dispatch_command_present", "dispatch_action_executed",
              "rerun_authorized", "retry_authorized", "replacement_run_authorized",
              "run_386_or_later_authorized", "next_segment_execution_authorized",
              "cross_year_comparison_authorized", "cross_year_result_production_authorized",
              "strategy_v1_synthesis_authorized", "promotion_authorized", "phase8b_authorized",
              "demo_order_authorized", "broker_mutation_authorized", "live_order_authorized",
              "real_money_authorized", "trading_authorized",
          ):
              assert value[field] is False, field
          PY

      - name: Upload immutable DEC-610 action preflight
        uses: actions/upload-artifact@v6
        with:
          name: annual-catalogue-2023-dec610-dispatch-action-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dec609-run.json
            ${{ runner.temp }}/dec609-artifacts.json
            ${{ runner.temp }}/dec609-2023-dispatch-authorization.json
            ${{ runner.temp }}/main-branch.json
            ${{ runner.temp }}/annual-runs.json
            ${{ runner.temp }}/dec610-2023-dispatch-action-preflight.json
          if-no-files-found: error
