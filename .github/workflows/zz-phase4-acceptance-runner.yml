name: zz-phase4-acceptance-runner

on:
  push:
    branches:
      - phase4-acceptance-closure
    paths:
      - scripts/_phase4_acceptance_closure_once.py
      - .github/workflows/zz-phase4-acceptance-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-acceptance-closure
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply Phase 4 acceptance closure
        run: python scripts/_phase4_acceptance_closure_once.py
      - name: Verify bounded acceptance closure
        run: |
          git diff --check
          python -m unittest discover -s tests -p 'test_phase4_acceptance_state.py' -v
          grep -q 'DEC-028 — Phase 4 baseline strategy research acceptance review — APPROVED' docs/decision-log.md
          grep -q '## Phase 4 — PASS' docs/project-state.md
          grep -q '## Phase 5 — UNSTARTED' docs/project-state.md
          grep -q 'Final-test touched?: NO' docs/phase4-acceptance-evidence.md
      - name: Commit Phase 4 acceptance closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/decision-log.md docs/project-state.md docs/phase4-acceptance-evidence.md tests/test_phase4_acceptance_state.py
          git commit -m '[phase1-no-source] Record Phase 4 PASS acceptance'
          git push origin HEAD:phase4-acceptance-closure
