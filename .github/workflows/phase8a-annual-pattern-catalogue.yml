name: phase8a-annual-pattern-catalogue

on:
  workflow_dispatch:
    inputs:
      annual_segment_label:
        description: Frozen annual segment
        required: true
        type: choice
        options:
          - "2015"
          - "2016"
          - "2017"
          - "2018"
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026_YTD_TO_2026_08_20"
      previous_annual_freeze_run_id:
        description: Required prior annual-catalogue run id for every segment after 2015
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  annual_preflight:
    name: annual-preflight-${{ inputs.annual_segment_label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require exact merged main manual dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Resolve required prior annual segment
        id: prior
        env:
          CURRENT_SEGMENT: ${{ inputs.annual_segment_label }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_annual_freeze_run_id }}
        run: |
          set -euo pipefail
          case "$CURRENT_SEGMENT" in
            2015)
              test -z "$PREVIOUS_RUN_ID"
              echo "required=false" >> "$GITHUB_OUTPUT"
              echo "segment=" >> "$GITHUB_OUTPUT"
              ;;
            2016) previous_segment="2015" ;;
            2017) previous_segment="2016" ;;
            2018) previous_segment="2017" ;;
            2019) previous_segment="2018" ;;
            2020) previous_segment="2019" ;;
            2021) previous_segment="2020" ;;
            2022) previous_segment="2021" ;;
            2023) previous_segment="2022" ;;
            2024) previous_segment="2023" ;;
            2025) previous_segment="2024" ;;
            2026_YTD_TO_2026_08_20) previous_segment="2025" ;;
            *) exit 1 ;;
          esac
          if test "$CURRENT_SEGMENT" != "2015"; then
            test -n "$PREVIOUS_RUN_ID"
            case "$PREVIOUS_RUN_ID" in
              *[!0-9]*|"") exit 1 ;;
            esac
            test "$PREVIOUS_RUN_ID" -gt 0
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "segment=$previous_segment" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned annual catalogue runtime
        run: python -m pip install -r requirements/exp061-discovery-run.txt -e .

      - name: Fetch exact accepted EXP-044 source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .preflight
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35867307338" > .preflight/feature-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35867307338/artifacts?per_page=100" > .preflight/feature-artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35876715434" > .preflight/outcome-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35876715434/artifacts?per_page=100" > .preflight/outcome-artifacts.json

      - name: Validate exact accepted EXP-044 source snapshots
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue.py preflight \
            --feature-run-json .preflight/feature-run.json \
            --feature-artifacts-json .preflight/feature-artifacts.json \
            --outcome-run-json .preflight/outcome-run.json \
            --outcome-artifacts-json .preflight/outcome-artifacts.json \
            --annual-segment-label "${{ inputs.annual_segment_label }}" \
            --code-commit "$GITHUB_SHA" \
            --out .preflight/preflight.json

      - name: Require separately authorized annual catalogue execution
        run: |
          python scripts/phase8a_annual_pattern_catalogue.py require-execution \
            --annual-segment-label "${{ inputs.annual_segment_label }}" \
            --code-commit "$GITHUB_SHA"

      - name: Fetch exact prior annual freeze evidence
        if: steps.prior.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_annual_freeze_run_id }}
          PREVIOUS_SEGMENT: ${{ steps.prior.outputs.segment }}
        run: |
          set -euo pipefail
          mkdir -p .prior-freeze/artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN_ID" > .prior-freeze/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN_ID/artifacts?per_page=100" > .prior-freeze/artifacts.json

          previous_head="$(jq -r '.head_sha' .prior-freeze/run.json)"
          expected_name="phase8a-annual-catalogue-freeze-$PREVIOUS_SEGMENT-$previous_head"
          matches="$(jq --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' .prior-freeze/artifacts.json)"
          test "$matches" = "1"
          artifact_id="$(jq -r --arg name "$expected_name" '.artifacts[] | select(.name == $name and .expired == false) | .id' .prior-freeze/artifacts.json)"
          expected_digest="$(jq -r --arg name "$expected_name" '.artifacts[] | select(.name == $name and .expired == false) | .digest' .prior-freeze/artifacts.json)"
          case "$expected_digest" in sha256:*) ;; *) exit 1 ;; esac
          expected_sha="${expected_digest#sha256:}"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > .prior-freeze/freeze.zip
          actual_sha="$(sha256sum .prior-freeze/freeze.zip | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          unzip -q .prior-freeze/freeze.zip -d .prior-freeze/artifact

          freeze_evidence="$(find .prior-freeze/artifact -type f -name annual-freeze.json -print)"
          test "$(printf '%s\n' "$freeze_evidence" | sed '/^$/d' | wc -l)" = "1"
          cp "$freeze_evidence" .prior-freeze/annual-freeze.json

      - name: Require immediately prior annual freeze
        env:
          CURRENT_SEGMENT: ${{ inputs.annual_segment_label }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_annual_freeze_run_id }}
        run: |
          set -euo pipefail
          if test "${{ steps.prior.outputs.required }}" = "true"; then
            python scripts/phase8a_annual_pattern_catalogue.py require-prior-freeze \
              --annual-segment-label "$CURRENT_SEGMENT" \
              --expected-previous-run-id "$PREVIOUS_RUN_ID" \
              --previous-run-json .prior-freeze/run.json \
              --previous-freeze-evidence .prior-freeze/annual-freeze.json \
              --out .preflight/prior-freeze.json
          else
            python scripts/phase8a_annual_pattern_catalogue.py require-prior-freeze \
              --annual-segment-label "$CURRENT_SEGMENT" \
              --out .preflight/prior-freeze.json
          fi

      - name: Upload annual catalogue preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-annual-catalogue-preflight-${{ inputs.annual_segment_label }}-${{ github.sha }}
          path: .preflight
          if-no-files-found: error
          include-hidden-files: true
          include-hidden-files: true
          include-hidden-files: true

  annual_cell:
    needs: annual_preflight
