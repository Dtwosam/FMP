            --annual-segment-label "${{ inputs.annual_segment_label }}" \
            --code-commit "$GITHUB_SHA"

      - name: Download all 18 annual catalogue cell products
        uses: actions/download-artifact@v6
        with:
          pattern: phase8a-annual-catalogue-cell-${{ inputs.annual_segment_label }}-*-*-*m-${{ github.sha }}
          path: .cell-results
          merge-multiple: false

      - name: Compile deterministic annual segment freeze evidence
        run: |
          set -euo pipefail
          python scripts/phase8a_annual_pattern_catalogue.py freeze \
            --result-root .cell-results \
            --annual-segment-label "${{ inputs.annual_segment_label }}" \
            --code-commit "$GITHUB_SHA" \
            --out .annual-freeze/annual-freeze.json

      - name: Upload annual segment freeze evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-annual-catalogue-freeze-${{ inputs.annual_segment_label }}-${{ github.sha }}
          path: .annual-freeze/annual-freeze.json
          if-no-files-found: error
