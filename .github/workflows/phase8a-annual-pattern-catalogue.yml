            outcome_zip_sha256: aa7fda1ca6e43c3b41a2ee1fb3729de61bb7dc6ea55e98fda70e8434770a8ee4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require exact merged main manual dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"

      - name: Install pinned annual catalogue runtime
        run: python -m pip install -r requirements/exp061-discovery-run.txt -e .

      - name: Recheck separately authorized annual catalogue execution
        run: |
          python scripts/phase8a_annual_pattern_catalogue.py require-execution \
            --annual-segment-label "${{ inputs.annual_segment_label }}" \
            --code-commit "$GITHUB_SHA"

      - name: Download exact accepted EXP-044 feature/outcome/evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_ARTIFACT_ID: ${{ matrix.dataset.feature_artifact_id }}
          FEATURE_ZIP_SHA256: ${{ matrix.dataset.feature_zip_sha256 }}
          OUTCOME_ARTIFACT_ID: ${{ matrix.dataset.outcome_artifact_id }}
          OUTCOME_ZIP_SHA256: ${{ matrix.dataset.outcome_zip_sha256 }}
          FEATURE_EVIDENCE_ARTIFACT_ID: "10753455784"
          FEATURE_EVIDENCE_ZIP_SHA256: 1d3763c3d8ef13ba5157786c019349f1a7fdb22d626800fbc5b41ad779448f04
          OUTCOME_EVIDENCE_ARTIFACT_ID: "10758027876"
          OUTCOME_EVIDENCE_ZIP_SHA256: 3c360629c8a408e6b0f97ee9c1254ca936c0144964fd1bb74855f394230a4d05
        run: |
          set -euo pipefail
          mkdir -p .downloads .feature .outcome .feature-evidence .outcome-evidence

          download_exact() {
            artifact_id="$1"
            expected_sha="$2"
            destination="$3"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$destination"
            actual_sha="$(sha256sum "$destination" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
          }

          download_exact "$FEATURE_ARTIFACT_ID" "$FEATURE_ZIP_SHA256" .downloads/feature.zip
          download_exact "$OUTCOME_ARTIFACT_ID" "$OUTCOME_ZIP_SHA256" .downloads/outcome.zip
          download_exact "$FEATURE_EVIDENCE_ARTIFACT_ID" "$FEATURE_EVIDENCE_ZIP_SHA256" .downloads/feature-evidence.zip
          download_exact "$OUTCOME_EVIDENCE_ARTIFACT_ID" "$OUTCOME_EVIDENCE_ZIP_SHA256" .downloads/outcome-evidence.zip

          unzip -q .downloads/feature.zip -d .feature
          unzip -q .downloads/outcome.zip -d .outcome
          unzip -q .downloads/feature-evidence.zip -d .feature-evidence
          unzip -q .downloads/outcome-evidence.zip -d .outcome-evidence

      - name: Resolve exact extracted source roots
        id: roots
        run: |
          set -euo pipefail
          feature_manifest="$(find .feature -type f -name manifest.json -print)"
          outcome_manifest="$(find .outcome -type f -name manifest.json -print)"
          feature_evidence="$(find .feature-evidence -type f -name 'feature-evidence.json' -print)"
          outcome_evidence="$(find .outcome-evidence -type f -name 'outcome-evidence.json' -print)"

          test "$(printf '%s\n' "$feature_manifest" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$outcome_manifest" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$feature_evidence" | sed '/^$/d' | wc -l)" = "1"
          test "$(printf '%s\n' "$outcome_evidence" | sed '/^$/d' | wc -l)" = "1"

          echo "feature_root=$(dirname "$feature_manifest")" >> "$GITHUB_OUTPUT"
          echo "outcome_root=$(dirname "$outcome_manifest")" >> "$GITHUB_OUTPUT"
          echo "feature_evidence=$feature_evidence" >> "$GITHUB_OUTPUT"
          echo "outcome_evidence=$outcome_evidence" >> "$GITHUB_OUTPUT"

      - name: Run frozen annual catalogue cell
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.dataset.timeframe }}
          HORIZON: ${{ matrix.dataset.horizon }}
          FEATURE_ROOT: ${{ steps.roots.outputs.feature_root }}
          OUTCOME_ROOT: ${{ steps.roots.outputs.outcome_root }}
          FEATURE_EVIDENCE: ${{ steps.roots.outputs.feature_evidence }}
          OUTCOME_EVIDENCE: ${{ steps.roots.outputs.outcome_evidence }}
        run: |
          set -euo pipefail
          mkdir -p .result
          python scripts/phase8a_annual_pattern_catalogue.py cell \
            --feature-root "$FEATURE_ROOT" \
            --outcome-root "$OUTCOME_ROOT" \
            --feature-evidence "$FEATURE_EVIDENCE" \
            --outcome-evidence "$OUTCOME_EVIDENCE" \
            --annual-segment-label "${{ inputs.annual_segment_label }}" \
            --symbol "$SYMBOL" \
            --timeframe "$TIMEFRAME" \
            --horizon-minutes "$HORIZON" \
            --code-commit "$GITHUB_SHA" \
            --evidence-out .result/cell-evidence.json \
            --catalogue-out .result/catalogue-payload.json

      - name: Upload annual catalogue cell product
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-annual-catalogue-cell-${{ inputs.annual_segment_label }}-${{ matrix.dataset.symbol }}-${{ matrix.dataset.timeframe }}-${{ matrix.dataset.horizon }}m-${{ github.sha }}
          path: .result
          if-no-files-found: error

  annual_freeze:
    needs: annual_cell
    name: annual-freeze-${{ inputs.annual_segment_label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require exact merged main manual dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
