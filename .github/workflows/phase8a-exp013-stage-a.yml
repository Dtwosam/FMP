name: phase8a-exp013-stage-a

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-a-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset:
          - symbol: EURUSD
            artifact_id: '10325737935'
            zip_sha256: db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3
          - symbol: GBPUSD
            artifact_id: '10326096831'
            zip_sha256: fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2
          - symbol: USDJPY
            artifact_id: '10327600628'
            zip_sha256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72
        timeframe: [5m, 15m, 1h]

    steps:
      - name: Checkout exact result-producing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download and verify accepted Phase 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.dataset.artifact_id }}
          EXPECTED_ZIP_SHA256: ${{ matrix.dataset.zip_sha256 }}
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          zip_path=".phase2-accepted/${SYMBOL}.zip"
          mkdir -p "${root}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${zip_path}"
          actual_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${EXPECTED_ZIP_SHA256}" ]; then
            echo "accepted Phase 2 artifact digest mismatch" >&2
            exit 1
          fi
          unzip -q "${zip_path}" -d "${root}"

      - name: Run frozen EXP-013 Stage A cell
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          manifest="${root}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json"
          out=".exp013-stage-a/${SYMBOL}-${TIMEFRAME}"
          test -f "${manifest}"
          python scripts/phase8a_exp013.py stage-a-cell \
            --dataset-root "${root}" \
            --manifest "${manifest}" \
            --symbol "${SYMBOL}" \
            --timeframe "${TIMEFRAME}" \
            --code-commit "${GITHUB_SHA}" \
            --out "${out}"

      - name: Verify frozen Stage A evidence
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".exp013-stage-a") / f"{os.environ['SYMBOL']}-{os.environ['TIMEFRAME']}"
          development = json.loads((root / "development.json").read_text(encoding="utf-8"))
          validation = json.loads((root / "validation.json").read_text(encoding="utf-8"))
          gate = json.loads((root / "gate.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          source_sha = hashlib.sha256(Path("src/fmp/strategies/opening_range_momentum.py").read_bytes()).hexdigest()

          for payload in (development, validation, gate):
              assert payload["experiment_id"] == "EXP-20260922-013", payload
              assert payload["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", payload
              assert payload["untouched_oos"] is False, payload
              assert payload["promotion_authorized"] is False, payload
              assert payload["runner_code_commit"] == os.environ["GITHUB_SHA"], payload
              assert payload["strategy_source_sha256"] == source_sha, payload
              assert payload["symbol"] == os.environ["SYMBOL"], payload
              assert payload["timeframe"] == os.environ["TIMEFRAME"], payload

          assert development["protocol"] == "fmp-phase8a-exp013-stage-a-cell-v1", development
          assert development["split_name"] == "development", development
          assert development["range_start"] == "2015-01-01", development
          assert development["range_end_exclusive"] == "2021-01-01", development
          assert development["historical_status_mutation_authorized"] is False, development
          assert development["strategy_identity_count"] == 4, development
          assert development["scenario_run_count"] == 12, development

          assert validation["protocol"] == "fmp-phase8a-exp013-stage-a-cell-v1", validation
          assert validation["split_name"] == "validation", validation
          assert validation["range_start"] == "2021-01-01", validation
          assert validation["range_end_exclusive"] == "2024-01-01", validation
          assert validation["historical_status_mutation_authorized"] is False, validation
          assert validation["strategy_identity_count"] == 4, validation
          assert validation["scenario_run_count"] == 12, validation

          assert gate["protocol"] == "fmp-phase8a-exp013-stage-a-gate-v1", gate
          assert gate["historical_status_mutation_authorized"] is False, gate
          assert len(gate["config_gates"]) == 4, gate
          assert set(gate["survivor_fingerprints"]).issubset(gate["config_gates"]), gate

          assert manifest["protocol"] == "fmp-phase8a-exp013-stage-a-cell-artifacts-v1", manifest
          assert manifest["promotion_authorized"] is False, manifest
          assert len(manifest["artifacts"]) == 3, manifest
          PY

      - name: Upload EXP-013 Stage A cell evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp013-stage-a-${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}-${{ github.sha }}
          path: .exp013-stage-a/${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}
          include-hidden-files: true
          if-no-files-found: error

  stage-a-authorize:
    needs: stage-a-cell
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact result-producing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download all Stage A cell evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase8a-exp013-stage-a-*-${{ github.sha }}
          path: .exp013-stage-a-inputs
          merge-multiple: false

      - name: Derive exact Stage A survivor authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_exp013.py stage-a-authorize \
            --inputs-root ".exp013-stage-a-inputs" \
            --out ".exp013-stage-a-authorization"

      - name: Verify authorization remains non-promotional
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".exp013-stage-a-authorization")
          authorization = json.loads((root / "authorization.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          source_sha = hashlib.sha256(Path("src/fmp/strategies/opening_range_momentum.py").read_bytes()).hexdigest()

          assert authorization["protocol"] == "fmp-phase8a-exp013-stage-a-authorization-v1", authorization
          assert authorization["experiment_id"] == "EXP-20260922-013", authorization
          assert authorization["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", authorization
          assert authorization["untouched_oos"] is False, authorization
          assert authorization["promotion_authorized"] is False, authorization
          assert authorization["historical_status_mutation_authorized"] is False, authorization
          assert authorization["runner_code_commit"] == os.environ["GITHUB_SHA"], authorization
          assert authorization["strategy_source_sha256"] == source_sha, authorization
          assert authorization["cell_count"] == 9, authorization
          assert authorization["strategy_identity_count"] == 36, authorization
          assert authorization["survivor_count"] == len(authorization["survivor_fingerprints"]), authorization
          assert authorization["stage_b_source_open_authorized"] == bool(authorization["survivor_fingerprints"]), authorization

          assert manifest["protocol"] == "fmp-phase8a-exp013-stage-a-authorization-artifacts-v1", manifest
          assert manifest["promotion_authorized"] is False, manifest
          PY

      - name: Upload EXP-013 Stage A authorization
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp013-stage-a-authorization-${{ github.sha }}
          path: .exp013-stage-a-authorization
          include-hidden-files: true
          if-no-files-found: error
