name: phase8a-exp013-stage-a

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-a-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset:
          - symbol: EURUSD
            artifact_id: '10325737935'
            zip_sha256: db0e65490bc1ff80f6d7a0498dd64322563f838a7f70c740617c41bd19e423c3
          - symbol: GBPUSD
            artifact_id: '10326096831'
            zip_sha256: fe42669ed46788d8c7db33b903db79c29034a666acd52213c3c28ec7d4ea88c2
          - symbol: USDJPY
            artifact_id: '10327600628'
            zip_sha256: 6ee632b38d45a26dcc58be6d6c9555606605e356aee25b135c089b4969426b72
        timeframe: [5m, 15m, 1h]

    steps:
      - name: Checkout exact dispatch ref
        uses: actions/checkout@v6

      - name: Require merged main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "EXP-013 Stage A must be dispatched from main" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download and verify accepted Phase 2 processed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.dataset.artifact_id }}
          EXPECTED_ZIP_SHA256: ${{ matrix.dataset.zip_sha256 }}
          SYMBOL: ${{ matrix.dataset.symbol }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          zip_path=".phase2-accepted/${SYMBOL}.zip"
          mkdir -p "${root}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${zip_path}"
          actual_sha256="$(sha256sum "${zip_path}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${EXPECTED_ZIP_SHA256}" ]; then
            echo "accepted Phase 2 artifact digest mismatch" >&2
            exit 1
          fi
          unzip -q "${zip_path}" -d "${root}"

      - name: Run EXP-013 Stage A cell
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          set -euo pipefail
          root=".phase2-accepted/${SYMBOL}"
          manifest="${root}/manifests/processed/fmp-canonical-1m-v1/${SYMBOL}.json"
          out=".exp013-stage-a/${SYMBOL}-${TIMEFRAME}"
          test -f "${manifest}"
          python scripts/phase8a_exp013.py cell \
            --dataset-root "${root}" \
            --manifest "${manifest}" \
            --symbol "${SYMBOL}" \
            --timeframe "${TIMEFRAME}" \
            --code-commit "${GITHUB_SHA}" \
            --out "${out}"

      - name: Verify EXP-013 cell evidence
        env:
          SYMBOL: ${{ matrix.dataset.symbol }}
          TIMEFRAME: ${{ matrix.timeframe }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".exp013-stage-a") / f"{os.environ['SYMBOL']}-{os.environ['TIMEFRAME']}" / "cell-evidence.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["protocol"] == "fmp-phase8a-exp013-stage-a-cell-evidence-v1", payload
          assert payload["experiment_id"] == "EXP-20260922-013", payload
          assert payload["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", payload
          assert payload["untouched_oos"] is False, payload
          assert payload["promotion_authorized"] is False, payload
          assert payload["historical_status_mutation_authorized"] is False, payload
          assert payload["runner_code_commit"] == os.environ["GITHUB_SHA"], payload
          assert payload["symbol"] == os.environ["SYMBOL"], payload
          assert payload["timeframe"] == os.environ["TIMEFRAME"], payload
          assert payload["strategy_identity_count"] == 4, payload
          assert len(payload["strategy_fingerprints"]) == 4, payload
          assert set(payload["survivor_fingerprints"]).issubset(set(payload["strategy_fingerprints"])), payload
          assert payload["development"]["scenario_run_count"] == 12, payload
          assert payload["validation"]["scenario_run_count"] == 12, payload
          PY

      - name: Upload EXP-013 Stage A cell evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp013-stage-a-cell-${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}-${{ github.sha }}
          path: .exp013-stage-a/${{ matrix.dataset.symbol }}-${{ matrix.timeframe }}
          include-hidden-files: true
          if-no-files-found: error

  stage-a-authorization:
    needs: stage-a-cell
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact dispatch ref
        uses: actions/checkout@v6

      - name: Require merged main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "EXP-013 Stage A authorization must be built from main" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Download all EXP-013 Stage A cell artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: phase8a-exp013-stage-a-cell-*-${{ github.sha }}
          path: .exp013-stage-a-cells

      - name: Build Stage A authorization
        run: |
          set -euo pipefail
          python scripts/phase8a_exp013.py authorize \
            --cells-root .exp013-stage-a-cells \
            --out .exp013-stage-a-authorization

      - name: Verify complete Stage A authorization
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".exp013-stage-a-authorization/stage-a-authorization.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["protocol"] == "fmp-phase8a-exp013-stage-a-authorization-v1", payload
          assert payload["experiment_id"] == "EXP-20260922-013", payload
          assert payload["evidence_label"] == "RETROSPECTIVE_ALREADY_SEEN", payload
          assert payload["untouched_oos"] is False, payload
          assert payload["promotion_authorized"] is False, payload
          assert payload["historical_status_mutation_authorized"] is False, payload
          assert payload["runner_code_commit"] == os.environ["GITHUB_SHA"], payload
          assert payload["cell_count"] == 9, payload
          assert payload["strategy_identity_count"] == 36, payload
          assert set(payload["processed_manifest_sha256_by_symbol"]) == {"EURUSD", "GBPUSD", "USDJPY"}, payload
          assert payload["stage_b_source_open_authorized"] is (payload["survivor_count"] > 0), payload
          assert len(payload["survivor_fingerprints"]) == payload["survivor_count"], payload
          PY

      - name: Upload complete EXP-013 Stage A authorization
        uses: actions/upload-artifact@v6
        with:
          name: phase8a-exp013-stage-a-authorization-${{ github.sha }}
          path: .exp013-stage-a-authorization
          include-hidden-files: true
          if-no-files-found: error
